<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栗尾坞 · 污染状态美术预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#262a36;color:#e2d8c9;font:14px system-ui,"Microsoft YaHei",sans-serif;height:100dvh;display:flex;flex-direction:column}header{padding:12px 18px;background:#363c4c;border-bottom:3px solid #22182a;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0 12px 0 0}button,a{font:inherit;color:#f3ede3;background:#4b5366;border:0;padding:9px 14px;text-decoration:none;cursor:pointer;clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),0 calc(100% - 2px),0 2px,4px 2px)}button:hover,a:hover{background:#656e82}button[aria-pressed=true]{background:#5f6f58}button:focus-visible,a:focus-visible{outline:3px solid #efc452;outline-offset:-4px}#stage{flex:1;overflow:hidden;position:relative;touch-action:none;cursor:grab;background:#2a2431}#stage.drag{cursor:grabbing}#world{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:pixelated;box-shadow:0 0 0 1px #4b5366}footer{padding:9px 18px;color:#cbbfae;background:#363c4c;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}#places{display:flex;gap:6px;overflow:auto;padding:8px 18px;background:#2e2b30;flex-shrink:0}#places button{white-space:nowrap;padding:7px 12px;font-size:13px}#zoom{min-width:45px;text-align:center}#hint{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#262a36;padding:8px 14px;pointer-events:none;white-space:nowrap;border:1px solid #6e6a70;opacity:.95}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<header><h1>栗尾坞 · 污染状态</h1><button id="fit">全城</button><button id="native">100%</button><button id="minus" aria-label="缩小">－</button><span id="zoom"></span><button id="plus" aria-label="放大">＋</button><button id="routes" aria-pressed="false">查看规划路线</button><a href="autumn-city-polluted.png" download>下载原图</a></header>
<nav id="places" aria-label="查看地图地点"></nav><main id="stage" aria-label="可拖动缩放的像素地图"><canvas id="world" width="1152" height="1408" aria-label="栗尾坞污染状态像素地图"></canvas><div id="hint">拖动查看 · 滚轮缩放 · 点击上方地点定位</div></main>
<footer><span>紧凑山城箱庭：平顶房、石阶、枫树庭院与河岸</span><span>整图预览 · 实际游玩请进入地图测试页</span></footer>
<script>
const DATA=__DATA__,stage=document.querySelector('#stage'),canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),picture=new Image(),logicalWidth=canvas.width,logicalHeight=canvas.height;canvas.width=logicalWidth*4;canvas.height=logicalHeight*4;canvas.style.width=logicalWidth+'px';canvas.style.height=logicalHeight+'px';ctx.setTransform(4,0,0,4,0,0);let scale=1,tx=0,ty=0,overlay=false,drag=null,ready=false;ctx.imageSmoothingEnabled=false;
function pixelLine(a,b,color){ctx.fillStyle=color;let x=Math.round(a[0]),y=Math.round(a[1]),x1=Math.round(b[0]),y1=Math.round(b[1]),dx=Math.abs(x1-x),dy=-Math.abs(y1-y),sx=x<x1?1:-1,sy=y<y1?1:-1,err=dx+dy,n=0;for(;;){if(n++%12<7)ctx.fillRect(x-1,y-1,3,3);if(x===x1&&y===y1)break;let e=2*err;if(e>=dy){err+=dy;x+=sx}if(e<=dx){err+=dx;y+=sy}}}
function draw(){if(!ready)return;ctx.clearRect(0,0,logicalWidth,logicalHeight);ctx.drawImage(picture,0,0,logicalWidth,logicalHeight);if(overlay){for(const [name,pts]of DATA.routes)for(let i=1;i<pts.length;i++)pixelLine(pts[i-1],pts[i],name==='货运升降机'?'#9bd3df':'#efc452');for(const p of DATA.landmarks){ctx.fillStyle='#262a36';ctx.fillRect(p.x-4,p.y-4,9,9);ctx.fillStyle='#fae59c';ctx.fillRect(p.x-2,p.y-2,5,5)}}}
function apply(){const w=stage.clientWidth,h=stage.clientHeight,margin=48;tx=Math.min(w-margin,Math.max(margin-logicalWidth*scale,tx));ty=Math.min(h-margin,Math.max(margin-logicalHeight*scale,ty));canvas.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;document.querySelector('#zoom').textContent=Math.round(scale*100)+'%'}
function fit(){scale=Math.min((stage.clientWidth-32)/logicalWidth,(stage.clientHeight-32)/logicalHeight);tx=(stage.clientWidth-logicalWidth*scale)/2;ty=(stage.clientHeight-logicalHeight*scale)/2;apply()}
function zoom(next,x=stage.clientWidth/2,y=stage.clientHeight/2){next=Math.max(.25,Math.min(5,next));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;apply()}
function focus(p){scale=2;tx=stage.clientWidth/2-p.x*scale;ty=stage.clientHeight*.6-p.y*scale;apply()}
for(const p of DATA.landmarks){const b=document.createElement('button');b.textContent=p.name;b.onclick=()=>focus(p);document.querySelector('#places').append(b)}
document.querySelector('#fit').onclick=fit;document.querySelector('#native').onclick=()=>zoom(1);document.querySelector('#minus').onclick=()=>zoom(scale/1.35);document.querySelector('#plus').onclick=()=>zoom(scale*1.35);document.querySelector('#routes').onclick=e=>{overlay=!overlay;e.target.setAttribute('aria-pressed',String(overlay));draw()};
stage.onwheel=e=>{e.preventDefault();const b=stage.getBoundingClientRect();zoom(scale*Math.exp(-e.deltaY*.0015),e.clientX-b.x,e.clientY-b.y)};stage.onpointerdown=e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,tx,ty};stage.setPointerCapture(e.pointerId);stage.classList.add('drag');document.querySelector('#hint').hidden=true};stage.onpointermove=e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;apply()};function release(){drag=null;stage.classList.remove('drag')}stage.onpointerup=stage.onpointercancel=stage.onlostpointercapture=release;window.addEventListener('resize',apply);picture.onload=()=>{ready=true;draw();fit();document.documentElement.dataset.ready='true'};picture.src='data:image/png;base64,__IMAGE__';window.autumnArt={width:logicalWidth,height:logicalHeight,data:DATA,focus,fit,zoom,get scale(){return scale}};

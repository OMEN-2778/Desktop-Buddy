*{box-sizing:border-box}body{margin:0;background:#eee8dd;color:#3c3442;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1080px;margin:30px auto;padding:0 18px}h1{font-size:24px;margin:0 0 5px}p{margin:4px 0 16px;color:#6c626c}nav,.controls{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}button{font:inherit;font-weight:650;color:inherit;background:#fffaf0;border:2px solid #6f626e;padding:7px 14px;cursor:pointer;box-shadow:2px 2px #b7a7a1;clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),0 calc(100% - 2px),0 2px,4px 2px)}button:hover,button[aria-current=true]{background:#dbe9cf}button:focus-visible{outline:3px solid #b47545;outline-offset:3px}button:disabled{opacity:.45;cursor:default}button[hidden]{display:none}.stage{background:#bcd8ea;border:3px solid #6f626e;box-shadow:4px 4px #b7a7a1;position:relative;overflow:hidden}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:crosshair;touch-action:none}canvas:focus-visible{outline:3px solid #b47545;outline-offset:-3px}#status{margin-left:auto;align-self:center;font-weight:650}small{color:#7a6e78}#error{color:#a33a3a}
#say{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:86%;background:#fffaf0;border:2px solid #6f626e;box-shadow:2px 2px #b7a7a1;padding:4px 12px;font-weight:600;font-size:14px;pointer-events:none}#say[hidden]{display:none}</style><main><h1>夏 · 海湾 · 地图漫步</h1><p>点击地面行走（或 ← → / A D）。先到更衣室点帘子换泳装：泳衣（男生女生款式不同）戴浮潜面罩，能潜一小会儿；潜水服背气瓶，能下到深海沟。走进海里会浮在水面，点水下就潜下去（↑ ↓ / W S 也行），点水面或岸上就浮上来。点躺椅可以晒太阳，点旅舍的门可以进屋；海里发光的小星星和鱼、海龟都能点。</p><nav aria-label="地图区域" id="maps"></nav><div class="stage"><p id="say" role="status" hidden></p><canvas id="scene" width="342" height="118" tabindex="0" aria-label="夏季海湾地图，点击行走和潜水"></canvas></div><div class="controls"><button id="gender">换成男生</button><button id="exit" hidden>回到屋外</button><button id="pause" aria-pressed="false">暂停</button><span id="status" role="status">正在准备地图…</span></div><small>夏季地图玩法预览，尚未接入正式游戏（不存档）。</small><p id="error" role="alert" hidden></p></main><script>/*__SCRIPT__*/</script></html>

// Pixel-circle outline for a pill n UI pixels tall (caps are half circles).
function pillClip(n, u) {
  const R = n / 2, inset = [];
  for (let r = 0; r < n; r++) {
    const dy = r + 0.5 - R;
    inset.push(Math.max(0, Math.round(R - Math.sqrt(Math.max(0, R * R - dy * dy)))));
  }
  const pts = [];
  for (let r = 0; r < n; r++) pts.push(`calc(100% - ${inset[r] * u}px) ${r * u}px`, `calc(100% - ${inset[r] * u}px) ${(r + 1) * u}px`);
  for (let r = n - 1; r >= 0; r--) pts.push(`${inset[r] * u}px ${(r + 1) * u}px`, `${inset[r] * u}px ${r * u}px`);
  return `polygon(${pts.join(",")})`;
}

// 8x8 UI-pixel tile of faint diagonal stripes; it crawls along the fill.
function stripePattern(u) {
  const c = document.createElement("canvas");
  c.width = c.height = 8 * u;
  const x = c.getContext("2d");
  x.fillStyle = "rgba(255,255,255,0.22)";
  for (let py = 0; py < 8; py++) for (let px = 0; px < 8; px++) if ((px + py) % 8 < 3) x.fillRect(px * u, py * u, u, u);
  return c.toDataURL();
}
let needGeo = { u: 2, bh: 28, barW: 200 };

function fit() {
  // The widget is [room for the bars][dots][house]; the bars always open to
  // the left into their own room, so they never cover the house.
  const desk = document.querySelector(".desk");
  const cs = getComputedStyle(desk);
  const avail = desk.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const BAR_MIN = 150, BAR_MAX = 300;
  let s = 4;
  while (s > 1 && W * s + 12 + BAR_MIN > avail) s--;
  if (W * s + 12 + BAR_MIN > avail) s = Math.max(0.4, (avail - 12 - BAR_MIN) / W);  // phones: shrink the house
  scale = s;
  const hPx = Math.round(H * s), wPx = Math.round(W * s);
  view.width = wPx; view.height = hPx;
  view.style.width = wPx + "px"; view.style.height = hPx + "px";
  // UI pixel = house pixel (at least 2px so the dots stay round)
  const u = Math.max(2, Math.round(s));
  let n = Math.max(14, Math.round(hPx * 0.14 / u));          // dot height in UI pixels
  while (n > 6 && n * u * 4 > hPx) n--;                      // four must fit in the house height
  const bh = n * u, g = 6 * u;
  const barW = Math.round(Math.max(BAR_MIN, Math.min(BAR_MAX, avail - wPx - g, wPx * 0.42)) / u) * u;
  const widget = document.getElementById("widget");
  widget.style.setProperty("--u", u + "px");
  widget.style.setProperty("--house-w", wPx + "px");
  widget.style.setProperty("--house-h", hPx + "px");
  widget.style.setProperty("--bh", bh + "px");
  widget.style.setProperty("--g", g + "px");
  widget.style.setProperty("--bar-w", barW + "px");
  // 10x10 chibi icons at one icon pixel per house pixel (smaller if the bar is thin)
  const icon = 10 * Math.max(1, Math.min(u, Math.floor((bh - 4 * u) / 10)));
  widget.style.setProperty("--icon", icon + "px");
  widget.style.setProperty("--slot", icon + 2 * u + "px");           // icon + a pixel of air each side
  widget.style.setProperty("--clip-track", pillClip(n, u));
  widget.style.setProperty("--clip-fill", pillClip(n - 4, u));
  widget.style.setProperty("--fmin", (n - 4) * u + "px");
  widget.style.setProperty("--stripes", `url(${stripePattern(u)})`);
  needGeo = { u, bh, barW };
  sizeSky(wPx, hPx, u);
  // the 造型室 is exactly as wide as the house; on phones the house is too
  // small for it, so it also spans the needs column to the house's left
  const narrowHouse = wPx < 520;
  widget.style.setProperty("--studio-w", (narrowHouse ? wPx + g + barW : wPx) + "px");
  widget.style.setProperty("--studio-dx", (narrowHouse ? g + barW : 0) + "px");
  if (typeof kickNeeds === "function") kickNeeds();
}

function activityFrame(ms) {
  // what Buddy looks like right now: frame params, pose, emote
  const a = sim.act, phase = Math.floor(ms / 600) % 2;
  if (reaction && realClock < reaction.until) return { f: { expr: "happy", wave: Math.floor(ms / 180) % 2 }, pose: "stand", emote: reaction.emote };
  if (sim.mode === "walk") {
    const i = Math.floor(sim.walkDist / 4) % 4;
    // contact frames (a foot lifted) dip the head a pixel, passing frames rise
    return { f: { look: sim.facing, bob: i % 2 ? 0 : 1, sway: i % 2 }, pose: ["walkL", "stand", "walkR", "stand"][i], emote: null };
  }
  if (sim.mode === "act") {
    const em = ACTS[a].emote;
    const showEm = em && Math.floor(ms / 2400) % 2 === 0;
    switch (a) {
      case "cook": return { f: { expr: phase ? "happy" : "neutral", bob: phase, sway: phase, look: -1 }, pose: "stand", emote: showEm ? em : null };
      case "toilet": return { f: { expr: Math.floor(ms / 2000) % 3 === 2 ? "blink" : "neutral", look: Math.floor(ms / 2600) % 2 ? 1 : -1 }, pose: "sit", emote: null };
      case "wash": return { f: { expr: phase ? "happy" : "blink", bob: phase, look: 1 }, pose: "stand", emote: showEm ? em : null };
      case "towel": return { f: { expr: "happy", bob: phase, look: -1 }, pose: "stand", emote: showEm ? em : null };
      case "water_living": case "water_study": return { f: { expr: "happy", look: a === "water_living" ? -1 : 1, bob: phase }, pose: "stand", emote: showEm ? em : null };
      case "dress": return { f: { expr: phase ? "happy" : "neutral", look: 1, bob: phase }, pose: "stand", emote: showEm ? em : null };
      case "eat": return { f: { expr: phase ? "happy" : "blink", bob: phase }, pose: "sit", emote: showEm ? em : null };
      case "computer": return { f: { expr: Math.floor(ms / 3000) % 3 === 2 ? "happy" : "neutral", look: Math.floor(ms / 1500) % 2 ? 1 : 0 }, pose: "sit", emote: showEm ? em : null };
      case "tv": return { f: { expr: Math.floor(ms / 2000) % 3 === 0 ? "happy" : "neutral", look: 1 }, pose: "sit", emote: showEm ? em : null };
      case "read": return { f: { expr: "neutral", look: -1, bob: Math.floor(ms / 1800) % 2 }, pose: "stand", emote: showEm ? em : null };
      case "window": return { f: { expr: Math.floor(ms / 2500) % 4 === 3 ? "blink" : "neutral", look: 1 }, pose: "stand", emote: null };
      default: return { f: { expr: "happy", bob: phase }, pose: "stand", emote: showEm ? em : null };
    }
  }
  // idle: replay the lively idle loop
  const seq = D.doll.seq, total = seq.reduce((a, s) => a + s.ms, 0);
  let t = ms % total, fr = seq[0];
  for (const s of seq) { if (t < s.ms) { fr = s; break; } t -= s.ms; }
  const em = fr.emote === "cheer" ? doll.cheer(look) : fr.emote;
  return { f: { ...fr }, pose: "stand", emote: em && fr.wave == null ? em : null };
}

function lyingHead(f) {   // the sleepy head turned 90 degrees: lying on the pillow
  const key = JSON.stringify(f);
  if (rotCache.has(key)) return rotCache.get(key);
  const src = dollCanvas(f, "stand", 15);
  const c = document.createElement("canvas"); c.width = src.height; c.height = src.width;
  const x = c.getContext("2d"); x.translate(0, src.width); x.rotate(-Math.PI / 2); x.drawImage(src, 0, 0);
  rotCache.set(key, c);
  return c;
}
function frameOf(list, fps) { return list[Math.floor(realClock * fps) % list.length]; }

function render() {
  const h = hour(), f = nightness(h);
  bctx.clearRect(0, 0, W, H);
  bctx.globalAlpha = 1; bctx.drawImage(IMG.day, 0, 0);
  if (f > 0) { bctx.globalAlpha = f; bctx.drawImage(IMG.night, 0, 0); bctx.globalAlpha = 1; }
  // open windows: casements swung in, curtains drifting
  const sway = [0, 1, 2, 1][Math.floor(realClock * 2.2) % 4];
  for (const [id, open] of Object.entries(windowsOpen)) {
    if (!open) continue;
    const wv = D.windows[id];
    bctx.drawImage(IMG.win[id]["day" + sway], wv.x, wv.y);
    if (f > 0) { bctx.globalAlpha = f; bctx.drawImage(IMG.win[id]["night" + sway], wv.x, wv.y); bctx.globalAlpha = 1; }
  }
  drawWeather(bctx, f > 0.5);   // on the glass only, behind everything that stands in front of a window
  drawDoors(bctx);
  const room = roomAt(sim.s), acting = sim.mode === "act", act = acting ? sim.act : null;
  const sleeping = act === "sleep";
  for (const [id, on] of Object.entries(lamps)) if (on) drawOverlay(bctx, id);
  const lit = [];
  if (f > 0.05) {
    for (const [id, on] of Object.entries(lamps)) if (on) lit.push(id);
    const auto = { kitchen: "kitchen", bath: "bath", stairs: "stairs", study: "study" }[room];
    if (auto && !sleeping) { lit.push(auto); if (auto === "stairs") drawOverlay(bctx, "sconce"); if (auto === "study") drawOverlay(bctx, "pendant"); }
    if (act === "tv") lit.push("tv");
    if (act === "computer") lit.push("monitor");
  }
  // Buddy
  const ms = realClock * 1000;
  const fr = activityFrame(ms);
  const full = { expr: "neutral", look: 0, bob: 0, sway: 0, wave: null, ...fr.f };
  let emoteAt = null;
  if (sleeping) {
    const [lx, ly] = D.sleepLying;
    bctx.drawImage(lyingHead({ ...full, expr: "sleepy", look: 0, bob: 0, sway: 0, wave: null }), lx, ly);
    drawOverlay(bctx, "sleep_cover");
    emoteAt = [lx + 10, ly - 14];
  } else if (act === "bath") {
    bctx.drawImage(dollCanvas({ ...full, look: 0, wave: null }, "stand", 14), D.bathHead[0], D.bathHead[1]);
    drawOverlay(bctx, "tub_front"); drawOverlay(bctx, "bubbles");
    emoteAt = [D.bathHead[0] + 13, D.bathHead[1] - 15];
  } else {
    const p = pathPos(sim.s);
    const x = Math.round(p.x - DW / 2), y = Math.round(p.y - DH + 1);
    bctx.drawImage(dollCanvas(full, fr.pose), x, y);
    if (act === "tv") drawOverlay(bctx, "coffee_table");
    emoteAt = [x + 13, y - 15];
  }
  grade(bctx, f, lit);
  // things that glow on their own: screens, flames, steam
  if (act === "tv") {
    const ch = Object.keys(IMG.tv)[Math.floor(realClock / 6) % 4];
    bctx.drawImage(frameOf(IMG.tv[ch], 4), D.screens.tv.x, D.screens.tv.y);
  }
  if (act === "computer") {
    const g = Object.keys(IMG.mon)[Math.floor(realClock / 8) % 3];
    bctx.drawImage(frameOf(IMG.mon[g], 5), D.screens.monitor.x, D.screens.monitor.y);
  }
  if (act === "cook") bctx.drawImage(frameOf(IMG.fx.cook, 8), D.fx.cook.x, D.fx.cook.y);
  if (act === "eat") bctx.drawImage(frameOf(IMG.fx.meal, 4), D.fx.meal.x, D.fx.meal.y);
  if (act === "water_living" || act === "water_study") bctx.drawImage(frameOf(IMG.fx[act], 6), D.fx[act].x, D.fx[act].y);
  if (fr.emote || sleeping) bctx.drawImage(emoteCanvas(sleeping ? "zzz" : fr.emote), emoteAt[0], emoteAt[1]);
  drawClickFx(bctx);
  vctx.imageSmoothingEnabled = false;
  vctx.drawImage(buf, 0, 0, view.width, view.height);
}

// ================================================================ seasons & weather
// Every 14 days is a season. Spring, summer and autumn now and then get a
// shower; winter gets snow. Each day rolls its episodes once (lazily).
const SEASON_DAYS = 14;
const SEASONS = [
  { name: "春", kind: "rain", p: 0.32, hello: "春天来了，窗外的山坡绿起来了。" },
  { name: "夏", kind: "rain", p: 0.28, hello: "夏天到了，阳光晒得暖暖的。" },
  { name: "秋", kind: "rain", p: 0.26, hello: "秋天了，窗外的山坡变成了金色。" },
  { name: "冬", kind: "snow", p: 0.45, hello: "冬天来了，要多穿一点哦。" },
];
const WEATHER_NAME = { clear: "晴", rain: "小雨", snow: "下雪" };
function seasonOf(t) {
  const d = Math.floor(t / 1440);
  return { i: Math.floor(d / SEASON_DAYS) % 4, day: d % SEASON_DAYS + 1 };
}
const weather = { plan: new Map(), force: null, kind: "clear", season: 0, snowCover: 0 };
function planDay(d) {
  if (d < 0) return [];
  if (!weather.plan.has(d)) {
    const s = SEASONS[Math.floor(d / SEASON_DAYS) % 4], eps = [];
    for (const p of [s.p, s.p * 0.3]) {           // usually none, sometimes one, rarely two
      if (Math.random() >= p) break;
      const from = d * 1440 + Math.floor(Math.random() * 22 * 60);
      eps.push({ from, to: from + 90 + Math.random() * 270, kind: s.kind });
    }
    weather.plan.set(d, eps);
  }
  return weather.plan.get(d);
}
function weatherAt(t) {
  if (weather.force) return weather.force;
  const d = Math.floor(t / 1440);
  for (const dd of [d - 1, d]) for (const e of planDay(dd)) if (t >= e.from && t < e.to) return e.kind;
  return "clear";
}
function updateWeather(dtGame) {
  const se = seasonOf(sim.t).i;
  if (se !== weather.season) { weather.season = se; log(SEASONS[se].hello); }
  const w = weatherAt(sim.t);
  if (w !== weather.kind) {
    const was = weather.kind;
    weather.kind = w;
    if (w === "rain") log("窗外下起了小雨。");
    else if (w === "snow") log("下雪了！窗外白白的一片。");
    else log(was === "snow" ? "雪停了。" : "雨停了。");
  }
  // snow settles on the hill while it snows and melts slowly afterwards (fast outside winter)
  if (w === "snow") weather.snowCover = Math.min(1, weather.snowCover + dtGame / 150);
  else weather.snowCover = Math.max(0, weather.snowCover - dtGame / (se === 3 ? 2880 : 240));
}

// ---------- weather through the windows
const WMASK = {};
function maskCanvas(imgs, w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  for (const i of imgs) x.drawImage(i, 0, 0);
  return c;
}
async function loadWeatherMasks() {
  for (const [id, m] of Object.entries(D.weatherMasks)) {
    const st = {};
    for (const k of ["closed", "open"]) {
      if (!m[k]) continue;
      const sky = await loadImg(m[k].sky), ground = await loadImg(m[k].ground);
      st[k] = { sky, ground, glass: maskCanvas([sky, ground], sky.width, sky.height), w: sky.width, h: sky.height };
    }
    WMASK[id] = { x: m.x, y: m.y, ...st };
  }
}
const wtmp = document.createElement("canvas"), wctx = wtmp.getContext("2d");
function masked(ctx, m, mask, x, y, paint) {   // paint(local ctx), keep only the mask's pixels
  wtmp.width = m.w; wtmp.height = m.h;
  wctx.globalCompositeOperation = "source-over";
  paint(wctx);
  wctx.globalCompositeOperation = "destination-in";
  wctx.drawImage(mask, 0, 0);
  ctx.drawImage(wtmp, x, y);
}
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function drawWeather(ctx, night) {
  const se = weather.season, w = weather.kind;
  const tint = se === 2 ? "rgba(214, 140, 52, 0.62)" : se === 1 ? "rgba(46, 104, 52, 0.22)" : null;
  for (const [id, win] of Object.entries(WMASK)) {
    const m = windowsOpen[id] && win.open ? win.open : win.closed;
    if (!m) continue;
    // the season on the hill
    if (tint || weather.snowCover > 0) {
      masked(ctx, m, m.ground, win.x, win.y, g => {
        if (tint) { g.fillStyle = tint; g.fillRect(0, 0, m.w, m.h); }
        if (weather.snowCover > 0) { g.fillStyle = `rgba(244, 247, 252, ${0.9 * weather.snowCover})`; g.fillRect(0, 0, m.w, m.h); }
      });
    }
    if (w === "clear") continue;
    // grey sky + falling rain / drifting snow, only on the glass
    masked(ctx, m, m.glass, win.x, win.y, g => {
      g.fillStyle = w === "rain" ? "rgba(66, 78, 100, 0.5)" : "rgba(196, 206, 222, 0.3)";
      g.fillRect(0, 0, m.w, m.h);
      const seed = id.length * 13 + win.x;
      if (w === "rain") {
        g.fillStyle = night ? "rgba(170, 190, 225, 0.75)" : "rgba(232, 240, 252, 0.85)";
        for (let i = 0; i < 22; i++) {
          const x0 = hash(seed + i) * (m.w + 6), sp = 26 + hash(seed + i * 3) * 10;
          const y = ((realClock * sp + hash(seed + i * 7) * m.h) % (m.h + 4)) - 3;
          g.fillRect(Math.floor(x0 - y * 0.25), Math.floor(y), 1, 3);
        }
      } else {
        g.fillStyle = "rgba(255, 255, 255, 0.95)";
        for (let i = 0; i < 12; i++) {
          const x0 = hash(seed + i) * m.w, sp = 3 + hash(seed + i * 3) * 3;
          const y = (realClock * sp + hash(seed + i * 7) * m.h) % (m.h + 2) - 1;
          g.fillRect(Math.floor(x0 + Math.sin(realClock * 1.3 + i) * 1.5), Math.floor(y), 1, 1);
        }
      }
    });
  }
}

// ---------- the sky bar above the house
const skyEl = document.getElementById("skybar"), skyCanvas = document.getElementById("sky"), skx = skyCanvas.getContext("2d");
const skyTip = document.getElementById("skyTip");
const SKY_STOPS = [[0, "#ffd92b"], [0.28, "#ffd84a"], [0.4, "#f8d6a0"], [0.48, "#f1c4d6"], [0.55, "#b7a3d0"],
                   [0.62, "#7186c6"], [0.7, "#2c72bf"], [1, "#0f63b0"]];
const SKY_ICON = 16, SKY_MORPH = 0.9;
let skyGeo = { b: 3, w: 684, cols: 228 }, skyTrack = null;
const sky = { icon: null, from: null, t0: -9, x: 0, fromX: 0 };
const IMG_SKY = {};
async function loadSkyIcons() {
  for (const [k, frames] of Object.entries(D.skyIcons)) IMG_SKY[k] = await Promise.all(frames.map(loadImg));
}
const skyFrac = t => (((t % 1440) / 60 - 6 + 24) % 24) / 24;   // the bar starts at 06:00
function skyColor(f) {
  let i = 0;
  while (i < SKY_STOPS.length - 2 && f > SKY_STOPS[i + 1][0]) i++;
  const [f0, c0] = SKY_STOPS[i], [f1, c1] = SKY_STOPS[i + 1];
  const k = Math.max(0, Math.min(1, (f - f0) / (f1 - f0)));
  const a = doll.hexToRgb(c0), b = doll.hexToRgb(c1);
  return `rgb(${a.map((v, j) => Math.round((v + (b[j] - v) * k) * 255)).join(",")})`;
}
function buildSkyTrack() {
  // a pixel pill: 8 units tall, 2-unit white ring, gradient fill, centred in the 16-unit bar
  const { b, w, cols } = skyGeo, H16 = SKY_ICON * b;
  const c = document.createElement("canvas"); c.width = w; c.height = H16;
  const x = c.getContext("2d");
  const ox = Math.floor((w - cols * b) / 2), top = 4, R = 4;
  const inset = (r, rad, rows) => { const d = r + 0.5 - rows / 2; return Math.round(rad - Math.sqrt(Math.max(0, rad * rad - d * d))); };
  for (let r = 0; r < 8; r++) {
    const e = inset(r, R, 8);
    x.fillStyle = "#ffffff";
    x.fillRect(ox + e * b, (top + r) * b, (cols - 2 * e) * b, b);
  }
  for (let r = 0; r < 4; r++) {
    const e = 2 + inset(r, 2, 4);
    for (let col = e; col < cols - e; col++) {
      x.fillStyle = skyColor(col / (cols - 1));
      x.fillRect(ox + col * b, (top + 2 + r) * b, b, b);
    }
    x.fillStyle = "rgba(255,255,255,0.32)";                 // a 1-unit gloss line, like the needs bars
    if (r === 0) x.fillRect(ox + (e + 2) * b, (top + 2) * b, (cols - 2 * e - 4) * b, b);
  }
  skyTrack = c;
}
function sizeSky(wPx, hPx, u) {
  const b = Math.max(1, Math.min(u, Math.floor(hPx / 36)));
  skyGeo = { b, w: wPx, cols: Math.floor(wPx / b) };
  skyCanvas.width = wPx; skyCanvas.height = SKY_ICON * b;
  const widget = document.getElementById("widget");
  widget.style.setProperty("--sky-h", SKY_ICON * b + "px");
  widget.style.setProperty("--sky-gap", -7 * b + "px");      // hangs 7 units over the house's top edge
  widget.style.setProperty("--sky-over", 7 * b + "px");
  buildSkyTrack();
}
function skyTarget() {
  if (weather.kind !== "clear") return weather.kind;
  const h = hour();
  return h >= 6 && h < 19 ? "sun" : "moon";
}
function drawIcon(name, cx, cy, scale) {
  const fr = IMG_SKY[name];
  if (!fr || scale <= 0.02) return;
  const fps = name === "rain" ? 6 : name === "sun" ? 3 : 4;
  const img = reduceMotionUI ? fr[0] : fr[Math.floor(realClock * fps) % fr.length];
  // whole screen pixels only: the icon is drawn at an integer size and position,
  // so it never lands between pixels (that is what made it look jagged)
  const size = Math.max(1, Math.round(SKY_ICON * skyGeo.b * scale));
  skx.drawImage(img, Math.round(cx - size / 2), Math.round(cy - size / 2), size, size);
}
function renderSky() {
  if (!skyTrack || !IMG_SKY.sun) return;
  const { b, w, cols } = skyGeo, ox = Math.floor((w - cols * b) / 2);
  const col = Math.round(SKY_ICON / 2 + skyFrac(sim.t) * (cols - SKY_ICON));
  const x = ox + col * b, cy = (SKY_ICON * b) / 2;
  const want = skyTarget();
  if (sky.icon === null) { sky.icon = want; sky.x = x; }
  const wrapped = x < sky.x - w / 2;                          // 06:00: from the right end back to the left
  if (want !== sky.icon || wrapped) { sky.from = sky.icon; sky.fromX = sky.x; sky.icon = want; sky.t0 = realClock; }
  sky.x = x;
  skx.imageSmoothingEnabled = false;
  skx.clearRect(0, 0, w, skyCanvas.height);
  skx.drawImage(skyTrack, 0, 0);
  const p = reduceMotionUI ? 1 : (realClock - sky.t0) / SKY_MORPH;
  const bob = reduceMotionUI || sky.icon === "sun" ? 0 : (Math.sin(realClock * 1.8) > 0.6 ? -b : 0);   // whole units
  if (p < 1 && sky.from) {
    // the old icon spins down to nothing, the new one springs up in its place
    const out = Math.min(1, p / 0.5), back = 1 - out;
    drawIcon(sky.from, sky.fromX, cy, back * back * (3 - 2 * back));
    const q = Math.max(0, (p - 0.3) / 0.7), c1 = 1.9;     // ease-out-back: overshoots a little, settles
    const pop = q <= 0 ? 0 : 1 + (c1 + 1) * (q - 1) ** 3 + c1 * (q - 1) ** 2;
    drawIcon(sky.icon, x, cy + bob, pop);
    // sparkles fly out from where the change happens
    skx.fillStyle = "#ffffff";
    if (p > 0.25 && p < 0.95) {
      const r = (p - 0.25) / 0.7;
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4 + 0.3, d = (6 + r * 9) * b;
        const size = Math.max(1, Math.round(b * (1 - r) * 1.5));
        skx.fillRect(Math.round(x + Math.cos(a) * d), Math.round(cy + Math.sin(a) * d), size, size);
      }
    }
  } else {
    drawIcon(sky.icon, x, cy + bob, 1);
  }
  if (!skyTip.hidden) skyTip.style.left = x + "px";
}
function skyText() {
  const se = seasonOf(sim.t);
  return `${SEASONS[se.i].name}季 · 第 ${se.day} 天 · ${fmt(sim.t)} · ${WEATHER_NAME[weather.kind]}`;
}
const skyHit = document.getElementById("skyHit");
skyHit.addEventListener("pointerenter", () => { skyTip.hidden = false; skyTip.textContent = skyText(); });
skyHit.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") skyTip.hidden = true; });
skyHit.addEventListener("click", () => { skyTip.hidden = !skyTip.hidden; skyTip.textContent = skyText(); });

document.querySelectorAll("[data-weather]").forEach(btn => btn.addEventListener("click", () => {
  weather.force = btn.dataset.weather || null;
  document.querySelectorAll("[data-weather]").forEach(x => x.setAttribute("aria-pressed", String(x === btn)));
}));
document.getElementById("nextSeason").addEventListener("click", () => {
  const d = Math.floor(sim.t / 1440);
  sim.t += ((Math.floor(d / SEASON_DAYS) + 1) * SEASON_DAYS - d) * 1440;
});

// ================================================================ UI
const needsEl = document.getElementById("needs");
needsEl.querySelectorAll("img[data-icon]").forEach(img => { img.src = D.needIcons[img.dataset.icon]; });
function needColor(v) { return v < 20 ? "var(--need-low)" : v < 50 ? "var(--need-warn)" : "var(--need-ok)"; }
function syncUI() {
  const day = Math.floor(sim.t / 1440) + 1, h = hour();
  const part = h < 5 ? "深夜" : h < 9 ? "早上" : h < 12 ? "上午" : h < 14 ? "中午" : h < 18 ? "下午" : h < 22 ? "晚上" : "深夜";
  const se = seasonOf(sim.t);
  document.getElementById("clock").textContent = `第 ${day} 天 · ${SEASONS[se.i].name} ${se.day}/${SEASON_DAYS} · ${fmt(sim.t)} · ${part} · ${WEATHER_NAME[weather.kind]}`;
  skyEl.setAttribute("aria-label", `时间与天气：${skyText()}`);
  if (!skyTip.hidden) skyTip.textContent = skyText();
  const doing = sim.mode === "walk" ? `走去${ACTS[sim.act].label}` : sim.mode === "act" ? ACTS[sim.act].label : "闲着";
  document.getElementById("doing").firstChild.textContent = `正在：${doing}`;
  document.getElementById("ff").textContent = sim.mode === "act" && sim.act === "sleep" && speed ? "（夜里自动快进）" : "";
  for (const [k, v] of Object.entries(sim.needs)) {
    const el = needsEl.querySelector(`[data-k="${k}"]`);
    el.style.setProperty("--c", needColor(v));
    el.classList.toggle("low", v < 20);
    el.style.setProperty("--v", (v / 100).toFixed(3));
    el.setAttribute("aria-valuenow", Math.round(v));
  }
}

// Open when the pointer comes near the dots (or on focus / tap); close shortly after it leaves.
// Each bar is a damped spring (overshoots, then settles), snapped to whole UI
// pixels every frame; bars pop out one after another, then their fill springs up.
const reduceMotionUI = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const springs = [...needsEl.querySelectorAll(".need")].map((el, i) => ({ el, i, x: 0, v: 0, target: 0, start: 0, p: 0, pv: 0, ptarget: 0, pstart: 0 }));
let springRaf = 0, springLast = 0;
function springStep(now) {
  const dt = springLast ? Math.min(0.033, (now - springLast) / 1000) : 0.016;
  springLast = now;
  const { u, bh, barW } = needGeo;
  let active = false;
  for (const s of springs) {
    if (reduceMotionUI) { s.x = s.target; s.p = s.ptarget; s.v = s.pv = 0; }
    if (now >= s.start) {
      const opening = s.target === 1;
      const k = opening ? 330 : 420, c = opening ? 17 : 30;      // bouncy out, firmer back
      s.v += (-k * (s.x - s.target) - c * s.v) * dt;
      s.x = Math.min(1.12, s.x + s.v * dt);
    }
    if (now >= s.pstart) {
      s.pv += (-260 * (s.p - s.ptarget) - 15 * s.pv) * dt;
      s.p += s.pv * dt;
    }
    const moving = now < s.start || now < s.pstart ||
      Math.abs(s.x - s.target) > 0.002 || Math.abs(s.v) > 0.02 || Math.abs(s.p - s.ptarget) > 0.002 || Math.abs(s.pv) > 0.02;
    if (moving) active = true; else { s.x = s.target; s.p = s.ptarget; s.v = s.pv = 0; }
    const w = bh + (barW - bh) * s.x;
    s.el.style.width = Math.max(bh, Math.round(w / u) * u) + "px";
    s.el.style.setProperty("--p", Math.max(0, s.p).toFixed(3));
  }
  springRaf = active ? requestAnimationFrame(springStep) : 0;
  if (!active) springLast = 0;
}
function kickNeeds() { if (!springRaf) springRaf = requestAnimationFrame(springStep); }

let closeT = null;
function setNeedsOpen(open) {
  clearTimeout(closeT);
  if (needsEl.classList.contains("open") === open) return;
  needsEl.classList.toggle("open", open);
  needsEl.setAttribute("aria-expanded", String(open));
  const now = performance.now();
  for (const s of springs) {
    s.target = open ? 1 : 0;
    s.ptarget = open ? 1 : 0;
    s.start = now + (open ? s.i * 55 : (springs.length - 1 - s.i) * 35);
    s.pstart = open ? s.start + 140 : now;
  }
  kickNeeds();
}
needsEl.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") setNeedsOpen(true); });
needsEl.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") closeT = setTimeout(() => setNeedsOpen(false), 250); });
needsEl.addEventListener("click", e => { if (e.pointerType !== "mouse") setNeedsOpen(!needsEl.classList.contains("open")); });
needsEl.addEventListener("focus", () => { if (needsEl.matches(":focus-visible")) setNeedsOpen(true); });  // keyboard only
needsEl.addEventListener("blur", () => setNeedsOpen(false));
needsEl.addEventListener("keydown", e => { if (e.key === "Escape") needsEl.blur(); });

document.querySelectorAll("[data-speed]").forEach(b => b.addEventListener("click", () => {
  speed = +b.dataset.speed;
  document.querySelectorAll("[data-speed]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
}));
function canvasXY(e) {
  const r = view.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
function buddyHit(x, y) {
  if (sim.mode === "act" && sim.act === "sleep") {
    const [lx, ly] = D.sleepLying;
    return x >= lx && x < lx + 15 && y >= ly && y < ly + 20;
  }
  const p = sim.mode === "act" && sim.act === "bath" ? { x: D.bathHead[0] + 10, y: D.bathHead[1] + 14 } : pathPos(sim.s);
  return Math.abs(x - p.x) < 9 && y > p.y - DH + 2 && y < p.y + 2;
}
view.addEventListener("pointermove", e => {
  const [x, y] = canvasXY(e);
  hoverId = buddyHit(x, y) ? null : clickableAt(x, y);
  view.style.cursor = hoverId || buddyHit(x, y) ? "pointer" : "default";
});
view.addEventListener("pointerleave", () => { hoverId = null; });
view.addEventListener("click", e => {
  const [x, y] = canvasXY(e);
  if (buddyHit(x, y)) {
    if (sim.mode === "act" && sim.act === "sleep") { log("你戳了戳她，她咂咂嘴继续睡。"); return; }
    reaction = { until: realClock + 1.6, emote: doll.cheer(look) };
    sim.needs.fun = clamp(sim.needs.fun + 4);
    if (Math.random() < 0.5) log(["你戳了她一下，她冲你挥挥手。", "她发现你在看她，开心地挥了挥手。", "被你戳得咯咯笑。"][Math.floor(Math.random() * 3)]);
    return;
  }
  const id = clickableAt(x, y);
  if (id) useFurniture(id);
});

// ================================================================ 造型室
// Clicking the wardrobe sends her there; when she arrives the dressing room
// slides open above the house (pushing it down, never covering it).
let wardrobeOpen = false;
const studioEl = document.getElementById("studio"), studioSlot = document.getElementById("studioSlot");
function saveLook() { try { localStorage.setItem("buddy-look-v2", JSON.stringify(look)); } catch (e) { /* storage unavailable */ } }
function changeLook(l) {
  setLook(l);
  saveLook();
  const p = pathPos(sim.s);
  poof = { t0: realClock, x: p.x, y: p.y - 14 };
}
let studio = null;
function openWardrobe() {
  if (wardrobeOpen) return;
  wardrobeOpen = true;
  studio.setLook(look);
  studioEl.hidden = false;
  studio.refit();
  studio.start();
  requestAnimationFrame(() => {
    studioSlot.classList.add("open");
    const r = view.getBoundingClientRect();
    if (r.top < 0 || studioEl.getBoundingClientRect().top < 0) studioEl.scrollIntoView({ block: "start", behavior: "smooth" });
  });
}
function closeWardrobe() {
  if (!wardrobeOpen) return;
  wardrobeOpen = false;
  studioSlot.classList.remove("open");
  studio.stop();
  const hide = () => { if (!wardrobeOpen) studioEl.hidden = true; };
  if (reduceMotionUI) hide(); else setTimeout(hide, 450);
  log("换好衣服了，美美的！");
}

// ================================================================ loop
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  realClock += dt;
  const fast = sim.mode === "act" && sim.act === "sleep" ? 8 : 1;
  step(dt * speed * fast, dt * (speed ? 1 : 0));
  updateDoors(speed ? dt : 0);
  render();
  renderSky();
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; syncUI(); }
  requestAnimationFrame(frame);
}

(async function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("buddy-look-v2") || "null"); } catch (e) { /* storage unavailable */ }
  setLook(saved && typeof saved === "object" ? saved : doll.PRESETS.f);
  studio = BuddyStudio(studioEl, doll, D.doll, { look, previewScale: 3, thumbH: 40, onChange: changeLook, onClose: closeWardrobe });
  fit();
  window.addEventListener("resize", fit);
  await loadAssets();
  await loadSkyIcons();
  await loadWeatherMasks();
  weather.kind = weatherAt(sim.t);
  log("—— 第 1 天 · 春 ——", "day");
  log("还在被窝里睡觉。");
  syncUI();
  render();
  requestAnimationFrame(frame);
})();
</script>

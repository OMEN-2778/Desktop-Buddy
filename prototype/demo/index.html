<title>Buddy 小屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: the page is just the house, centred like a widget on a desktop.
   Everything else hides until asked for: the needs are four dots beside the
   house that stretch into bars when the pointer comes near. */
:root {
  --bg: #e6e3ee;
  --dither: #dcd8e6;
  --panel: #f7f6fb;
  --panel-2: #eceaf2;
  --ink: #22182a;
  --muted: #5e5b71;
  --edge: #22182a;
  --bevel-hi: #ffffff;
  --bevel-lo: #bab7c9;
  --shadow: #8f8ba2;
  --accent: #46619e;
  --accent-hi: #6c90c8;
  --accent-lo: #2f3c6d;
  --accent-ink: #f7f6fb;
  --focus: #d29b30;
  /* needs: track ring + three states (from the sketch) */
  --ring: #ffffff;
  --need-ok: #b2d683;
  --need-warn: #f5b675;
  --need-low: #e87272;
  --need-label: rgba(34, 24, 42, 0.62);
  --u: 2px;              /* one UI pixel = one house pixel on screen (set by fit) */
  --font: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131f; --dither: #1d1828; --panel: #2b2538; --panel-2: #332c42; --ink: #f7f6fb; --muted: #bab7c9;
    --edge: #0d0a12; --bevel-hi: #433a54; --bevel-lo: #1f1a2a; --shadow: #0d0a12;
    --accent: #6c90c8; --accent-hi: #a6c5e7; --accent-lo: #2f3c6d; --accent-ink: #141228; --focus: #efc452;
    --ring: #f4f1f8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131f; --dither: #1d1828; --panel: #2b2538; --panel-2: #332c42; --ink: #f7f6fb; --muted: #bab7c9;
  --edge: #0d0a12; --bevel-hi: #433a54; --bevel-lo: #1f1a2a; --shadow: #0d0a12;
  --accent: #6c90c8; --accent-hi: #a6c5e7; --accent-lo: #2f3c6d; --accent-ink: #141228; --focus: #efc452;
  --ring: #f4f1f8; color-scheme: dark;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; }
body {
  background-color: var(--bg);
  background-image: repeating-conic-gradient(var(--dither) 0 25%, transparent 0 50%);
  background-size: 6px 6px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  display: grid;
  grid-template-rows: 1fr auto;
  grid-template-columns: minmax(0, 1fr);
}
.desk {
  display: grid;
  place-items: center;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.widget { position: relative; }
#view { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }

/* ---------- needs: dots that stretch into bars ----------
   Sizes come from JS (fit): --u is one house pixel on screen, --bh the dot /
   bar height, --bar-w the open length; the column is exactly as tall as the
   house and sits just left of it. Bars only ever grow to the left. */
.widget { display: flex; align-items: stretch; gap: var(--g, 12px); padding-left: calc(var(--bar-w, 200px) - var(--bh, 24px)); }
.needs {
  position: relative;
  flex: none;
  width: var(--bh, 24px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;  /* first dot flush with the top, last with the bottom */
  align-items: flex-end;           /* right-anchored: bars grow to the left */
  outline: none;
}
.needs::before {                   /* invisible hover zone around the dots */
  content: ""; position: absolute; inset: -14px -10px -14px -14px;
}
.needs.open::before { left: calc(var(--bh, 24px) - var(--bar-w, 200px) - 14px); }
.need {
  position: relative;
  flex: none;
  width: var(--bh, 24px);          /* JS springs this between the dot and the open bar */
  height: var(--bh, 24px);
  background: var(--ring);
  clip-path: var(--clip-track);
}
.need .fill {
  position: absolute;
  /* 2px white ring; once open (--p springs 0 -> 1) the fill starts right of
     the icon slot, so the icon never hides the fill's start or its maximum */
  --room: calc(100% - var(--u) * 4 - var(--slot, 30px) * var(--p, 0));
  top: calc(var(--u) * 2); bottom: calc(var(--u) * 2);
  left: calc(var(--u) * 2 + var(--slot, 30px) * var(--p, 0));
  width: min(var(--room), var(--fmin) + (var(--room) - var(--fmin)) * var(--v, 1) * var(--p, 0));
  background-color: var(--c, var(--need-ok));
  background-image: var(--stripes);
  background-size: calc(var(--u) * 8) calc(var(--u) * 8);
  image-rendering: pixelated;
  clip-path: var(--clip-fill);
  animation: crawl 3.2s steps(8) infinite;
  transition: background-color .3s;
}
.need .fill::before {              /* a 1px gloss line along the top */
  content: ""; position: absolute; top: var(--u); left: calc(var(--u) * 2); right: calc(var(--u) * 2);
  height: var(--u); background: rgba(255, 255, 255, .38);
}
.need.low .fill { animation: crawl 3.2s steps(8) infinite, pulse 1.4s ease-in-out infinite; }
@keyframes crawl { from { background-position: 0 0; } to { background-position: calc(var(--u) * -8) 0; } }
@keyframes pulse { 50% { filter: brightness(1.18) saturate(1.1); } }
.need img {
  position: absolute;
  left: calc(var(--u) * 3);
  top: 50%;
  width: var(--icon, 24px);
  height: var(--icon, 24px);
  transform: translateY(-50%) scale(.2);
  image-rendering: pixelated;
  opacity: 0;
  pointer-events: none;
}
.needs.open .need img {
  animation: pop .5s cubic-bezier(.3, 1.9, .5, 1) both;
  animation-delay: calc(var(--i, 0) * 55ms + 200ms);
}
@keyframes pop {
  from { opacity: 0; transform: translateY(-50%) scale(.2) rotate(-12deg); }
  to   { opacity: 1; transform: translateY(-50%) scale(1) rotate(0); }
}
.needs:focus-visible::after {
  content: ""; position: absolute; inset: -6px; border: 2px dashed var(--focus); pointer-events: none;
}

/* ---------- wardrobe: a small pixel window that pops up beside the wardrobe ---------- */
.wardrobe {
  position: absolute;
  z-index: 5;
  width: 248px;
  background: var(--panel);
  color: var(--ink);
  font-size: 12px;
  box-shadow:
    0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge),
    6px 6px 0 0 var(--shadow);
  animation: wpop .32s cubic-bezier(.3, 1.6, .5, 1) both;
  transform-origin: 0 0;
}
@keyframes wpop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.wardrobe .wtitle { display: flex; justify-content: space-between; align-items: center; background: #33253b; color: #f7f6fb; padding: 3px 4px 3px 10px; font-weight: 700; letter-spacing: .1em; }
.wardrobe .wtitle button { margin: 0; padding: 0 6px; font-size: 12px; box-shadow: none; background: transparent; color: inherit; }
.wardrobe .wbody { padding: 8px 10px 10px; display: grid; gap: 6px; }
.wardrobe .wrow { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 6px; align-items: center; }
.wardrobe .wl { color: var(--muted); font-weight: 700; }
.wardrobe .chips { display: flex; flex-wrap: wrap; gap: 3px 4px; }
.wardrobe .chips button { margin: 2px; padding: 1px 6px; font-size: 12px; }
.wardrobe .sw { display: flex; flex-wrap: wrap; gap: 3px; }
.wardrobe .sw button {
  width: 14px; height: 14px; margin: 0; padding: 0; background: var(--c);
  box-shadow: 0 0 0 1px var(--edge);
}
.wardrobe .sw button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.wardrobe #wRandom { justify-self: start; margin-top: 2px; }

/* ---------- temporary console (time, suggestions, look, diary) ---------- */
.console {
  justify-self: center;
  width: min(100%, 980px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 20px;
  color: var(--muted);
  font-size: 13px;
}
.console summary { cursor: pointer; letter-spacing: .04em; }
.console[open] summary { margin-bottom: 12px; }
.console .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; color: var(--ink); }
@media (max-width: 760px) { .console .grid { grid-template-columns: minmax(0, 1fr); } }
.console .box { display: grid; gap: 8px; align-content: start; min-width: 0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
button {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--panel-2);
  border: 0; padding: 4px 10px; margin: var(--u); cursor: pointer;
  box-shadow:
    inset 0 calc(-1 * var(--u)) 0 0 var(--bevel-lo), inset 0 var(--u) 0 0 var(--bevel-hi),
    0 calc(-1 * var(--u)) 0 0 var(--edge), 0 var(--u) 0 0 var(--edge),
    calc(-1 * var(--u)) 0 0 0 var(--edge), var(--u) 0 0 0 var(--edge);
}
button:hover { background: var(--panel); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, summary:focus-visible { outline: var(--u) dashed var(--focus); outline-offset: calc(var(--u) * 2); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 200px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 8px; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.log li.day { grid-template-columns: 1fr; color: var(--muted); font-size: 12px; letter-spacing: .1em; }
@media (prefers-reduced-motion: reduce) {
  .need .fill, .need.low .fill { animation: none; transition: none; }
  .needs.open .need img { animation: none; opacity: 1; transform: translateY(-50%); }
}
</style>

<main class="desk">
  <div class="widget" id="widget">
    <div class="needs" id="needs" tabindex="0" role="button" aria-expanded="false" aria-label="她的状态（饱腹、精力、清洁、开心）">
      <div class="need" style="--i:0" data-k="hunger" role="meter" aria-label="饱腹" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="hunger"></div>
      <div class="need" style="--i:1" data-k="energy" role="meter" aria-label="精力" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="energy"></div>
      <div class="need" style="--i:2" data-k="hygiene" role="meter" aria-label="清洁" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="hygiene"></div>
      <div class="need" style="--i:3" data-k="fun" role="meter" aria-label="开心" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="fun"></div>
    </div>
    <canvas id="view" width="342" height="118" aria-label="小屋剖面，小人在里面生活。点家具让她去做事，点她一下试试。"></canvas>
    <div class="wardrobe" id="wardrobe" hidden role="dialog" aria-label="衣柜">
      <div class="wtitle"><span>衣柜</span><button type="button" id="wClose" aria-label="关上衣柜">✕</button></div>
      <div class="wbody">
        <div class="wrow"><span class="wl">性别</span><div class="chips" data-k="gender"><button type="button" data-v="f">女生</button><button type="button" data-v="m">男生</button></div></div>
        <div class="wrow"><span class="wl">发型</span><div class="chips" data-k="style"><button type="button" data-v="messy">短发</button><button type="button" data-v="neat">侧分</button><button type="button" data-v="long">长发</button><button type="button" data-v="buns">丸子</button></div></div>
        <div class="wrow"><span class="wl">衣服</span><div class="chips" data-k="outfit"><button type="button" data-v="jacket">夹克</button><button type="button" data-v="hoodie">卫衣</button><button type="button" data-v="dress">裙装</button></div></div>
        <div class="wrow"><span class="wl">配饰</span><div class="chips" data-k="acc"><button type="button" data-v="">无</button><button type="button" data-v="glasses">眼镜</button><button type="button" data-v="bow">蝴蝶结</button><button type="button" data-v="headphones">耳机</button></div></div>
        <div class="wrow"><span class="wl">发色</span><div class="sw" data-k="hair"></div></div>
        <div class="wrow"><span class="wl">上衣</span><div class="sw" data-k="top"></div></div>
        <div class="wrow"><span class="wl" id="wBottomLabel">下装</span><div class="sw" data-k="bottom"></div></div>
        <button type="button" id="wRandom">随机搭配</button>
      </div>
    </div>
  </div>
</main>

<details class="console">
  <summary>临时控制台：时间 · 日记（之后也会改成隐藏式）</summary>
  <div class="grid">
    <div class="box">
      <div class="clock" id="clock">第 1 天 · 07:00</div>
      <div id="doing">正在：睡觉<small id="ff"></small></div>
      <div class="label">时间速度</div>
      <div class="row" role="group" aria-label="时间速度">
        <button type="button" data-speed="0" aria-pressed="false">暂停</button>
        <button type="button" data-speed="1" aria-pressed="false">×1</button>
        <button type="button" data-speed="3" aria-pressed="true">×3</button>
        <button type="button" data-speed="10" aria-pressed="false">×10</button>
      </div>
      <p class="note">点家具让她去做事：床、衣柜、浴缸、马桶、洗手台、毛巾、书架、电脑、沙发、电视、灶台、餐桌、冰箱、绿植；台灯和窗户可以开关。</p>
    </div>
    <div class="box" style="grid-column: span 2">
      <div class="label">日记</div>
      <ul class="log" id="log"></ul>
    </div>
  </div>
</details>

// ================================================================ colors
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
function rgbToHex(r, g, b) { return "#" + [r, g, b].map(v => Math.round(v * 255).toString(16).padStart(2, "0")).join(""); }
function rgbToHsv(r, g, b) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) { if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
  return [h, max ? d / max : 0, max];
}
function hsvToRgb(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return [r + m, g + m, b + m];
}
function toward(h, t, a) { const d = (((t - h + 180) % 360) + 360) % 360 - 180; return (h + Math.max(-a, Math.min(a, d)) + 360) % 360; }
function rampFrom(base, skin = false) {
  const R = D.ramp, steps = skin ? R.skin : R.cloth, sh = skin ? R.skinShadowHue : R.shadowHue;
  const [h, s, v] = rgbToHsv(...hexToRgb(base));
  return steps.map(([dv, fs, dh]) => {
    let hh = h, ss = s, vv = v;
    if (dv < 0) { hh = toward(h, sh, dh); ss = Math.min(1, s * fs + 0.06); vv = v * (1 + dv); }
    else if (dv > 0) { hh = toward(h, R.lightHue, dh); ss = s * fs; vv = Math.min(1, v + (1 - v) * dv * (0.4 + 0.6 * v)); }
    return rgbToHex(...hsvToRgb(hh, ss, vv));
  });
}

const DW = D.dollW, DH = D.dollH;
const LEG_START = { jacket: 23, hoodie: 24, dress: 25 };
const SIT_DROP = { jacket: [23, 24], hoodie: [23, 24], dress: [22, 25] };
const dollCache = new Map();

function layerKeys(st, f) {
  const arm = f.wave !== null && f.wave !== undefined;
  const k = [];
  if (st.style === "long" || st.style === "buns") k.push(`back/${st.style}/${f.bob}`);
  k.push(`body/${st.outfit}/${arm ? 1 : 0}`);
  k.push(`head/${st.style}/${f.bob}`);
  if (st.style === "messy") k.push(`ahoge/${f.sway % 2}/${f.bob}`);
  k.push(`face/${st.gender}/${f.expr}/${f.look}/${f.bob}/${st.acc === "glasses" ? 1 : 0}`);
  if (st.acc) k.push(`acc/${st.acc}/${f.bob}`);
  if (arm) k.push(`arm/${f.wave}`);
  return k;
}
function paintLayer(buf, w, h, layer, ox, oy) {
  if (!layer) return;
  const y0 = layer.y || 0;
  layer.rows.forEach((row, j) => {
    for (let i = 0; i < row.length; i++) {
      const t = row[i];
      if (t === ".") continue;
      const c = D.colors[t];
      const hex = typeof c === "string" ? c : ramps[c[0]][c[1]];
      const x = ox + i, y = oy + y0 + j;
      if (x < 0 || y < 0 || x >= w || y >= h) continue;
      const [r, g, b] = hexToRgb(hex), p = (y * w + x) * 4;
      buf[p] = r * 255; buf[p + 1] = g * 255; buf[p + 2] = b * 255; buf[p + 3] = 255;
    }
  });
}
function rowsOf(buf, w, r) { return buf.slice(r * w * 4, (r + 1) * w * 4); }
function applyPose(buf, pose) {
  const W4 = DW * 4;
  if (pose === "walkL" || pose === "walkR") {   // lift one foot by a pixel
    const out = buf.slice();
    const c0 = pose === "walkL" ? 0 : DW / 2, c1 = c0 + DW / 2;
    for (let r = LEG_START[look.outfit]; r < DH; r++) {
      for (let c = c0; c < c1; c++) {
        const src = (r * DW + c) * 4, dst = ((r - 1) * DW + c) * 4;
        for (let k = 0; k < 4; k++) out[dst + k] = buf[src + k];
        if (r === DH - 1) for (let k = 0; k < 4; k++) out[src + k] = 0;
      }
    }
    return out;
  }
  if (pose === "sit") {                         // drop the thighs: head sinks, knees forward
    const drop = SIT_DROP[look.outfit];
    const keep = [];
    for (let r = 0; r < DH; r++) if (!drop.includes(r)) keep.push(r);
    const out = new Uint8ClampedArray(buf.length);
    const off = DH - keep.length;
    keep.forEach((r, i) => out.set(rowsOf(buf, DW, r), (i + off) * W4));
    return out;
  }
  return buf;
}
function dollCanvas(f, pose = "stand", cropRows = DH) {
  const key = JSON.stringify([f.expr, f.look, f.bob, f.sway, f.wave ?? null, pose, cropRows]);
  if (dollCache.has(key)) return dollCache.get(key);
  let buf = new Uint8ClampedArray(DW * DH * 4);
  for (const k of layerKeys(look, f)) paintLayer(buf, DW, DH, D.layers[k], 0, 0);
  buf = applyPose(buf, pose);
  const c = document.createElement("canvas");
  c.width = DW; c.height = cropRows;
  c.getContext("2d").putImageData(new ImageData(buf.slice(0, DW * cropRows * 4), DW, cropRows), 0, 0);
  dollCache.set(key, c);
  return c;
}
const emoteCache = new Map();
function emoteCanvas(name) {
  if (emoteCache.has(name)) return emoteCache.get(name);
  const L = D.layers["emote/" + name];
  const buf = new Uint8ClampedArray(L.w * L.h * 4);
  paintLayer(buf, L.w, L.h, L, 0, 0);
  const c = document.createElement("canvas");
  c.width = L.w; c.height = L.h;
  c.getContext("2d").putImageData(new ImageData(buf, L.w, L.h), 0, 0);

// ================================================================ walk path
// One polyline through the whole house; Buddy's position is a distance s along it.
const PATH = D.path;
const SEG = [0];
for (let i = 1; i < PATH.length; i++) SEG.push(SEG[i - 1] + Math.hypot(PATH[i][0] - PATH[i - 1][0], PATH[i][1] - PATH[i - 1][1]));
const UP_START = SEG[PATH.length - 2];                       // start of the upper-floor segment
function pathPos(s) {
  s = Math.max(0, Math.min(SEG[SEG.length - 1], s));
  let i = 1; while (i < SEG.length - 1 && SEG[i] < s) i++;
  const t = (s - SEG[i - 1]) / (SEG[i] - SEG[i - 1] || 1);
  return { x: PATH[i - 1][0] + (PATH[i][0] - PATH[i - 1][0]) * t, y: PATH[i - 1][1] + (PATH[i][1] - PATH[i - 1][1]) * t };
}
function sOf(storey, x) { return storey === 0 ? PATH[0][0] - x : UP_START + (x - PATH[PATH.length - 2][0]); }
const DOOR_S = Object.fromEntries(D.doors.map(d => [d.id, sOf(d.storey, d.x + 2)]));
function roomAt(s) {
  if (s > SEG[1] + 2 && s < UP_START - 2) return "stairs";
  const p = pathPos(s), storey = s >= UP_START ? 1 : 0;
  for (const [k, [st, x0, x1]] of Object.entries(D.roomX)) if (st === storey && p.x >= x0 && p.x < x1) return k;
  return "stairs";
}

function choose() {
  const h = hour(), n = sim.needs, r = () => Math.random();
  const meal = (h >= 7 && h < 9) || (h >= 11.5 && h < 13) || (h >= 18 && h < 20);
  const score = {
    sleep: (h >= 22.5 || h < 6) ? 300 : n.energy < 15 ? 150 : 0,
    cook: n.hunger < 55 ? (100 - n.hunger) * 1.3 + (meal ? 40 : 0) : (meal && n.hunger < 75 ? 50 : 0),
    snack: n.hunger < 40 && !meal ? (100 - n.hunger) * 0.6 : 0,
    bath: n.hygiene < 55 ? (100 - n.hygiene) * 1.1 + (h >= 20 && h < 22.5 ? 30 : 0) : 0,
    computer: (100 - n.fun) * 1.0 + r() * 25,
    tv: (100 - n.fun) * 0.9 + r() * 25 + (h >= 19 ? 15 : 0),
    read: (100 - n.fun) * 0.8 + r() * 25,
    toilet: n.hygiene < 75 ? 10 + r() * 14 : 0, wash: (h >= 6.5 && h < 9) || (h >= 21 && h < 23) ? 28 + r() * 10 : 4 + r() * 8,

// The player clicked a piece of furniture: drop what she's doing and go.
function command(act) {
  if (sim.mode === "act" && sim.act === "sleep") {
    const h = hour();

    if (!sim.nap && (h >= 22 || h < 6)) { log(`她睡得正香，等醒了再去${ACTS[act].label}吧。`); sim.queue = [act]; return; }
    log("你把她从午觉里叫醒了。");
  }

function step(dtGame, dtReal) {
  sim.t += dtGame;
  const day = Math.floor(sim.t / 1440) + 1;
  if (day !== sim.lastDay) { sim.lastDay = day; log(`—— 第 ${day} 天 ——`, "day"); }
  // needs
  const n = sim.needs, eff = sim.mode === "act" ? (EFFECT[sim.act] || {}) : {};
  for (const k of Object.keys(n)) {
    let d = -DECAY[k];
    if (sim.act === "sleep" && sim.mode === "act") d *= k === "energy" ? 0 : 0.4;
    if (eff[k] && k === "fun") d = 0;
    n[k] = clamp(n[k] + (d + (eff[k] || 0)) * dtGame);
  }
  // behaviour
  if (sim.mode === "walk") {
    const v = 28 * Math.min(speed, 4) * dtReal;
    const d = sim.target - sim.s;
    if (Math.abs(d) <= v) { sim.s = sim.target; arrive(); }
    else {
      const before = pathPos(sim.s).x;
      sim.s += Math.sign(d) * v; sim.walkDist += v;
      const dx = pathPos(sim.s).x - before;
      if (Math.abs(dx) > 0.01) sim.facing = Math.sign(dx);
    }
  } else if (sim.mode === "act") {
    const h = hour();
    const done = sim.act === "sleep"
      ? sim.nap ? n.energy >= 95 || sim.t >= sim.actEnd - 780 : (n.energy >= 99 && h >= 6.5 && h < 12) || (h >= 9 && h < 20)
      : sim.act === "dress" && wardrobeOpen ? false : sim.t >= sim.actEnd;
    if (done) finishAct();
  } else if (sim.mode === "idle" && sim.t >= sim.idleUntil) {
    startAct(sim.queue.length ? sim.queue.shift() : choose());
  }
}

// ================================================================ lighting
const W = D.W, H = D.H;
const EMISSIVE = new Set(D.emissive.map(h => parseInt(h.slice(1), 16)));
const LIGHT_G = {};
for (const [id, [lx, ly, r, , room]] of Object.entries(D.lights)) {
  const [rx, ry, rw, rh] = D.rooms[room];
  const g = new Float32Array(W * H);
  for (let y = ry; y < ry + rh; y++) for (let x = rx; x < rx + rw; x++) {
    const d = Math.hypot(x - lx, (y - ly) * 1.15) / r;
    g[y * W + x] = Math.ceil(Math.max(0, 1 - d) * 4) / 4 * 0.9;
  }
  LIGHT_G[id] = g;
}
function nightness(h) {
  if (h >= 7 && h < 17) return 0;
  if (h >= 17 && h < 19) return (h - 17) / 2;
  if (h >= 5 && h < 7) return 1 - (h - 5) / 2;
  return 1;
}
function grade(ctx, f, lit) {
  if (f <= 0) return;
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  const L = lit.map(id => [LIGHT_G[id], D.lights[id][3]]);
  for (let i = 0, p = 0; i < W * H; i++, p += 4) {
    const r = d[p], g = d[p + 1], b = d[p + 2];
    if (EMISSIVE.has((r << 16) | (g << 8) | b)) continue;
    const nr = r * 0.40, ng = g * 0.42, nb = b * 0.62;
    let or = nr, og = ng, ob = nb;
    for (const [G, c] of L) {
      const k = G[i];
      if (!k) continue;
      or = Math.max(or, nr * (1 - k) + r * c[0] * k);
      og = Math.max(og, ng * (1 - k) + g * c[1] * k);
      ob = Math.max(ob, nb * (1 - k) + b * c[2] * k);
    }
    d[p] = r + (or - r) * f; d[p + 1] = g + (og - g) * f; d[p + 2] = b + (ob - b) * f;
  }
  ctx.putImageData(img, 0, 0);
}

const CLICK = {};   // id -> { x, y, w, h, mask:Set, rings:[ring1, ring2, ring3], sparks }
function buildClickables() {
  for (const [id, c] of Object.entries(D.clickables)) {
    const img = IMG.click[id], w = img.width, h = img.height;
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0);
    const a = cx.getImageData(0, 0, w, h).data;
    const inside = new Set();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (a[(y * w + x) * 4 + 3]) inside.add((c.x + x) + "," + (c.y + y));
    const rings = [];
    let grown = new Set(inside);
    for (let k = 0; k < 3; k++) {   // dilate one pixel at a time: the glow's rings
      const ring = [], seen = new Set();
      for (const key of grown) {
        const [x, y] = key.split(",").map(Number);
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nk = (x + dx) + "," + (y + dy);
          if (!grown.has(nk) && !seen.has(nk)) { seen.add(nk); ring.push([x + dx, y + dy]); }
        }
      }
      for (const k of seen) grown.add(k);
      rings.push(ring);
    }
    CLICK[id] = { x: c.x, y: c.y, w, h, area: inside.size, inside, near: new Set([...inside, ...rings[0].map(p => p[0] + "," + p[1])]), rings };
  }
}
function clickableAt(x, y) {
  const key = Math.floor(x) + "," + Math.floor(y);
  let best = null;
  for (const [id, c] of Object.entries(CLICK)) if (c.near.has(key) && (!best || c.area < CLICK[best].area)) best = id;
  return best;
}
let hoverId = null, glow = null, poof = null;

function useFurniture(id) {

  if (id in lamps) { lamps[id] = !lamps[id]; log(`${lamps[id] ? "打开" : "关掉"}了${CLICK_NAME[id]}。`); return; }
  if (id in windowsOpen) { windowsOpen[id] = !windowsOpen[id]; log(windowsOpen[id] ? "推开窗户，风吹了进来。" : "关上了窗户。"); return; }

// warm gold: reads on the pale walls by day and glows at night
const GLOW = "255,196,64", GLOW_SOFT = "255,226,150", GLOW_PALE = "255,243,205";
function px(ctx, x, y, a, c = GLOW) { ctx.fillStyle = `rgba(${c},${a})`; ctx.fillRect(x, y, 1, 1); }
function drawClickFx(ctx) {
  if (hoverId && !(glow && glow.id === hoverId && realClock - glow.t0 < 0.9)) {
    const shimmer = Math.floor(realClock * 6);   // marching highlight around the piece
    for (const [x, y] of CLICK[hoverId].rings[0]) px(ctx, x, y, (x + y + shimmer) % 4 ? 0.7 : 1, (x + y + shimmer) % 4 ? GLOW : GLOW_PALE);
  }
  if (glow) {
    const t = realClock - glow.t0, c = CLICK[glow.id];
    if (t > 0.9) { glow = null; return; }
    if (t < 0.22) {   // flash: brighten the piece itself
      ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.55 * (1 - t / 0.22);
      ctx.drawImage(IMG.click[glow.id], c.x, c.y); ctx.restore();
    }
    const fade = 1 - t / 0.9;
    const ringCol = [GLOW, GLOW_SOFT, GLOW_PALE];
    for (let k = 0; k < 3; k++) {     // rings ripple outward one pixel at a time
      if (t < k * 0.07) continue;
      const a = fade * (k === 0 ? 1 : k === 1 ? 0.75 : 0.45);
      for (const [x, y] of c.rings[k]) px(ctx, x, y, a, ringCol[k]);
    }
    for (const sp of glow.sparks) {   // four-point twinkles
      const st = t - sp.d;
      if (st < 0 || st > 0.5) continue;
      const a = Math.sin(st / 0.5 * Math.PI), [x, y] = sp.p, arm = st < 0.15 || st > 0.38 ? 1 : 2;
      px(ctx, x, y, a, "255,255,255");
      for (let i = 1; i <= arm; i++) { px(ctx, x + i, y, a * 0.9, GLOW); px(ctx, x - i, y, a * 0.9, GLOW); px(ctx, x, y + i, a * 0.9, GLOW); px(ctx, x, y - i, a * 0.9, GLOW); }
    }
  }
  if (poof) {          // sparkle burst around Buddy when she changes clothes
    const t = realClock - poof.t0;
    if (t > 0.8) { poof = null; return; }
    for (let i = 0; i < 10; i++) {
      const ang = i / 10 * Math.PI * 2, r = 6 + t * 22;
      const x = Math.round(poof.x + Math.cos(ang) * r), y = Math.round(poof.y + Math.sin(ang) * r * 0.8);
      const a = 1 - t / 0.8;
      px(ctx, x, y, a, "255,255,255"); px(ctx, x + 1, y, a * 0.7, GLOW); px(ctx, x - 1, y, a * 0.7, GLOW); px(ctx, x, y + 1, a * 0.7, GLOW); px(ctx, x, y - 1, a * 0.7, GLOW);
    }
  }
}

// ================================================================ drawing
const view = document.getElementById("view");
const vctx = view.getContext("2d");

const bctx = buf.getContext("2d", { willReadFrequently: true });

// Pixel-circle outline for a pill n UI pixels tall (caps are half circles).
function pillClip(n, u) {
  const R = n / 2, inset = [];
  for (let r = 0; r < n; r++) {
    const dy = r + 0.5 - R;
    inset.push(Math.max(0, Math.round(R - Math.sqrt(Math.max(0, R * R - dy * dy)))));
  }
  const pts = [];
  for (let r = 0; r < n; r++) pts.push(`calc(100% - ${inset[r] * u}px) ${r * u}px`, `calc(100% - ${inset[r] * u}px) ${(r + 1) * u}px`);
  for (let r = n - 1; r >= 0; r--) pts.push(`${inset[r] * u}px ${(r + 1) * u}px`, `${inset[r] * u}px ${r * u}px`);
  return `polygon(${pts.join(",")})`;
}

// 8x8 UI-pixel tile of faint diagonal stripes; it crawls along the fill.
function stripePattern(u) {
  const c = document.createElement("canvas");
  c.width = c.height = 8 * u;
  const x = c.getContext("2d");
  x.fillStyle = "rgba(255,255,255,0.22)";
  for (let py = 0; py < 8; py++) for (let px = 0; px < 8; px++) if ((px + py) % 8 < 3) x.fillRect(px * u, py * u, u, u);
  return c.toDataURL();
}
let needGeo = { u: 2, bh: 28, barW: 200 };

function fit() {
  // The widget is [room for the bars][dots][house]; the bars always open to
  // the left into their own room, so they never cover the house.
  const desk = document.querySelector(".desk");
  const cs = getComputedStyle(desk);
  const avail = desk.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const BAR_MIN = 150, BAR_MAX = 300;
  let s = 4;
  while (s > 1 && W * s + 12 + BAR_MIN > avail) s--;
  if (W * s + 12 + BAR_MIN > avail) s = Math.max(0.4, (avail - 12 - BAR_MIN) / W);  // phones: shrink the house
  scale = s;
  const hPx = Math.round(H * s), wPx = Math.round(W * s);
  view.width = wPx; view.height = hPx;
  view.style.width = wPx + "px"; view.style.height = hPx + "px";
  // UI pixel = house pixel (at least 2px so the dots stay round)
  const u = Math.max(2, Math.round(s));
  let n = Math.max(14, Math.round(hPx * 0.14 / u));          // dot height in UI pixels
  while (n > 6 && n * u * 4 > hPx) n--;                      // four must fit in the house height
  const bh = n * u, g = 6 * u;
  const barW = Math.round(Math.max(BAR_MIN, Math.min(BAR_MAX, avail - wPx - g, wPx * 0.42)) / u) * u;
  const widget = document.getElementById("widget");
  widget.style.setProperty("--u", u + "px");
  widget.style.setProperty("--bh", bh + "px");
  widget.style.setProperty("--g", g + "px");
  widget.style.setProperty("--bar-w", barW + "px");
  // 10x10 chibi icons at one icon pixel per house pixel (smaller if the bar is thin)
  const icon = 10 * Math.max(1, Math.min(u, Math.floor((bh - 4 * u) / 10)));
  widget.style.setProperty("--icon", icon + "px");
  widget.style.setProperty("--slot", icon + 2 * u + "px");           // icon + a pixel of air each side
  widget.style.setProperty("--clip-track", pillClip(n, u));
  widget.style.setProperty("--clip-fill", pillClip(n - 4, u));
  widget.style.setProperty("--fmin", (n - 4) * u + "px");
  widget.style.setProperty("--stripes", `url(${stripePattern(u)})`);
  needGeo = { u, bh, barW };
  if (typeof kickNeeds === "function") kickNeeds();
}

function activityFrame(ms) {
  // what Buddy looks like right now: frame params, pose, emote
  const a = sim.act, phase = Math.floor(ms / 600) % 2;
  if (reaction && realClock < reaction.until) return { f: { expr: "happy", wave: Math.floor(ms / 180) % 2 }, pose: "stand", emote: reaction.emote };
  if (sim.mode === "walk") {
    const i = Math.floor(sim.walkDist / 4) % 4;
    // contact frames (a foot lifted) dip the head a pixel, passing frames rise
    return { f: { look: sim.facing, bob: i % 2 ? 0 : 1, sway: i % 2 }, pose: ["walkL", "stand", "walkR", "stand"][i], emote: null };
  }
  if (sim.mode === "act") {
    const em = ACTS[a].emote;
    const showEm = em && Math.floor(ms / 2400) % 2 === 0;
    switch (a) {
      case "cook": return { f: { expr: phase ? "happy" : "neutral", bob: phase, sway: phase, look: -1 }, pose: "stand", emote: showEm ? em : null };
      case "toilet": return { f: { expr: Math.floor(ms / 2000) % 3 === 2 ? "blink" : "neutral", look: Math.floor(ms / 2600) % 2 ? 1 : -1 }, pose: "sit", emote: null };
      case "wash": return { f: { expr: phase ? "happy" : "blink", bob: phase, look: 1 }, pose: "stand", emote: showEm ? em : null };
      case "towel": return { f: { expr: "happy", bob: phase, look: -1 }, pose: "stand", emote: showEm ? em : null };
      case "water_living": case "water_study": return { f: { expr: "happy", look: a === "water_living" ? -1 : 1, bob: phase }, pose: "stand", emote: showEm ? em : null };
      case "dress": return { f: { expr: phase ? "happy" : "neutral", look: 1, bob: phase }, pose: "stand", emote: showEm ? em : null };
      case "eat": return { f: { expr: phase ? "happy" : "blink", bob: phase }, pose: "sit", emote: showEm ? em : null };
      case "computer": return { f: { expr: Math.floor(ms / 3000) % 3 === 2 ? "happy" : "neutral", look: Math.floor(ms / 1500) % 2 ? 1 : 0 }, pose: "sit", emote: showEm ? em : null };
      case "tv": return { f: { expr: Math.floor(ms / 2000) % 3 === 0 ? "happy" : "neutral", look: 1 }, pose: "sit", emote: showEm ? em : null };
      case "read": return { f: { expr: "neutral", look: -1, bob: Math.floor(ms / 1800) % 2 }, pose: "stand", emote: showEm ? em : null };
      case "window": return { f: { expr: Math.floor(ms / 2500) % 4 === 3 ? "blink" : "neutral", look: 1 }, pose: "stand", emote: null };
      default: return { f: { expr: "happy", bob: phase }, pose: "stand", emote: showEm ? em : null };
    }
  }
  // idle: replay the lively idle loop
  const total = D.seq.reduce((a, s) => a + s.ms, 0);
  let t = ms % total, fr = D.seq[0];
  for (const s of D.seq) { if (t < s.ms) { fr = s; break; } t -= s.ms; }
  const em = fr.emote === "cheer" ? (look.gender === "f" ? "heart" : "star") : fr.emote;
  return { f: { ...fr }, pose: "stand", emote: em && fr.wave == null ? em : null };
}

const rotCache = new Map();
function lyingHead(f) {   // the sleepy head turned 90 degrees: lying on the pillow
  const key = JSON.stringify(f);
  if (rotCache.has(key)) return rotCache.get(key);
  const src = dollCanvas(f, "stand", 15);
  const c = document.createElement("canvas"); c.width = src.height; c.height = src.width;
  const x = c.getContext("2d"); x.translate(0, src.width); x.rotate(-Math.PI / 2); x.drawImage(src, 0, 0);
  rotCache.set(key, c);
  return c;
}
function frameOf(list, fps) { return list[Math.floor(realClock * fps) % list.length]; }

function render() {
  const h = hour(), f = nightness(h);
  bctx.clearRect(0, 0, W, H);
  bctx.globalAlpha = 1; bctx.drawImage(IMG.day, 0, 0);
  if (f > 0) { bctx.globalAlpha = f; bctx.drawImage(IMG.night, 0, 0); bctx.globalAlpha = 1; }
  // open windows: casements swung in, curtains drifting
  const sway = [0, 1, 2, 1][Math.floor(realClock * 2.2) % 4];
  for (const [id, open] of Object.entries(windowsOpen)) {
    if (!open) continue;
    const wv = D.windows[id];
    bctx.drawImage(IMG.win[id]["day" + sway], wv.x, wv.y);
    if (f > 0) { bctx.globalAlpha = f; bctx.drawImage(IMG.win[id]["night" + sway], wv.x, wv.y); bctx.globalAlpha = 1; }
  }
  drawDoors(bctx);
  const room = roomAt(sim.s), acting = sim.mode === "act", act = acting ? sim.act : null;
  const sleeping = act === "sleep";
  for (const [id, on] of Object.entries(lamps)) if (on) drawOverlay(bctx, id);
  const lit = [];
  if (f > 0.05) {
    for (const [id, on] of Object.entries(lamps)) if (on) lit.push(id);
    const auto = { kitchen: "kitchen", bath: "bath", stairs: "stairs", study: "study" }[room];
    if (auto && !sleeping) { lit.push(auto); if (auto === "stairs") drawOverlay(bctx, "sconce"); if (auto === "study") drawOverlay(bctx, "pendant"); }
    if (act === "tv") lit.push("tv");
    if (act === "computer") lit.push("monitor");
  }
  // Buddy
  const ms = realClock * 1000;
  const fr = activityFrame(ms);
  const full = { expr: "neutral", look: 0, bob: 0, sway: 0, wave: null, ...fr.f };
  let emoteAt = null;
  if (sleeping) {
    const [lx, ly] = D.sleepLying;
    bctx.drawImage(lyingHead({ ...full, expr: "sleepy", look: 0, bob: 0, sway: 0, wave: null }), lx, ly);
    drawOverlay(bctx, "sleep_cover");
    emoteAt = [lx + 10, ly - 14];
  } else if (act === "bath") {
    bctx.drawImage(dollCanvas({ ...full, look: 0, wave: null }, "stand", 14), D.bathHead[0], D.bathHead[1]);
    drawOverlay(bctx, "tub_front"); drawOverlay(bctx, "bubbles");
    emoteAt = [D.bathHead[0] + 13, D.bathHead[1] - 15];
  } else {
    const p = pathPos(sim.s);
    const x = Math.round(p.x - DW / 2), y = Math.round(p.y - DH + 1);
    bctx.drawImage(dollCanvas(full, fr.pose), x, y);
    if (act === "tv") drawOverlay(bctx, "coffee_table");
    emoteAt = [x + 13, y - 15];
  }
  grade(bctx, f, lit);
  // things that glow on their own: screens, flames, steam
  if (act === "tv") {
    const ch = Object.keys(IMG.tv)[Math.floor(realClock / 6) % 4];
    bctx.drawImage(frameOf(IMG.tv[ch], 4), D.screens.tv.x, D.screens.tv.y);
  }
  if (act === "computer") {
    const g = Object.keys(IMG.mon)[Math.floor(realClock / 8) % 3];
    bctx.drawImage(frameOf(IMG.mon[g], 5), D.screens.monitor.x, D.screens.monitor.y);
  }
  if (act === "cook") bctx.drawImage(frameOf(IMG.fx.cook, 8), D.fx.cook.x, D.fx.cook.y);
  if (act === "eat") bctx.drawImage(frameOf(IMG.fx.meal, 4), D.fx.meal.x, D.fx.meal.y);
  if (act === "water_living" || act === "water_study") bctx.drawImage(frameOf(IMG.fx[act], 6), D.fx[act].x, D.fx[act].y);
  if (fr.emote || sleeping) bctx.drawImage(emoteCanvas(sleeping ? "zzz" : fr.emote), emoteAt[0], emoteAt[1]);
  drawClickFx(bctx);
  vctx.imageSmoothingEnabled = false;
  vctx.drawImage(buf, 0, 0, view.width, view.height);
}

// ================================================================ UI
const needsEl = document.getElementById("needs");
needsEl.querySelectorAll("img[data-icon]").forEach(img => { img.src = D.needIcons[img.dataset.icon]; });
function needColor(v) { return v < 20 ? "var(--need-low)" : v < 50 ? "var(--need-warn)" : "var(--need-ok)"; }
function syncUI() {
  const day = Math.floor(sim.t / 1440) + 1, h = hour();
  const part = h < 5 ? "深夜" : h < 9 ? "早上" : h < 12 ? "上午" : h < 14 ? "中午" : h < 18 ? "下午" : h < 22 ? "晚上" : "深夜";
  document.getElementById("clock").textContent = `第 ${day} 天 · ${fmt(sim.t)} · ${part}`;
  const doing = sim.mode === "walk" ? `走去${ACTS[sim.act].label}` : sim.mode === "act" ? ACTS[sim.act].label : "闲着";
  document.getElementById("doing").firstChild.textContent = `正在：${doing}`;
  document.getElementById("ff").textContent = sim.mode === "act" && sim.act === "sleep" && speed ? "（夜里自动快进）" : "";
  for (const [k, v] of Object.entries(sim.needs)) {
    const el = needsEl.querySelector(`[data-k="${k}"]`);
    el.style.setProperty("--c", needColor(v));
    el.classList.toggle("low", v < 20);
    el.style.setProperty("--v", (v / 100).toFixed(3));
    el.setAttribute("aria-valuenow", Math.round(v));
  }
}

// Open when the pointer comes near the dots (or on focus / tap); close shortly after it leaves.
// Each bar is a damped spring (overshoots, then settles), snapped to whole UI
// pixels every frame; bars pop out one after another, then their fill springs up.
const reduceMotionUI = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const springs = [...needsEl.querySelectorAll(".need")].map((el, i) => ({ el, i, x: 0, v: 0, target: 0, start: 0, p: 0, pv: 0, ptarget: 0, pstart: 0 }));
let springRaf = 0, springLast = 0;
function springStep(now) {
  const dt = springLast ? Math.min(0.033, (now - springLast) / 1000) : 0.016;
  springLast = now;
  const { u, bh, barW } = needGeo;
  let active = false;
  for (const s of springs) {
    if (reduceMotionUI) { s.x = s.target; s.p = s.ptarget; s.v = s.pv = 0; }
    if (now >= s.start) {
      const opening = s.target === 1;
      const k = opening ? 330 : 420, c = opening ? 17 : 30;      // bouncy out, firmer back
      s.v += (-k * (s.x - s.target) - c * s.v) * dt;
      s.x = Math.min(1.12, s.x + s.v * dt);
    }
    if (now >= s.pstart) {
      s.pv += (-260 * (s.p - s.ptarget) - 15 * s.pv) * dt;
      s.p += s.pv * dt;
    }
    const moving = now < s.start || now < s.pstart ||
      Math.abs(s.x - s.target) > 0.002 || Math.abs(s.v) > 0.02 || Math.abs(s.p - s.ptarget) > 0.002 || Math.abs(s.pv) > 0.02;
    if (moving) active = true; else { s.x = s.target; s.p = s.ptarget; s.v = s.pv = 0; }
    const w = bh + (barW - bh) * s.x;
    s.el.style.width = Math.max(bh, Math.round(w / u) * u) + "px";
    s.el.style.setProperty("--p", Math.max(0, s.p).toFixed(3));
  }
  springRaf = active ? requestAnimationFrame(springStep) : 0;
  if (!active) springLast = 0;
}
function kickNeeds() { if (!springRaf) springRaf = requestAnimationFrame(springStep); }

let closeT = null;
function setNeedsOpen(open) {
  clearTimeout(closeT);
  if (needsEl.classList.contains("open") === open) return;
  needsEl.classList.toggle("open", open);
  needsEl.setAttribute("aria-expanded", String(open));
  const now = performance.now();
  for (const s of springs) {
    s.target = open ? 1 : 0;
    s.ptarget = open ? 1 : 0;
    s.start = now + (open ? s.i * 55 : (springs.length - 1 - s.i) * 35);
    s.pstart = open ? s.start + 140 : now;
  }
  kickNeeds();
}
needsEl.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") setNeedsOpen(true); });
needsEl.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") closeT = setTimeout(() => setNeedsOpen(false), 250); });
needsEl.addEventListener("click", e => { if (e.pointerType !== "mouse") setNeedsOpen(!needsEl.classList.contains("open")); });
needsEl.addEventListener("focus", () => { if (needsEl.matches(":focus-visible")) setNeedsOpen(true); });  // keyboard only
needsEl.addEventListener("blur", () => setNeedsOpen(false));
needsEl.addEventListener("keydown", e => { if (e.key === "Escape") needsEl.blur(); });

document.querySelectorAll("[data-speed]").forEach(b => b.addEventListener("click", () => {
  speed = +b.dataset.speed;
  document.querySelectorAll("[data-speed]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
}));
function canvasXY(e) {
  const r = view.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
function buddyHit(x, y) {
  if (sim.mode === "act" && sim.act === "sleep") {
    const [lx, ly] = D.sleepLying;
    return x >= lx && x < lx + 15 && y >= ly && y < ly + 20;
  }
  const p = sim.mode === "act" && sim.act === "bath" ? { x: D.bathHead[0] + 10, y: D.bathHead[1] + 14 } : pathPos(sim.s);
  return Math.abs(x - p.x) < 9 && y > p.y - DH + 2 && y < p.y + 2;
}
view.addEventListener("pointermove", e => {
  const [x, y] = canvasXY(e);
  hoverId = buddyHit(x, y) ? null : clickableAt(x, y);
  view.style.cursor = hoverId || buddyHit(x, y) ? "pointer" : "default";
});
view.addEventListener("pointerleave", () => { hoverId = null; });
view.addEventListener("click", e => {
  const [x, y] = canvasXY(e);
  if (buddyHit(x, y)) {
    if (sim.mode === "act" && sim.act === "sleep") { log("你戳了戳她，她咂咂嘴继续睡。"); return; }
    reaction = { until: realClock + 1.6, emote: look.gender === "f" ? "heart" : "star" };
    sim.needs.fun = clamp(sim.needs.fun + 4);
    if (Math.random() < 0.5) log(["你戳了她一下，她冲你挥挥手。", "她发现你在看她，开心地挥了挥手。", "被你戳得咯咯笑。"][Math.floor(Math.random() * 3)]);
    return;
  }
  const id = clickableAt(x, y);
  if (id) useFurniture(id);
});

// ================================================================ wardrobe
let wardrobeOpen = false;
const wardEl = document.getElementById("wardrobe");
function saveLook() { try { localStorage.setItem("buddy-look", JSON.stringify(look)); } catch (e) { /* storage unavailable */ } }
function positionWardrobe() {
  const c = D.clickables.wardrobe, cw = CLICK.wardrobe ? CLICK.wardrobe.w : 22;
  const panelW = wardEl.offsetWidth || 248;
  let left = view.offsetLeft + (c.x + cw + 3) * scale;
  if (left + panelW > view.offsetLeft + view.width) left = view.offsetLeft + c.x * scale - panelW - 8;
  wardEl.style.left = Math.max(0, left) + "px";
  wardEl.style.top = view.offsetTop + Math.max(0, c.y - 6) * scale + "px";
}
function syncWardrobe() {
  wardEl.querySelectorAll(".chips").forEach(g => g.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String((look[g.dataset.k] || "") === b.dataset.v))));
  wardEl.querySelectorAll(".sw").forEach(g => g.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String(look[g.dataset.k].toLowerCase() === b.dataset.v))));
  document.getElementById("wBottomLabel").textContent = look.outfit === "dress" ? "裙子" : "裤子";
}
function changeLook(patch) {
  setLook({ ...look, ...patch });
  saveLook();
  syncWardrobe();
  const p = pathPos(sim.s);
  poof = { t0: realClock, x: p.x, y: p.y - 14 };
}
function openWardrobe() { wardrobeOpen = true; wardEl.hidden = false; syncWardrobe(); positionWardrobe(); }
function closeWardrobe() { if (!wardrobeOpen) return; wardrobeOpen = false; wardEl.hidden = true; log("换好衣服了，美美的！"); }
for (const [k, list] of [["hair", D.swatches.hair], ["top", D.swatches.cloth], ["bottom", D.swatches.cloth]]) {
  const box = wardEl.querySelector(`.sw[data-k="${k}"]`);
  for (const [label, hex] of list) {
    const b = document.createElement("button");
    b.type = "button"; b.title = label; b.setAttribute("aria-label", label);
    b.dataset.v = hex.toLowerCase(); b.style.setProperty("--c", hex);
    box.appendChild(b);
  }
}
wardEl.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "wClose") { closeWardrobe(); return; }
  if (b.id === "wRandom") {
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const cloth = D.swatches.cloth.map(c => c[1].toLowerCase());
    const top = pick(cloth);
    changeLook({ style: pick(["messy", "neat", "long", "buns"]), outfit: pick(["jacket", "hoodie", "dress"]),
      acc: pick(["", "", "glasses", "bow", "headphones"]), hair: pick(D.swatches.hair)[1].toLowerCase(),
      top, bottom: pick(cloth.filter(c => c !== top)) });
    return;
  }
  const g = b.closest("[data-k]"); if (!g) return;
  changeLook({ [g.dataset.k]: b.dataset.v });
});
wardEl.addEventListener("keydown", e => { if (e.key === "Escape") closeWardrobe(); });

// ================================================================ loop
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  realClock += dt;
  const fast = sim.mode === "act" && sim.act === "sleep" ? 8 : 1;
  step(dt * speed * fast, dt * (speed ? 1 : 0));
  updateDoors(speed ? dt : 0);
  render();
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; syncUI(); }
  requestAnimationFrame(frame);
}

(async function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("buddy-look") || "null"); } catch (e) { /* storage unavailable */ }
  setLook(saved && typeof saved === "object" ? { ...PRESETS.f, ...saved } : { ...PRESETS.f });
  fit();
  window.addEventListener("resize", () => { fit(); if (wardrobeOpen) positionWardrobe(); });
  await loadAssets();
  log("—— 第 1 天 ——", "day");
  log("还在被窝里睡觉。");
  syncUI();
  render();
  requestAnimationFrame(frame);
})();
</script>

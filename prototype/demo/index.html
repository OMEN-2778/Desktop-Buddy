<title>Buddy 小屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: the page is just the house, centred like a widget on a desktop.
   Everything else hides until asked for: the needs are four dots beside the
   house that stretch into bars when the pointer comes near. */
:root {
  --bg: #e6e3ee;
  --dither: #dcd8e6;
  --panel: #f7f6fb;
  --panel-2: #eceaf2;
  --ink: #22182a;
  --muted: #5e5b71;
  --edge: #22182a;
  --bevel-hi: #ffffff;
  --bevel-lo: #bab7c9;
  --shadow: #8f8ba2;
  --accent: #46619e;
  --accent-hi: #6c90c8;
  --accent-lo: #2f3c6d;
  --accent-ink: #f7f6fb;
  --accent-soft: #cfdcf2;
  --focus: #d29b30;
  /* needs: track ring + three states (from the sketch) */
  --ring: #ffffff;
  --need-ok: #b2d683;
  --need-warn: #f5b675;
  --need-low: #e87272;
  --need-label: rgba(34, 24, 42, 0.62);
  --u: 2px;              /* one UI pixel = one house pixel on screen (set by fit) */
  --font: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131f; --dither: #1d1828; --panel: #2b2538; --panel-2: #332c42; --ink: #f7f6fb; --muted: #bab7c9;
    --edge: #0d0a12; --bevel-hi: #433a54; --bevel-lo: #1f1a2a; --shadow: #0d0a12;
    --accent: #6c90c8; --accent-hi: #a6c5e7; --accent-lo: #2f3c6d; --accent-ink: #141228; --accent-soft: #34446a; --focus: #efc452;
    --ring: #f4f1f8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131f; --dither: #1d1828; --panel: #2b2538; --panel-2: #332c42; --ink: #f7f6fb; --muted: #bab7c9;
  --edge: #0d0a12; --bevel-hi: #433a54; --bevel-lo: #1f1a2a; --shadow: #0d0a12;
  --accent: #6c90c8; --accent-hi: #a6c5e7; --accent-lo: #2f3c6d; --accent-ink: #141228; --accent-soft: #34446a; --focus: #efc452;
  --ring: #f4f1f8; color-scheme: dark;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; }
body {
  background-color: var(--bg);
  background-image: repeating-conic-gradient(var(--dither) 0 25%, transparent 0 50%);
  background-size: 6px 6px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  display: grid;
  grid-template-rows: 1fr auto;
  grid-template-columns: minmax(0, 1fr);
}
.desk {
  display: grid;
  place-items: center;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.widget { position: relative; }
#view { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }

/* ---------- needs: dots that stretch into bars ----------
   Sizes come from JS (fit): --u is one house pixel on screen, --bh the dot /
   bar height, --bar-w the open length; the column is exactly as tall as the
   house and sits just left of it. Bars only ever grow to the left. */
.widget { display: flex; align-items: flex-end; gap: var(--g, 12px); padding-left: calc(var(--bar-w, 200px) - var(--bh, 24px)); }
.needs {
  position: relative;
  flex: none;
  height: var(--house-h, 236px);   /* flush with the house, not with the studio above it */
  width: var(--bh, 24px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;  /* first dot flush with the top, last with the bottom */
  align-items: flex-end;           /* right-anchored: bars grow to the left */
  outline: none;
}
.needs::before {                   /* invisible hover zone around the dots */
  content: ""; position: absolute; inset: -14px -10px -14px -14px;
}
.needs.open::before { left: calc(var(--bh, 24px) - var(--bar-w, 200px) - 14px); }
.need {
  position: relative;
  flex: none;
  width: var(--bh, 24px);          /* JS springs this between the dot and the open bar */
  height: var(--bh, 24px);
  background: var(--ring);
  clip-path: var(--clip-track);
}
.need .fill {
  position: absolute;
  /* 2px white ring; once open (--p springs 0 -> 1) the fill starts right of
     the icon slot, so the icon never hides the fill's start or its maximum */
  --room: calc(100% - var(--u) * 4 - var(--slot, 30px) * var(--p, 0));
  top: calc(var(--u) * 2); bottom: calc(var(--u) * 2);
  left: calc(var(--u) * 2 + var(--slot, 30px) * var(--p, 0));
  width: min(var(--room), var(--fmin) + (var(--room) - var(--fmin)) * var(--v, 1) * var(--p, 0));
  background-color: var(--c, var(--need-ok));
  background-image: var(--stripes);
  background-size: calc(var(--u) * 8) calc(var(--u) * 8);
  image-rendering: pixelated;
  clip-path: var(--clip-fill);
  animation: crawl 3.2s steps(8) infinite;
  transition: background-color .3s;
}
.need .fill::before {              /* a 1px gloss line along the top */
  content: ""; position: absolute; top: var(--u); left: calc(var(--u) * 2); right: calc(var(--u) * 2);
  height: var(--u); background: rgba(255, 255, 255, .38);
}
.need.low .fill { animation: crawl 3.2s steps(8) infinite, pulse 1.4s ease-in-out infinite; }
@keyframes crawl { from { background-position: 0 0; } to { background-position: calc(var(--u) * -8) 0; } }
@keyframes pulse { 50% { filter: brightness(1.18) saturate(1.1); } }
.need img {
  position: absolute;
  left: calc(var(--u) * 3);
  top: 50%;
  width: var(--icon, 24px);
  height: var(--icon, 24px);
  transform: translateY(-50%) scale(.2);
  image-rendering: pixelated;
  opacity: 0;
  pointer-events: none;
}
.needs.open .need img {
  animation: pop .5s cubic-bezier(.3, 1.9, .5, 1) both;
  animation-delay: calc(var(--i, 0) * 55ms + 200ms);
}
@keyframes pop {
  from { opacity: 0; transform: translateY(-50%) scale(.2) rotate(-12deg); }
  to   { opacity: 1; transform: translateY(-50%) scale(1) rotate(0); }
}
.needs:focus-visible::after {
  content: ""; position: absolute; inset: -6px; border: 2px dashed var(--focus); pointer-events: none;
}

/* ---------- 造型室: opens above the house (never over it), as wide as the house ----------
   The slot grows from 0 to the studio's height, pushing the house down; the
   clip keeps room for the studio's pixel outline and drop shadow. */
.house-col { display: grid; min-width: 0; width: var(--house-w, 684px); }
.studio-slot {
  display: grid;
  width: var(--studio-w, 684px);
  margin-left: calc(-1 * var(--studio-dx, 0px));   /* phones: also spans the needs column (see fit) */
  grid-template-rows: 0fr;
  transition: grid-template-rows .42s cubic-bezier(.3, 1.2, .5, 1), margin-bottom .42s cubic-bezier(.3, 1.2, .5, 1);
  margin-bottom: 0;
}
.studio-slot.open { grid-template-rows: 1fr; margin-bottom: calc(var(--u) * 7); }
.studio-clip {
  min-height: 0; overflow: hidden;
  padding: var(--u) calc(var(--u) * 3) calc(var(--u) * 3) var(--u);
  margin: calc(-1 * var(--u)) calc(-3 * var(--u)) calc(-3 * var(--u)) calc(-1 * var(--u));
}
#studio { --sp: var(--u); width: var(--studio-w, 684px); }

/* ---------- sky bar: one day from 06:00 (left) to 06:00 (right) above the house,
   exactly as wide as it. The icon walks along it with the clock and turns
   into the moon at dusk, or a rain cloud / snowflake when the weather turns.
   Drawn in a canvas at one UI pixel per bar unit (set by fit). */
.skybar { position: relative; z-index: 2; width: var(--house-w, 684px); height: var(--sky-h, 48px); margin-bottom: var(--sky-gap, 12px); pointer-events: none; }
#sky { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
/* the bar hangs over the house's top edge; only the part above the house takes the pointer (tooltip) */
.sky-hit { position: absolute; left: 0; right: 0; top: 0; bottom: var(--sky-over, 0px); pointer-events: auto; }
.sky-tip {
  position: absolute; bottom: calc(100% + 6px); left: 0; transform: translateX(-50%);
  white-space: nowrap; pointer-events: none; z-index: 3;
  background: var(--panel); color: var(--ink); font-size: 12px; font-weight: 500; letter-spacing: .04em;
  padding: 2px 10px;
  box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge), 3px 3px 0 0 var(--shadow);
}
.sky-tip[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .studio-slot { transition: none; } }
/* ---------- Buddy 造型室 (shared by prototype/creator and prototype/demo) ----------
   A pixel window: title bar, a small stage with Buddy on the left, tabs on the
   right. Every tab panel sits in the same grid cell, so the window keeps the
   height of the tallest tab and nothing below it jumps when tabs change.
   The host page supplies the color tokens; --sp is one UI pixel. */
.studio {
  --sp: 3px;
  background: var(--panel);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.4;
  box-shadow:
    0 calc(-1 * var(--sp)) 0 0 var(--edge), 0 var(--sp) 0 0 var(--edge),
    calc(-1 * var(--sp)) 0 0 0 var(--edge), var(--sp) 0 0 0 var(--edge),
    calc(var(--sp) * 2) calc(var(--sp) * 2) 0 0 var(--shadow);
  min-width: 0;
}
.studio button {
  font: inherit; color: var(--ink); background: var(--panel-2);
  border: 0; margin: var(--sp); padding: 3px 10px; cursor: pointer;
  box-shadow:
    inset 0 calc(-1 * var(--sp)) 0 0 var(--bevel-lo), inset 0 var(--sp) 0 0 var(--bevel-hi),
    0 calc(-1 * var(--sp)) 0 0 var(--edge), 0 var(--sp) 0 0 var(--edge),
    calc(-1 * var(--sp)) 0 0 0 var(--edge), var(--sp) 0 0 0 var(--edge);
}
.studio button:hover { background: var(--panel); }
.studio button:active { transform: translateY(var(--sp)); }
.studio button:focus-visible, .studio .st-custom:focus-within { outline: var(--sp) dashed var(--focus); outline-offset: var(--sp); }
.studio button[aria-pressed="true"]:not(.st-swatch) {
  background: var(--accent); color: var(--accent-ink);
  box-shadow:
    inset 0 var(--sp) 0 0 var(--accent-lo), inset 0 calc(-1 * var(--sp)) 0 0 var(--accent-hi),
    0 calc(-1 * var(--sp)) 0 0 var(--edge), 0 var(--sp) 0 0 var(--edge),
    calc(-1 * var(--sp)) 0 0 0 var(--edge), var(--sp) 0 0 0 var(--edge);
}

.st-title {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--title, #33253b); color: var(--title-ink, #f7f6fb);
  padding: 3px 4px 3px 12px; font-weight: 700; letter-spacing: .12em;
}
.st-name::before { content: ""; display: inline-block; width: 6px; height: 6px; background: var(--focus); margin-right: 8px; vertical-align: 2px; }
.st-tools { display: flex; align-items: center; gap: 4px; }
.studio .st-tools button { margin: 0; padding: 1px 8px; font-size: 12px; letter-spacing: .04em; box-shadow: none; background: transparent; color: inherit; }
.studio .st-tools button:hover { background: rgba(255, 255, 255, .14); }
.studio .st-tools .st-random { background: var(--focus); color: #22182a; }
.studio .st-tools .st-random:hover { background: var(--focus); filter: brightness(1.1); }

.st-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; padding: 12px 14px 14px; align-items: start; }
.st-stage { display: grid; gap: 8px; justify-items: center; }
.st-screen { background: var(--edge); padding: var(--sp); }
.st-preview { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.st-modes { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 100%; }
.studio .st-modes button { padding: 1px 7px; font-size: 12px; }

.st-main { display: grid; gap: 10px; min-width: 0; }
.st-tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; border-bottom: var(--sp) solid var(--edge); padding-bottom: 6px; }
.studio .st-tabs button { padding: 2px 12px; font-weight: 700; letter-spacing: .1em; }
.studio .st-tabs button[aria-selected="true"] {
  background: var(--accent); color: var(--accent-ink); transform: translateY(var(--sp));
  box-shadow:
    inset 0 var(--sp) 0 0 var(--accent-lo),
    0 calc(-1 * var(--sp)) 0 0 var(--edge), calc(-1 * var(--sp)) 0 0 0 var(--edge), var(--sp) 0 0 0 var(--edge);
}
.st-panels { display: grid; }
.st-panel { grid-area: 1 / 1; display: grid; gap: 8px; align-content: start; visibility: hidden; min-width: 0; }
.st-panel.on { visibility: visible; }
.st-group { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 6px; align-items: center; }
.st-label { color: var(--muted); font-weight: 700; font-size: 12px; letter-spacing: .08em; }
.st-chips { display: flex; flex-wrap: wrap; gap: 2px 4px; }
.st-thumbs { display: flex; flex-wrap: wrap; gap: 2px 4px; }
.studio .st-thumb { display: grid; justify-items: center; align-content: end; gap: 2px; padding: 4px 4px 2px; min-width: 50px; }
.st-thumb canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.st-thumb span { font-size: 11px; line-height: 1.3; white-space: nowrap; }
.studio button.st-thumb[aria-pressed="true"] { background: var(--accent-soft, #cfdcf2); color: var(--ink); }
.studio button.st-thumb[aria-pressed="true"] span { font-weight: 700; }
.st-swatches { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px; align-items: center; }
.studio .st-swatch {
  position: relative; overflow: hidden; width: 22px; height: 22px; margin: 0; padding: 0; background: var(--c);
  box-shadow: 0 0 0 2px var(--edge);
}
.studio .st-swatch:active { transform: none; }
.st-swatch::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--c2); }
.st-swatch::before { content: ""; position: absolute; left: 3px; top: 3px; width: 5px; height: 2px; background: rgba(255, 255, 255, .45); z-index: 1; }
.studio .st-swatch[aria-pressed="true"] { outline: var(--sp) solid var(--accent); outline-offset: 3px; }
.studio .st-custom {
  display: grid; place-items: center; cursor: pointer; font-weight: 900; font-size: 15px; color: var(--ink);
  background: repeating-conic-gradient(var(--bevel-lo) 0 25%, var(--panel) 0 50%) 0 0 / 8px 8px;
}
.st-custom::before, .st-custom::after { display: none; }
.st-custom.has-color { background: var(--c); color: transparent; }
.st-custom.has-color::after { display: block; }
.st-custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.st-note { margin: 0; color: var(--muted); font-size: 12px; }

/* narrow: stage above the tabs */
.studio.narrow .st-body { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 10px; }
.studio.narrow .st-group { grid-template-columns: minmax(0, 1fr); gap: 4px; }
.studio.narrow .st-thumb { min-width: 44px; }
.studio.narrow .st-tabs button { padding: 2px 8px; letter-spacing: .04em; }
@media (prefers-reduced-motion: reduce) { .studio button { transform: none !important; } }


/* ---------- temporary console (time, suggestions, look, diary) ---------- */
.console {
  justify-self: center;
  width: min(100%, 980px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 20px;
  color: var(--muted);
  font-size: 13px;
}
.console summary { cursor: pointer; letter-spacing: .04em; }
.console[open] summary { margin-bottom: 12px; }
.console .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; color: var(--ink); }
@media (max-width: 760px) { .console .grid { grid-template-columns: minmax(0, 1fr); } }
.console .box { display: grid; gap: 8px; align-content: start; min-width: 0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
button {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--panel-2);
  border: 0; padding: 4px 10px; margin: var(--u); cursor: pointer;
  box-shadow:
    inset 0 calc(-1 * var(--u)) 0 0 var(--bevel-lo), inset 0 var(--u) 0 0 var(--bevel-hi),
    0 calc(-1 * var(--u)) 0 0 var(--edge), 0 var(--u) 0 0 var(--edge),
    calc(-1 * var(--u)) 0 0 0 var(--edge), var(--u) 0 0 0 var(--edge);
}
button:hover { background: var(--panel); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, summary:focus-visible { outline: var(--u) dashed var(--focus); outline-offset: calc(var(--u) * 2); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 200px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 8px; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.log li.day { grid-template-columns: 1fr; color: var(--muted); font-size: 12px; letter-spacing: .1em; }
@media (prefers-reduced-motion: reduce) {
  .need .fill, .need.low .fill { animation: none; transition: none; }
  .needs.open .need img { animation: none; opacity: 1; transform: translateY(-50%); }
}
</style>

<main class="desk">
  <div class="widget" id="widget">
    <div class="needs" id="needs" tabindex="0" role="button" aria-expanded="false" aria-label="她的状态（饱腹、精力、清洁、开心）">
      <div class="need" style="--i:0" data-k="hunger" role="meter" aria-label="饱腹" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="hunger"></div>
      <div class="need" style="--i:1" data-k="energy" role="meter" aria-label="精力" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="energy"></div>
      <div class="need" style="--i:2" data-k="hygiene" role="meter" aria-label="清洁" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="hygiene"></div>
      <div class="need" style="--i:3" data-k="fun" role="meter" aria-label="开心" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="fun"></div>
    </div>
    <div class="house-col">
      <div class="studio-slot" id="studioSlot"><div class="studio-clip"><section id="studio" hidden></section></div></div>
      <div class="skybar" id="skybar" role="img" aria-label="时间与天气">
        <canvas id="sky" width="684" height="48"></canvas>
        <div class="sky-hit" id="skyHit"></div>
        <div class="sky-tip" id="skyTip" hidden></div>
      </div>
      <canvas id="view" width="342" height="118" aria-label="小屋剖面，小人在里面生活。点家具让她去做事，点衣柜打开造型室，点她一下试试。"></canvas>
    </div>
  </div>
</main>

<details class="console">
  <summary>临时控制台：时间 · 日记（之后也会改成隐藏式）</summary>
  <div class="grid">
    <div class="box">
      <div class="clock" id="clock">第 1 天 · 07:00</div>
      <div id="doing">正在：睡觉<small id="ff"></small></div>
      <div class="label">时间速度</div>
      <div class="row" role="group" aria-label="时间速度">
        <button type="button" data-speed="0" aria-pressed="false">暂停</button>
        <button type="button" data-speed="1" aria-pressed="false">×1</button>
        <button type="button" data-speed="3" aria-pressed="true">×3</button>
        <button type="button" data-speed="10" aria-pressed="false">×10</button>
      </div>
      <div class="label">天气（测试用）</div>
      <div class="row" role="group" aria-label="天气">
        <button type="button" data-weather="" aria-pressed="true">自动</button>
        <button type="button" data-weather="clear" aria-pressed="false">晴</button>
        <button type="button" data-weather="rain" aria-pressed="false">下雨</button>
        <button type="button" data-weather="snow" aria-pressed="false">下雪</button>
        <button type="button" id="nextSeason">跳到下个季节</button>
      </div>
      <p class="note">点家具让她去做事：床、衣柜（打开造型室）、浴缸、马桶、洗手台、毛巾、书架、电脑、沙发、电视、灶台、餐桌、冰箱、绿植；台灯和窗户可以开关。</p>
    </div>
    <div class="box" style="grid-column: span 2">
      <div class="label">日记</div>
      <ul class="log" id="log"></ul>
    </div>
  </div>

  // Mirror of tools/pixelkit/palette.py ramp_from(): one picked color -> 5 shades,
  // shadows drift cool (skin: toward red), highlights drift warm.
  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
  function rgbToHex(r, g, b) { return "#" + [r, g, b].map(v => Math.round(v * 255).toString(16).padStart(2, "0")).join(""); }
  function rgbToHsv(r, g, b) {
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) { if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
    return [h, max ? d / max : 0, max];
  }
  function hsvToRgb(h, s, v) {
    const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [r + m, g + m, b + m];
  }
  function toward(h, t, a) { const d = (((t - h + 180) % 360) + 360) % 360 - 180; return (h + Math.max(-a, Math.min(a, d)) + 360) % 360; }
  const rampCache = new Map();
  function rampFrom(base, skin = false) {
    const key = base + (skin ? "s" : "c");
    if (rampCache.has(key)) return rampCache.get(key);
    const R = DATA.ramp, steps = skin ? R.skin : R.cloth, sh = skin ? R.skinShadowHue : R.shadowHue;
    const [h, s, v] = rgbToHsv(...hexToRgb(base));
    const out = steps.map(([dv, fs, dh]) => {
      let hh = h, ss = s, vv = v;
      if (dv < 0) { hh = toward(h, sh, dh); ss = Math.min(1, s * fs + 0.06); vv = v * (1 + dv); }
      else if (dv > 0) { hh = toward(h, R.lightHue, dh); ss = s * fs; vv = Math.min(1, v + (1 - v) * dv * (0.4 + 0.6 * v)); }
      return rgbToHex(...hsvToRgb(hh, ss, vv));
    });
    rampCache.set(key, out);
    return out;
  }
  function rampsOf(look) {
    const r = {};
    for (const role of ROLES) r[role] = rampFrom(look[role], role === "skin");
    return r;
  }

  // ---------------------------------------------------------- looks
  const PRESETS = {
    f: { gender: "f", style: "long", eyes: "round", topStyle: "sweater", bottomStyle: "pleated", socks: "short", acc: ["bow"],
         hair: "#433a54", skin: "#f6c39c", top: "#b94b4b", bottom: "#46619e", sock: "#e8e6ef", eye: "#46619e" },
    m: { gender: "m", style: "messy", eyes: "bean", topStyle: "jacket", bottomStyle: "jeans", socks: "short", acc: [],
         hair: "#7c4734", skin: "#f6c39c", top: "#447840", bottom: "#46619e", sock: "#e8e6ef", eye: "#7c4734" },
  };
  const has = (list, v) => list.some(o => o[0] === v);
  function normalize(l) {   // fill gaps / drop unknown values (old saves, hand edits)
    const p = PRESETS[l && l.gender === "m" ? "m" : "f"], o = DATA.options;
    const out = { ...p, ...(l || {}) };
    if (!has(o.style, out.style)) out.style = p.style;
    if (!has(o.eyes, out.eyes)) out.eyes = p.eyes;
    if (!has(o.top, out.topStyle)) out.topStyle = p.topStyle;
    if (!has(o.bottom, out.bottomStyle)) out.bottomStyle = p.bottomStyle;
    if (!has(o.socks, out.socks)) out.socks = p.socks;
    out.acc = Array.isArray(out.acc) ? out.acc.filter(a => has(o.acc, a)) : [];
    for (const r of ROLES) if (!/^#[0-9a-f]{6}$/i.test(out[r] || "")) out[r] = p[r];
    for (const r of ROLES) out[r] = out[r].toLowerCase();
    return out;
  }
  // Wear / take off an accessory. Only one pair of eyewear at a time.
  function toggleAcc(list, a) {
    if (list.includes(a)) return list.filter(x => x !== a);
    const ew = DATA.eyewear;
    return [...list.filter(x => !(ew.includes(a) && ew.includes(x))), a];
  }

  // ---------------------------------------------------------- layers
  function layerKeys(look, f) {
    const arm = f.wave !== null && f.wave !== undefined;
    const acc = new Set(look.acc);
    const keys = [];
    const add = k => { if (DATA.layers[k]) keys.push(k); };
    const pose = DATA.pose[look.bottomStyle];
    const hat = acc.has("beanie") ? 1 : 0;      // hair above the beanie's cuff is clipped away
    add(`back/${look.style}/${f.bob}/${f.sway % 2}/${hat}`);
    add(`base/${arm ? 1 : 0}`);
    if (look.socks !== "none") add(`socks/${look.socks}`);
    add(`shoes/${pose.shoes}`);
    add(`bottom/${look.bottomStyle}`);
    add(`top/${look.topStyle}/${arm ? 1 : 0}`);
    add(`bib/${look.bottomStyle}`);
    if (acc.has("scarf")) add("acc/scarf/0");
    add(`head/${look.style}/${f.bob}/${hat}`);
    if (!acc.has("beanie")) add(`ahoge/${look.style}/${f.sway % 2}/${f.bob}`);
    const eyes = f.expr === "neutral" ? look.eyes : "-";
    const brows = look.gender === "m" && DATA.eyewear.some(a => acc.has(a)) ? 1 : 0;
    add(`face/${look.gender}/${eyes}/${f.expr}/${f.look}/${f.bob}/${brows}`);
    for (const a of DATA.headAcc) {
      if (!acc.has(a)) continue;
      // the headphone band is fitted to the hairstyle's outline (or the hat's)
      add(a === "headphones" ? `acc/headphones/${hat ? "hat" : look.style}/${f.bob}` : `acc/${a}/${f.bob}`);
    }
    if (arm) add(`arm/${DATA.sleeves[look.topStyle]}/${f.wave}`);
    return keys;
  }

  const rgbCache = new Map();
  function rgb255(hex) {
    let v = rgbCache.get(hex);
    if (!v) { v = hexToRgb(hex).map(c => Math.round(c * 255)); rgbCache.set(hex, v); }
    return v;
  }
  // Paint one role map into an RGBA buffer (w x h) at (ox, oy).
  function paintLayer(buf, w, h, layer, ox, oy, ramps) {
    if (!layer) return;
    const y0 = layer.y || 0;
    layer.rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i++) {
        const t = row[i];
        if (t === ".") continue;
        const c = DATA.colors[t];
        const hex = typeof c === "string" ? c : ramps[c[0]][c[1]];
        const x = ox + i, y = oy + y0 + j;
        if (x < 0 || y < 0 || x >= w || y >= h) continue;
        const [r, g, b] = rgb255(hex), p = (y * w + x) * 4;
        buf[p] = r; buf[p + 1] = g; buf[p + 2] = b; buf[p + 3] = 255;
      }
    });
  }
  const FRAME = { expr: "neutral", look: 0, bob: 0, sway: 0, wave: null };
  // Buddy's 20x28 RGBA pixels for a look and an animation frame.
  function pixels(look, f, ramps = rampsOf(look)) {
    const buf = new Uint8ClampedArray(DW * DH * 4);
    const fr = { ...FRAME, ...f };
    for (const k of layerKeys(look, fr)) paintLayer(buf, DW, DH, DATA.layers[k], 0, 0, ramps);
    return buf;
  }
  function emotePixels(name, ramps) {
    const L = DATA.layers["emote/" + name];
    const buf = new Uint8ClampedArray(L.w * L.h * 4);
    paintLayer(buf, L.w, L.h, L, 0, 0, ramps);
    return { buf, w: L.w, h: L.h };
  }
  function toCanvas(buf, w, h, rows = h) {
    const c = document.createElement("canvas");
    c.width = w; c.height = rows;
    c.getContext("2d").putImageData(new ImageData(buf.slice(0, w * rows * 4), w, rows), 0, 0);
    return c;
  }
  const cheer = look => (look.gender === "f" ? "heart" : "star");

  return { W: DW, H: DH, ROLES, PRESETS, rampFrom, rampsOf, normalize, toggleAcc, layerKeys, paintLayer,
           pixels, emotePixels, toCanvas, hexToRgb, cheer };
}

// ================================================================ Buddy 造型室 (dressing room)
// One panel, used as the whole page in prototype/creator and as the pop-up
// above the house in prototype/demo. Tabs: hair / face / top / bottom / socks /
// accessories; every option is a live thumbnail of Buddy in the current colors.
//
//   const studio = BuddyStudio(rootEl, doll, DATA, {
//     look, onChange(look), onClose?, modes?: true, previewScale?: 4, thumbH?: 44 })
//   studio.setLook(look) · studio.start() · studio.stop() · studio.look
function BuddyStudio(root, doll, DATA, opts = {}) {
  const O = DATA.options;
  let look = doll.normalize(opts.look);
  let tab = "hair", mode = "idle";
  const COVERS_SOCKS = ["trousers", "jeans", "maxi"];
  const HIDES_HAIR = ["beanie", "headphones"];

  const TABS = [
    { id: "hair", name: "发型", groups: [{ kind: "thumbs", key: "style", opt: "style", label: "发型" }, { kind: "colors", key: "hair", label: "发色" }] },
    { id: "face", name: "五官", groups: [{ kind: "gender", label: "性别" }, { kind: "thumbs", key: "eyes", opt: "eyes", label: "眼型" },
                                        { kind: "colors", key: "eye", label: "瞳色" }, { kind: "colors", key: "skin", label: "肤色" }] },
    { id: "top", name: "上装", groups: [{ kind: "thumbs", key: "topStyle", opt: "top", label: "款式" }, { kind: "colors", key: "top", label: "颜色" }] },
    { id: "bottom", name: "下装", groups: [{ kind: "thumbs", key: "bottomStyle", opt: "bottom", label: "款式" }, { kind: "colors", key: "bottom", label: "颜色" }] },
    { id: "socks", name: "袜子", groups: [{ kind: "thumbs", key: "socks", opt: "socks", label: "款式" }, { kind: "colors", key: "sock", label: "颜色" },
                                         { kind: "note", id: "socksNote" }] },
    { id: "acc", name: "饰品", groups: [{ kind: "thumbs", key: "acc", opt: "acc", label: "佩戴", multi: true },
                                       { kind: "note", text: "可以同时戴好几件，再点一次就取下来。眼镜和墨镜只能二选一。" }] },
  ];
  // thumbnail crop per option kind: x, y, w, h in doll pixels
  const CROP = { style: [0, 0, 20, 16], eyes: [3, 8, 14, 7], topStyle: [1, 14, 18, 9], bottomStyle: [3, 21, 14, 7],
                 socks: [4, 22, 12, 6], acc: [1, 0, 18, 16], scarf: [1, 6, 18, 16] };
  const cropOf = (key, v) => CROP[key === "acc" && v === "scarf" ? "scarf" : key];
  const SWATCH = { hair: DATA.swatches.hair, skin: DATA.swatches.skin, top: DATA.swatches.cloth, bottom: DATA.swatches.cloth,
                   sock: DATA.swatches.cloth, eye: DATA.swatches.eye };

  // a look that shows option v of a kind clearly (nothing covering it)
  function variant(key, v) {
    switch (key) {
      case "style": return { ...look, style: v, acc: look.acc.filter(a => !HIDES_HAIR.includes(a)) };
      case "eyes": return { ...look, eyes: v, acc: look.acc.filter(a => !DATA.eyewear.includes(a)) };
      case "topStyle": return { ...look, topStyle: v, acc: look.acc.filter(a => a !== "scarf") };
      case "socks": return { ...look, socks: v, bottomStyle: "shorts" };   // the legs show best in shorts
      case "acc": return { ...look, acc: [v] };
      default: return { ...look, [key]: v };
    }
  }

  // ---------------------------------------------------------- markup
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  root.classList.add("studio");
  root.setAttribute("aria-label", "Buddy 造型室");
  root.innerHTML = `
    <div class="st-title">
      <span class="st-name">Buddy 造型室</span>
      <span class="st-tools">
        <button type="button" class="st-random">随机搭配</button>
        ${opts.onClose ? `<button type="button" class="st-close" aria-label="关闭造型室">✕</button>` : ""}
      </span>
    </div>
    <div class="st-body">
      <div class="st-stage">
        <div class="st-screen"><canvas class="st-preview" aria-label="Buddy 预览"></canvas></div>
        ${opts.modes ? `<div class="st-modes" role="group" aria-label="表情">${[["idle", "日常"], ["happy", "开心"], ["surprised", "惊讶"],
          ["sleepy", "犯困"], ["flustered", "慌张"]].map(([m, n]) => `<button type="button" data-mode="${m}">${n}</button>`).join("")}</div>` : ""}
      </div>
      <div class="st-main">
        <div class="st-tabs" role="tablist">${TABS.map(t =>
          `<button type="button" role="tab" data-tab="${t.id}" id="st-tab-${t.id}" aria-controls="st-panel-${t.id}">${t.name}</button>`).join("")}</div>
        <div class="st-panels">${TABS.map(t => `
          <div class="st-panel" role="tabpanel" data-tab="${t.id}" id="st-panel-${t.id}" aria-labelledby="st-tab-${t.id}">
            ${t.groups.map(g => groupHTML(g)).join("")}
          </div>`).join("")}</div>
      </div>
    </div>`;

  function groupHTML(g) {
    if (g.kind === "note") return `<p class="st-note"${g.id ? ` data-note="${g.id}"` : ""}>${g.text ? esc(g.text) : ""}</p>`;
    const head = `<span class="st-label">${g.label}</span>`;
    if (g.kind === "gender") {
      return `<div class="st-group">${head}<div class="st-chips" role="group" aria-label="性别">
        <button type="button" data-gender="f">女生</button><button type="button" data-gender="m">男生</button></div></div>`;
    }
    if (g.kind === "thumbs") {
      return `<div class="st-group">${head}<div class="st-thumbs" role="group" aria-label="${g.label}">${O[g.opt].map(([v, name]) => {
        const [, , w, h] = cropOf(g.key, v);
        return `<button type="button" class="st-thumb" data-key="${g.key}" data-v="${v}" title="${esc(name)}">
          <canvas width="${w}" height="${h}" aria-hidden="true"></canvas><span>${esc(name)}</span></button>`;
      }).join("")}</div></div>`;
    }
    // colors: preset swatches + a custom picker that makes the same 5-shade ramp
    const skin = g.key === "skin";
    return `<div class="st-group">${head}<div class="st-swatches" role="group" aria-label="${g.label}" data-color="${g.key}">${SWATCH[g.key].map(([name, hex]) =>
      `<button type="button" class="st-swatch" data-color="${g.key}" data-v="${hex.toLowerCase()}" title="${esc(name)}" aria-label="${esc(name)}"
        style="--c:${hex};--c2:${doll.rampFrom(hex, skin)[1]}"></button>`).join("")}
      <label class="st-swatch st-custom" title="自定义颜色">+<input type="color" data-color="${g.key}" aria-label="${g.label}：自定义颜色"></label>
    </div></div>`;
  }

  const $ = s => root.querySelector(s), $$ = s => [...root.querySelectorAll(s)];
  const preview = $(".st-preview"), pctx = preview.getContext("2d");

  // ---------------------------------------------------------- thumbnails
  const scratch = document.createElement("canvas");
  scratch.width = doll.W; scratch.height = doll.H;
  const sctx = scratch.getContext("2d");
  function paintThumb(btn) {
    const key = btn.dataset.key, v = btn.dataset.v, c = btn.querySelector("canvas");
    const [x, y, w, h] = cropOf(key, v);
    sctx.putImageData(new ImageData(doll.pixels(variant(key, v), {}), doll.W, doll.H), 0, 0);
    const g = c.getContext("2d");
    g.clearRect(0, 0, w, h);
    g.drawImage(scratch, x, y, w, h, 0, 0, w, h);
  }
  function sizeThumbs() {
    const th = opts.thumbH || 44;
    for (const btn of $$(".st-thumb")) {
      const [, , w, h] = cropOf(btn.dataset.key, btn.dataset.v);
      const s = Math.max(1, Math.round(th / h));
      const c = btn.querySelector("canvas");
      c.style.width = w * s + "px"; c.style.height = h * s + "px";
    }
  }

  // ---------------------------------------------------------- sync
  function sync() {
    $$(".st-tabs [data-tab]").forEach(b => {
      const on = b.dataset.tab === tab;
      b.setAttribute("aria-selected", String(on));
      b.tabIndex = on ? 0 : -1;
    });
    $$(".st-panel").forEach(p => p.classList.toggle("on", p.dataset.tab === tab));
    $$("[data-gender]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.gender === look.gender)));
    $$(".st-thumb").forEach(b => {
      const k = b.dataset.key, v = b.dataset.v;
      b.setAttribute("aria-pressed", String(k === "acc" ? look.acc.includes(v) : look[k] === v));
    });
    $$(`.st-panel[data-tab="${tab}"] .st-thumb`).forEach(paintThumb);
    for (const box of $$(".st-swatches")) {
      const key = box.dataset.color, cur = look[key];
      let matched = false;
      box.querySelectorAll(".st-swatch:not(.st-custom)").forEach(b => {
        const on = b.dataset.v === cur; matched ||= on;
        b.setAttribute("aria-pressed", String(on));
      });
      const custom = box.querySelector(".st-custom");
      custom.classList.toggle("has-color", !matched);
      custom.setAttribute("aria-pressed", String(!matched));
      if (!matched) { custom.style.setProperty("--c", cur); custom.style.setProperty("--c2", doll.rampFrom(cur, key === "skin")[1]); }
      custom.querySelector("input").value = cur;
    }
    const note = $('[data-note="socksNote"]');
    if (note) {
      const bottomName = O.bottom.find(o => o[0] === look.bottomStyle)[1];
      note.textContent = COVERS_SOCKS.includes(look.bottomStyle) ? `现在穿的${bottomName}会盖住袜子，换成短裤或短裙就看得到啦。`
        : look.bottomStyle === "pleated" ? "百褶裙会挡住大半截，长袜只从裙摆缝里露出一点。配短裤或短裙更明显。"
        : "短袜只露出脚踝一圈，长袜一直拉到膝盖。";
    }
    $$(".st-modes [data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  }

  function change(patch) {
    look = doll.normalize({ ...look, ...patch });
    sync();
    redraw();
    if (opts.onChange) opts.onChange(look);
  }

  // ---------------------------------------------------------- preview stage
  // a slice of the bedroom from the house: plaster wall, white skirting, oak floor
  const SW = 48, SH = 52, STAGE_X = 14, FLOOR_TOP = 41, FEET_Y = 47;
  const off = document.createElement("canvas");
  off.width = SW; off.height = SH;
  const octx = off.getContext("2d");
  function rect(img, x, y, w, h, hex) {
    const [r, g, b] = doll.hexToRgb(hex);
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
      if (i < 0 || j < 0 || i >= SW || j >= SH) continue;
      const p = (j * SW + i) * 4;
      img.data[p] = r * 255; img.data[p + 1] = g * 255; img.data[p + 2] = b * 255; img.data[p + 3] = 255;
    }
  }
  function paintRoom(img) {
    rect(img, 0, 0, SW, FLOOR_TOP, "#ece2d9");
    rect(img, 0, 0, SW, 1, "#cdbfb4");
    rect(img, 0, 1, SW, 1, "#dccfc5");
    rect(img, 0, FLOOR_TOP - 3, SW, 3, "#f4f2ee");
    rect(img, 0, FLOOR_TOP - 1, SW, 1, "#c4c1bc");
    rect(img, 0, FLOOR_TOP, SW, SH - FLOOR_TOP, "#b48a62");
    rect(img, 0, FLOOR_TOP, SW, 1, "#5b4232");
    rect(img, 0, FLOOR_TOP + 1, SW, 1, "#d1ab80");
    for (let r = 0, y = FLOOR_TOP + 2; y < SH; r++, y += 3) {
      rect(img, 0, y + 2, SW, 1, "#8a6446");
      for (let x = (r * 11) % 23; x < SW; x += 23) rect(img, x, y, 1, 2, "#8a6446");
    }
  }
  function paintStage(f) {
    const ramps = doll.rampsOf(look);
    const img = octx.createImageData(SW, SH);
    paintRoom(img);
    const top = FEET_Y - doll.H + 1;
    rect(img, STAGE_X + 5, FEET_Y + 1, 11, 1, "#8a6446");   // contact shadow under the shoes
    const px = doll.pixels(look, f, ramps);
    for (let j = 0; j < doll.H; j++) for (let i = 0; i < doll.W; i++) {
      const s = (j * doll.W + i) * 4;
      if (!px[s + 3]) continue;
      const d = ((top + j) * SW + STAGE_X + i) * 4;
      img.data[d] = px[s]; img.data[d + 1] = px[s + 1]; img.data[d + 2] = px[s + 2]; img.data[d + 3] = 255;
    }
    if (f.emote) {
      const name = f.emote === "cheer" ? doll.cheer(look) : f.emote;
      const e = doll.emotePixels(name, ramps);
      for (let j = 0; j < e.h; j++) for (let i = 0; i < e.w; i++) {
        const s = (j * e.w + i) * 4, x = STAGE_X + 13 + i, y = top - 15 + j;
        if (!e.buf[s + 3] || x >= SW || y < 0) continue;
        const d = (y * SW + x) * 4;
        img.data[d] = e.buf[s]; img.data[d + 1] = e.buf[s + 1]; img.data[d + 2] = e.buf[s + 2]; img.data[d + 3] = 255;
      }
    }
    octx.putImageData(img, 0, 0);
    pctx.imageSmoothingEnabled = false;
    pctx.clearRect(0, 0, preview.width, preview.height);
    pctx.drawImage(off, 0, 0, preview.width, preview.height);
  }
  function sizePreview(scale) {
    preview.width = SW * scale; preview.height = SH * scale;
    preview.style.width = preview.width + "px"; preview.style.height = preview.height + "px";
  }

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const MODE_SEQ = {
    happy: [{ expr: "happy", emote: "note", ms: 700 }, { expr: "happy", bob: 1, sway: 1, emote: "note", ms: 400 }],
    surprised: [{ expr: "surprised", emote: "bang", ms: 900 }, { expr: "surprised", bob: 1, sway: 1, emote: "bang", ms: 300 }],
    sleepy: [{ expr: "sleepy", ms: 900 }, { expr: "sleepy", bob: 1, sway: 1, ms: 700 }],
    flustered: [{ expr: "flustered", ms: 500 }, { expr: "flustered", bob: 1, sway: 1, ms: 250 }, { expr: "flustered", ms: 400 }],
  };
  let timer = null, step = 0, running = false;
  function tick() {
    const seq = mode === "idle" ? DATA.seq : MODE_SEQ[mode];
    const f = { expr: "neutral", look: 0, bob: 0, sway: 0, wave: null, emote: null, ...seq[step % seq.length] };
    paintStage(f);
    if (reduceMotion || !running) return;

  }

  // ---------------------------------------------------------- input
  root.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || !root.contains(b)) return;
    if (b.dataset.tab) { tab = b.dataset.tab; sync(); return; }
    if (b.dataset.mode) { mode = b.dataset.mode; step = 0; sync(); redraw(); return; }
    if (b.dataset.gender) { if (b.dataset.gender !== look.gender) change(pickPreset(b.dataset.gender)); return; }
    if (b.classList.contains("st-thumb")) {
      const k = b.dataset.key, v = b.dataset.v;

    }

    if (b.classList.contains("st-random")) { change(randomLook()); return; }
    if (b.classList.contains("st-close") && opts.onClose) opts.onClose();
  });
  root.addEventListener("input", e => {
    const inp = e.target.closest("input[type=color]");
    if (inp) change({ [inp.dataset.color]: inp.value });
  });
  root.querySelector(".st-tabs").addEventListener("keydown", e => {   // arrow keys move between tabs
    const i = TABS.findIndex(t => t.id === tab);
    const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    tab = TABS[(i + d + TABS.length) % TABS.length].id;
    sync();

  });
  root.addEventListener("keydown", e => { if (e.key === "Escape" && opts.onClose) opts.onClose(); });

  // switching gender puts on that gender's default styles; colors stay
  function pickPreset(g) {
    const p = doll.PRESETS[g];
    return { gender: g, style: p.style, eyes: p.eyes, topStyle: p.topStyle, bottomStyle: p.bottomStyle, socks: p.socks, acc: p.acc };
  }
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function randomLook() {
    const g = pick(["f", "m"]);
    const short = O.style.filter(o => DATA.shortStyles.includes(o[0])), long = O.style.filter(o => !DATA.shortStyles.includes(o[0]));
    const styles = Math.random() < 0.8 ? (g === "m" ? short : long) : O.style;
    const cloth = DATA.swatches.cloth.map(c => c[1].toLowerCase());
    const top = pick(cloth);
    let acc = [];
    for (const [a] of O.acc) if (Math.random() < 0.18) acc = doll.toggleAcc(acc, a);
    const skirts = ["pleated", "maxi"];
    return {
      gender: g, style: pick(styles)[0], eyes: pick(O.eyes)[0], topStyle: pick(O.top)[0],
      bottomStyle: pick(O.bottom.filter(o => g === "f" || !skirts.includes(o[0])))[0], socks: pick(O.socks)[0], acc,
      hair: pick(DATA.swatches.hair)[1].toLowerCase(), skin: pick(DATA.swatches.skin)[1].toLowerCase(),
      top, bottom: pick(cloth.filter(c => c !== top)), sock: pick(cloth), eye: pick(DATA.swatches.eye)[1].toLowerCase(),
    };
  }

  // narrow hosts (phones): stage above the tabs, smaller preview and thumbnails
  let narrow = null;
  function fitWidth() {
    const w = root.clientWidth;
    if (!w || (w < 600) === narrow) return;
    narrow = w < 600;
    root.classList.toggle("narrow", narrow);
    opts.thumbH = narrow ? 34 : wideThumbH;
    sizeThumbs();
    sizePreview(narrow ? (opts.modes ? 3 : 2) : (opts.previewScale || 4));
    redraw();
  }
  const wideThumbH = opts.thumbH || 44;
  if (window.ResizeObserver) new ResizeObserver(fitWidth).observe(root);

  sizeThumbs();
  sizePreview(opts.previewScale || 4);
  sync();
  tick();
  fitWidth();

  return {
    get look() { return look; },
    setLook(l) { look = doll.normalize(l); sync(); redraw(); },
    start() { if (running) return; running = true; step = 0; redraw(); },
    stop() { running = false; clearTimeout(timer); },
    refit() { narrow = null; fitWidth(); },
  };
}


// ================================================================ Buddy's look
const doll = BuddyDoll(D.doll);
let look = doll.normalize(doll.PRESETS.f);
let ramps = doll.rampsOf(look);
function setLook(l) {
  look = doll.normalize(l);
  ramps = doll.rampsOf(look);
  dollCache.clear();
  rotCache.clear();
}

const DW = doll.W, DH = doll.H;
const dollCache = new Map(), rotCache = new Map();
function rowsOf(buf, w, r) { return buf.slice(r * w * 4, (r + 1) * w * 4); }
function applyPose(buf, pose) {
  const W4 = DW * 4, P = D.doll.pose[look.bottomStyle];
  if (pose === "walkL" || pose === "walkR") {   // lift one foot by a pixel
    const out = buf.slice();
    const c0 = pose === "walkL" ? 0 : DW / 2, c1 = c0 + DW / 2;
    for (let r = P.legStart; r < DH; r++) {
      for (let c = c0; c < c1; c++) {
        const src = (r * DW + c) * 4, dst = ((r - 1) * DW + c) * 4;
        for (let k = 0; k < 4; k++) out[dst + k] = buf[src + k];
        if (r === DH - 1) for (let k = 0; k < 4; k++) out[src + k] = 0;
      }
    }
    return out;
  }
  if (pose === "sit") {                         // drop the thighs: head sinks, knees forward
    const keep = [];
    for (let r = 0; r < DH; r++) if (!P.sitDrop.includes(r)) keep.push(r);
    const out = new Uint8ClampedArray(buf.length);
    const off = DH - keep.length;
    keep.forEach((r, i) => out.set(rowsOf(buf, DW, r), (i + off) * W4));
    return out;
  }
  return buf;
}
function dollCanvas(f, pose = "stand", cropRows = DH) {
  const key = JSON.stringify([f.expr, f.look, f.bob, f.sway, f.wave ?? null, pose, cropRows]);
  if (dollCache.has(key)) return dollCache.get(key);
  const c = doll.toCanvas(applyPose(doll.pixels(look, f, ramps), pose), DW, DH, cropRows);
  dollCache.set(key, c);
  return c;
}
const emoteCache = new Map();
function emoteCanvas(name) {
  if (emoteCache.has(name)) return emoteCache.get(name);
  const e = doll.emotePixels(name, ramps);
  const c = doll.toCanvas(e.buf, e.w, e.h);
  emoteCache.set(name, c);

}

// ================================================================ walk path
// One polyline through the whole house; Buddy's position is a distance s along it.
const PATH = D.path;
const SEG = [0];
for (let i = 1; i < PATH.length; i++) SEG.push(SEG[i - 1] + Math.hypot(PATH[i][0] - PATH[i - 1][0], PATH[i][1] - PATH[i - 1][1]));
const UP_START = SEG[PATH.length - 2];                       // start of the upper-floor segment
function pathPos(s) {
  s = Math.max(0, Math.min(SEG[SEG.length - 1], s));
  let i = 1; while (i < SEG.length - 1 && SEG[i] < s) i++;
  const t = (s - SEG[i - 1]) / (SEG[i] - SEG[i - 1] || 1);
  return { x: PATH[i - 1][0] + (PATH[i][0] - PATH[i - 1][0]) * t, y: PATH[i - 1][1] + (PATH[i][1] - PATH[i - 1][1]) * t };
}
function sOf(storey, x) { return storey === 0 ? PATH[0][0] - x : UP_START + (x - PATH[PATH.length - 2][0]); }
const DOOR_S = Object.fromEntries(D.doors.map(d => [d.id, sOf(d.storey, d.x + 2)]));
function roomAt(s) {
  if (s > SEG[1] + 2 && s < UP_START - 2) return "stairs";
  const p = pathPos(s), storey = s >= UP_START ? 1 : 0;
  for (const [k, [st, x0, x1]] of Object.entries(D.roomX)) if (st === storey && p.x >= x0 && p.x < x1) return k;
  return "stairs";
}

  const score = {

function step(dtGame, dtReal) {
  sim.t += dtGame;
  const day = Math.floor(sim.t / 1440) + 1;
  if (day !== sim.lastDay) { sim.lastDay = day; log(`—— 第 ${day} 天 · ${SEASONS[seasonOf(sim.t).i].name} ——`, "day"); }
  updateWeather(dtGame);
  // needs
  const n = sim.needs, eff = sim.mode === "act" ? (EFFECT[sim.act] || {}) : {};
  for (const k of Object.keys(n)) {
    let d = -DECAY[k];
    if (sim.act === "sleep" && sim.mode === "act") d *= k === "energy" ? 0 : 0.4;
    if (eff[k] && k === "fun") d = 0;
    n[k] = clamp(n[k] + (d + (eff[k] || 0)) * dtGame);
  }
  // behaviour
  if (sim.mode === "walk") {
    const v = 28 * Math.min(speed, 4) * dtReal;
    const d = sim.target - sim.s;
    if (Math.abs(d) <= v) { sim.s = sim.target; arrive(); }
    else {
      const before = pathPos(sim.s).x;
      sim.s += Math.sign(d) * v; sim.walkDist += v;
      const dx = pathPos(sim.s).x - before;
      if (Math.abs(dx) > 0.01) sim.facing = Math.sign(dx);
    }
  } else if (sim.mode === "act") {
    const h = hour();
    const done = sim.act === "sleep"
      ? sim.nap ? n.energy >= 95 || sim.t >= sim.actEnd - 780 : (n.energy >= 99 && h >= 6.5 && h < 12) || (h >= 9 && h < 20)
      : sim.act === "dress" && wardrobeOpen ? false : sim.t >= sim.actEnd;
    if (done) finishAct();
  } else if (sim.mode === "idle" && sim.t >= sim.idleUntil) {
    startAct(sim.queue.length ? sim.queue.shift() : choose());
  }
}

  const p = pathPos(sim.s);
  for (const d of D.doors) {
    const st = doorState[d.id];
    const near = sim.mode === "walk" && Math.abs(sim.s - DOOR_S[d.id]) < 16;
    if (near && st.angle === 0) st.side = sim.facing > 0 ? "r" : "l";
    st.t += dtReal * Math.min(speed, 4);

// ================================================================ lighting
const W = D.W, H = D.H;
const EMISSIVE = new Set(D.emissive.map(h => parseInt(h.slice(1), 16)));
const LIGHT_G = {};
for (const [id, [lx, ly, r, , room]] of Object.entries(D.lights)) {
  const [rx, ry, rw, rh] = D.rooms[room];
  const g = new Float32Array(W * H);
  for (let y = ry; y < ry + rh; y++) for (let x = rx; x < rx + rw; x++) {
    const d = Math.hypot(x - lx, (y - ly) * 1.15) / r;
    g[y * W + x] = Math.ceil(Math.max(0, 1 - d) * 4) / 4 * 0.9;
  }
  LIGHT_G[id] = g;
}
function nightness(h) {
  if (h >= 7 && h < 17) return 0;
  if (h >= 17 && h < 19) return (h - 17) / 2;
  if (h >= 5 && h < 7) return 1 - (h - 5) / 2;
  return 1;
}
function grade(ctx, f, lit) {
  if (f <= 0) return;
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  const L = lit.map(id => [LIGHT_G[id], D.lights[id][3]]);
  for (let i = 0, p = 0; i < W * H; i++, p += 4) {
    const r = d[p], g = d[p + 1], b = d[p + 2];
    if (EMISSIVE.has((r << 16) | (g << 8) | b)) continue;
    const nr = r * 0.40, ng = g * 0.42, nb = b * 0.62;
    let or = nr, og = ng, ob = nb;
    for (const [G, c] of L) {
      const k = G[i];
      if (!k) continue;
      or = Math.max(or, nr * (1 - k) + r * c[0] * k);
      og = Math.max(og, ng * (1 - k) + g * c[1] * k);
      ob = Math.max(ob, nb * (1 - k) + b * c[2] * k);
    }
    d[p] = r + (or - r) * f; d[p + 1] = g + (og - g) * f; d[p + 2] = b + (ob - b) * f;
  }
  ctx.putImageData(img, 0, 0);
}

const CLICK = {};   // id -> { x, y, w, h, mask:Set, rings:[ring1, ring2, ring3], sparks }
function buildClickables() {
  for (const [id, c] of Object.entries(D.clickables)) {
    const img = IMG.click[id], w = img.width, h = img.height;
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0);
    const a = cx.getImageData(0, 0, w, h).data;
    const inside = new Set();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (a[(y * w + x) * 4 + 3]) inside.add((c.x + x) + "," + (c.y + y));
    const rings = [];
    let grown = new Set(inside);
    for (let k = 0; k < 3; k++) {   // dilate one pixel at a time: the glow's rings
      const ring = [], seen = new Set();
      for (const key of grown) {
        const [x, y] = key.split(",").map(Number);
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nk = (x + dx) + "," + (y + dy);
          if (!grown.has(nk) && !seen.has(nk)) { seen.add(nk); ring.push([x + dx, y + dy]); }
        }
      }
      for (const k of seen) grown.add(k);
      rings.push(ring);
    }
    CLICK[id] = { x: c.x, y: c.y, w, h, area: inside.size, inside, near: new Set([...inside, ...rings[0].map(p => p[0] + "," + p[1])]), rings };
  }
}
function clickableAt(x, y) {
  const key = Math.floor(x) + "," + Math.floor(y);
  let best = null;
  for (const [id, c] of Object.entries(CLICK)) if (c.near.has(key) && (!best || c.area < CLICK[best].area)) best = id;
  return best;
}
let hoverId = null, glow = null, poof = null;

function useFurniture(id) {
  glow = { id, t0: realClock, sparks: Array.from({ length: 6 }, () => ({ p: CLICK[id].rings[1][Math.floor(Math.random() * CLICK[id].rings[1].length)], d: Math.random() * 0.35 })) };
  if (id in lamps) { lamps[id] = !lamps[id]; log(`${lamps[id] ? "打开" : "关掉"}了${CLICK_NAME[id]}。`); return; }
  if (id in windowsOpen) { windowsOpen[id] = !windowsOpen[id]; log(windowsOpen[id] ? "推开窗户，风吹了进来。" : "关上了窗户。"); return; }
  if (CLICK_ACT[id]) command(CLICK_ACT[id]);
}

// warm gold: reads on the pale walls by day and glows at night
const GLOW = "255,196,64", GLOW_SOFT = "255,226,150", GLOW_PALE = "255,243,205";
function px(ctx, x, y, a, c = GLOW) { ctx.fillStyle = `rgba(${c},${a})`; ctx.fillRect(x, y, 1, 1); }
function drawClickFx(ctx) {
  if (hoverId && !(glow && glow.id === hoverId && realClock - glow.t0 < 0.9)) {
    const shimmer = Math.floor(realClock * 6);   // marching highlight around the piece
    for (const [x, y] of CLICK[hoverId].rings[0]) px(ctx, x, y, (x + y + shimmer) % 4 ? 0.7 : 1, (x + y + shimmer) % 4 ? GLOW : GLOW_PALE);
  }
  if (glow) {
    const t = realClock - glow.t0, c = CLICK[glow.id];
    if (t > 0.9) { glow = null; return; }
    if (t < 0.22) {   // flash: brighten the piece itself
      ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.55 * (1 - t / 0.22);
      ctx.drawImage(IMG.click[glow.id], c.x, c.y); ctx.restore();
    }
    const fade = 1 - t / 0.9;
    const ringCol = [GLOW, GLOW_SOFT, GLOW_PALE];
    for (let k = 0; k < 3; k++) {     // rings ripple outward one pixel at a time
      if (t < k * 0.07) continue;
      const a = fade * (k === 0 ? 1 : k === 1 ? 0.75 : 0.45);
      for (const [x, y] of c.rings[k]) px(ctx, x, y, a, ringCol[k]);
    }
    for (const sp of glow.sparks) {   // four-point twinkles
      const st = t - sp.d;
      if (st < 0 || st > 0.5) continue;
      const a = Math.sin(st / 0.5 * Math.PI), [x, y] = sp.p, arm = st < 0.15 || st > 0.38 ? 1 : 2;
      px(ctx, x, y, a, "255,255,255");
      for (let i = 1; i <= arm; i++) { px(ctx, x + i, y, a * 0.9, GLOW); px(ctx, x - i, y, a * 0.9, GLOW); px(ctx, x, y + i, a * 0.9, GLOW); px(ctx, x, y - i, a * 0.9, GLOW); }
    }
  }
  if (poof) {          // sparkle burst around Buddy when she changes clothes
    const t = realClock - poof.t0;
    if (t > 0.8) { poof = null; return; }
    for (let i = 0; i < 10; i++) {
      const ang = i / 10 * Math.PI * 2, r = 6 + t * 22;
      const x = Math.round(poof.x + Math.cos(ang) * r), y = Math.round(poof.y + Math.sin(ang) * r * 0.8);
      const a = 1 - t / 0.8;
      px(ctx, x, y, a, "255,255,255"); px(ctx, x + 1, y, a * 0.7, GLOW); px(ctx, x - 1, y, a * 0.7, GLOW); px(ctx, x, y + 1, a * 0.7, GLOW); px(ctx, x, y - 1, a * 0.7, GLOW);
    }
  }
}

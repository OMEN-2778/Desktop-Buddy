      else bctx.drawImage(frameOf(IMG.fx.phone, 2), x + 8, y + 17);
    }
    emoteAt = [x + 13, y - 15];
  }
  grade(bctx, f, lit);
  // things that glow on their own: screens, flames, steam
  if (act === "tv") {
    const ch = IMG.tv[sim.item?.screen] ? sim.item.screen : Object.keys(IMG.tv)[Math.floor(realClock / 6) % 4];
    bctx.drawImage(frameOf(IMG.tv[ch], 4), D.screens.tv.x, D.screens.tv.y);
  }
  if (act === "computer") {
    const g = IMG.mon[sim.item?.screen] ? sim.item.screen : Object.keys(IMG.mon)[Math.floor(realClock / 8) % 3];
    bctx.drawImage(frameOf(IMG.mon[g], 5), D.screens.monitor.x, D.screens.monitor.y);
  }
  if (act && act.startsWith("pc_")) bctx.drawImage(frameOf(IMG.app[act.slice(3)], act === "pc_video" ? 2 : 3), D.screens.monitor.x, D.screens.monitor.y);
  if (act === "cook") bctx.drawImage(frameOf(IMG.fx.cook, 8), D.fx.cook.x, D.fx.cook.y);
  if (act === "eat") bctx.drawImage(frameOf(IMG.fx.meal, 4), D.fx.meal.x, D.fx.meal.y);
  if (act === "water_living" || act === "water_study") bctx.drawImage(frameOf(IMG.fx[act], 6), D.fx[act].x, D.fx[act].y);
  const down = sim.mode === "down";
  if (sleeping) {
    // Zs drift up from the pillow; now and then a dream bubble instead (user:
    // not the same dark zzz bubble all night)
    const cyc = Math.floor(realClock / 26), inDream = realClock % 26 > 19;
    if (inDream) bctx.drawImage(emoteCanvas(DREAMS[cyc % DREAMS.length]), emoteAt[0], emoteAt[1]);
    else bctx.drawImage(frameOf(IMG.fx.sleep_z, 4), emoteAt[0] - 2, emoteAt[1] - 6);
  } else if (fr.emote || down) bctx.drawImage(emoteCanvas(down ? "skull" : fr.emote), emoteAt[0], emoteAt[1] + (down ? Math.floor(realClock * 2) % 2 : 0));
  if (down) drawRevive(bctx);
  drawClickFx(bctx);
  vctx.imageSmoothingEnabled = false;
  vctx.drawImage(buf, 0, 0, view.width, view.height);
}

// ================================================================ seasons & weather
// Every 14 days is a season. Spring, summer and autumn now and then get a
// shower; winter gets snow. Each day rolls its episodes once (lazily).
const SEASON_DAYS = 14;
const SEASONS = [
  { name: "春", kind: "rain", p: 0.32 },
  { name: "夏", kind: "rain", p: 0.28 },
  { name: "秋", kind: "rain", p: 0.26 },
  { name: "冬", kind: "snow", p: 0.45 },
];
const WEATHER_NAME = { clear: "晴", rain: "小雨", snow: "下雪" };
function seasonOf(t) {
  const d = Math.floor(t / 1440);
  return { i: Math.floor(d / SEASON_DAYS) % 4, day: d % SEASON_DAYS + 1 };
}
const weather = { plan: new Map(), force: null, kind: "clear", season: 0, snowCover: 0 };
function planDay(d) {
  if (d < 0) return [];
  if (!weather.plan.has(d)) {
    const s = SEASONS[Math.floor(d / SEASON_DAYS) % 4], eps = [];
    for (const p of [s.p, s.p * 0.3]) {           // usually none, sometimes one, rarely two
      if (Math.random() >= p) break;
      const from = d * 1440 + Math.floor(Math.random() * 22 * 60);
      eps.push({ from, to: from + 90 + Math.random() * 270, kind: s.kind });
    }
    weather.plan.set(d, eps);
  }
  return weather.plan.get(d);
}
function weatherAt(t) {
  if (weather.force) return weather.force;
  const d = Math.floor(t / 1440);
  for (const dd of [d - 1, d]) for (const e of planDay(dd)) if (t >= e.from && t < e.to) return e.kind;
  return "clear";
}
function updateWeather(dtGame) {
  const se = seasonOf(sim.t).i;
  if (se !== weather.season) { weather.season = se; lifeSeason(se); }
  const w = weatherAt(sim.t);
  if (w !== weather.kind) {
    const was = weather.kind;
    weather.kind = w;
    lifeWeather(was, w);
    if (w === "snow") log("下雪了！窗外白白的一片。");
    else if (w === "clear") log(was === "snow" ? "雪停了。" : "雨停了。");
  }
  // snow settles on the hill while it snows and melts slowly afterwards (fast outside winter)
  if (w === "snow") weather.snowCover = Math.min(1, weather.snowCover + dtGame / 150);
  else weather.snowCover = Math.max(0, weather.snowCover - dtGame / (se === 3 ? 2880 : 240));
}

// ---------- weather through the windows
const WMASK = {};
function maskCanvas(imgs, w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  for (const i of imgs) x.drawImage(i, 0, 0);
  return c;
}
async function loadWeatherMasks() {
  for (const [id, m] of Object.entries(D.weatherMasks)) {
    const st = {};
    for (const k of ["closed", "open"]) {
      if (!m[k]) continue;
      const sky = await loadImg(m[k].sky), ground = await loadImg(m[k].ground);
      st[k] = { sky, ground, glass: maskCanvas([sky, ground], sky.width, sky.height), w: sky.width, h: sky.height };
    }
    WMASK[id] = { x: m.x, y: m.y, ...st };
  }
}
const wtmp = document.createElement("canvas"), wctx = wtmp.getContext("2d");
function masked(ctx, m, mask, x, y, paint) {   // paint(local ctx), keep only the mask's pixels
  wtmp.width = m.w; wtmp.height = m.h;
  wctx.globalCompositeOperation = "source-over";
  paint(wctx);
  wctx.globalCompositeOperation = "destination-in";
  wctx.drawImage(mask, 0, 0);
  ctx.drawImage(wtmp, x, y);
}
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function drawWeather(ctx, night) {
  const se = weather.season, w = weather.kind;
  const tint = se === 2 ? "rgba(214, 140, 52, 0.62)" : se === 1 ? "rgba(46, 104, 52, 0.22)" : null;
  for (const [id, win] of Object.entries(WMASK)) {
    if (windowState[id] === "drawn") continue;              // curtains shut: no view
    const m = windowState[id] === "open" && win.open ? win.open : win.closed;
    if (!m) continue;
    // the season on the hill
    if (tint || weather.snowCover > 0) {
      masked(ctx, m, m.ground, win.x, win.y, g => {
        if (tint) { g.fillStyle = tint; g.fillRect(0, 0, m.w, m.h); }
        if (weather.snowCover > 0) { g.fillStyle = `rgba(244, 247, 252, ${0.9 * weather.snowCover})`; g.fillRect(0, 0, m.w, m.h); }
      });
    }
    if (w === "clear") continue;
    // grey sky + falling rain / drifting snow, only on the glass
    masked(ctx, m, m.glass, win.x, win.y, g => {
      g.fillStyle = w === "rain" ? "rgba(66, 78, 100, 0.5)" : "rgba(196, 206, 222, 0.3)";
      g.fillRect(0, 0, m.w, m.h);
      const seed = id.length * 13 + win.x;
      if (w === "rain") {
        g.fillStyle = night ? "rgba(170, 190, 225, 0.75)" : "rgba(232, 240, 252, 0.85)";
        for (let i = 0; i < 22; i++) {
          const x0 = hash(seed + i) * (m.w + 6), sp = 26 + hash(seed + i * 3) * 10;
          const y = ((realClock * sp + hash(seed + i * 7) * m.h) % (m.h + 4)) - 3;
          g.fillRect(Math.floor(x0 - y * 0.25), Math.floor(y), 1, 3);
        }
      } else {
        g.fillStyle = "rgba(255, 255, 255, 0.95)";
        for (let i = 0; i < 12; i++) {
          const x0 = hash(seed + i) * m.w, sp = 3 + hash(seed + i * 3) * 3;
          const y = (realClock * sp + hash(seed + i * 7) * m.h) % (m.h + 2) - 1;
          g.fillRect(Math.floor(x0 + Math.sin(realClock * 1.3 + i) * 1.5), Math.floor(y), 1, 1);
        }
      }
    });
  }
}

// ---------- the sky bar above the house
const skyEl = document.getElementById("skybar"), skyCanvas = document.getElementById("sky"), skx = skyCanvas.getContext("2d");
const skyTip = document.getElementById("skyTip");
const SKY_STOPS = [[0, "#ffd92b"], [0.28, "#ffd84a"], [0.4, "#f8d6a0"], [0.48, "#f1c4d6"], [0.55, "#b7a3d0"],
                   [0.62, "#7186c6"], [0.7, "#2c72bf"], [1, "#0f63b0"]];
const SKY_ICON = 16, SKY_MORPH = 0.9;
let skyGeo = { b: 3, w: 684, cols: 228 }, skyTrack = null;
const sky = { icon: null, from: null, t0: -9, x: 0, fromX: 0 };
const IMG_SKY = {};
async function loadSkyIcons() {
  for (const [k, frames] of Object.entries(D.skyIcons)) IMG_SKY[k] = await Promise.all(frames.map(loadImg));
}
const skyFrac = t => (((t % 1440) / 60 - 6 + 24) % 24) / 24;   // the bar starts at 06:00
function skyColor(f) {
  let i = 0;
  while (i < SKY_STOPS.length - 2 && f > SKY_STOPS[i + 1][0]) i++;
  const [f0, c0] = SKY_STOPS[i], [f1, c1] = SKY_STOPS[i + 1];
  const k = Math.max(0, Math.min(1, (f - f0) / (f1 - f0)));
  const a = doll.hexToRgb(c0), b = doll.hexToRgb(c1);
  return `rgb(${a.map((v, j) => Math.round((v + (b[j] - v) * k) * 255)).join(",")})`;
}
function buildSkyTrack() {
  // a pixel pill: 8 units tall, 2-unit white ring, gradient fill, centred in the 16-unit bar
  const { b, w, cols } = skyGeo, H16 = SKY_ICON * b;
  const c = document.createElement("canvas"); c.width = w; c.height = H16;
  const x = c.getContext("2d");
  const ox = Math.floor((w - cols * b) / 2), top = 4, R = 4;
  const inset = (r, rad, rows) => { const d = r + 0.5 - rows / 2; return Math.round(rad - Math.sqrt(Math.max(0, rad * rad - d * d))); };
  for (let r = 0; r < 8; r++) {
    const e = inset(r, R, 8);
    x.fillStyle = "#ffffff";
    x.fillRect(ox + e * b, (top + r) * b, (cols - 2 * e) * b, b);
  }
  for (let r = 0; r < 4; r++) {
    const e = 2 + inset(r, 2, 4);
    for (let col = e; col < cols - e; col++) {
      x.fillStyle = skyColor(col / (cols - 1));
      x.fillRect(ox + col * b, (top + 2 + r) * b, b, b);
    }
    x.fillStyle = "rgba(255,255,255,0.32)";                 // a 1-unit gloss line, like the needs bars
    if (r === 0) x.fillRect(ox + (e + 2) * b, (top + 2) * b, (cols - 2 * e - 4) * b, b);
  }
  skyTrack = c;
}
function sizeSky(wPx, hPx, u) {
  const b = Math.max(1, Math.min(u, Math.floor(hPx / 36)));
  skyGeo = { b, w: wPx, cols: Math.floor(wPx / b) };
  skyCanvas.width = Math.round(wPx); skyCanvas.height = SKY_ICON * b;
  const widget = document.getElementById("widget");
  widget.style.setProperty("--sky-h", SKY_ICON * b + "px");
  widget.style.setProperty("--sky-gap", 1 * b + "px");       // just above the roof, never over it (user tuned this)
  widget.style.setProperty("--sky-over", "0px");
  buildSkyTrack();
  sizeMood(2);                                              // a 48px emoji at every 界面大小, like the gear
}
function skyTarget() {
  if (weather.kind !== "clear") return weather.kind;
  const h = hour();
  return h >= 6 && h < 19 ? "sun" : "moon";
}
function drawIcon(name, cx, cy, scale) {
  const fr = IMG_SKY[name];
  if (!fr || scale <= 0.02) return;
  const fps = name === "rain" ? 6 : name === "sun" ? 3 : 4;
  const img = reduceMotionUI ? fr[0] : fr[Math.floor(realClock * fps) % fr.length];
  // whole screen pixels only: the icon is drawn at an integer size and position,
  // so it never lands between pixels (that is what made it look jagged)
  const size = Math.max(1, Math.round(SKY_ICON * skyGeo.b * scale));
  skx.drawImage(img, Math.round(cx - size / 2), Math.round(cy - size / 2), size, size);
}
function renderSky() {
  if (!skyTrack || !IMG_SKY.sun) return;
  const { b, w, cols } = skyGeo, ox = Math.floor((w - cols * b) / 2);
  const col = Math.round(SKY_ICON / 2 + skyFrac(sim.t) * (cols - SKY_ICON));
  const x = ox + col * b, cy = (SKY_ICON * b) / 2;
  const want = skyTarget();
  if (sky.icon === null) { sky.icon = want; sky.x = x; }
  const wrapped = x < sky.x - w / 2;                          // 06:00: from the right end back to the left
  if (want !== sky.icon || wrapped) { sky.from = sky.icon; sky.fromX = sky.x; sky.icon = want; sky.t0 = realClock; }
  sky.x = x;
  skx.imageSmoothingEnabled = false;
  skx.clearRect(0, 0, w, skyCanvas.height);
  skx.drawImage(skyTrack, 0, 0);
  const p = reduceMotionUI ? 1 : (realClock - sky.t0) / SKY_MORPH;
  const bob = reduceMotionUI || sky.icon === "sun" ? 0 : (Math.sin(realClock * 1.8) > 0.6 ? -b : 0);   // whole units
  if (p < 1 && sky.from) {
    // the old icon spins down to nothing, the new one springs up in its place
    const out = Math.min(1, p / 0.5), back = 1 - out;
    drawIcon(sky.from, sky.fromX, cy, back * back * (3 - 2 * back));
    const q = Math.max(0, (p - 0.3) / 0.7), c1 = 1.9;     // ease-out-back: overshoots a little, settles
    const pop = q <= 0 ? 0 : 1 + (c1 + 1) * (q - 1) ** 3 + c1 * (q - 1) ** 2;
    drawIcon(sky.icon, x, cy + bob, pop);
    // sparkles fly out from where the change happens
    skx.fillStyle = "#ffffff";
    if (p > 0.25 && p < 0.95) {
      const r = (p - 0.25) / 0.7;
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4 + 0.3, d = (6 + r * 9) * b;
        const size = Math.max(1, Math.round(b * (1 - r) * 1.5));
        skx.fillRect(Math.round(x + Math.cos(a) * d), Math.round(cy + Math.sin(a) * d), size, size);
      }
    }

}

  const se = seasonOf(sim.t);

// ---------- room above the house for what opens upward (造型室, diary list)
// The house and its UI stay where they are (user): the page gets just
// enough room at the top (--room-top on .desk); in the desktop app the
// window grows upward by the same amount (fitWindow moves it).
let roomTop = 0;

  const desk = document.querySelector(".desk");
  const u = parseFloat(getComputedStyle(document.getElementById("widget")).getPropertyValue("--u")) || 4;
  let need = 0;                                         // px needed above the mood row's top
  const mTop = moodrow.getBoundingClientRect().top, rowH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row-h")) || 42;
  if (wardrobeOpen) need = Math.max(need, rowH + 20 + studioEl.offsetHeight + 4 * u);
  if (diaryOn) need = Math.max(need, mTop - diaryBox.getBoundingClientRect().top + 8 + diaryPop.offsetHeight);
  need += 8;
  // the smallest room that fits it (a centred page moves by half: iterate)
  for (let i = 0; i < 12; i++) {
    const top = moodrow.getBoundingClientRect().top + window.scrollY;
    const r = Math.max(0, Math.round(roomTop + need - top));
    if (r === roomTop) break;
    roomTop = r; desk.style.setProperty("--room-top", r + "px");
  }
  if (TAURI) fitWindow();
  else {   // a scrolled page: bring what just opened into view
    const top = moodrow.getBoundingClientRect().top - need;
    if (top < 0) window.scrollBy({ top, behavior: reduceMotionUI ? "auto" : "smooth" });
  }

// a browser keeps it in localStorage. With 自动保存 on it is saved every
// 5 minutes, when the page is hidden or closed, and after a look change;
// off, only 保存 writes it. Game time waits while the game is closed.
const SAVE_VERSION = 1, SAVE_KEY = "buddy-save";
const store = TAURI ? {
  load: async () => { const t = await TAURI.core.invoke("load_save"); return t ? JSON.parse(t) : null; },
  save: async obj => TAURI.core.invoke("write_save", { data: JSON.stringify(obj) }),
} : {
  load: async () => JSON.parse(localStorage.getItem(SAVE_KEY) || "null"),
  save: async obj => { if (obj === null) localStorage.removeItem(SAVE_KEY); else localStorage.setItem(SAVE_KEY, JSON.stringify(obj)); },
};
let booted = false, saving = false;
function snapshot() {
  const p = here();
  return {
    version: SAVE_VERSION, savedAt: Date.now(),
    look,
    settings: { speed, scale: prefs.scale, onTop: prefs.onTop },
    sim: { t: sim.t, needs: sim.needs, mode: sim.mode, act: sim.act, actEnd: sim.actEnd, nap: !!sim.nap,
           at: [Math.round(p.x), storeyOfY(p.y)], facing: sim.facing, queue: sim.windup ? [sim.windup.act] : sim.queue, recent: sim.recent,
           lastDay: sim.lastDay, sleptTonight: sim.sleptTonight, meal: sim.meal, down: sim.down,
           graceUntil: sim.graceUntil, insomnia: !!sim.insomnia },
    moods: [...moods].filter(([id]) => ML[id] && !id.startsWith("test_")).map(([id, m]) => [id, m.until, m.t]),
    flags: lifeFlags, events: eventLast, lastFestivalDay, namedAs,
    house: { lamps, windows: windowState },
    weather: { plan: [...weather.plan], snowCover: weather.snowCover, season: weather.season },
    diary: [...logEl.children].map(li => li.classList.contains("day") ? ["day", li.textContent]
      : ["", li.querySelector("time").textContent, li.querySelector("span").textContent]),
  };
}
// older saves are brought up to date here, one version step at a time
function migrate(sv) {
  if (!sv || typeof sv !== "object" || !sv.look || !sv.sim) return null;
  // (version 1 is the first; future steps go here: if (sv.version < 2) { ...; sv.version = 2; })
  return sv;
}
function restore(sv) {
  setLook(sv.look);
  applySettings(sv.settings);         // older saves carried the settings; the settings file wins (boot)
  const m = sv.sim;
  if (Number.isFinite(m.t)) sim.t = m.t;
  for (const k of Object.keys(sim.needs)) if (Number.isFinite(m.needs?.[k])) sim.needs[k] = clamp(m.needs[k]);
  for (const k of ["facing", "lastDay", "sleptTonight", "graceUntil"]) if (Number.isFinite(m[k])) sim[k] = m[k];
  sim.queue = (m.queue || []).filter(a => ACTS[a]); sim.recent = (m.recent || []).filter(a => ACTS[a]);
  sim.meal = m.meal || null; sim.insomnia = !!m.insomnia; sim.nap = !!m.nap;
  let [x, storey] = Array.isArray(m.at) ? m.at : [D.spots.bed[1], 1];
  if (m.mode === "act" && ACTS[m.act] && m.act !== "dress") {
    sim.mode = "act"; sim.act = m.act; sim.actEnd = m.actEnd;
    if (ACTS[m.act].spot) [storey, x] = D.spots[ACTS[m.act].spot];       // back at her spot
  } else if (m.mode === "down" && m.down) {
    sim.mode = "down"; sim.act = null; sim.down = m.down;
  } else {
    sim.mode = "idle"; sim.act = null; sim.idleUntil = sim.t + 1;          // she was walking: she'll decide again
  }
  sim.route = [[x, FLOOR_Y[storey] ?? FLOOR_Y[1]]]; sim.s = 0; sim.target = 0; sim.crossing = [];
  moods.clear();
  for (const [id, until, t] of sv.moods || []) if (ML[id]) moods.set(id, { until, t });
  Object.assign(lifeFlags, sv.flags || {});
  Object.assign(eventLast, sv.events || {});
  lastFestivalDay = sv.lastFestivalDay || 0;
  namedAs = sv.namedAs || look.name;
  Object.assign(lamps, sv.house?.lamps || {});
  Object.assign(windowState, sv.house?.windows || {});
  if (sv.weather) {
    weather.plan = new Map(sv.weather.plan || []);
    weather.snowCover = sv.weather.snowCover || 0;
    weather.season = sv.weather.season ?? seasonOf(sim.t).i;
  }
  logEl.innerHTML = "";
  for (const e of sv.diary || []) {
    const li = document.createElement("li");
    if (e[0] === "day") { li.className = "day"; li.textContent = e[1]; }
    else { li.innerHTML = "<time></time><span></span>"; li.firstChild.textContent = e[1]; li.lastChild.textContent = e[2]; }
    logEl.appendChild(li);
  }
  syncDiary();
}
async function saveGame() {
  if (!booted || saving) return false;
  saving = true;
  try {
    await store.save(snapshot());
    // the 造型室 page (prototype/creator) shares her look through these two keys
    if (!TAURI) try { localStorage.setItem("buddy-look-v2", JSON.stringify(look)); localStorage.setItem("buddy-look-at", String(Date.now())); } catch (e) { /* full */ }
    return true;
  }
  catch (e) { console.warn("save failed", e); return false; }
  finally { saving = false; }
}
// 自动保存 on: every 5 minutes, and when the window is hidden or closed.
// Off: only the 保存 button saves.
const autoSave = () => (prefs.autosave ? saveGame() : Promise.resolve(false));
setInterval(autoSave, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.hidden) autoSave(); });
window.addEventListener("pagehide", () => { if (!TAURI && booted && prefs.autosave) try { localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot())); } catch (e) { /* full */ } });
async function exportSave() {
  const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
  const filename = `${look.name}-存档-${stamp}.json`, text = JSON.stringify(snapshot(), null, 1);
  // on claude.ai the page may only hand over files through the viewer's own save prompt
  const downloads = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (downloads) {
    try { await downloads.save({ filename, data: text }); flashLabel("存档", "已导出"); }
    catch (e) { if (!e || e.code !== "declined") flashLabel("存档", "没导出"); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
document.getElementById("importSave").addEventListener("change", async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  let sv = null;
  try { sv = migrate(JSON.parse(await f.text())); } catch (err) { sv = null; }
  if (!sv) { flashLabel("存档", "读不出来"); return; }
  booted = false;                                   // nothing may save over it before the reload
  await store.save(sv);
  location.reload();
});
async function resetSave() {
  booted = false;
  await store.save(null);
  if (!TAURI) try { localStorage.removeItem("buddy-look-v2"); localStorage.removeItem("buddy-look-at"); } catch (e) { /* ignore */ }
  location.reload();
}

// ---------- the desktop window: sized to the game, tray menu events
let lastWin = "", lastTop = null, lifted = 0;
function fitWindow() {
  if (!TAURI) return;
  const w = document.getElementById("widget"), desk = document.querySelector(".desk"), cs = getComputedStyle(desk);
  // the game, plus the settings menu while it is open (it may reach past the house)
  const r = w.getBoundingClientRect();
  let right = r.right, bottom = r.bottom;
  if (!setPop.hidden) { const p = setPop.getBoundingClientRect(); right = Math.max(right, p.right + 8); bottom = Math.max(bottom, p.bottom + 8); }
  const width = Math.ceil(right - r.left + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight));
  const height = Math.ceil(bottom - r.top + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom));
  // room made above the house (makeRoom) moves it down in the window: move
  // the window up as much, so it stays put on screen; give back only what
  // the window really moved (it stops at the top of the screen)
  const top = moodrow.getBoundingClientRect().top;
  let dy = lastTop === null ? 0 : top - lastTop;
  lastTop = top;
  if (dy < 0) dy = -Math.min(-dy, lifted);
  if (`${width}x${height}` === lastWin && !dy) return;
  lastWin = `${width}x${height}`;
  TAURI.core.invoke("fit_window", { width, height, dy })
    .then(moved => { lifted = Math.max(0, lifted + (+moved || 0)); })
    .catch(e => TAURI.core.invoke("log_js", { message: `fit_window: ${e}` }));
}
// Moving the window (it has no title bar): press on the empty space around
// the game, the mood row or the time bar; or press on the house's walls or
// floor (not on her or a piece of furniture) and move a little.
function dragWindow() { TAURI.core.invoke("start_drag").catch(e => TAURI.core.invoke("log_js", { message: `start_drag: ${e}` })); }
if (TAURI) {
  const desk = document.querySelector(".desk"), widgetEl = document.getElementById("widget");
  const EMPTY = new Set([document.documentElement, document.body, desk, widgetEl, document.querySelector(".house-col"),
                         moodrow, moodTalk, document.getElementById("skybar"), skyHit]);
  document.addEventListener("mousedown", e => { if (e.button === 0 && EMPTY.has(e.target)) { e.preventDefault(); dragWindow(); } });
  let press = null;
  view.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.pointerType !== "mouse" || sim.mode === "down") return;
    const [x, y] = canvasXY(e);
    press = !buddyHit(x, y) && !clickableAt(x, y) ? { x: e.clientX, y: e.clientY } : null;
  });
  view.addEventListener("pointermove", e => {
    if (press && (e.buttons & 1) && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 3) { press = null; dragWindow(); }
  });
  window.addEventListener("pointerup", () => { press = null; });
}
if (TAURI) {
  const ro = new ResizeObserver(fitWindow);
  ro.observe(document.getElementById("widget")); ro.observe(setPop);
  TAURI.event.listen("app-quit", async () => { await autoSave(); TAURI.core.invoke("exit_app"); });
  TAURI.event.listen("on-top-changed", e => { prefs.onTop = !!e.payload; saveSettings(); buildSettings(); });
}

// ================================================================ loop
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  realClock += dt;
  const fast = sim.mode === "act" && sim.act === "sleep" ? 8 : 1;
  step(dt * speed * fast, dt * (speed ? 1 : 0));
  updateDoors(speed ? dt : 0);
  render();
  renderSky();
  renderMood();
  placeRing();
  placeNametag();
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; syncUI(); updateMood(); }
  requestAnimationFrame(frame);
}

document.getElementById("testDown").addEventListener("click", () => { if (sim.mode !== "down") collapse(pick(EXTREME)); });

(async function boot() {
  let sv = null, st = null;
  try { sv = migrate(await store.load()); } catch (e) { sv = null; }
  try { st = await settingsStore.load(); } catch (e) { st = null; }
  if (sv) restore(sv);
  applySettings(st);
  await refreshSaveDir();
  // her look may have been changed on the 造型室 page since (browser only)
  let shared = null, sharedAt = 0;
  if (!TAURI) try { shared = JSON.parse(localStorage.getItem("buddy-look-v2") || "null"); sharedAt = +localStorage.getItem("buddy-look-at") || 0; } catch (e) { /* storage unavailable */ }
  if (!sv) setLook(shared && typeof shared === "object" ? shared : doll.PRESETS.f);
  else if (shared && typeof shared === "object" && sharedAt > sv.savedAt) setLook({ ...shared, name: shared.name || look.name });
  namedAs = namedAs || nameOf();
  studio = BuddyStudio(studioEl, doll, D.doll, { look, previewScale: 3, thumbH: 40, onChange: changeLook, onClose: closeWardrobe });
  fit();
  if (TAURI && !st && !sv) {      // first run of the desktop app: the biggest size that leaves most of the screen free
    const w = document.getElementById("widget"), k = prefs.scale / 100;
    const need = (w.offsetWidth + 80) / k, needH = (w.offsetHeight + 112) / k;
    prefs.scale = [...SCALES].reverse().find(v => need * v / 100 <= screen.availWidth * 0.6 && needH * v / 100 <= screen.availHeight * 0.6) || SCALES[0];
    fit();
  }
  window.addEventListener("resize", fit);
  await loadAssets();
  await loadSkyIcons();
  await loadMoodIcons();
  await loadWeatherMasks();
  weather.kind = weatherAt(sim.t);
  if (!sv) {
    log("—— 第 1 天 · 春 ——", "day");
    log(`${nameOf()}还在被窝里睡觉。`);
  } else {
    log(`—— 回来啦 · 第 ${Math.floor(sim.t / 1440) + 1} 天 ——`, "day");
  }
  if (TAURI) TAURI.core.invoke("set_on_top", { on: prefs.onTop }).catch(() => {});
  booted = true;
  updateMood();
  syncUI();
  render();
  requestAnimationFrame(frame);
  if (!st) saveSettings();
  if (!sv) autoSave();
})();
</script>

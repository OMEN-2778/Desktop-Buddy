function diaryItem(li) {
  const out = document.createElement("li");
  if (li.classList.contains("day")) { out.className = "day"; out.textContent = li.textContent; }
  else { out.innerHTML = "<time></time><span></span>"; out.firstChild.textContent = li.querySelector("time").textContent; out.lastChild.textContent = li.querySelector("span").textContent; }
  if (li._talk) {   // the whole conversation, folded under its line (user)
    const b = Object.assign(document.createElement("button"), { type: "button", className: "talk-btn", textContent: li._talk.some(([w]) => w === "评论：" || w.startsWith("【")) ? `浏览记录 · ${li._talk.length} 条` : `聊天记录 · ${li._talk.length} 句` });
    const box = Object.assign(document.createElement("div"), { className: "talk-log" });
    for (const [who, line] of li._talk) {
      const p = document.createElement("p");
      if (who) { p.className = "other"; p.append(Object.assign(document.createElement("em"), { textContent: who })); }
      else p.append(Object.assign(document.createElement("em"), { textContent: nameOf() + "：" }));
      p.append(spaced(line));
      box.append(p);
    }
    const open = on => { out.classList.toggle("open", on); b.setAttribute("aria-expanded", String(on)); on ? talkOpen.add(li) : talkOpen.delete(li); };
    b.addEventListener("click", () => open(!out.classList.contains("open")));

// ---------- room above the house for what opens upward (造型室, diary list)
// The house and its UI stay where they are (user): the page gets just
// enough room at the top (--room-top on .desk); in the desktop app the
// window grows upward by the same amount (fitWindow moves it).
let roomTop = 0;
const APP_HEADROOM = 700;   // px above the mood row the app always has: the tallest thing that opens up there (the guide) fits
function makeRoom() {
  const desk = document.querySelector(".desk");
  const u = parseFloat(getComputedStyle(document.getElementById("widget")).getPropertyValue("--u")) || 4;
  let need = 0;                                         // px needed above the mood row's top
  const mTop = moodrow.getBoundingClientRect().top, rowH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row-h")) || 42;
  if (wardrobeOpen) need = Math.max(need, rowH + 20 + studioEl.offsetHeight + 4 * u);
  if (guideOn) need = Math.max(need, rowH + 20 + guideEl.offsetHeight + 4 * u);
  if (diaryOn) need = Math.max(need, mTop - diaryBox.getBoundingClientRect().top + 8 + diaryPop.offsetHeight);
  if (!setPop.hidden) need = Math.max(need, mTop - setPop.getBoundingClientRect().top + 8);
  // the app keeps room above the house for all of these all the time (and
  // lets clicks through it): opening one never moves the window (user: it flashed)
  if (TAURI) need = Math.max(need, APP_HEADROOM);
  need += 8;
  // the smallest room that fits it (a centred page moves by half: iterate)
  for (let i = 0; i < 12; i++) {
    const top = moodrow.getBoundingClientRect().top + window.scrollY;
    const r = Math.max(0, Math.round(roomTop + need - top));
    if (r === roomTop) break;
    roomTop = r; desk.style.setProperty("--room-top", r + "px");
  }
  // and on the left for the pick-a-thing panel (unless it lies over the house)
  // (it ends 14px left of the widget; its own pop-in transform doesn't count)
  const needL = pickOn && !pickerEl.classList.contains("over") ? pickerEl.offsetWidth + 14 + 8 : 0;
  let roomL = parseFloat(desk.style.getPropertyValue("--room-left")) || 0;
  for (let i = 0; i < 12; i++) {
    const left = document.getElementById("widget").getBoundingClientRect().left + window.scrollX;
    const r = Math.max(0, Math.round(roomL + needL - left));
    if (r === roomL) break;
    roomL = r; desk.style.setProperty("--room-left", r + "px");
  }
  if (TAURI) fitWindow();
  else {   // a scrolled page: bring what just opened into view
    const top = moodrow.getBoundingClientRect().top - need;
    if (top < 0) window.scrollBy({ top, behavior: reduceMotionUI ? "auto" : "smooth" });
  }
}

// ================================================================ 新手教程
// A picture book about how to play (user): pages from guide_text.js, each
// with a real screenshot (tools/make_guide_shots.js, D.guide) and numbered
// marks the text points at. It opens upward above the gear row like the
// 造型室 (the house never moves), by itself the first time, and again from
// 设置 → 存档 → 教程. The clock stands still while it is open.
/*__GUIDE_JS__*/
let guideOn = false, guidePage = 0;
const guideEl = document.getElementById("guide"), guideSlot = document.getElementById("guideSlot");
const guideFill = t => t.replace(/\{名字\}/g, nameOf()).replace(/\{她\}/g, ta());
// [3] -> mark 3's badge, **x** -> bold
const guideHtml = t => guideFill(t).replace(/&/g, "&amp;").replace(/</g, "&lt;")
  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[(\d+)\]/g, '<span class="gd-n">$1</span>');
// as wide as the house, but never narrower than a page can be read in, nor wider than one needs
function sizeGuide() {
  const w = document.getElementById("widget"), sw = parseFloat(w.style.getPropertyValue("--studio-w")) || 684;
  const dx = parseFloat(w.style.getPropertyValue("--studio-dx")) || 0;

  w.style.setProperty("--guide-w", gw + "px");
  w.style.setProperty("--guide-left", -dx + Math.max(0, (sw - gw) / 2) + "px");
  guideEl.classList.toggle("narrow", gw < 640);

  const room = TAURI ? window.screenY + moodrow.getBoundingClientRect().top - (screen.availTop || 0) - 140 : Infinity;
  const gh = Math.round(Math.max(340, Math.min(gw < 640 ? 500 : 540, room)));

function buildGuide() {

// ================================================================ saving
// One versioned save: her look and name, the settings, the clock, her needs,

// weather plan and the diary. The desktop app keeps it as a file in its data
// folder (written whole then swapped in, the previous copy kept as .bak);
// a browser keeps it in localStorage. With 自动保存 on it is saved every
// 5 minutes, when the page is hidden or closed, and after a look change;
// off, only 保存 writes it. Game time waits while the game is closed.
const SAVE_VERSION = 1, SAVE_KEY = "buddy-save";
const store = TAURI ? {
  load: async () => { const t = await TAURI.core.invoke("load_save"); return t ? JSON.parse(t) : null; },
  save: async obj => TAURI.core.invoke("write_save", { data: JSON.stringify(obj) }),
} : {
  load: async () => JSON.parse(localStorage.getItem(SAVE_KEY) || "null"),
  save: async obj => { if (obj === null) localStorage.removeItem(SAVE_KEY); else localStorage.setItem(SAVE_KEY, JSON.stringify(obj)); },
};
let booted = false, saving = false;
function snapshot() {
  const p = here();
  return {
    version: SAVE_VERSION, savedAt: Date.now(),
    look,
    settings: { speed, scale: prefs.scale, onTop: prefs.onTop },
    sim: { t: sim.t, needs: sim.needs, mode: sim.mode, act: sim.act, actEnd: sim.actEnd, nap: !!sim.nap,
           at: [Math.round(p.x), storeyOfY(p.y)], facing: sim.facing, queue: sim.windup ? [sim.windup.act] : sim.queue, recent: sim.recent,
           lastDay: sim.lastDay, sleptTonight: sim.sleptTonight, meal: sim.meal, down: sim.down,
           graceUntil: sim.graceUntil, insomnia: !!sim.insomnia, place: sim.place },
    moods: [...moods].filter(([id]) => ML[id] && !id.startsWith("test_")).map(([id, m]) => [id, m.until, m.t]),
    flags: lifeFlags, events: eventLast, lastFestivalDay, namedAs,
    house: { lamps, windows: windowState },
    weather: { plan: [...weather.plan], snowCover: weather.snowCover, season: weather.season },
    diary: [...logEl.children].map(li => li.classList.contains("day") ? ["day", li.textContent]
      : ["", li.querySelector("time").textContent, li.querySelector("span").textContent, ...(li._talk ? [li._talk] : [])]),
  };
}
// older saves are brought up to date here, one version step at a time
function migrate(sv) {
  if (!sv || typeof sv !== "object" || !sv.look || !sv.sim) return null;
  // (version 1 is the first; future steps go here: if (sv.version < 2) { ...; sv.version = 2; })
  return sv;
}
function restore(sv) {
  setLook(sv.look);
  applySettings(sv.settings);         // older saves carried the settings; the settings file wins (boot)
  const m = sv.sim;
  if (Number.isFinite(m.t)) sim.t = m.t;
  for (const k of Object.keys(sim.needs)) if (Number.isFinite(m.needs?.[k])) sim.needs[k] = clamp(m.needs[k]);
  for (const k of ["facing", "lastDay", "sleptTonight", "graceUntil"]) if (Number.isFinite(m[k])) sim[k] = m[k];
  sim.queue = (m.queue || []).filter(a => ACTS[a]); sim.recent = (m.recent || []).filter(a => ACTS[a]);
  sim.meal = m.meal || null; sim.insomnia = !!m.insomnia; sim.nap = !!m.nap;
  let [x, storey] = Array.isArray(m.at) ? m.at : [D.spots.bed[1], 1];
  if (m.mode === "act" && ACTS[m.act] && m.act !== "dress") {
    sim.mode = "act"; sim.act = m.act; sim.actEnd = m.actEnd;
    if (ACTS[m.act].spot) [storey, x] = D.spots[ACTS[m.act].spot];       // back at her spot
  } else if (m.mode === "down" && m.down) {
    sim.mode = "down"; sim.act = null; sim.down = m.down;
  } else {
    sim.mode = "idle"; sim.act = null; sim.idleUntil = sim.t + 1;          // she was walking: she'll decide again
  }
  sim.route = [[x, FLOOR_Y[storey] ?? FLOOR_Y[1]]]; sim.s = 0; sim.target = 0; sim.crossing = [];
  sim.place = OUT[m.place] ? m.place : "home";
  if (sim.place !== "home") {                     // out in front: back on the sidewalk where she was
    const O = OUT[sim.place], ox = Math.max(O.walk[0], Math.min(O.walk[1], Array.isArray(m.at) ? m.at[0] : O.doorX));
    sim.route = [[ox, O.feet]];
    if (sim.mode !== "down") { sim.mode = "idle"; sim.act = null; sim.idleUntil = sim.t + 1; }
    arriveAt(sim.place);
  }
  moods.clear();
  for (const [id, until, t] of sv.moods || []) if (ML[id]) moods.set(id, { until, t });
  Object.assign(lifeFlags, sv.flags || {});
  Object.assign(eventLast, sv.events || {});
  lastFestivalDay = sv.lastFestivalDay || 0;
  namedAs = sv.namedAs || look.name;
  Object.assign(lamps, sv.house?.lamps || {});
  Object.assign(windowState, sv.house?.windows || {});
  if (sv.weather) {
    weather.plan = new Map(sv.weather.plan || []);
    weather.snowCover = sv.weather.snowCover || 0;
    weather.season = sv.weather.season ?? seasonOf(sim.t).i;
  }
  logEl.innerHTML = "";
  for (const e of sv.diary || []) {
    const li = document.createElement("li");
    if (e[0] === "day") { li.className = "day"; li.textContent = e[1]; }
    else { li.innerHTML = "<time></time><span></span>"; li.firstChild.textContent = e[1]; li.lastChild.textContent = e[2]; if (Array.isArray(e[3])) li._talk = e[3]; }
    logEl.appendChild(li);
  }
  syncDiary();
}
async function saveGame() {
  if (!booted || saving) return false;
  saving = true;
  try {
    await store.save(snapshot());
    // the 造型室 page (prototype/creator) shares her look through these two keys
    if (!TAURI) try { localStorage.setItem("buddy-look-v2", JSON.stringify(look)); localStorage.setItem("buddy-look-at", String(Date.now())); } catch (e) { /* full */ }
    return true;
  }
  catch (e) { console.warn("save failed", e); return false; }
  finally { saving = false; }
}
// 自动保存 on: every 5 minutes, and when the window is hidden or closed.
// Off: only the 保存 button saves.
const autoSave = () => (prefs.autosave ? saveGame() : Promise.resolve(false));
setInterval(autoSave, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.hidden) autoSave(); });
window.addEventListener("pagehide", () => { if (!TAURI && booted && prefs.autosave) try { localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot())); } catch (e) { /* full */ } });
async function exportSave() {
  const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
  const filename = `${look.name}-存档-${stamp}.json`, text = JSON.stringify(snapshot(), null, 1);
  if (TAURI) {                                    // the desktop app: a save dialog, the copy goes where you pick
    const at = await TAURI.core.invoke("export_save", { name: filename, data: text }).catch(() => undefined);
    if (at) flashLabel("存档", "已导出"); else if (at === undefined) flashLabel("存档", "没导出");
    return;
  }
  // on claude.ai the page may only hand over files through the viewer's own save prompt
  const downloads = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (downloads) {
    try { await downloads.save({ filename, data: text }); flashLabel("存档", "已导出"); }
    catch (e) { if (!e || e.code !== "declined") flashLabel("存档", "没导出"); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
document.getElementById("importSave").addEventListener("change", async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  let sv = null;
  try { sv = migrate(JSON.parse(await f.text())); } catch (err) { sv = null; }
  if (!sv) { flashLabel("存档", "读不出来"); return; }
  booted = false;                                   // nothing may save over it before the reload
  await store.save(sv);
  location.reload();
});
async function resetSave() {
  booted = false;
  await store.save(null);
  if (!TAURI) try { localStorage.removeItem("buddy-look-v2"); localStorage.removeItem("buddy-look-at"); } catch (e) { /* ignore */ }
  location.reload();
}

// ---------- the desktop window: sized to the game, tray menu events
let lastWin = "", lastTop = null, lastLeft = null, lifted = 0, shifted = 0;
function fitWindow() {
  if (!TAURI) return;
  const w = document.getElementById("widget"), desk = document.querySelector(".desk"), cs = getComputedStyle(desk);
  // the game, plus the settings menu while it is open (it may reach past the house)
  const r = w.getBoundingClientRect();
  let right = r.right, bottom = r.bottom;
  if (!setPop.hidden) { const p = setPop.getBoundingClientRect(); right = Math.max(right, p.right + 8); bottom = Math.max(bottom, p.bottom + 8); }
  if (!guideEl.hidden) right = Math.max(right, guideEl.getBoundingClientRect().right + 3 * 4 + 8);   // the guide may be wider than a small house
  const width = Math.ceil(right - r.left + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight));
  const height = Math.ceil(bottom - r.top + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom));
  // room made above the house (makeRoom) moves it down in the window: move
  // the window up as much, so it stays put on screen; give back only what
  // the window really moved (it stops at the top of the screen)
  // (and the same leftward for the pick-a-thing panel)
  const mr = moodrow.getBoundingClientRect(), top = mr.top, left = mr.left;
  let dy = lastTop === null ? 0 : top - lastTop, dx = lastLeft === null ? 0 : left - lastLeft;
  lastTop = top; lastLeft = left;
  if (dy < 0) dy = -Math.min(-dy, lifted);
  if (dx < 0) dx = -Math.min(-dx, shifted);
  if (`${width}x${height}` === lastWin && !dy && !dx) return;
  lastWin = `${width}x${height}`;
  TAURI.core.invoke("fit_window", { width, height, dx, dy })
    .then(m => { const [mx, my] = Array.isArray(m) ? m : [0, +m || 0]; shifted = Math.max(0, shifted + mx); lifted = Math.max(0, lifted + my); })
    .catch(e => TAURI.core.invoke("log_js", { message: `fit_window: ${e}` }));
}
// Moving the window (it has no title bar): press on the time bar, or on the
// house's walls or floor (not on her or a piece of furniture) and move a
// little. The see-through parts of the window let clicks through to the
// desktop (user: the room kept above the house must not get in the way):
// a few times a second the page looks at what is under the mouse and turns
// click-through on over nothing, off over the game.
// what shows nothing: the page, the layout boxes, the room kept above the house
const HOLLOW = "html, body, .desk, .widget, .house-col, .moodrow, .mood-talk, .mood-list, .skybar, .studio-slot, .studio-clip, .settings, .set-pop, .set-row, .set-items, .set-labels, .diary, .ring";
function dragWindow() { TAURI.core.invoke("start_drag").catch(e => TAURI.core.invoke("log_js", { message: `start_drag: ${e}` })); }
if (TAURI) {
  const desk = document.querySelector(".desk"), widgetEl = document.getElementById("widget");
  document.addEventListener("mousedown", e => { if (e.button === 0 && (e.target === skyHit || e.target.matches(HOLLOW))) { e.preventDefault(); dragWindow(); } });
  let through = false, held = false;
  document.addEventListener("pointerdown", () => { held = true; }, true);
  window.addEventListener("pointerup", () => { held = false; }, true);
  setInterval(async () => {
    if (held) return;                                   // never in the middle of a press or a drag
    const p = await TAURI.core.invoke("cursor_in_window").catch(() => null);
    if (!p) return;
    const el = document.elementFromPoint(p[0], p[1]);
    moodHover(p[0], p[1]);                              // click-through hides the mouse from the page
    const hollow = (!el || el.matches(HOLLOW)) && !(listOpen && inMoodZone(p[0], p[1]));
    if (hollow !== through) { through = hollow; TAURI.core.invoke("set_click_through", { on: hollow }).catch(() => {}); }
  }, 70);
  let press = null;
  view.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.pointerType !== "mouse" || sim.mode === "down") return;
    const [x, y] = canvasXY(e);
    press = !buddyHit(x, y) && !clickableAt(x, y) ? { x: e.clientX, y: e.clientY } : null;
  });
  view.addEventListener("pointermove", e => {
    if (press && (e.buttons & 1) && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 3) { press = null; dragWindow(); }
  });
  window.addEventListener("pointerup", () => { press = null; });
}
if (TAURI) {
  const ro = new ResizeObserver(fitWindow);
  ro.observe(document.getElementById("widget")); ro.observe(setPop);
  TAURI.event.listen("app-quit", async () => { await autoSave(); TAURI.core.invoke("exit_app"); });
  TAURI.event.listen("on-top-changed", e => { prefs.onTop = !!e.payload; saveSettings(); buildSettings(); });
}

// ================================================================ updates (desktop app)
// Every CI build is a GitHub release (user: no more sending the .exe
// around). A while after start, and every 6 hours, the app asks GitHub for a
// newer one. With 自动更新 (设置 → 更新, on by default) it downloads it
// quietly and, once nothing is open and you've left it alone for a bit,
// saves, swaps itself and restarts where the window was (user: seamless);
// then says which version it is now. With 只提醒, a bar above the diary box
// offers 更新 / 以后. 检查更新 (settings, tray) asks right away and, if
// there's one, updates at once.
const updEl = document.getElementById("update"), updText = updEl.querySelector("span");
let upd = { state: "idle", version: null, shown: false }, updLater = false, lastInput = Date.now();
for (const ev of ["pointerdown", "keydown", "wheel"]) document.addEventListener(ev, () => { lastInput = Date.now(); }, true);
// above the diary box, flush with the house's right edge (user: off the house)
function placeUpdate() {
  const box = updEl.parentElement.getBoundingClientRect(), d = diaryBox.getBoundingClientRect();
  updEl.style.top = Math.round(d.top - box.top - updEl.offsetHeight - 14) + "px";
  updEl.style.right = updEl.parentElement.clientWidth - view.offsetLeft - view.offsetWidth + "px";
}
function showUpdate(text, { go = null, later = true } = {}) {
  updText.textContent = text; updEl.title = "";
  updEl.querySelector(".up-go").hidden = !go;
  updEl.querySelector(".up-go").textContent = go || "";
  updEl.querySelector(".up-later").hidden = !later;
  if (updEl.hidden) { updEl.hidden = false; void updEl.offsetWidth; }
  placeUpdate();                                        // (it needs its own height first)
  updEl.classList.add("on");
}
function hideUpdate(after = 0) { setTimeout(() => { updEl.classList.remove("on"); setTimeout(() => { if (!updEl.classList.contains("on")) updEl.hidden = true; }, 300); }, after); }
// asked: from 检查更新 (says what it finds, and updates right away)
async function checkUpdate(asked = false) {
  if (!TAURI) return;
  if (upd.state === "ready") { if (asked) applyUpdate(); return; }
  if (upd.state !== "idle" && upd.state !== "offered") return;   // already on it
  if (!asked && updLater) return;
  if (asked) showUpdate("正在检查更新……", { later: false });
  let u = null;
  try { u = await TAURI.core.invoke("check_update"); }
  catch (e) { if (asked) { showUpdate("没连上 GitHub，稍后再试"); hideUpdate(4000); } return; }
  if (!u) { if (asked) { showUpdate("已经是最新版啦"); hideUpdate(3000); } return; }
  upd.version = u.version;
  if (asked) downloadUpdate(true);
  else if (prefs.autoUpdate) downloadUpdate(false);          // quietly, in the background
  else { upd.state = "offered"; showUpdate(`有新版本 ${u.version}`, { go: "更新" }); }
}
// shown: progress on the bar (asked for); quietly otherwise
async function downloadUpdate(shown) {
  upd.state = "downloading"; upd.shown = shown;
  if (shown) showUpdate("下载中……", { later: false });
  let v = null;
  try { v = await TAURI.core.invoke("download_update"); }
  catch (e) {
    upd.state = "idle"; updEl.style.removeProperty("--p");
    TAURI.core.invoke("log_js", { message: `update: ${e}` });
    if (shown) updFailed(e);
    return;
  }
  if (!v) { upd.state = "idle"; if (shown) hideUpdate(); return; }
  upd.state = "ready"; upd.version = v;
  if (shown) applyUpdate(); else waitForQuiet();
}
// a moment when the restart can't get in the way: nothing open, no clicks for 20 s
const busyNow = () => !!(card || pickOn || wardrobeOpen || guideOn || ringOf || diaryOn || listOpen
  || setGear.getAttribute("aria-expanded") === "true" || wiping || sim.mode === "down");
function waitForQuiet() {
  if (upd.state !== "ready") return;
  if (busyNow() || Date.now() - lastInput < 20000) { setTimeout(waitForQuiet, 5000); return; }
  applyUpdate();
}
async function applyUpdate() {
  if (upd.state !== "ready") return;
  upd.state = "applying";
  showUpdate(`更新到 ${upd.version}，马上回来……`, { later: false });
  await saveGame();                                     // always, even with 自动保存 off: it must come back as it was
  try { localStorage.setItem("buddy-updated", upd.version); } catch (e) { /* only for the note after */ }
  await new Promise(r => setTimeout(r, 1200));
  try { await TAURI.core.invoke("apply_update"); }      // swaps the exe and restarts (or runs the installer)
  catch (e) { upd.state = "ready"; updFailed(e); TAURI.core.invoke("log_js", { message: `apply: ${e}` }); }
}
// say why (user: it kept failing with no reason); the whole message on hover
function updFailed(e) {
  const msg = String(e || "").replace(/^Error:\s*/, "");
  const head = /^[\u4e00-\u9fff]/.test(msg) ? msg : msg ? `更新失败：${msg}` : "更新失败了";   // the app's own reasons start in Chinese
  showUpdate(head.length > 18 ? head.slice(0, 18) + "…" : head, { go: "重试" });
  updEl.title = msg ? `${msg}\n（详细记录在 update.log）` : "";
}
updEl.querySelector(".up-go").addEventListener("click", () => { if (upd.state === "ready") applyUpdate(); else { updLater = false; checkUpdate(true); } });
updEl.querySelector(".up-later").addEventListener("click", () => { updLater = true; if (upd.state === "offered") upd.state = "idle"; hideUpdate(); });
if (TAURI) {
  TAURI.event.listen("check-update", () => { updLater = false; checkUpdate(true); });
  TAURI.event.listen("update-progress", e => {
    const { done, total, source } = e.payload || {};
    if (!upd.shown) return;
    if (source && !/^https:\/\/github\.com\//.test(source)) { updText.textContent = "换个线路下载……"; updEl.style.setProperty("--p", "0%"); return; }
    if (!total) return;
    const p = Math.min(100, Math.round(done / total * 100));
    updEl.style.setProperty("--p", p + "%");
    updText.textContent = `下载中 ${p}%`;
  });
  TAURI.core.invoke("app_version").then(v => { appVersion = v || ""; }).catch(() => {});
  // just updated: say so
  let was = null;
  try { was = localStorage.getItem("buddy-updated"); localStorage.removeItem("buddy-updated"); } catch (e) { /* none */ }
  if (was) setTimeout(() => { showUpdate(`已更新到 ${was}`, { later: false }); hideUpdate(4000); }, 1500);
  setTimeout(checkUpdate, 8000);
  setInterval(checkUpdate, 6 * 3600 * 1000);
}

// ================================================================ loop
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  realClock += dt;
  const fast = sim.mode === "act" && sim.act === "sleep" ? 8 : 1, run = cardHolds() || wiping ? 0 : speed;   // a chance card (or a scene change) stops the clock
  step(dt * run * fast, dt * (run ? 1 : 0));
  updateDoors(run ? dt : 0);
  render();
  renderSky();
  renderMood();
  placeRing();
  placeNametag();
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; syncUI(); updateMood(); }
  requestAnimationFrame(frame);
}

document.getElementById("testDown").addEventListener("click", () => { if (sim.mode !== "down") collapse(pick(EXTREME)); });

(async function boot() {
  let sv = null, st = null;
  try { sv = migrate(await store.load()); } catch (e) { sv = null; }
  try { st = await settingsStore.load(); } catch (e) { st = null; }
  if (sv) restore(sv);
  applySettings(st);
  await refreshSaveDir();
  // her look may have been changed on the 造型室 page since (browser only)
  let shared = null, sharedAt = 0;
  if (!TAURI) try { shared = JSON.parse(localStorage.getItem("buddy-look-v2") || "null"); sharedAt = +localStorage.getItem("buddy-look-at") || 0; } catch (e) { /* storage unavailable */ }
  if (!sv) setLook(shared && typeof shared === "object" ? shared : doll.PRESETS.f);
  else if (shared && typeof shared === "object" && sharedAt > sv.savedAt) setLook({ ...shared, name: shared.name || look.name });
  namedAs = namedAs || nameOf();
  studio = BuddyStudio(studioEl, doll, D.doll, { look, previewScale: 3, thumbH: 40, onChange: changeLook, onClose: closeWardrobe });
  fit();
  if (TAURI && !st && !sv) {      // first run of the desktop app: the biggest size that leaves most of the screen free
    const w = document.getElementById("widget"), k = prefs.scale / 100;
    const need = (w.offsetWidth + 80) / k, needH = (w.offsetHeight + 112) / k;
    prefs.scale = [...SCALES].reverse().find(v => need * v / 100 <= screen.availWidth * 0.6 && needH * v / 100 <= screen.availHeight * 0.6) || SCALES[0];
    fit();
  }
  window.addEventListener("resize", fit);
  await loadAssets();
  await loadSkyIcons();
  await loadMoodIcons();
  await loadWeatherMasks();
  weather.kind = weatherAt(sim.t);
  if (!sv) {
    log("—— 第 1 天 · 春 ——", "day");
    log(`${nameOf()}还在被窝里睡觉。`);
  } else {
    log(`—— 回来啦 · 第 ${Math.floor(sim.t / 1440) + 1} 天 ——`, "day");
  }
  if (TAURI) TAURI.core.invoke("set_on_top", { on: prefs.onTop }).catch(() => {});
  booted = true;
  updateMood();
  syncUI();
  render();
  requestAnimationFrame(frame);
  if (!st) saveSettings();
  if (!sv) autoSave();
  if (!prefs.guided) setTimeout(openGuide, 1200);   // first time: the guide opens by itself
})();
</script>

<title>Buddy 小屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: the page is just the house, centred like a widget on a desktop.
   Everything else hides until asked for: the needs are four dots beside the
   house that stretch into bars when the pointer comes near. */
:root {
  --bg: #e6e3ee;
  --dither: #dcd8e6;
  --panel: #f7f6fb;
  --panel-2: #eceaf2;
  --ink: #22182a;
  --muted: #5e5b71;
  --edge: #22182a;
  --bevel-hi: #ffffff;
  --bevel-lo: #bab7c9;
  --shadow: #8f8ba2;
  --accent: #46619e;
  --accent-hi: #6c90c8;
  --accent-lo: #2f3c6d;
  --accent-ink: #f7f6fb;
  --accent-soft: #cfdcf2;
  --focus: #d29b30;
  /* needs: track ring + three states (from the sketch) */
  --ring: #ffffff;
  --need-ok: #b2d683;
  --need-warn: #f5b675;
  --need-low: #e87272;
  --need-label: rgba(34, 24, 42, 0.62);
  --u: 2px;              /* one UI pixel = one house pixel on screen (set by fit) */
  --font: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131f; --dither: #1d1828; --panel: #2b2538; --panel-2: #332c42; --ink: #f7f6fb; --muted: #bab7c9;
    --edge: #0d0a12; --bevel-hi: #433a54; --bevel-lo: #1f1a2a; --shadow: #0d0a12;
    --accent: #6c90c8; --accent-hi: #a6c5e7; --accent-lo: #2f3c6d; --accent-ink: #141228; --accent-soft: #34446a; --focus: #efc452;
    --ring: #f4f1f8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131f; --dither: #1d1828; --panel: #2b2538; --panel-2: #332c42; --ink: #f7f6fb; --muted: #bab7c9;
  --edge: #0d0a12; --bevel-hi: #433a54; --bevel-lo: #1f1a2a; --shadow: #0d0a12;
  --accent: #6c90c8; --accent-hi: #a6c5e7; --accent-lo: #2f3c6d; --accent-ink: #141228; --accent-soft: #34446a; --focus: #efc452;
  --ring: #f4f1f8; color-scheme: dark;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; }
body {
  background-color: var(--bg);
  background-image: repeating-conic-gradient(var(--dither) 0 25%, transparent 0 50%);
  background-size: 6px 6px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  display: grid;
  grid-template-rows: 1fr auto;
  grid-template-columns: minmax(0, 1fr);
}
.desk {
  display: grid;
  place-items: center;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.widget { position: relative; }
#view { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }

/* ---------- needs: dots that stretch into bars ----------
   Sizes come from JS (fit): --u is one house pixel on screen, --bh the dot /
   bar height, --bar-w the open length; the column is exactly as tall as the
   house and sits just left of it. Bars only ever grow to the left. */
.widget { display: flex; align-items: flex-end; gap: var(--g, 12px); padding-left: calc(var(--bar-w, 200px) - var(--bh, 24px)); }
.needs {
  position: relative;
  flex: none;
  height: var(--house-h, 236px);   /* flush with the house, not with the studio above it */
  width: var(--bh, 24px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;  /* first dot flush with the top, last with the bottom */
  align-items: flex-end;           /* right-anchored: bars grow to the left */
  outline: none;
}
.needs::before {                   /* invisible hover zone around the dots */
  content: ""; position: absolute; inset: -14px -10px -14px -14px;
}
.needs.open::before { left: calc(var(--bh, 24px) - var(--bar-w, 200px) - 14px); }
.need {
  position: relative;
  flex: none;
  width: var(--bh, 24px);          /* JS springs this between the dot and the open bar */
  height: var(--bh, 24px);
  background: var(--ring);
  clip-path: var(--clip-track);
}
.need .fill {
  position: absolute;
  /* 2px white ring; once open (--p springs 0 -> 1) the fill starts right of
     the icon slot, so the icon never hides the fill's start or its maximum */
  --room: calc(100% - var(--u) * 4 - var(--slot, 30px) * var(--p, 0));
  top: calc(var(--u) * 2); bottom: calc(var(--u) * 2);
  left: calc(var(--u) * 2 + var(--slot, 30px) * var(--p, 0));
  width: min(var(--room), var(--fmin) + (var(--room) - var(--fmin)) * var(--v, 1) * var(--p, 0));
  background-color: var(--c, var(--need-ok));
  background-image: var(--stripes);
  background-size: calc(var(--u) * 8) calc(var(--u) * 8);
  image-rendering: pixelated;
  clip-path: var(--clip-fill);
  animation: crawl 3.2s steps(8) infinite;
  transition: background-color .3s;
}
.need .fill::before {              /* a 1px gloss line along the top */
  content: ""; position: absolute; top: var(--u); left: calc(var(--u) * 2); right: calc(var(--u) * 2);
  height: var(--u); background: rgba(255, 255, 255, .38);
}
.need.low .fill { animation: crawl 3.2s steps(8) infinite, pulse 1.4s ease-in-out infinite; }
@keyframes crawl { from { background-position: 0 0; } to { background-position: calc(var(--u) * -8) 0; } }
@keyframes pulse { 50% { filter: brightness(1.18) saturate(1.1); } }
.need img {
  position: absolute;
  left: calc(var(--u) * 3);
  top: 50%;
  width: var(--icon, 24px);
  height: var(--icon, 24px);
  transform: translateY(-50%) scale(.2);
  image-rendering: pixelated;
  opacity: 0;
  pointer-events: none;
}
.needs.open .need img {
  animation: pop .5s cubic-bezier(.3, 1.9, .5, 1) both;
  animation-delay: calc(var(--i, 0) * 55ms + 200ms);
}
@keyframes pop {
  from { opacity: 0; transform: translateY(-50%) scale(.2) rotate(-12deg); }
  to   { opacity: 1; transform: translateY(-50%) scale(1) rotate(0); }
}
.needs:focus-visible::after {
  content: ""; position: absolute; inset: -6px; border: 2px dashed var(--focus); pointer-events: none;
}

/* ---------- 造型室: opens above the house (never over it), as wide as the house ----------
   The slot grows from 0 to the studio's height, pushing the house down; the
   clip keeps room for the studio's pixel outline and drop shadow. */
.house-col { display: grid; min-width: 0; width: var(--house-w, 684px); }
.studio-slot {
  display: grid;
  width: var(--studio-w, 684px);
  margin-left: calc(-1 * var(--studio-dx, 0px));   /* phones: also spans the needs column (see fit) */
  grid-template-rows: 0fr;
  transition: grid-template-rows .42s cubic-bezier(.3, 1.2, .5, 1), margin-bottom .42s cubic-bezier(.3, 1.2, .5, 1);
  margin-bottom: 0;
}
.studio-slot.open { grid-template-rows: 1fr; margin-bottom: calc(var(--u) * 7); }
.studio-clip {
  min-height: 0; overflow: hidden;
  padding: var(--u) calc(var(--u) * 3) calc(var(--u) * 3) var(--u);
  margin: calc(-1 * var(--u)) calc(-3 * var(--u)) calc(-3 * var(--u)) calc(-1 * var(--u));
}
#studio { --sp: var(--u); width: var(--studio-w, 684px); }

/* ---------- sky bar: one day from 06:00 (left) to 06:00 (right) above the house,
   exactly as wide as it. The icon walks along it with the clock and turns
   into the moon at dusk, or a rain cloud / snowflake when the weather turns.
   Drawn in a canvas at one UI pixel per bar unit (set by fit). */
.skybar { position: relative; z-index: 2; width: var(--house-w, 684px); height: var(--sky-h, 48px); margin-bottom: var(--sky-gap, 12px); pointer-events: none; }
#sky { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
/* the bar hangs over the house's top edge; only the part above the house takes the pointer (tooltip) */
.sky-hit { position: absolute; left: 0; right: 0; top: 0; bottom: var(--sky-over, 0px); pointer-events: auto; }
.sky-tip {
  position: absolute; bottom: calc(100% + 6px); left: 0; transform: translateX(-50%);
  white-space: nowrap; pointer-events: none; z-index: 3;
  background: var(--panel); color: var(--ink); font-size: 12px; font-weight: 500; letter-spacing: .04em;
  padding: 2px 10px;
  box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge), 3px 3px 0 0 var(--shadow);
}
.sky-tip[hidden] { display: none; }

/* ---------- mood: an emoji in a round frame at the top-left of the sky bar;
   to its right Buddy's own thoughts / words in a light-wood bubble with a
   tail pointing at her face, running to the house's right edge. It pops in
   and fades out; it never covers the house. */
.moodrow {
  position: relative; z-index: 3; width: var(--studio-w, 684px); margin-left: calc(-1 * var(--studio-dx, 0px));
  display: flex; align-items: center; gap: calc(var(--sky-b, 3px) * 4);
  height: var(--mood-h, 72px); margin-bottom: calc(var(--sky-b, 3px) * 1);
}
.mood-face { position: relative; flex: none; width: var(--mood-d, 78px); height: var(--mood-d, 78px); cursor: pointer; outline: none; }
.mood-face canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.mood-face:focus-visible::after { content: ""; position: absolute; inset: -4px; border: 2px dashed var(--focus); }
.mood-talk {
  flex: 1 1 auto; min-width: 0; height: 100%;
  display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 5px;
  padding-right: 2px;   /* the bubble's 2px outline ends exactly at the house's right edge */
}
.pop {
  --pe: var(--edge);
  position: relative; max-width: 100%; display: flex; align-items: baseline; gap: 8px;
  font-size: var(--say-fs, 32px); line-height: 1.35; padding: 6px 16px; color: var(--ink);
  box-shadow: 0 -2px 0 0 var(--pe), 0 2px 0 0 var(--pe), -2px 0 0 0 var(--pe), 2px 0 0 0 var(--pe), 3px 3px 0 0 var(--shadow);
  transform-origin: left center;
  animation: popin .42s cubic-bezier(.3, 1.6, .5, 1) both;
  transition: opacity .35s, transform .35s;
}
.pop span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop.out { opacity: 0; transform: translateY(-3px); }
.pop[hidden] { display: none; }
.pop.say { --pe: #8a6446; background: #ecd5ad; color: #3d2a1e; margin-left: 14px; }
.pop.say::before, .pop.say::after {           /* pixel tail pointing left at the face */
  content: ""; position: absolute; top: 50%; transform: translateY(-50%);
  clip-path: polygon(100% 0, 100% 100%, 0 50%);
}
.pop.say::before { left: -20px; width: 20px; height: 28px; background: #8a6446; }
.pop.say::after { left: -15px; width: 16px; height: 20px; background: #ecd5ad; }
@keyframes popin { from { opacity: 0; transform: scale(.5) translateX(-10px); } to { opacity: 1; transform: none; } }
.mood-tip {
  position: absolute; left: 0; top: calc(100% + 6px); z-index: 6; min-width: 230px; max-width: 320px;
  background: var(--panel); color: var(--ink); font-size: 12px; line-height: 1.5; padding: 8px 10px 9px;
  box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge), 4px 4px 0 0 var(--shadow);
  cursor: default;
}
.mood-tip[hidden] { display: none; }
.mood-tip .mt-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.mood-tip .mt-name { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.mood-tip .mt-name i { width: 10px; height: 10px; display: block; background: var(--c); box-shadow: 0 0 0 1px var(--edge); }
.mood-tip .mt-level { color: var(--muted); }
.mood-tip ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.mood-tip li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.mood-tip li i { width: 8px; height: 8px; display: block; background: var(--c); box-shadow: 0 0 0 1px var(--edge); }
.mood-tip li b { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.mood-tip li small { grid-column: 2 / 4; color: var(--muted); font-size: 11px; margin-top: -2px; }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; transition: none; } }
@media (prefers-reduced-motion: reduce) { .studio-slot { transition: none; } }
/* ---------- ring menu: pixel buttons that pop out around Buddy (or the computer) ---------- */
.house-col { position: relative; }
.ring { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 8; }
.ring[hidden] { display: none; }
.ring button {
  position: absolute; left: 0; top: 0; margin: 0; white-space: nowrap;
  font-size: var(--ring-fs, 14px); font-weight: 700; letter-spacing: .04em; padding: 5px 12px;
  transform: translate(-50%, -50%) scale(.2); opacity: 0;
  transition: transform .34s cubic-bezier(.3, 1.7, .5, 1), opacity .18s;
  transition-delay: calc(var(--k, 0) * 35ms);
  box-shadow:
    inset 0 calc(-1 * var(--u)) 0 0 var(--bevel-lo), inset 0 var(--u) 0 0 var(--bevel-hi),
    0 calc(-1 * var(--u)) 0 0 var(--edge), 0 var(--u) 0 0 var(--edge),
    calc(-1 * var(--u)) 0 0 0 var(--edge), var(--u) 0 0 0 var(--edge), calc(var(--u) * 2) calc(var(--u) * 2) 0 0 var(--shadow);
}
.ring.on button { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))); opacity: 1; }
.ring button.more::after { content: " ▸"; }
.ring button.back { background: var(--panel); color: var(--muted); }
.ring button:active { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y) + var(--u))); }
.ring .hint {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
  background: var(--title, #33253b); color: #f7f6fb; font-size: var(--ring-fs, 14px); padding: 4px 10px;
}
@media (prefers-reduced-motion: reduce) { .ring button { transition: none; } }
/*__SHARED_STUDIO_CSS__*/

/* ---------- temporary console (time, suggestions, look, diary) ---------- */
.console {
  justify-self: center;
  width: min(100%, 980px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 20px;
  color: var(--muted);
  font-size: 13px;
}
.console summary { cursor: pointer; letter-spacing: .04em; }
.console[open] summary { margin-bottom: 12px; }
.console .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; color: var(--ink); }
@media (max-width: 760px) { .console .grid { grid-template-columns: minmax(0, 1fr); } }
.console .box { display: grid; gap: 8px; align-content: start; min-width: 0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
button {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--panel-2);
  border: 0; padding: 4px 10px; margin: var(--u); cursor: pointer;
  box-shadow:
    inset 0 calc(-1 * var(--u)) 0 0 var(--bevel-lo), inset 0 var(--u) 0 0 var(--bevel-hi),
    0 calc(-1 * var(--u)) 0 0 var(--edge), 0 var(--u) 0 0 var(--edge),
    calc(-1 * var(--u)) 0 0 0 var(--edge), var(--u) 0 0 0 var(--edge);
}
button:hover { background: var(--panel); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, summary:focus-visible { outline: var(--u) dashed var(--focus); outline-offset: calc(var(--u) * 2); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 200px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 8px; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.log li.day { grid-template-columns: 1fr; color: var(--muted); font-size: 12px; letter-spacing: .1em; }
@media (prefers-reduced-motion: reduce) {
  .need .fill, .need.low .fill { animation: none; transition: none; }
  .needs.open .need img { animation: none; opacity: 1; transform: translateY(-50%); }
}
</style>

<main class="desk">
  <div class="widget" id="widget">
    <div class="needs" id="needs" tabindex="0" role="button" aria-expanded="false" aria-label="她的状态（饱腹、精力、清洁、如厕、社交、开心）">
      <div class="need" style="--i:0" data-k="hunger" role="meter" aria-label="饱腹" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="hunger"></div>
      <div class="need" style="--i:1" data-k="energy" role="meter" aria-label="精力" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="energy"></div>
      <div class="need" style="--i:2" data-k="hygiene" role="meter" aria-label="清洁" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="hygiene"></div>
      <div class="need" style="--i:3" data-k="bladder" role="meter" aria-label="如厕" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="bladder"></div>
      <div class="need" style="--i:4" data-k="social" role="meter" aria-label="社交" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="social"></div>
      <div class="need" style="--i:5" data-k="fun" role="meter" aria-label="开心" aria-valuemin="0" aria-valuemax="100"><span class="fill"></span><img alt="" data-icon="fun"></div>
    </div>
    <div class="house-col">
      <div class="studio-slot" id="studioSlot"><div class="studio-clip"><section id="studio" hidden></section></div></div>
      <div class="moodrow" id="moodrow">
        <div class="mood-face" id="moodFace" tabindex="0" role="button" aria-label="情绪" aria-expanded="false">
          <canvas id="mood" width="78" height="78"></canvas>
          <div class="mood-tip" id="moodTip" hidden></div>
        </div>
        <div class="mood-talk" aria-live="polite">
          <div class="pop say" id="popSay" hidden><span></span></div>
        </div>
      </div>
      <div class="skybar" id="skybar" role="img" aria-label="时间与天气">
        <canvas id="sky" width="684" height="48"></canvas>
        <div class="sky-hit" id="skyHit"></div>
        <div class="sky-tip" id="skyTip" hidden></div>
      </div>
      <canvas id="view" width="342" height="118" aria-label="小屋剖面，小人在里面生活。点家具让她去做事，点衣柜打开造型室，点她弹出互动菜单。"></canvas>
      <div class="ring" id="ring" role="menu" aria-label="和她互动" hidden></div>
    </div>
  </div>
</main>

<details class="console">
  <summary>临时控制台：时间 · 日记（之后也会改成隐藏式）</summary>
  <div class="grid">
    <div class="box">
      <div class="clock" id="clock">第 1 天 · 07:00</div>
      <div id="doing">正在：睡觉<small id="ff"></small></div>
      <div class="label">时间速度</div>
      <div class="row" role="group" aria-label="时间速度">
        <button type="button" data-speed="0" aria-pressed="false">暂停</button>
        <button type="button" data-speed="1" aria-pressed="false">×1</button>
        <button type="button" data-speed="3" aria-pressed="true">×3</button>
        <button type="button" data-speed="10" aria-pressed="false">×10</button>
      </div>
      <div class="label">情绪（测试用）</div>
      <div class="row">
        <select id="moodPick" aria-label="加一条测试心情"><option value="">加一条测试心情……</option></select>
        <button type="button" id="testDown">晕倒测试</button>
      </div>
      <div class="label">天气（测试用）</div>
      <div class="row" role="group" aria-label="天气">
        <button type="button" data-weather="" aria-pressed="true">自动</button>
        <button type="button" data-weather="clear" aria-pressed="false">晴</button>
        <button type="button" data-weather="rain" aria-pressed="false">下雨</button>
        <button type="button" data-weather="snow" aria-pressed="false">下雪</button>
        <button type="button" id="nextSeason">跳到下个季节</button>
      </div>
      <p class="note">点家具让她去做事：床、衣柜（打开造型室）、浴缸、马桶、洗手台、毛巾、书架、电脑（会弹出菜单）、沙发、电视、灶台、餐桌、冰箱、绿植；台灯和窗户可以开关。点她本人弹出互动菜单；她晕倒时长按她 5 秒。</p>
    </div>
    <div class="box" style="grid-column: span 2">
      <div class="label">日记</div>
      <ul class="log" id="log"></ul>
    </div>
  </div>
</details>

<script>
const DATA = /*__DEMO_DATA__*/null;
const D = DATA;

/*__SHARED_DOLL_JS__*/
/*__SHARED_STUDIO_JS__*/

// ================================================================ Buddy's look
const doll = BuddyDoll(D.doll);
let look = doll.normalize(doll.PRESETS.f);
let ramps = doll.rampsOf(look);
function setLook(l) {
  look = doll.normalize(l);

}

const DW = doll.W, DH = doll.H;
const dollCache = new Map(), rotCache = new Map();
function rowsOf(buf, w, r) { return buf.slice(r * w * 4, (r + 1) * w * 4); }
function applyPose(buf, pose) {
  const W4 = DW * 4, P = D.doll.pose[look.bottomStyle];
  if (pose === "walkL" || pose === "walkR") {   // lift one foot by a pixel
    const out = buf.slice();
    const c0 = pose === "walkL" ? 0 : DW / 2, c1 = c0 + DW / 2;
    for (let r = P.legStart; r < DH; r++) {
      for (let c = c0; c < c1; c++) {
        const src = (r * DW + c) * 4, dst = ((r - 1) * DW + c) * 4;
        for (let k = 0; k < 4; k++) out[dst + k] = buf[src + k];
        if (r === DH - 1) for (let k = 0; k < 4; k++) out[src + k] = 0;
      }
    }
    return out;
  }
  if (pose === "sit") {                         // drop the thighs: head sinks, knees forward
    const keep = [];
    for (let r = 0; r < DH; r++) if (!P.sitDrop.includes(r)) keep.push(r);
    const out = new Uint8ClampedArray(buf.length);
    const off = DH - keep.length;
    keep.forEach((r, i) => out.set(rowsOf(buf, DW, r), (i + off) * W4));
    return out;
  }
  return buf;
}
function dollCanvas(f, pose = "stand", cropRows = DH) {
  const key = JSON.stringify([f.expr, f.look, f.bob, f.sway, f.wave ?? null, pose, cropRows]);
  if (dollCache.has(key)) return dollCache.get(key);
  const c = doll.toCanvas(applyPose(doll.pixels(look, f, ramps), pose), DW, DH, cropRows);
  dollCache.set(key, c);
  return c;
}
function backCanvas(f, pose = "stand") {   // seen from behind, climbing the stairs
  const key = JSON.stringify(["back", f.bob, f.sway, pose]);
  if (dollCache.has(key)) return dollCache.get(key);

  dollCache.set(key, c);
  return c;
}

// ================================================================ walking
// The floors are flat; the only way between them is the flight in the
// stairwell, which runs straight back into the screen: Buddy climbs it with
// her back to us and comes down facing us. Each trip is its own short
// polyline (along the floor, up or down the stairs, along again) and her
// position is the distance sim.s walked along it.
const FLOOR_Y = D.floors, STAIR_X = D.stair.x;
const MID_Y = (FLOOR_Y[0] + FLOOR_Y[1]) / 2;
const storeyOfY = y => (y < MID_Y ? 1 : 0);
function planRoute(fx, fy, tx, ty) {
  if (fy === ty) return [[fx, fy], [tx, ty]];
  return [[fx, fy], [STAIR_X, fy], [STAIR_X, ty], [tx, ty]];
}
function routeLength(r) {
  let L = 0;
  for (let i = 1; i < r.length; i++) L += Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
  return L;
}
function routePos(r, s) {   // -> { x, y, dy }: dy < 0 while climbing, > 0 coming down
  for (let i = 1; i < r.length; i++) {
    const [x0, y0] = r[i - 1], [x1, y1] = r[i], L = Math.hypot(x1 - x0, y1 - y0);
    if (s <= L || i === r.length - 1) {
      const t = L ? Math.max(0, Math.min(1, s / L)) : 1;
      return { x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, dy: t < 1 ? Math.sign(y1 - y0) : 0 };
    }
    s -= L;
  }
  return { x: r[0][0], y: r[0][1], dy: 0 };
}
const here = () => routePos(sim.route, sim.s);
// doors this trip walks through: [door id, x] on the storey it crosses them
function doorsOn(r) {
  const out = [];
  for (let i = 1; i < r.length; i++) {
    const [x0, y0] = r[i - 1], [x1, y1] = r[i];
    if (y0 !== y1) continue;
    for (const d of D.doors) {
      const dx = d.x + 2;
      if (d.storey === storeyOfY(y0) && dx > Math.min(x0, x1) && dx < Math.max(x0, x1)) out.push([d.id, dx]);
    }
  }
  return out;
}
function roomAt(p) {
  if (p.dy) return "stairs";
  const storey = storeyOfY(p.y);
  for (const [k, [st, x0, x1]] of Object.entries(D.roomX)) if (st === storey && p.x >= x0 && p.x < x1) return k;
  return "stairs";
}

    snack: n.hunger < 40 && !meal ? (100 - n.hunger) * 0.6 : 0,

function startAct(name, quiet = false) {
  const a = ACTS[name];
  sim.act = name;
  const p = here();
  // spot null: right where she is (stepping off the stairs first)
  const [st, x] = a.spot ? D.spots[a.spot] : [storeyOfY(p.y), Math.round(p.x)];

}
function arrive() {
  const a = ACTS[sim.act];
  sim.mode = "act";

    const h = hour();
    sim.nap = !(h >= 21 || h < 6);
    if (!sim.nap && lamps.bed_lamp) { lamps.bed_lamp = false; log("关掉台灯，钻进被窝。"); }
  }
  if (sim.act === "dress" && sim.player) openWardrobe();
  sim.actEnd = sim.t + (sim.act === "sleep" ? 900 : a.dur * (0.8 + Math.random() * 0.4));

}
function finishAct() {
  const a = ACTS[sim.act];

  lifeFinish(sim.act);
  if (sim.act === "sleep" && !sim.upAtNight) log(sim.nap ? "睡了个午觉，精神多了。" : "醒了，伸了个大大的懒腰。");

  if (sim.act === "eat") log("吃饱了，好满足～");
  if (sim.act === "bath") log("洗得香喷喷的。");

  sim.mode = "idle";
  sim.act = null;
  sim.idleUntil = sim.t + 2 + Math.random() * 6;

// The player clicked a piece of furniture: drop what she's doing and go.
function command(act) {
  if (sim.mode === "down") { log("她晕倒了，先长按她 5 秒把她叫醒吧。"); return; }
  if (sim.mode === "act" && sim.act === "sleep") {
    const h = hour();
    if (act === "sleep") return;
    if (!sim.nap && (h >= 22 || h < 6)) { log(`她睡得正香，等醒了再去${ACTS[act].label}吧。`); sim.queue = [act]; return; }
    log("你把她从午觉里叫醒了。");
  }
  if (sim.act === act && sim.mode !== "idle") return;
  if (sim.act === "dress" && act !== "dress") closeWardrobe();
  sim.queue = [];
  sim.player = true;
  startAct(act);
}

function step(dtGame, dtReal) {
  sim.t += dtGame;
  const day = Math.floor(sim.t / 1440) + 1;
  if (day !== sim.lastDay) { sim.lastDay = day; log(`—— 第 ${day} 天 · ${SEASONS[seasonOf(sim.t).i].name} ——`, "day"); }
  updateWeather(dtGame);
  // needs
  const n = sim.needs, eff = sim.mode === "act" ? (EFFECT[sim.act] || {}) : {};
  for (const k of Object.keys(n)) {
    let d = -DECAY[k];
    if (sim.act === "sleep" && sim.mode === "act") d *= k === "energy" ? 0 : k === "bladder" ? 0.35 : 0.4;
    if (eff[k] > 0) d = 0;
    n[k] = clamp(n[k] + (d + (eff[k] || 0)) * dtGame);
  }
  if (sim.mode === "act" && sim.act === "sleep" && !sim.nap) sim.sleptTonight += dtGame;
  // couldn't hold it: no harm done, just embarrassing (and a bath)
  if (n.bladder <= 0 && sim.mode !== "down" && sim.act !== "toilet") {
    n.bladder = 100; n.hygiene = Math.max(0, n.hygiene - 40);
    addMood("accident");
    if (!asleep()) { sim.queue = []; startAct("bath"); }
  }
  // behaviour
  if (sim.mode === "down") return;
  if (sim.mode === "walk") {
    const v = 28 * Math.min(speed, 4) * dtReal * (here().dy ? 0.7 : 1);   // a little slower on the stairs
    if (sim.target - sim.s <= v) { sim.s = sim.target; arrive(); }
    else {
      const before = here().x;
      sim.s += v; sim.walkDist += v;
      const dx = here().x - before;
      if (Math.abs(dx) > 0.01) sim.facing = Math.sign(dx);
    }
  } else if (sim.mode === "act") {
    const h = hour();
    const done = sim.act === "sleep"
      ? sim.nap ? n.energy >= 95 || sim.t >= sim.actEnd - 780 : (n.energy >= 99 && h >= 6.5 && h < 12) || (h >= 9 && h < 20)
      : sim.act === "dress" && wardrobeOpen ? false : sim.t >= sim.actEnd;
    // up in the night for the toilet, then back to bed
    if (sim.act === "sleep" && !done && n.bladder < 10) { sim.upAtNight = true; log("半夜起来上了个厕所。"); finishAct(); sim.queue = ["toilet", "sleep"]; return; }
    if (done) finishAct();
  } else if (sim.mode === "idle" && sim.t >= sim.idleUntil) {
    startAct(sim.queue.length ? sim.queue.shift() : choose());
  }
}

// ================================================================ doors
const doorState = Object.fromEntries(D.doors.map(d => [d.id, { angle: 0, side: "r", t: 0 }]));
const ANGLES = [0, 30, 60, 90];
function updateDoors(dtReal) {
  const p = here(), storey = storeyOfY(p.y);
  for (const d of D.doors) {
    const st = doorState[d.id];
    const near = sim.mode === "walk" && !p.dy && d.storey === storey
      && sim.crossing.some(([id, x]) => id === d.id && Math.abs(p.x - x) < 16);
    if (near && st.angle === 0) st.side = sim.facing > 0 ? "r" : "l";
    st.t += dtReal * Math.min(speed, 4);
    if (st.t < 0.06) continue;
    st.t = 0;
    const i = ANGLES.indexOf(st.angle);
    if (near && i < 3) st.angle = ANGLES[i + 1];
    else if (!near && i > 0) st.angle = ANGLES[i - 1];
  }
}
function drawDoors(ctx) {
  for (const d of D.doors) {
    const st = doorState[d.id];
    if (!st.angle) continue;
    ctx.drawImage(IMG.gap[d.id], d.x, d.y);
    const w = { 30: 5, 60: 10, 90: 13 }[st.angle];
    const leaf = IMG.leaf[`${w}${st.side === "r" ? "l" : "r"}`];
    ctx.drawImage(leaf, st.side === "r" ? d.x + 4 : d.x - w, d.y);
  }
}

// ================================================================ lighting
const W = D.W, H = D.H;
const EMISSIVE = new Set(D.emissive.map(h => parseInt(h.slice(1), 16)));
const LIGHT_G = {};
for (const [id, [lx, ly, r, , room]] of Object.entries(D.lights)) {
  const [rx, ry, rw, rh] = D.rooms[room];
  const g = new Float32Array(W * H);

function buildClickables() {

// Pixel-circle outline for a pill n UI pixels tall (caps are half circles).
function pillClip(n, u) {
  const R = n / 2, inset = [];

    const dy = r + 0.5 - R;
    inset.push(Math.max(0, Math.round(R - Math.sqrt(Math.max(0, R * R - dy * dy)))));
  }
  const pts = [];
  for (let r = 0; r < n; r++) pts.push(`calc(100% - ${inset[r] * u}px) ${r * u}px`, `calc(100% - ${inset[r] * u}px) ${(r + 1) * u}px`);
  for (let r = n - 1; r >= 0; r--) pts.push(`${inset[r] * u}px ${(r + 1) * u}px`, `${inset[r] * u}px ${r * u}px`);

function fit() {
  // The widget is [room for the bars][dots][house]; the bars always open to

  const desk = document.querySelector(".desk");
  const cs = getComputedStyle(desk);
  const avail = desk.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const BAR_MIN = 150, BAR_MAX = 300;
  let s = 4;
  while (s > 1 && W * s + 12 + BAR_MIN > avail) s--;
  if (W * s + 12 + BAR_MIN > avail) s = Math.max(0.4, (avail - 12 - BAR_MIN) / W);  // phones: shrink the house
  scale = s;
  const hPx = Math.round(H * s), wPx = Math.round(W * s);
  view.width = wPx; view.height = hPx;
  view.style.width = wPx + "px"; view.style.height = hPx + "px";
  // UI pixel = house pixel (at least 2px so the dots stay round)

  while (n > 5 && n * u * 6 + 5 * 2 * u > hPx) n--;          // six (and a little air) must fit in the house height

  widget.style.setProperty("--u", u + "px");

  widget.style.setProperty("--house-h", hPx + "px");

  const icon = 10 * Math.max(1, Math.min(u, Math.floor((bh - 4 * u) / 10)));
  widget.style.setProperty("--icon", icon + "px");
  widget.style.setProperty("--slot", icon + 2 * u + "px");           // icon + a pixel of air each side
  widget.style.setProperty("--clip-track", pillClip(n, u));
  widget.style.setProperty("--clip-fill", pillClip(n - 4, u));
  widget.style.setProperty("--fmin", (n - 4) * u + "px");

      case "wash": return { f: { expr: phase ? "happy" : "blink", bob: phase, look: 1 }, pose: "stand", emote: showEm ? em : null };
      case "towel": return { f: { expr: "happy", bob: phase, look: -1 }, pose: "stand", emote: showEm ? em : null };

      case "dress": return { f: { expr: phase ? "happy" : "neutral", look: 1, bob: phase }, pose: "stand", emote: showEm ? em : null };
      case "eat": return { f: { expr: phase ? "happy" : "blink", bob: phase }, pose: "sit", emote: showEm ? em : null };

      case "phone_call": return { f: { expr: Math.floor(ms / 1800) % 3 === 1 ? "happy" : "neutral", bob: phase, look: Math.floor(ms / 2600) % 2 ? -1 : 0 }, pose: "stand", emote: showEm ? em : null };
      case "phone_video": case "phone_feed": case "phone_text": case "phone_game":

// ================================================================ seasons & weather
// Every 14 days is a season. Spring, summer and autumn now and then get a
// shower; winter gets snow. Each day rolls its episodes once (lazily).
const SEASON_DAYS = 14;
const SEASONS = [
  { name: "春", kind: "rain", p: 0.32 },
  { name: "夏", kind: "rain", p: 0.28 },
  { name: "秋", kind: "rain", p: 0.26 },
  { name: "冬", kind: "snow", p: 0.45 },

const WEATHER_NAME = { clear: "晴", rain: "小雨", snow: "下雪" };
function seasonOf(t) {

}
const weather = { plan: new Map(), force: null, kind: "clear", season: 0, snowCover: 0 };
function planDay(d) {
  if (d < 0) return [];
  if (!weather.plan.has(d)) {
    const s = SEASONS[Math.floor(d / SEASON_DAYS) % 4], eps = [];
    for (const p of [s.p, s.p * 0.3]) {           // usually none, sometimes one, rarely two
      if (Math.random() >= p) break;
      const from = d * 1440 + Math.floor(Math.random() * 22 * 60);
      eps.push({ from, to: from + 90 + Math.random() * 270, kind: s.kind });
    }
    weather.plan.set(d, eps);
  }
  return weather.plan.get(d);
}
function weatherAt(t) {
  if (weather.force) return weather.force;
  const d = Math.floor(t / 1440);
  for (const dd of [d - 1, d]) for (const e of planDay(dd)) if (t >= e.from && t < e.to) return e.kind;
  return "clear";
}
function updateWeather(dtGame) {
  const se = seasonOf(sim.t).i;
  if (se !== weather.season) { weather.season = se; lifeSeason(se); }
  const w = weatherAt(sim.t);
  if (w !== weather.kind) {
    const was = weather.kind;
    weather.kind = w;
    lifeWeather(was, w);
    if (w === "snow") log("下雪了！窗外白白的一片。");
    else if (w === "clear") log(was === "snow" ? "雪停了。" : "雨停了。");
  }
  // snow settles on the hill while it snows and melts slowly afterwards (fast outside winter)
  if (w === "snow") weather.snowCover = Math.min(1, weather.snowCover + dtGame / 150);
  else weather.snowCover = Math.max(0, weather.snowCover - dtGame / (se === 3 ? 2880 : 240));
}

// ---------- the sky bar above the house
const skyEl = document.getElementById("skybar"), skyCanvas = document.getElementById("sky"), skx = skyCanvas.getContext("2d");

const SKY_STOPS = [[0, "#ffd92b"], [0.28, "#ffd84a"], [0.4, "#f8d6a0"], [0.48, "#f1c4d6"], [0.55, "#b7a3d0"],
                   [0.62, "#7186c6"], [0.7, "#2c72bf"], [1, "#0f63b0"]];
const SKY_ICON = 16, SKY_MORPH = 0.9;
let skyGeo = { b: 3, w: 684, cols: 228 }, skyTrack = null;

const skyFrac = t => (((t % 1440) / 60 - 6 + 24) % 24) / 24;   // the bar starts at 06:00
function skyColor(f) {
  let i = 0;
  while (i < SKY_STOPS.length - 2 && f > SKY_STOPS[i + 1][0]) i++;
  const [f0, c0] = SKY_STOPS[i], [f1, c1] = SKY_STOPS[i + 1];

}
function buildSkyTrack() {
  // a pixel pill: 8 units tall, 2-unit white ring, gradient fill, centred in the 16-unit bar
  const { b, w, cols } = skyGeo, H16 = SKY_ICON * b;

  for (let r = 0; r < 4; r++) {

// ================================================================ moodlets & emotions
// Sims-style. Every moodlet adds points to one emotion; the emotion with the
// most points is how she feels (no moodlets = 平静): 1-2 points "a little",

/*__LIFE_TEXT_JS__*/
const T = LIFE_TEXT, ML = T.moodlets;
const MOOD = Object.fromEntries(D.moods.map(([k, name, color]) => [k, { name, color }]));
const LEVEL_WORD = ["", "有点", "", "非常"];
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
// "{食物}" -> a random dish; vars pins a value so diary and words agree
function fill(text, vars = {}) {

}

  const sum = {}, last = {};

    last[d.emo] = Math.max(last[d.emo] ?? -1, m.t);
  }

function rollEvents() {

  lastHour = hNow;
  if (sim.mode === "down") return;
  const h = hour(), sleeping = asleep();
  const c = { h, se: seasonOf(sim.t), act: sim.mode === "act" ? sim.act : null, sleeping, awake: !sleeping,
              open: Object.values(windowState).includes("open"), clear: weather.kind === "clear", day: h >= 8 && h < 18 };
  // festivals, birthday and anniversaries, once on their day
  const day = Math.floor(sim.t / 1440) + 1;
  if (h >= 9 && c.awake && lastFestivalDay !== day) {
    lastFestivalDay = day;
    const f = T.festivals.find(f => f.season === c.se.i && f.day === c.se.day);
    if (f) { log(`今天是${f.name}。` + f.diary); speak(pick(f.say)); addMood(f.mood || "festival", { diary: false, words: false }); if (f.sad) addMood("festivalSad", { diary: false, words: false }); }
    if (day === 30) { log("今天是生日！给自己做了一个小蛋糕，许了个愿。"); speak("生日快乐，我！"); addMood("birthday", { diary: false, words: false }); }
    if (day === 14 || day === 56) { log(`搬进这个小屋已经${day}天了。`); speak("这里越来越像家了"); addMood("anniversary", { diary: false, words: false }); }
  }
  for (const [id, when, p, cd, run] of EVENTS) {
    if (sim.t - (eventLast[id] ?? -1e9) < cd || !when(c) || Math.random() >= p) continue;
    eventLast[id] = sim.t;
    if (run) run(); else { lifeEvent(id); addMood(id, { diary: false, words: false }); }
    break;                                        // one thing at a time

}

// ---------- her own words
function thought() {
  const e = emotion(), a = sim.mode === "act" ? sim.act : null, h = hour(), se = seasonOf(sim.t).i;
  const pool = [...T.thoughts[e.key], ...T.thoughts[e.key]];           // feelings first
  if (a && T.acts[a]) pool.push(...T.acts[a], ...T.acts[a]);
  for (const [id] of moods) if (ML[id].say) pool.push(...ML[id].say);
  const sc = T.scene;
  if (h >= 6 && h < 9) pool.push(...sc.wake); else if (h >= 11.5 && h < 13.5) pool.push(...sc.noon);
  else if (h >= 17 && h < 19) pool.push(...sc.dusk); else if (h >= 22.5 || h < 5) pool.push(...sc.late);
  pool.push(...(weather.kind === "rain" ? sc.rain : weather.kind === "snow" ? sc.snow : sc.sunny));
  if (se === 1) pool.push(...sc.summer); if (se === 3) pool.push(...sc.winter);
  return fill(pick(pool.filter(t => t !== lastSaid)));
}

// Open when the pointer comes near the dots (or on focus / tap); close shortly after it leaves.
// Each bar is a damped spring (overshoots, then settles), snapped to whole UI
// pixels every frame; bars pop out one after another, then their fill springs up.
const reduceMotionUI = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const springs = [...needsEl.querySelectorAll(".need")].map((el, i) => ({ el, i, x: 0, v: 0, target: 0, start: 0, p: 0, pv: 0, ptarget: 0, pstart: 0 }));

function springStep(now) {
  const dt = springLast ? Math.min(0.033, (now - springLast) / 1000) : 0.016;
  springLast = now;
  const { u, bh, barW } = needGeo;
  let active = false;
  for (const s of springs) {
    if (reduceMotionUI) { s.x = s.target; s.p = s.ptarget; s.v = s.pv = 0; }
    if (now >= s.start) {
      const opening = s.target === 1;
      const k = opening ? 330 : 420, c = opening ? 17 : 30;      // bouncy out, firmer back
      s.v += (-k * (s.x - s.target) - c * s.v) * dt;
      s.x = Math.min(1.12, s.x + s.v * dt);
    }
    if (now >= s.pstart) {
      s.pv += (-260 * (s.p - s.ptarget) - 15 * s.pv) * dt;
      s.p += s.pv * dt;
    }
    const moving = now < s.start || now < s.pstart ||
      Math.abs(s.x - s.target) > 0.002 || Math.abs(s.v) > 0.02 || Math.abs(s.p - s.ptarget) > 0.002 || Math.abs(s.pv) > 0.02;
    if (moving) active = true; else { s.x = s.target; s.p = s.ptarget; s.v = s.pv = 0; }
    const w = bh + (barW - bh) * s.x;
    s.el.style.width = Math.max(bh, Math.round(w / u) * u) + "px";
    s.el.style.setProperty("--p", Math.max(0, s.p).toFixed(3));
  }
  springRaf = active ? requestAnimationFrame(springStep) : 0;
  if (!active) springLast = 0;
}

  if (buddyHit(x, y)) { holding = { t0: realClock }; view.setPointerCapture(e.pointerId); e.preventDefault(); }
});
for (const ev of ["pointerup", "pointercancel"]) view.addEventListener(ev, () => {
  if (holding && realClock - holding.t0 < REVIVE_S) { holding = null; showHint("长按她 5 秒，把她叫醒"); }
});
view.addEventListener("contextmenu", e => { if (sim.mode === "down") e.preventDefault(); });
view.addEventListener("click", e => {
  const [x, y] = canvasXY(e);
  const wasOpen = !!ringOf;
  closeRing();
  if (sim.mode === "down") return;
  if (buddyHit(x, y)) {
    if (wasOpen) return;                          // a second click on her closes the menu
    if (sim.mode === "act" && sim.act === "sleep") { log("你戳了戳她，她咂咂嘴继续睡。"); return; }
    openRing("buddy");
    return;
  }
  const id = clickableAt(x, y);
  if (id === "computer") { useFurniture(id, true); openRing("computer"); return; }
  if (id) useFurniture(id);
});

// ================================================================ ring menu
// Click Buddy: chat, pat, phone (a second ring), dance, bed. Click the
// computer: what to do on it. More options will join later.
const ringEl = document.getElementById("ring");
const RINGS = {
  buddy: [["chat", "聊聊天"], ["pat", "摸摸头"], ["phone", "玩手机", "more"], ["dance", "跳支舞"], ["bed", "去睡觉"]],
  phone: [["phone_call", "打给妈妈"], ["phone_video", "和朋友视频"], ["phone_feed", "刷动态"], ["phone_text", "发消息"], ["phone_game", "玩手机游戏"], ["back", "返回", "back"]],
  computer: [["computer", "打游戏"], ["pc_video", "视频聊天"], ["pc_forum", "逛论坛"], ["pc_code", "写代码"]],
};
let ringOf = null, ringAt = null;
function ringCenter() {
  if (ringAt === "computer") { const c = CLICK.computer; return { x: c.x + c.w / 2, y: c.y + c.h / 2 }; }
  const p = sim.mode === "act" && sim.act === "bath" ? { x: D.bathHead[0] + 10, y: D.bathHead[1] + 14 } : here();
  return { x: p.x, y: p.y - 13 };
}
function placeRing() {
  if (ringEl.hidden) return;
  const c = ringCenter(), k = view.width / W;
  ringEl.style.left = view.offsetLeft + c.x * k + "px";
  ringEl.style.top = view.offsetTop + c.y * k + "px";
}
function openRing(which, at = which === "computer" ? "computer" : "buddy") {
  ringOf = which; ringAt = at;
  const items = RINGS[which];
  const k = view.width / W, R = Math.max(48, Math.min(118, 24 * k));
  ringEl.innerHTML = "";
  items.forEach(([id, label, cls], i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.setAttribute("role", "menuitem");
    if (cls) b.className = cls;
    const a = -Math.PI / 2 + i / items.length * Math.PI * 2;
    b.style.setProperty("--x", Math.round(Math.cos(a) * R * 1.25) + "px");
    b.style.setProperty("--y", Math.round(Math.sin(a) * R) + "px");
    b.style.setProperty("--k", i);
    b.addEventListener("click", ev => { ev.stopPropagation(); ringPick(id); });
    ringEl.appendChild(b);
  });
  ringEl.hidden = false;
  placeRing();
  ringEl.classList.remove("on");
  void ringEl.offsetWidth;
  ringEl.classList.add("on");
  if (reduceMotionUI) ringEl.classList.add("on");
}
function closeRing() { ringEl.hidden = true; ringEl.classList.remove("on"); ringOf = null; }
let hintT = null;
function showHint(text) {
  ringOf = null; ringAt = "buddy";
  ringEl.innerHTML = `<div class="hint"></div>`;
  ringEl.firstChild.textContent = text;
  ringEl.firstChild.style.top = -Math.round(18 * view.width / W) + "px";
  ringEl.hidden = false; placeRing();
  clearTimeout(hintT); hintT = setTimeout(() => { if (!ringOf) closeRing(); }, 1800);
}
document.addEventListener("pointerdown", e => { if (ringOf && !ringEl.contains(e.target) && e.target !== view) closeRing(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && ringOf) closeRing(); });
let lastChat = -1e9;
function ringPick(id) {
  if (id === "phone") { openRing("phone", "buddy"); return; }
  if (id === "back") { openRing("buddy"); return; }
  closeRing();
  if (sim.mode === "down") return;
  if (id === "chat") {
    const often = sim.t - lastChat < 60;           // chatting non-stop helps less
    lastChat = sim.t;
    sim.needs.social = clamp(sim.needs.social + (often ? 3 : 8));
    reaction = { until: realClock + 1.8, emote: "chat", wave: false };
    speak(fill(pick(Math.random() < 0.5 ? T.you.chat : T.thoughts[emotion().key])), true);
    if (!often) addMood("chatYou", { words: false });
    log("你和她聊了一会儿天。");
    return;
  }
  if (id === "pat") {
    reaction = { until: realClock + 1.6, emote: doll.cheer(look) };
    sim.needs.fun = clamp(sim.needs.fun + 4); sim.needs.social = clamp(sim.needs.social + 2);
    addMood("patted", { words: false });
    speak(pick(T.you.pat), true);
    log(pick(["你摸了摸她的头，她冲你挥挥手。", "被你摸了摸头，她咯咯笑。"]));
    return;
  }
  if (id === "bed") {
    const h = hour();
    if (sim.needs.energy < 70 || h >= 21 || h < 6) command("sleep"); else speak(pick(T.you.notSleepy), true);
    return;
  }
  command(id);
}

// ================================================================ 造型室
// Clicking the wardrobe sends her there; when she arrives the dressing room
// slides open above the house (pushing it down, never covering it).
let wardrobeOpen = false;
const studioEl = document.getElementById("studio"), studioSlot = document.getElementById("studioSlot");
function saveLook() { try { localStorage.setItem("buddy-look-v2", JSON.stringify(look)); } catch (e) { /* storage unavailable */ } }
function changeLook(l) {
  setLook(l);
  saveLook();
  const p = here();
  poof = { t0: realClock, x: p.x, y: p.y - 14 };
}
let studio = null;
function openWardrobe() {
  if (wardrobeOpen) return;
  wardrobeOpen = true;
  studio.setLook(look);
  studioEl.hidden = false;
  studio.refit();
  studio.start();
  requestAnimationFrame(() => {
    studioSlot.classList.add("open");
    const r = view.getBoundingClientRect();
    if (r.top < 0 || studioEl.getBoundingClientRect().top < 0) studioEl.scrollIntoView({ block: "start", behavior: "smooth" });
  });
}
function closeWardrobe() {
  if (!wardrobeOpen) return;
  wardrobeOpen = false;
  studioSlot.classList.remove("open");
  studio.stop();
  const hide = () => { if (!wardrobeOpen) studioEl.hidden = true; };
  if (reduceMotionUI) hide(); else setTimeout(hide, 450);
  log("换好衣服了，美美的！");
}

// ================================================================ loop
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  realClock += dt;
  const fast = sim.mode === "act" && sim.act === "sleep" ? 8 : 1;
  step(dt * speed * fast, dt * (speed ? 1 : 0));
  updateDoors(speed ? dt : 0);
  render();
  renderSky();
  renderMood();
  placeRing();
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; syncUI(); updateMood(); }
  requestAnimationFrame(frame);
}

document.getElementById("testDown").addEventListener("click", () => { if (sim.mode !== "down") collapse(pick(EXTREME)); });

(async function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("buddy-look-v2") || "null"); } catch (e) { /* storage unavailable */ }
  setLook(saved && typeof saved === "object" ? saved : doll.PRESETS.f);
  studio = BuddyStudio(studioEl, doll, D.doll, { look, previewScale: 3, thumbH: 40, onChange: changeLook, onClose: closeWardrobe });
  fit();
  window.addEventListener("resize", fit);
  await loadAssets();
  await loadSkyIcons();
  await loadMoodIcons();
  await loadWeatherMasks();
  weather.kind = weatherAt(sim.t);
  log("—— 第 1 天 · 春 ——", "day");
  log("还在被窝里睡觉。");
  updateMood();
  syncUI();
  render();
  requestAnimationFrame(frame);
})();
</script>

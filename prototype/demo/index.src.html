<title>Buddy 小屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: the page is just the house, centred like a widget on a desktop.
   Everything else hides until asked for: the needs are four dots beside the
   house that stretch into bars when the pointer comes near. */
:root {
  --bg: #e6e3ee;
  --dither: #dcd8e6;
  --panel: #f7f6fb;
  --panel-2: #eceaf2;
  --ink: #22182a;
  --muted: #5e5b71;
  --edge: #22182a;
  --bevel-hi: #ffffff;
  --bevel-lo: #bab7c9;
  --shadow: #8f8ba2;
  --accent: #46619e;
  --accent-hi: #6c90c8;
  --accent-lo: #2f3c6d;
  --accent-ink: #f7f6fb;
  --accent-soft: #cfdcf2;
  --focus: #d29b30;
  /* needs: track ring + three states (from the sketch) */
  --ring: #ffffff;
  --need-ok: #b2d683;
  --need-warn: #f5b675;
  --need-low: #e87272;
  --need-label: rgba(34, 24, 42, 0.62);
  --u: 2px;              /* one UI pixel = one house pixel on screen (set by fit) */
  --font: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131f; --dither: #1d1828; --panel: #2b2538; --panel-2: #332c42; --ink: #f7f6fb; --muted: #bab7c9;
    --edge: #0d0a12; --bevel-hi: #433a54; --bevel-lo: #1f1a2a; --shadow: #0d0a12;
    --accent: #6c90c8; --accent-hi: #a6c5e7; --accent-lo: #2f3c6d; --accent-ink: #141228; --accent-soft: #34446a; --focus: #efc452;
    --ring: #f4f1f8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131f; --dither: #1d1828; --panel: #2b2538; --panel-2: #332c42; --ink: #f7f6fb; --muted: #bab7c9;
  --edge: #0d0a12; --bevel-hi: #433a54; --bevel-lo: #1f1a2a; --shadow: #0d0a12;
  --accent: #6c90c8; --accent-hi: #a6c5e7; --accent-lo: #2f3c6d; --accent-ink: #141228; --accent-soft: #34446a; --focus: #efc452;
  --ring: #f4f1f8; color-scheme: dark;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; }
body {
  background-color: var(--bg);
  background-image: repeating-conic-gradient(var(--dither) 0 25%, transparent 0 50%);
  background-size: 6px 6px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  display: grid;
  grid-template-rows: 1fr auto;
  grid-template-columns: minmax(0, 1fr);
}
.desk {
  display: grid;
  place-items: center;
  padding-block: calc(var(--row-h, 42px) + 24px + var(--room-top, 0px)) 32px;   /* top: the gear + diary row, and room for what opens above it */
  padding-left: calc(max(16px, env(safe-area-inset-left, 0px)) + var(--room-left, 0px));   /* + room for the pick-a-thing panel */
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.widget { position: relative; }
#view { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }

/* ---------- needs: dots that stretch into bars ----------
   Sizes come from JS (fit): --u is one house pixel on screen, --bh the dot /
   bar height, --bar-w the open length; the column is exactly as tall as the
   house and sits just left of it. Bars only ever grow to the left. */
.widget { display: flex; align-items: flex-end; gap: var(--g, 12px); padding-left: calc(var(--bar-w, 200px) - var(--bh, 24px)); }
.needs {
  position: relative;
  flex: none;
  height: var(--house-h, 236px);   /* flush with the house, not with the studio above it */
  width: var(--bh, 24px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;  /* first dot flush with the top, last with the bottom */
  align-items: flex-end;           /* right-anchored: bars grow to the left */
  outline: none;
}
.needs::before {                   /* invisible hover zone around the dots */
  content: ""; position: absolute; inset: -14px -10px -14px -14px;
}
.needs.open::before { left: calc(var(--bh, 24px) - var(--bar-w, 200px) - 14px); }
.need {
  position: relative;
  flex: none;
  width: var(--bh, 24px);          /* JS springs this between the dot and the open bar */
  height: var(--bh, 24px);
  background: var(--ring);
  clip-path: var(--clip-track);
}
.need .fill {
  position: absolute;
  /* 2px white ring; once open (--p springs 0 -> 1) the fill starts right of
     the icon slot, so the icon never hides the fill's start or its maximum */
  --room: calc(100% - var(--u) * 4 - var(--slot, 30px) * var(--p, 0));
  top: calc(var(--u) * 2); bottom: calc(var(--u) * 2);
  left: calc(var(--u) * 2 + var(--slot, 30px) * var(--p, 0));
  width: min(var(--room), var(--fmin) + (var(--room) - var(--fmin)) * var(--v, 1) * var(--p, 0));
  background-color: var(--c, var(--need-ok));
  background-image: var(--stripes);
  background-size: calc(var(--u) * 8) calc(var(--u) * 8);
  image-rendering: pixelated;
  clip-path: var(--clip-fill);
  animation: crawl 3.2s steps(8) infinite;
  transition: background-color .3s;
}
.need .fill::before {              /* a 1px gloss line along the top */
  content: ""; position: absolute; top: var(--u); left: calc(var(--u) * 2); right: calc(var(--u) * 2);
  height: var(--u); background: rgba(255, 255, 255, .38);
}
.need.low .fill { animation: crawl 3.2s steps(8) infinite, pulse 1.4s ease-in-out infinite; }
@keyframes crawl { from { background-position: 0 0; } to { background-position: calc(var(--u) * -8) 0; } }
@keyframes pulse { 50% { filter: brightness(1.18) saturate(1.1); } }
.need img {
  position: absolute;
  left: calc(var(--u) * 3);
  top: 50%;
  width: var(--icon, 24px);
  height: var(--icon, 24px);
  transform: translateY(-50%) scale(.2);
  image-rendering: pixelated;
  opacity: 0;
  pointer-events: none;
}
.needs.open .need img {
  animation: pop .5s cubic-bezier(.3, 1.9, .5, 1) both;
  animation-delay: calc(var(--i, 0) * 55ms + 200ms);
}
@keyframes pop {
  from { opacity: 0; transform: translateY(-50%) scale(.2) rotate(-12deg); }
  to   { opacity: 1; transform: translateY(-50%) scale(1) rotate(0); }
}
.needs:focus-visible::after {
  content: ""; position: absolute; inset: -6px; border: 2px dashed var(--focus); pointer-events: none;
}

/* ---------- 造型室: opens UPWARD above the gear row, as wide as the house ----------
   The house and its UI never move (user): the slot hangs above the mood row
   and grows from 0 to the studio's height upward; the page (or the app
   window) makes room above it (--room-top, see makeRoom). The clip keeps
   room for the studio's pixel outline and drop shadow. */
.house-col { display: grid; min-width: 0; width: var(--house-w, 684px); }
.studio-slot {
  position: absolute; z-index: 2; bottom: calc(100% + var(--row-h, 42px) + 20px); left: calc(-1 * var(--studio-dx, 0px));   /* phones: also spans the needs column (see fit) */
  display: grid;
  width: var(--studio-w, 684px);
  grid-template-rows: 0fr;
  transition: grid-template-rows .42s cubic-bezier(.3, 1.2, .5, 1);
}
.studio-slot.open { grid-template-rows: 1fr; }
.studio-clip {
  min-height: 0; overflow: hidden;
  padding: var(--u) calc(var(--u) * 3) calc(var(--u) * 3) var(--u);
  margin: calc(-1 * var(--u)) calc(-3 * var(--u)) calc(-3 * var(--u)) calc(-1 * var(--u));
}
#studio { --sp: var(--u); width: var(--studio-w, 684px); }

/* ---------- sky bar: one day from 06:00 (left) to 06:00 (right) above the house,
   exactly as wide as it. The icon walks along it with the clock and turns
   into the moon at dusk, or a rain cloud / snowflake when the weather turns.
   Drawn in a canvas at one UI pixel per bar unit (set by fit). */
.skybar { position: relative; z-index: 2; width: var(--house-w, 684px); height: var(--sky-h, 48px); margin-bottom: var(--sky-gap, 12px); pointer-events: none; }
#sky { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
/* the bar hangs over the house's top edge; only the part above the house takes the pointer (tooltip) */
.sky-hit { position: absolute; left: 0; right: 0; top: 0; bottom: var(--sky-over, 0px); pointer-events: auto; }
.sky-tip {
  position: absolute; bottom: calc(100% + 6px); left: 0; transform: translateX(-50%);
  white-space: nowrap; pointer-events: none; z-index: 3;
  background: var(--panel); color: var(--ink); font-size: 12px; font-weight: 500; letter-spacing: .04em;
  padding: 2px 10px;
  box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge), 3px 3px 0 0 var(--shadow);
}
.sky-tip[hidden] { display: none; }
/* on a festival (or her birthday) its name rides the time bar in a little
   rounded tag right of the sun / moon; when the icon is too near the bar's
   end for it to fit, it fades away (the day is nearly over anyway; user) */
.sky-fest {
  position: absolute; top: 50%; left: 0; z-index: 2; pointer-events: none; white-space: nowrap;
  transform: translate(var(--fx, 0px), -50%); isolation: isolate;
  font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #fff; padding: 2px 9px; line-height: 1.35;
  filter: drop-shadow(2px 2px 0 var(--shadow)); transition: opacity .35s;
}
.sky-fest::before { content: ""; position: absolute; inset: -2px; z-index: -2; background: #fff; clip-path: var(--clip-btn); }
.sky-fest::after { content: ""; position: absolute; inset: 0; z-index: -1; background: #e1725b; clip-path: var(--clip-btn); }
.sky-fest.gone { opacity: 0; }
.sky-fest[hidden] { display: none; }

/* ---------- mood: an emoji in a round frame at the top-left of the sky bar;
   to its right Buddy's own thoughts / words in a light-wood bubble with a
   tail pointing at her face, running to the house's right edge. It pops in
   and fades out; it never covers the house. */
.moodrow {
  position: relative; z-index: 3; width: var(--house-w, 684px);   /* the emoji lines up with the house's left edge, never the open bars */
  display: flex; align-items: center; gap: calc(var(--sky-b, 3px) * 4);
  height: var(--mood-h, 72px); margin-bottom: calc(var(--sky-b, 3px) * 1);
}
.mood-face { position: relative; flex: none; width: var(--mood-d, 78px); height: var(--mood-d, 78px); cursor: pointer; outline: none; }
.mood-face canvas {
  display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges;
  transition: transform .35s cubic-bezier(.3, 1.8, .5, 1);
}
.mood-face:hover canvas, .mood-face[aria-expanded="true"] canvas { transform: translateY(calc(var(--sky-b, 3px) * -1)); }   /* a little hop, whole pixels only */
.mood-face:focus-visible::after { content: ""; position: absolute; inset: -4px; border: 2px dashed var(--focus); }
.mood-talk {
  position: relative; flex: 1 1 auto; min-width: 0; height: 100%;
  display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 5px;
  padding-right: 0;     /* the bubble's outline ends exactly at the house's right edge */
}
.pop {
  --pe: var(--edge);
  position: relative; max-width: 100%; display: flex; align-items: baseline; gap: 8px;
  font-size: var(--say-fs, 32px); line-height: 1.35; padding: 8px 20px; color: var(--ink);
  isolation: isolate; filter: drop-shadow(3px 3px 0 var(--shadow));
  transform-origin: left center;
  animation: popin .42s cubic-bezier(.3, 1.6, .5, 1) both;
  transition: translate .3s cubic-bezier(.3, 1.4, .5, 1), filter .3s;
}
.pop span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* (the pop-in animation pins opacity/transform, so fades use translate + filter) */
.pop.out { translate: 0 -4px; filter: drop-shadow(3px 3px 0 var(--shadow)) opacity(0); }
.mood-talk.listing .pop { translate: 16px 0; filter: drop-shadow(3px 3px 0 var(--shadow)) opacity(0); pointer-events: none; }
.pop[hidden] { display: none; }
/* the bubble is ONE pixel shape (sayClip, made in fit): a 2px outline layer
   and a fill layer, both ends full half-circles like the diary box above it
   (user: no tail, the corners didn't match). In the --tail gap between her
   face and the bubble, two little round bubbles (small, then bigger) show
   the words come from the emoji, like a thought bubble. */
.pop .bg { position: absolute; inset: 0 0 0 calc(-1 * var(--tail, 16px)); z-index: -1; background: var(--pe); clip-path: var(--clip-say); }
.pop .bg::after { content: ""; position: absolute; inset: 0; background: var(--pf); clip-path: var(--clip-say-in); }
.pop .dot { position: absolute; z-index: -1; background: var(--pe); clip-path: var(--clip-dot); animation: dotin .32s cubic-bezier(.3, 1.6, .5, 1) both; }
.pop .dot::after { content: ""; position: absolute; inset: 2px; background: var(--pf); clip-path: var(--clip-dot-in); }
.pop .d1 { --clip-dot: var(--clip-dot-s); --clip-dot-in: var(--clip-dot-s-in); width: 8px; height: 8px; left: calc(2px - var(--tail, 24px)); top: calc(50% - 1px); }
.pop .d2 { --clip-dot: var(--clip-dot-m); --clip-dot-in: var(--clip-dot-m-in); width: 12px; height: 12px; left: calc(12px - var(--tail, 24px)); top: calc(50% - 8px); animation-delay: .06s; }
@keyframes dotin { from { transform: scale(0); } }
.pop.say {
  --pe: #8a6446; --pf: #ecd5ad; color: #3d2a1e; font-weight: 700; margin-left: var(--tail, 16px);
  height: var(--say-h, 60px); padding-block: 0; align-items: center;   /* whole-pixel height keeps every step crisp */
}
@keyframes popin { from { opacity: 0; transform: scale(.5) translateX(-10px); } to { opacity: 1; transform: none; } }
/* her moodlets: hovering (or tapping) the emoji swaps her words for a row of
   pills in the same place, so nothing gets covered. First pill = the
   emotion in its own colour, then each moodlet (name, points) tinted with its
   emotion's colour; the tint shrinks as its time runs out. */
.mood-list {   /* up to two rows of pills fit in the mood row's height */
  position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: center; align-items: center;
  gap: 6px 8px; padding-left: 4px; overflow: hidden; padding-bottom: 3px;
}
.mood-list[hidden] { display: none; }
.mp {
  --tint: color-mix(in srgb, var(--c) 42%, var(--panel-2));
  position: relative; isolation: isolate; flex: none; display: flex; align-items: center; gap: 7px;
  white-space: nowrap; font-size: var(--mp-fs, 15px); font-weight: 700; line-height: 1.3; letter-spacing: .02em;
  padding: 6px 14px; color: var(--ink); cursor: default;
  filter: drop-shadow(3px 3px 0 var(--shadow));
  transform-origin: left center;
  transform: translateX(calc(-24px * (var(--k) + 1))) scale(.35); opacity: 0;
  transition: transform .42s cubic-bezier(.3, 1.6, .5, 1), opacity .22s;
  transition-delay: calc(var(--k) * 45ms);
}
.mood-list.on .mp { transform: none; opacity: 1; }
.mood-list:not(.on) .mp { transition-duration: .22s, .18s; transition-delay: calc((var(--n) - var(--k)) * 22ms); }   /* fold back last-first */
.mp::before, .mp::after { content: ""; position: absolute; }
.mp::before { inset: 0; z-index: -2; background: var(--edge); clip-path: var(--clip-btn); }
.mp::after {
  inset: 2px; z-index: -1; clip-path: var(--clip-btn-in);
  background: linear-gradient(90deg, var(--tint) var(--left, 100%), var(--panel-2) var(--left, 100%));
  box-shadow: inset 0 2px 0 0 rgba(255, 255, 255, .35);
}
.mp b { font-size: .8em; color: var(--muted); font-variant-numeric: tabular-nums; }
.mp.head { color: #2b2033; }
.mp.head::after { background: var(--c); }
.mp.head b { color: rgba(43, 32, 51, .62); }
.mp.head.on-dark { color: #fff; }
.mp.head.on-dark b { color: rgba(255, 255, 255, .72); }
.mp.more { color: var(--muted); }
.mp.more::after { background: var(--panel); }
@media (prefers-reduced-motion: reduce) { .mp, .mood-face canvas { transition: none; } }
@media (prefers-reduced-motion: reduce) { .pop, .pop .dot { animation: none; transition: none; } }
@media (prefers-reduced-motion: reduce) { .studio-slot { transition: none; } }
/* ---------- ring menu: pixel pills that pop out around Buddy (or the computer) ---------- */
.house-col { position: relative; }
.ring { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 8; }
.ring[hidden] { display: none; }
/* every pill: an outline layer and a fill layer, each clipped to a stepped
   rounded rect (--clip-btn, made in fit) behind the label */
.ring button, .ring .ring-label, .ring .ring-field {
  position: relative; margin: 0; white-space: nowrap; color: var(--ink);
  font-size: var(--ring-fs, 14px); font-weight: 700; letter-spacing: .04em;
  background: none; box-shadow: none; isolation: isolate; padding: 7px 16px;
  filter: drop-shadow(3px 3px 0 var(--shadow));
}
.ring button::before, .ring button::after, .ring .ring-label::before, .ring .ring-field::before, .ring .ring-field::after {
  content: ""; position: absolute; z-index: -1;
}
.ring button::before, .ring .ring-label::before, .ring .ring-field::before { inset: 0; background: var(--edge); clip-path: var(--clip-btn); }
.ring button::after, .ring .ring-field::after {
  inset: 2px; background: var(--panel-2); clip-path: var(--clip-btn-in);
  box-shadow: inset 0 -2px 0 0 var(--bevel-lo), inset 0 2px 0 0 var(--bevel-hi);
}
.ring .ring-label { color: #f7f6fb; cursor: default; }
.ring .ring-label::before { background: var(--title, #33253b); }
.ring button:hover { background: none; }
.ring button:hover::after { background: var(--panel); }
.ring button.back { color: var(--muted); }
.ring button.back::after { background: var(--panel); }
.ring button.ok::after { background: var(--accent); box-shadow: inset 0 2px 0 0 var(--accent-lo), inset 0 -2px 0 0 var(--accent-hi); }
.ring button.ok { color: var(--accent-ink); }
/* the items of a ring sit on a circle (--x, --y) and spring out of its centre */
.ring > button, .ring > .ring-label {
  position: absolute; left: 0; top: 0;
  transform: translate(-50%, -50%) scale(.2); opacity: 0;
  transition: transform .34s cubic-bezier(.3, 1.7, .5, 1), opacity .18s;
  transition-delay: calc(var(--k, 0) * 35ms);
}
.ring.on > button, .ring.on > .ring-label { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))); opacity: 1; }
.ring > button:active { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y) + 2px)); }
/* renaming: one row of pills above her head (name box, die, OK) */
.ring-edit {
  position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px;
  transform: translate(-50%, calc(-100% - var(--lift, 60px))) scale(.3); opacity: 0; transform-origin: 50% 100%;
  transition: transform .34s cubic-bezier(.3, 1.7, .5, 1), opacity .18s;
}
.ring.on .ring-edit { transform: translate(-50%, calc(-100% - var(--lift, 60px))); opacity: 1; }
.ring .ring-field { padding: 4px 10px; }
.ring .ring-field input {
  font: inherit; color: inherit; background: none; border: 0; outline: none; padding: 3px 4px; width: calc(8.4em + 8px);   /* 8 characters */
}
.ring .ring-field input::placeholder { color: var(--muted); font-weight: 400; }
.ring .ring-field:focus-within { outline: 2px dashed var(--focus); outline-offset: 3px; }
.ring button.die { padding: 6px 10px; display: grid; place-items: center; }
.ring button.die svg { display: block; }
.ring .hint {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
  background: var(--title, #33253b); color: #f7f6fb; font-size: var(--ring-fs, 14px); padding: 6px 14px;
  clip-path: var(--clip-btn);
}
/* her name tag: a dark pill over her head while the pointer is on her */
.nametag {
  position: absolute; left: 0; top: 0; z-index: 7; pointer-events: none; white-space: nowrap;
  font-size: var(--ring-fs, 14px); font-weight: 700; letter-spacing: .04em; color: #f7f6fb; padding: 4px 12px;
  isolation: isolate; filter: drop-shadow(2px 2px 0 var(--shadow));
  transform: translate(-50%, -100%) scale(.4); opacity: 0; transform-origin: 50% 100%;
  transition: transform .26s cubic-bezier(.3, 1.7, .5, 1), opacity .15s;
}
.nametag::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--title, #33253b); clip-path: var(--clip-btn); }
.nametag.on { transform: translate(-50%, -100%); opacity: 1; }
@media (prefers-reduced-motion: reduce) { .ring > button, .ring > .ring-label, .ring-edit, .nametag { transition: none; } }
/* ---------- settings: a round gear right above the mood emoji (user); its
   options pop out to the RIGHT as rows of pill bubbles in the ring-menu style ---------- */
.settings {
  position: absolute; z-index: 20; display: flex; align-items: flex-start; gap: 10px;
  /* the gear sits right over the emoji, centred in the diary's row (--row-h); rows grow down from it */
  left: calc(var(--mood-d, 52px) / 2 - 24px); top: calc(-8px - var(--row-h, 52px) + (var(--row-h, 52px) - 48px) / 2);
  --pill-fs: 14px; cursor: default;
}
.settings button, .set-label {
  position: relative; margin: 0; isolation: isolate; white-space: nowrap; border: 0;
  background: none; box-shadow: none; color: var(--ink);
  font-size: var(--pill-fs); font-weight: 700; letter-spacing: .04em; padding: 7px 16px;
  filter: drop-shadow(3px 3px 0 var(--shadow));
}
.settings button::before, .settings button::after, .set-label::before { content: ""; position: absolute; z-index: -1; }
.settings button::before, .set-label::before { inset: 0; background: var(--edge); clip-path: var(--clip-btn); }
.settings button::after {
  inset: 2px; background: var(--panel-2); clip-path: var(--clip-btn-in);

/* ---------- pick-a-thing panel (user): clicking the bookshelf, the TV, a
   game on the computer or the phone, or the stove pops a panel out to the
   LEFT of the house: every book / show / game / dish with its little
   picture, a line about it, and for dishes how filling it is and how long
   it takes. The page (or the app window) makes room on the left. */
.picker {
  position: absolute; z-index: 30; right: calc(100% + var(--g, 12px) + var(--bar-w, 200px) + 14px); top: var(--pick-top, 0px);   /* left of the needs bars */
  width: 360px; height: var(--pick-h, 360px); display: flex; flex-direction: column;
  background: var(--panel); color: var(--ink);
  box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge), 5px 5px 0 0 var(--shadow);

  transition: transform .3s cubic-bezier(.3, 1.5, .5, 1), opacity .18s;

.picker.on { transform: none; opacity: 1; }
.picker[hidden] { display: none; }
/* user: every panel is exactly the house's size and lies right over it */

.picker.over {
  transform-origin: var(--from-x, 50%) var(--from-y, 50%); transform: scale(.04); opacity: 0;
  transition: transform .26s cubic-bezier(.45, 0, .8, .5), opacity .12s .15s;   /* closing: shrinks into the object, fading at the end */

}
.picker.over .pk-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
/* a small house: a one-line header; the items keep their size (user) — scroll */
.picker.tight .pk-head { padding: 2px 6px 2px 10px; }
.picker.tight .pk-head h3 { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.picker.tight .pk-head h3 .long, .picker.tight .rand .long { display: none; }

  margin: 2px; padding: 6px; background: var(--panel-2); color: var(--ink); font-size: 12px; line-height: 1.3;

/* ---------- chance cards (user, like The Sims): the house dims a little
   (it stays visible) and game time stands still; a card springs out of her
   over it, two choices; the one you pick gets pressed in and the card
   shrinks back into her. Later the result pops out of her, with the
   moodlet it gave her on a pill above it (with a burst, so it is seen); any
   click closes it and the pill flies into the emoji. --cs scales the text
   with the house (set in JS). */
.card, .card-res {
  position: absolute; z-index: 34; left: var(--pick-left, 0px); top: var(--pick-top, 0px); width: var(--pick-w, 342px); height: var(--pick-h, 118px);
}
.card[hidden], .card-res[hidden] { display: none; }
#view { transition: filter .3s; }
#view.dim { filter: brightness(.52) saturate(.8); }   /* just the house's own pixels, not a box around it */
.card {
  --rim: #f7f6fb;
  --outline: 2px 0 0 #1b1322, -2px 0 0 #1b1322, 0 2px 0 #1b1322, 0 -2px 0 #1b1322, 2px 2px 0 #1b1322, -2px 2px 0 #1b1322, 2px -2px 0 #1b1322, -2px -2px 0 #1b1322, 4px 4px 0 rgba(27, 19, 34, .55);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(8px * var(--cs, 1));
  padding: 8px calc(22px * var(--cs, 1)) 12px; text-align: center; overflow: hidden;
  color: #fff;
  transform-origin: var(--from-x, 50%) var(--from-y, 50%); transform: scale(.04); opacity: 0;
  transition: transform .28s cubic-bezier(.45, 0, .8, .5), opacity .12s .16s;   /* closing: back into her */
}

/* opening: a springy pop with a couple of wobbles */
@keyframes cardIn {

  12% { opacity: 1; }
  48% { transform: scale(1.045); animation-timing-function: ease-in-out; }
  70% { transform: scale(.982); animation-timing-function: ease-in-out; }
  86% { transform: scale(1.008); }
  100% { transform: none; opacity: 1; }
}
/* bigger than a tiny house: it hangs over other things, so it gets a backing */
.card.big {
  background: rgba(27, 19, 34, .86);
  box-shadow: 0 -2px 0 0 #f7f6fb, 0 2px 0 0 #f7f6fb, -2px 0 0 0 #f7f6fb, 2px 0 0 0 #f7f6fb, 5px 5px 0 0 var(--shadow);
}

.card p { margin: 0; max-width: 36em; font-size: calc(16px * var(--cs, 1)); line-height: 1.55; font-weight: 700; text-shadow: var(--outline); }
.cd-opts { display: flex; justify-content: center; gap: calc(28px * var(--cs, 1)); width: 100%; margin-top: calc(4px * var(--cs, 1)); }
.cd-opt {
  position: relative; isolation: isolate; flex: 0 1 40%; min-width: 0; margin: 0;
  padding: calc(8px * var(--cs, 1)) calc(16px * var(--cs, 1)); line-height: 1.3;
  font-size: calc(15px * var(--cs, 1)); font-weight: 700; letter-spacing: .03em; color: #f7f6fb;

.cd-opt::before, .cd-opt::after { content: ""; position: absolute; z-index: -1; }

.cd-opt::after { inset: 2px; background: var(--title, #33253b); clip-path: var(--clip-btn-in); box-shadow: inset 0 2px 0 0 rgba(255, 255, 255, .16); }
.cd-opt:hover { background: none; transform: translateY(-2px); }
.cd-opt:hover::after { background: var(--accent); }
.cd-opt:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

.cd-opt.chosen { animation: chosen .5s cubic-bezier(.3, 1.6, .5, 1); filter: drop-shadow(1px 1px 0 var(--shadow)); }
.cd-opt.chosen::after { background: var(--accent); box-shadow: inset 0 2px 0 0 var(--accent-lo), inset 0 -2px 0 0 var(--accent-hi); }

.cd-clock { opacity: 0; }
.card.on .cd-clock { animation: cdShow .35s ease-out .75s forwards, cdClock var(--wait, 60s) linear forwards; }   /* only once the card and its choices are out (user) */

.card-res { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(10px * var(--cs, 1)); pointer-events: none; }
.cr-box {
  position: relative; isolation: isolate; max-width: 86%; text-align: center;
  padding: calc(12px * var(--cs, 1)) calc(30px * var(--cs, 1));
  font-size: calc(16px * var(--cs, 1)); line-height: 1.45; font-weight: 700; letter-spacing: .03em; color: #f7f6fb;
  filter: drop-shadow(4px 4px 0 var(--shadow));
  transform-origin: var(--from-x, 50%) var(--from-y, 50%); transform: scale(.05); opacity: 0;
  transition: transform .28s cubic-bezier(.45, 0, .8, .5), opacity .12s .16s;
}
.cr-box::before, .cr-box::after { content: ""; position: absolute; z-index: -1; }
.cr-box::before { inset: 0; background: #f7f6fb; clip-path: var(--clip-btn); }
.cr-box::after { inset: 2px; background: var(--title, #33253b); clip-path: var(--clip-btn-in); box-shadow: inset 0 2px 0 0 rgba(255, 255, 255, .16); }
.card-res.on .cr-box { transform: none; opacity: 1; animation: cardIn .62s linear; transition: none; }
.card-res.on.closing .cr-box { transform: scale(.05); opacity: 0; animation: none; transition: transform .28s cubic-bezier(.45, 0, .8, .5), opacity .12s .16s; }
/* the moodlet pill (user: make it stand out): once the box has landed it
   bursts out — a flash of its colour, a shock ring, pixel sparks, a big
   wobbly pop, a shine across it and a glow that pulses — then sits there
   until the result closes and flies into the emoji */
.cr-moodwrap { position: relative; display: flex; justify-content: center; }
.cr-moodwrap[hidden] { display: none; }
.card-res .mp.cr-mood {
  --left: 100%; font-size: calc(var(--mp-fs, 15px) * var(--cs, 1) * 1.12); padding: .45em 1.1em;
  transform: scale(0); opacity: 0; transition: none;
  filter: drop-shadow(3px 3px 0 rgba(27, 19, 34, .6)) drop-shadow(0 0 0 transparent);
}
.card-res .mp.cr-mood::before { background: #f7f6fb; }

  transform: none; opacity: 1;
  animation: moodPop .7s linear .2s backwards, moodGlow 1.6s ease-in-out .55s 2;
}
@keyframes moodPop {
  0% { transform: scale(0) rotate(-10deg); opacity: 0; animation-timing-function: cubic-bezier(.2, .8, .4, 1); }
  10% { opacity: 1; }
  45% { transform: scale(1.42) rotate(5deg); animation-timing-function: ease-in-out; }
  66% { transform: scale(.9) rotate(-2deg); animation-timing-function: ease-in-out; }
  84% { transform: scale(1.06) rotate(1deg); }
  100% { transform: none; opacity: 1; }
}
@keyframes moodGlow {
  50% { filter: drop-shadow(3px 3px 0 rgba(27, 19, 34, .6)) drop-shadow(0 0 12px var(--c)); }
}
.cr-mood .shine {   /* a white flash, then a bright band sweeping across */
  position: absolute; inset: 2px; z-index: -1; clip-path: var(--clip-btn-in); pointer-events: none;
  background: linear-gradient(105deg, transparent 0 38%, rgba(255, 255, 255, .85) 46% 54%, transparent 62%) no-repeat;
  background-size: 260% 100%; background-position: 130% 0; opacity: 0;
}
.card-res.on .cr-mood .shine { animation: moodShine .9s ease-out .36s; }
@keyframes moodShine {
  0% { opacity: 1; background-color: rgba(255, 255, 255, .9); background-position: 130% 0; }
  25% { background-color: transparent; }
  99% { opacity: 1; background-position: -30% 0; }
  100% { opacity: 0; }
}
.cr-burst { position: absolute; inset: 0; pointer-events: none; z-index: -1; }
.cr-burst::before, .cr-burst::after {   /* colour flash + shock ring, pill-shaped */
  content: ""; position: absolute; inset: 0; clip-path: var(--clip-btn); background: var(--c); opacity: 0;
}
.cr-burst::after { background: #fff; }
.card-res.on .cr-burst::before { animation: moodWave .7s cubic-bezier(.2, .7, .3, 1) .28s; }
.card-res.on .cr-burst::after { animation: moodWave .6s cubic-bezier(.2, .7, .3, 1) .36s; }
@keyframes moodWave { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.1, 2.8); opacity: 0; } }
.cr-burst s {
  position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; background: var(--c);
  box-shadow: 0 0 0 2px #fff, 2px 2px 0 2px rgba(27, 19, 34, .45); opacity: 0;
}

<script>
const DATA = /*__DEMO_DATA__*/null;
const D = DATA;
// Inside the desktop app (Tauri, desktop/) the page is the whole frameless,
// transparent window; in a browser it's a page.
const TAURI = window.__TAURI__ && window.__TAURI__.core ? window.__TAURI__ : null;
if (TAURI) {
  document.documentElement.classList.add("desktop");
  // no devtools in the app: page errors go to the app's log
  const report = m => TAURI.core.invoke("log_js", { message: String(m) }).catch(() => {});
  window.addEventListener("error", e => report(`${e.message} @${e.lineno}:${e.colno}`));
  window.addEventListener("unhandledrejection", e => report(`unhandled: ${e.reason && (e.reason.stack || e.reason)}`));
}
// 界面大小 (% or "auto" = fit the page), 置顶游戏, 自动保存 (every 5 minutes, or never)
const prefs = { scale: TAURI ? 100 : "auto", onTop: false, autosave: true };
// 界面大小 counts SCREEN pixels: 25% = one game pixel is one pixel of the
// monitor (at any Windows display scaling), 100% = 4 of them; every step is
// a whole number of screen pixels, so the pixel art stays crisp
const SCALES = [25, 50, 75, 100, 125, 150, 175, 200];

/*__SHARED_DOLL_JS__*/
/*__SHARED_STUDIO_JS__*/

// ================================================================ Buddy's look
const doll = BuddyDoll(D.doll);
let look = doll.normalize(doll.PRESETS.f);
let ramps = doll.rampsOf(look);
function setLook(l) {
  look = doll.normalize(l);
  ramps = doll.rampsOf(look);
  dollCache.clear();
  rotCache.clear();
  syncNames();
}
// her name and 她/他 (by gender) wherever the page talks about her
const nameOf = () => look.name, ta = () => doll.pronoun(look);
// Chinese running text gets a space where it meets Latin letters or digits
// ("和 Buddy 聊天", "Buddy 的小屋"): applied to every line the page writes
const spaced = t => t.replace(/([\u3400-\u9fff])([A-Za-z0-9])/g, "$1 $2").replace(/([A-Za-z0-9])([\u3400-\u9fff])/g, "$1 $2");
function syncNames() {
  const n = nameOf();
  document.title = spaced(`${n}的小屋`);
  const set = (id, attr, text) => { const el = document.getElementById(id); if (el) el.setAttribute(attr, spaced(text)); };
  set("needs", "aria-label", `${n}的状态（饱腹、精力、清洁、如厕、社交、开心）`);
  set("moodTip", "aria-label", `${n}现在的心情`);
  set("ring", "aria-label", `和${n}互动`);
  set("view", "aria-label", `小屋剖面，${n}在里面生活。点家具让${ta()}去做事，点衣柜打开造型室，点${ta()}弹出互动菜单。`);
}

const DW = doll.W, DH = doll.H;
const dollCache = new Map(), rotCache = new Map();
function rowsOf(buf, w, r) { return buf.slice(r * w * 4, (r + 1) * w * 4); }
function applyPose(buf, pose) {
  const W4 = DW * 4, P = D.doll.pose[look.bottomStyle];
  if (pose === "walkL" || pose === "walkR") {   // lift one foot by a pixel
    const out = buf.slice();
    const c0 = pose === "walkL" ? 0 : DW / 2, c1 = c0 + DW / 2;
    for (let r = P.legStart; r < DH; r++) {
      for (let c = c0; c < c1; c++) {
        const src = (r * DW + c) * 4, dst = ((r - 1) * DW + c) * 4;
        for (let k = 0; k < 4; k++) out[dst + k] = buf[src + k];
        if (r === DH - 1) for (let k = 0; k < 4; k++) out[src + k] = 0;
      }
    }
    return out;
  }
  if (pose === "sit") {                         // drop the thighs: head sinks, knees forward
    const keep = [];
    for (let r = 0; r < DH; r++) if (!P.sitDrop.includes(r)) keep.push(r);
    const out = new Uint8ClampedArray(buf.length);
    const off = DH - keep.length;
    keep.forEach((r, i) => out.set(rowsOf(buf, DW, r), (i + off) * W4));
    return out;
  }
  return buf;
}
function dollCanvas(f, pose = "stand", cropRows = DH) {
  const key = JSON.stringify([f.expr, f.look, f.bob, f.sway, f.wave ?? null, pose, cropRows]);
  if (dollCache.has(key)) return dollCache.get(key);
  const c = doll.toCanvas(applyPose(doll.pixels(look, f, ramps), pose), DW, DH, cropRows);
  dollCache.set(key, c);
  return c;
}
function backCanvas(f, pose = "stand") {   // seen from behind, climbing the stairs
  const key = JSON.stringify(["back", f.bob, f.sway, pose]);
  if (dollCache.has(key)) return dollCache.get(key);
  const c = doll.toCanvas(applyPose(doll.pixelsBack(look, f, ramps), pose), DW, DH);
  dollCache.set(key, c);
  return c;
}
const emoteCache = new Map();
function emoteCanvas(name) {
  if (emoteCache.has(name)) return emoteCache.get(name);
  const e = doll.emotePixels(name, ramps);
  const c = doll.toCanvas(e.buf, e.w, e.h);
  emoteCache.set(name, c);
  return c;
}

// ================================================================ house assets
const IMG = {};
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function loadAssets() {
  IMG.day = await loadImg(D.bg.day);
  IMG.night = await loadImg(D.bg.night);
  IMG.gap = {}; for (const d of D.doors) IMG.gap[d.id] = await loadImg(d.gap);
  IMG.leaf = {}; for (const [k, v] of Object.entries(D.leaves)) IMG.leaf[k] = await loadImg(v);
  IMG.ov = {}; for (const [k, v] of Object.entries(D.overlays)) IMG.ov[k] = await loadImg(v.src);
  IMG.click = {}; for (const [k, v] of Object.entries(D.clickables)) IMG.click[k] = await loadImg(v.src);
  IMG.win = {};
  for (const [k, v] of Object.entries(D.windows)) {
    IMG.win[k] = {};
    for (const key of ["day0", "day1", "day2", "night0", "night1", "night2", "drawn"]) IMG.win[k][key] = await loadImg(v[key]);
  }
  IMG.tv = {}; for (const [c, fr] of Object.entries(D.screens.tv.channels)) IMG.tv[c] = await Promise.all(fr.map(loadImg));
  IMG.mon = {}; for (const [g, fr] of Object.entries(D.screens.monitor.games)) IMG.mon[g] = await Promise.all(fr.map(loadImg));
  IMG.app = {}; for (const [g, fr] of Object.entries(D.screens.monitor.apps)) IMG.app[g] = await Promise.all(fr.map(loadImg));
  IMG.fx = {}; for (const [k, v] of Object.entries(D.fx)) IMG.fx[k] = await Promise.all(v.frames.map(loadImg));
  buildClickables();
}
function drawOverlay(ctx, name) { const o = D.overlays[name]; ctx.drawImage(IMG.ov[name], o.x, o.y); }

// ================================================================ walking
// The floors are flat; the only way between them is the flight in the
// stairwell, which runs straight back into the screen: Buddy climbs it with
// her back to us and comes down facing us. Each trip is its own short
// polyline (along the floor, up or down the stairs, along again) and her
// position is the distance sim.s walked along it.
const FLOOR_Y = D.floors, STAIR_X = D.stair.x;
const MID_Y = (FLOOR_Y[0] + FLOOR_Y[1]) / 2;
const storeyOfY = y => (y < MID_Y ? 1 : 0);
function planRoute(fx, fy, tx, ty) {
  if (fy === ty) return [[fx, fy], [tx, ty]];
  return [[fx, fy], [STAIR_X, fy], [STAIR_X, ty], [tx, ty]];
}
function routeLength(r) {
  let L = 0;
  for (let i = 1; i < r.length; i++) L += Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
  return L;
}
function routePos(r, s) {   // -> { x, y, dy }: dy < 0 while climbing, > 0 coming down
  for (let i = 1; i < r.length; i++) {
    const [x0, y0] = r[i - 1], [x1, y1] = r[i], L = Math.hypot(x1 - x0, y1 - y0);
    if (s <= L || i === r.length - 1) {
      const t = L ? Math.max(0, Math.min(1, s / L)) : 1;
      return { x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, dy: t < 1 ? Math.sign(y1 - y0) : 0 };
    }
    s -= L;
  }
  return { x: r[0][0], y: r[0][1], dy: 0 };
}
const here = () => routePos(sim.route, sim.s);
// doors this trip walks through: [door id, x] on the storey it crosses them
function doorsOn(r) {
  const out = [];
  for (let i = 1; i < r.length; i++) {
    const [x0, y0] = r[i - 1], [x1, y1] = r[i];
    if (y0 !== y1) continue;
    for (const d of D.doors) {
      const dx = d.x + 2;
      if (d.storey === storeyOfY(y0) && dx > Math.min(x0, x1) && dx < Math.max(x0, x1)) out.push([d.id, dx]);
    }
  }
  return out;
}
function roomAt(p) {
  if (p.dy) return "stairs";
  const storey = storeyOfY(p.y);
  for (const [k, [st, x0, x1]] of Object.entries(D.roomX)) if (st === storey && p.x >= x0 && p.x < x1) return k;
  return "stairs";
}

// ================================================================ simulation
const ACTS = {
  sleep:    { spot: "bed",       label: "睡觉",       emote: "zzz",  dur: 600, log: "困了，回卧室睡觉。" },
  cook:     { spot: "cook",      label: "做饭",       emote: "note", dur: 20,  log: "去厨房开火做饭。", then: "eat" },
  eat:      { spot: "eat",       label: "吃饭",       emote: "bowl", dur: 15,  log: "开饭！热腾腾的。" },
  snack:    { spot: "fridge",    label: "找零食",     emote: "bowl", dur: 4,   log: "去冰箱里翻零食。" },
  bath:     { spot: "bath",      label: "泡澡",       emote: "soap", dur: 25,  log: "放了一缸热水泡澡。" },
  toilet:   { spot: "toilet",    label: "上厕所",     emote: null,   dur: 5,   log: "去了趟卫生间。" },
  wash:     { spot: "vanity",    label: "洗脸刷牙",   emote: "soap", dur: 6,   log: "对着镜子洗脸刷牙。" },
  towel:    { spot: "towel",     label: "擦干手脸",   emote: "soap", dur: 3,   log: "拿毛巾擦了擦脸。" },
  computer: { spot: "computer",  label: "打游戏",     emote: "game", dur: 45,  log: "打开电脑玩游戏。" },
  tv:       { spot: "sofa",      label: "看电视",     emote: "star", dur: 40,  log: "窝在沙发上看电视。" },
  read:     { spot: "bookshelf", label: "看书",       emote: "book", dur: 30,  log: "从书架上挑了本书来看。" },
  window:   { spot: "study_window", label: "看窗外发呆", emote: null, dur: 8, log: "在窗边发了会儿呆。" },
  water_living: { spot: "water_living", label: "浇花", emote: "note", dur: 5, log: "给客厅的绿植浇了水。" },
  water_study:  { spot: "water_study",  label: "浇花", emote: "note", dur: 5, log: "给书房的绿植浇了水。" },
  art:      { spot: "art",       label: "欣赏挂画",   emote: null,   dur: 5,   log: "盯着墙上的画看了一会儿。" },
  dress:    { spot: "wardrobe",  label: "换衣服",     emote: "star", dur: 6,   log: "打开衣柜挑衣服。" },
  // social & more on the computer

const WALK = 28 * 2 / 3;   // house pixels per real second at 1x (user: two thirds of the old 28)
function step(dtGame, dtReal) {
  sim.t += dtGame;
  const day = Math.floor(sim.t / 1440) + 1;
  if (day !== sim.lastDay) { sim.lastDay = day; log(`—— 第 ${day} 天 · ${SEASONS[seasonOf(sim.t).i].name} ——`, "day"); }
  updateWeather(dtGame);
  // needs
  const n = sim.needs;
  let eff = sim.mode === "act" ? (EFFECT[sim.act] || {}) : {};
  if (sim.mode === "act" && sim.act === "eat" && sim.meal?.quality) {   // a burnt meal fills less, a great one cheers her up
    const q = sim.meal.quality;
    eff = { ...eff, hunger: sim.meal.rate ?? eff.hunger * ({ burnt: 0.6, plain: 1, good: 1.1, great: 1.2 }[q] || 1), ...(q === "great" ? { fun: 0.3 } : {}) };
  }
  for (const k of Object.keys(n)) {
    let d = -DECAY[k];
    if (sim.act === "sleep" && sim.mode === "act") d *= k === "energy" ? 0 : k === "bladder" ? 0.35 : 0.4;
    if (eff[k] > 0) d = 0;
    n[k] = clamp(n[k] + (d + (eff[k] || 0)) * dtGame);
  }
  if (sim.mode === "act" && sim.act === "sleep" && !sim.nap) sim.sleptTonight += dtGame;
  // couldn't hold it: no harm done, just embarrassing (and a bath)
  if (n.bladder <= 0 && sim.mode !== "down" && sim.act !== "toilet") {
    n.bladder = 100; n.hygiene = Math.max(0, n.hygiene - 40);
    addMood("accident");
    if (!asleep()) { sim.queue = []; startAct("bath"); }
  }
  // behaviour
  if (sim.mode === "down") { sim.windup = null; return; }
  if (sim.windup) {
    if (realClock >= sim.windup.at) { const a = sim.windup.act; sim.windup = null; startAct(a); }
    else return;   // she halts (mid-step, or keeps at what she was doing) until she sets off
  }
  if (sim.mode === "walk") {
    const v = WALK * Math.min(speed, 4) * dtReal * (here().dy ? 0.7 : 1);   // a little slower on the stairs
    if (sim.target - sim.s <= v) { sim.s = sim.target; arrive(); }
    else {
      const before = here();
      sim.s += v; sim.walkDist += v;
      const now = here(), dx = now.x - before.x;
      if (Math.abs(dx) > 0.01) sim.facing = Math.sign(dx);
      walkMoments(before, now);

  } else if (sim.mode === "act") {
    const h = hour();
    const done = sim.act === "sleep"
      ? sim.nap ? n.energy >= 95 || sim.t >= sim.actEnd - 780 : (n.energy >= 99 && h >= 6.5 && h < 12) || (h >= 9 && h < 20)
      : sim.act === "dress" && wardrobeOpen ? false : sim.t >= sim.actEnd;
    // up in the night for the toilet, then back to bed
    if (sim.act === "sleep" && !done && n.bladder < 10) { sim.upAtNight = true; log("半夜起来上了个厕所。"); finishAct(); sim.queue = ["toilet", "sleep"]; return; }
    // longer activities: she breaks off for the toilet before it's too late
    if (!done && !["sleep", "toilet", "dress"].includes(sim.act) && n.bladder < 15) {
      const next = ACTS[sim.act].then;               // (a cooked meal still gets eaten after)
      sim.player = false; lifeFinish(sim.act); sim.act = null;
      startAct("toilet"); sim.queue = next ? [next] : [];
      return;
    }
    if (done) finishAct();
  } else if (sim.mode === "idle" && sim.t >= sim.idleUntil) {
    startAct(sim.queue.length ? sim.queue.shift() : choose());
  }

const doorState = Object.fromEntries(D.doors.map(d => [d.id, { angle: 0, side: "r", t: 0 }]));
const ANGLES = [0, 30, 60, 90];
function updateDoors(dtReal) {

// ================================================================ lighting
const W = D.W, H = D.H;
const EMISSIVE = new Set(D.emissive.map(h => parseInt(h.slice(1), 16)));
const LIGHT_G = {};
for (const [id, [lx, ly, r, , room]] of Object.entries(D.lights)) {
  const [rx, ry, rw, rh] = D.rooms[room];
  const g = new Float32Array(W * H);
  for (let y = ry; y < ry + rh; y++) for (let x = rx; x < rx + rw; x++) {
    const d = Math.hypot(x - lx, (y - ly) * 1.15) / r;
    g[y * W + x] = Math.ceil(Math.max(0, 1 - d) * 4) / 4 * 0.9;
  }
  LIGHT_G[id] = g;
}
function nightness(h) {
  if (h >= 7 && h < 17) return 0;
  if (h >= 17 && h < 19) return (h - 17) / 2;
  if (h >= 5 && h < 7) return 1 - (h - 5) / 2;
  return 1;
}
// The room Buddy is in has its ceiling light on: it keeps daytime brightness
// while the rest of the house is night. The light fades on/off as she moves.
const ROOM_KEYS = Object.keys(D.rooms);
const ROOM_IDX = new Uint8Array(W * H);          // pixel -> 1 + room index (0: walls, outside)
ROOM_KEYS.forEach((k, i) => {
  const [rx, ry, rw, rh] = D.rooms[k];
  for (let y = ry; y < ry + rh; y++) for (let x = rx; x < rx + rw; x++) ROOM_IDX[y * W + x] = i + 1;
});
const roomGlow = new Float32Array(ROOM_KEYS.length + 1);
let glowClock = 0;
function updateRoomLights(room, on) {
  const dt = Math.min(0.1, realClock - glowClock);
  glowClock = realClock;
  const target = on ? ROOM_KEYS.indexOf(room) + 1 : -1;
  for (let i = 1; i < roomGlow.length; i++) {
    const want = i === target ? 1 : 0;
    roomGlow[i] += (want - roomGlow[i]) * Math.min(1, dt * 7);
    if (Math.abs(want - roomGlow[i]) < 0.01) roomGlow[i] = want;
  }
}
function grade(ctx, f, lit) {
  if (f <= 0) return;
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  const L = lit.map(id => [LIGHT_G[id], D.lights[id][3]]);
  for (let i = 0, p = 0; i < W * H; i++, p += 4) {
    const r = d[p], g = d[p + 1], b = d[p + 2];
    if (EMISSIVE.has((r << 16) | (g << 8) | b)) continue;
    const nr = r * 0.40, ng = g * 0.42, nb = b * 0.62;
    let or = nr, og = ng, ob = nb;
    for (const [G, c] of L) {
      const k = G[i];
      if (!k) continue;
      or = Math.max(or, nr * (1 - k) + r * c[0] * k);
      og = Math.max(og, ng * (1 - k) + g * c[1] * k);
      ob = Math.max(ob, nb * (1 - k) + b * c[2] * k);
    }
    const k = f * (1 - roomGlow[ROOM_IDX[i]]);          // a lit room keeps its daytime colours
    d[p] = r + (or - r) * k; d[p + 1] = g + (og - g) * k; d[p + 2] = b + (ob - b) * k;
  }
  ctx.putImageData(img, 0, 0);
}

const CLICK = {};   // id -> { x, y, w, h, mask:Set, rings:[ring1, ring2, ring3], sparks }
function buildClickables() {
  for (const [id, c] of Object.entries(D.clickables)) {
    const img = IMG.click[id], w = img.width, h = img.height;
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0);
    const a = cx.getImageData(0, 0, w, h).data;
    const inside = new Set();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (a[(y * w + x) * 4 + 3]) inside.add((c.x + x) + "," + (c.y + y));
    const rings = [];
    let grown = new Set(inside);
    for (let k = 0; k < 3; k++) {   // dilate one pixel at a time: the glow's rings
      const ring = [], seen = new Set();
      for (const key of grown) {
        const [x, y] = key.split(",").map(Number);
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nk = (x + dx) + "," + (y + dy);
          if (!grown.has(nk) && !seen.has(nk)) { seen.add(nk); ring.push([x + dx, y + dy]); }
        }
      }
      for (const k of seen) grown.add(k);
      rings.push(ring);
    }
    CLICK[id] = { x: c.x, y: c.y, w, h, area: inside.size, inside, near: new Set([...inside, ...rings[0].map(p => p[0] + "," + p[1])]), rings };

// Pixel-circle outline for a pill n UI pixels tall (caps are half circles).
function pillClip(n, u) {
  const R = n / 2, inset = [];
  for (let r = 0; r < n; r++) {
    const dy = r + 0.5 - R;
    inset.push(Math.max(0, Math.round(R - Math.sqrt(Math.max(0, R * R - dy * dy)))));
  }
  const pts = [];
  for (let r = 0; r < n; r++) pts.push(`calc(100% - ${inset[r] * u}px) ${r * u}px`, `calc(100% - ${inset[r] * u}px) ${(r + 1) * u}px`);
  for (let r = n - 1; r >= 0; r--) pts.push(`${inset[r] * u}px ${(r + 1) * u}px`, `${inset[r] * u}px ${r * u}px`);
  return `polygon(${pts.join(",")})`;
}

// The speech bubble as one pixel shape, H px tall: a body with round corners
// (nR steps of p px on the right, nL on the left, so the left side keeps a
// straight run for the tail) and a stepped tail T px long, 2h steps tall,
// centred on its left side. Returns [outline, fill] polygons for .bg (which starts T px
// left of the bubble); the fill is the outline shape shrunk by one step, so
// the outline is exactly one step thick everywhere, tail included.
function sayClip(H, T, nL, nR, p, h) {
  const rows = Math.round(H / p), c = rows / 2;
  const insets = n => Array.from({ length: n }, (_, r) => { const dy = n - (r + 0.5); return Math.round(n - Math.sqrt(Math.max(0, n * n - dy * dy))); });
  const inL = insets(nL), inR = insets(nR);
  const corner = (ins, n, r) => (r < n ? ins[r] : r >= rows - n ? ins[rows - 1 - r] : 0);
  const L = [], Rt = [];                    // per row: left edge from .bg's left, inset from the right
  for (let r = 0; r < rows; r++) {
    let left = T + corner(inL, nL, r) * p;
    const k = r < c ? c - r : r - c + 1;    // 1 = the two rows at the tip
    // slightly hollow sides: a sharp tip that flares into the body
    if (k <= h) left = Math.min(left, Math.round((T / p) * Math.pow((k - 1) / h, 0.75)) * p);
    L.push(left); Rt.push(corner(inR, nR, r) * p);
  }
  const poly = (L, Rt, r0, r1) => {
    const pts = [];
    for (let r = r0; r <= r1; r++) pts.push(`calc(100% - ${Rt[r]}px) ${r * p}px`, `calc(100% - ${Rt[r]}px) ${(r + 1) * p}px`);
    for (let r = r1; r >= r0; r--) pts.push(`${L[r]}px ${(r + 1) * p}px`, `${L[r]}px ${r * p}px`);
    return `polygon(${pts.join(",")})`;
  };
  const Li = L.map((v, r) => Math.max(v, L[r - 1] ?? v, L[r + 1] ?? v) + p);
  const Ri = Rt.map((v, r) => Math.max(v, Rt[r - 1] ?? v, Rt[r + 1] ?? v) + p);
  return [poly(L, Rt, 0, rows - 1), poly(Li, Ri, 1, rows - 2)];
}

// A rectangle whose corners are pixel-stepped quarter circles: n steps of p px.
function roundClip(n, p) {

  for (let r = 0; r < n; r++) { const dy = n - (r + 0.5); ins.push(Math.round(n - Math.sqrt(Math.max(0, n * n - dy * dy)))); }
  const pts = [], R = i => `calc(100% - ${i}px)`;
  for (let r = 0; r < n; r++) pts.push(`${R(ins[r] * p)} ${r * p}px`, `${R(ins[r] * p)} ${(r + 1) * p}px`);
  for (let r = n - 1; r >= 0; r--) pts.push(`${R(ins[r] * p)} ${R((r + 1) * p)}`, `${R(ins[r] * p)} ${R(r * p)}`);
  for (let r = 0; r < n; r++) pts.push(`${ins[r] * p}px ${R(r * p)}`, `${ins[r] * p}px ${R((r + 1) * p)}`);
  for (let r = n - 1; r >= 0; r--) pts.push(`${ins[r] * p}px ${(r + 1) * p}px`, `${ins[r] * p}px ${r * p}px`);

function activityFrame(ms) {
  // what Buddy looks like right now: frame params, pose, emote
  const a = sim.act, phase = Math.floor(ms / 600) % 2;
  if (reaction && realClock < reaction.until && sim.mode !== "down")
    return { f: { expr: "happy", wave: reaction.wave === false ? null : Math.floor(ms / 180) % 2, bob: Math.floor(ms / 300) % 2 }, pose: "stand", emote: reaction.emote };
  if (sim.mode === "walk") {
    const i = Math.floor(sim.walkDist / 4) % 4;
    // contact frames (a foot lifted) dip the head a pixel, passing frames rise
    const dy = here().dy;   // on the stairs: back to us going up, facing us coming down
    return { f: { look: dy ? 0 : sim.facing, bob: i % 2 ? 0 : 1, sway: i % 2 }, pose: ["walkL", "stand", "walkR", "stand"][i], emote: null, back: dy < 0 };
  }
  if (sim.mode === "act") {
    const em = ACTS[a].emote;
    const showEm = em && Math.floor(ms / 2400) % 2 === 0;
    switch (a) {
      case "cook": return { f: { expr: phase ? "happy" : "neutral", bob: phase, sway: phase, look: -1 }, pose: "stand", emote: showEm ? em : null };
      case "toilet": return { f: { expr: Math.floor(ms / 2000) % 3 === 2 ? "blink" : "neutral", look: Math.floor(ms / 2600) % 2 ? 1 : -1 }, pose: "sit", emote: null };
      case "wash": return { f: { expr: phase ? "happy" : "blink", bob: phase, look: 1 }, pose: "stand", emote: showEm ? em : null };
      case "towel": return { f: { expr: "happy", bob: phase, look: -1 }, pose: "stand", emote: showEm ? em : null };
      case "water_living": case "water_study": return { f: { expr: "happy", look: a === "water_living" ? -1 : 1, bob: phase }, pose: "stand", emote: showEm ? em : null };
      case "dress": return { f: { expr: phase ? "happy" : "neutral", look: 1, bob: phase }, pose: "stand", emote: showEm ? em : null };
      case "eat": return { f: { expr: phase ? "happy" : "blink", bob: phase }, pose: "sit", emote: showEm ? em : null };
      case "computer": case "pc_code": case "pc_forum": case "pc_video":
        if (!chairReady()) return { f: { expr: "happy", wave: 1 }, pose: "stand", emote: null };   // a wave of the hand: the chair pops in, then she sits
        return { f: { expr: Math.floor(ms / 3000) % 3 === 2 ? "happy" : "neutral", look: Math.floor(ms / 1500) % 2 ? 1 : 0 }, pose: "sit", emote: showEm ? em : null };
      case "phone_call": return { f: { expr: Math.floor(ms / 1800) % 3 === 1 ? "happy" : "neutral", bob: phase, look: Math.floor(ms / 2600) % 2 ? -1 : 0 }, pose: "stand", emote: showEm ? em : null };
      case "phone_video": case "phone_feed": case "phone_text": case "phone_game":
        return { f: { expr: Math.floor(ms / 2200) % 3 === 2 ? "happy" : Math.floor(ms / 3100) % 5 === 4 ? "blink" : "neutral", look: 1 }, pose: "stand", emote: showEm ? em : null };
      case "dance": {
        const i = Math.floor(ms / 260) % 4;
        return { f: { expr: "happy", wave: i % 2, bob: i % 2, sway: i % 2, look: i < 2 ? -1 : 1 }, pose: ["walkL", "stand", "walkR", "stand"][i], emote: showEm ? em : null };
      }
      case "tv": return { f: { expr: Math.floor(ms / 2000) % 3 === 0 ? "happy" : "neutral", look: 1 }, pose: "sit", emote: showEm ? em : null };
      case "read": return { f: { expr: "neutral", look: -1, bob: Math.floor(ms / 1800) % 2 }, pose: "stand", emote: showEm ? em : null };
      case "window": return { f: { expr: Math.floor(ms / 2500) % 4 === 3 ? "blink" : "neutral", look: 1 }, pose: "stand", emote: null };

}

// ================================================================ seasons & weather
// Every 14 days is a season. Spring, summer and autumn now and then get a
// shower; winter gets snow. Each day rolls its episodes once (lazily).
const SEASON_DAYS = 14;
const SEASONS = [
  { name: "春", kind: "rain", p: 0.32 },
  { name: "夏", kind: "rain", p: 0.28 },
  { name: "秋", kind: "rain", p: 0.26 },
  { name: "冬", kind: "snow", p: 0.45 },
];
const WEATHER_NAME = { clear: "晴", rain: "小雨", snow: "下雪" };
function seasonOf(t) {
  const d = Math.floor(t / 1440);
  return { i: Math.floor(d / SEASON_DAYS) % 4, day: d % SEASON_DAYS + 1 };
}
const weather = { plan: new Map(), force: null, kind: "clear", season: 0, snowCover: 0 };
function planDay(d) {
  if (d < 0) return [];
  if (!weather.plan.has(d)) {
    const s = SEASONS[Math.floor(d / SEASON_DAYS) % 4], eps = [];
    for (const p of [s.p, s.p * 0.3]) {           // usually none, sometimes one, rarely two
      if (Math.random() >= p) break;
      const from = d * 1440 + Math.floor(Math.random() * 22 * 60);
      eps.push({ from, to: from + 90 + Math.random() * 270, kind: s.kind });
    }
    weather.plan.set(d, eps);
  }
  return weather.plan.get(d);
}
function weatherAt(t) {
  if (weather.force) return weather.force;
  const d = Math.floor(t / 1440);
  for (const dd of [d - 1, d]) for (const e of planDay(dd)) if (t >= e.from && t < e.to) return e.kind;
  return "clear";
}
function updateWeather(dtGame) {
  const se = seasonOf(sim.t).i;
  if (se !== weather.season) { weather.season = se; lifeSeason(se); }
  const w = weatherAt(sim.t);
  if (w !== weather.kind) {
    const was = weather.kind;
    weather.kind = w;
    lifeWeather(was, w);
    if (w === "snow") log("下雪了！窗外白白的一片。");
    else if (w === "clear") log(was === "snow" ? "雪停了。" : "雨停了。");
  }
  // snow settles on the hill while it snows and melts slowly afterwards (fast outside winter)
  if (w === "snow") weather.snowCover = Math.min(1, weather.snowCover + dtGame / 150);
  else weather.snowCover = Math.max(0, weather.snowCover - dtGame / (se === 3 ? 2880 : 240));
}

// ---------- weather through the windows
const WMASK = {};
function maskCanvas(imgs, w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  for (const i of imgs) x.drawImage(i, 0, 0);

}

    const st = {};

      st[k] = { sky, ground, glass: maskCanvas([sky, ground], sky.width, sky.height), w: sky.width, h: sky.height };

const wtmp = document.createElement("canvas"), wctx = wtmp.getContext("2d");
function masked(ctx, m, mask, x, y, paint) {   // paint(local ctx), keep only the mask's pixels

function drawWeather(ctx, night) {

  for (const [id, win] of Object.entries(WMASK)) {
    if (windowState[id] === "drawn") continue;              // curtains shut: no view
    const m = windowState[id] === "open" && win.open ? win.open : win.closed;
    if (!m) continue;
    // the season on the hill
    if (tint || weather.snowCover > 0) {
      masked(ctx, m, m.ground, win.x, win.y, g => {
        if (tint) { g.fillStyle = tint; g.fillRect(0, 0, m.w, m.h); }
        if (weather.snowCover > 0) { g.fillStyle = `rgba(244, 247, 252, ${0.9 * weather.snowCover})`; g.fillRect(0, 0, m.w, m.h); }
      });
    }
    if (w === "clear") continue;
    // grey sky + falling rain / drifting snow, only on the glass
    masked(ctx, m, m.glass, win.x, win.y, g => {
      g.fillStyle = w === "rain" ? "rgba(66, 78, 100, 0.5)" : "rgba(196, 206, 222, 0.3)";
      g.fillRect(0, 0, m.w, m.h);
      const seed = id.length * 13 + win.x;
      if (w === "rain") {
        g.fillStyle = night ? "rgba(170, 190, 225, 0.75)" : "rgba(232, 240, 252, 0.85)";
        for (let i = 0; i < 22; i++) {
          const x0 = hash(seed + i) * (m.w + 6), sp = 26 + hash(seed + i * 3) * 10;
          const y = ((realClock * sp + hash(seed + i * 7) * m.h) % (m.h + 4)) - 3;
          g.fillRect(Math.floor(x0 - y * 0.25), Math.floor(y), 1, 3);

      } else {

          const x0 = hash(seed + i) * m.w, sp = 3 + hash(seed + i * 3) * 3;
          const y = (realClock * sp + hash(seed + i * 7) * m.h) % (m.h + 2) - 1;
          g.fillRect(Math.floor(x0 + Math.sin(realClock * 1.3 + i) * 1.5), Math.floor(y), 1, 1);
        }
      }
    });
  }
}

// ---------- the sky bar above the house
const skyEl = document.getElementById("skybar"), skyCanvas = document.getElementById("sky"), skx = skyCanvas.getContext("2d");
const skyTip = document.getElementById("skyTip");
const SKY_STOPS = [[0, "#ffd92b"], [0.28, "#ffd84a"], [0.4, "#f8d6a0"], [0.48, "#f1c4d6"], [0.55, "#b7a3d0"],
                   [0.62, "#7186c6"], [0.7, "#2c72bf"], [1, "#0f63b0"]];
const SKY_ICON = 16, SKY_MORPH = 0.9;
let skyGeo = { b: 3, w: 684, cols: 228 }, skyTrack = null;
const sky = { icon: null, from: null, t0: -9, x: 0, fromX: 0 };
const IMG_SKY = {};
async function loadSkyIcons() {
  for (const [k, frames] of Object.entries(D.skyIcons)) IMG_SKY[k] = await Promise.all(frames.map(loadImg));
}
const skyFrac = t => (((t % 1440) / 60 - 6 + 24) % 24) / 24;   // the bar starts at 06:00
function skyColor(f) {
  let i = 0;
  while (i < SKY_STOPS.length - 2 && f > SKY_STOPS[i + 1][0]) i++;
  const [f0, c0] = SKY_STOPS[i], [f1, c1] = SKY_STOPS[i + 1];
  const k = Math.max(0, Math.min(1, (f - f0) / (f1 - f0)));
  const a = doll.hexToRgb(c0), b = doll.hexToRgb(c1);
  return `rgb(${a.map((v, j) => Math.round((v + (b[j] - v) * k) * 255)).join(",")})`;
}
function buildSkyTrack() {
  // a pixel pill: 8 units tall, 2-unit white ring, gradient fill, centred in the 16-unit bar
  const { b, w, cols } = skyGeo, H16 = SKY_ICON * b;
  const c = document.createElement("canvas"); c.width = w; c.height = H16;
  const x = c.getContext("2d");
  const ox = Math.floor((w - cols * b) / 2), top = 4, R = 4;
  const inset = (r, rad, rows) => { const d = r + 0.5 - rows / 2; return Math.round(rad - Math.sqrt(Math.max(0, rad * rad - d * d))); };
  for (let r = 0; r < 8; r++) {
    const e = inset(r, R, 8);
    x.fillStyle = "#ffffff";
    x.fillRect(ox + e * b, (top + r) * b, (cols - 2 * e) * b, b);
  }
  for (let r = 0; r < 4; r++) {
    const e = 2 + inset(r, 2, 4);
    for (let col = e; col < cols - e; col++) {
      x.fillStyle = skyColor(col / (cols - 1));
      x.fillRect(ox + col * b, (top + 2 + r) * b, b, b);
    }
    x.fillStyle = "rgba(255,255,255,0.32)";                 // a 1-unit gloss line, like the needs bars
    if (r === 0) x.fillRect(ox + (e + 2) * b, (top + 2) * b, (cols - 2 * e - 4) * b, b);
  }

}
function sizeSky(wPx, hPx, u) {
  const b = Math.max(1, Math.min(u, Math.floor(hPx / 36)));
  skyGeo = { b, w: wPx, cols: Math.floor(wPx / b) };
  skyCanvas.width = Math.round(wPx); skyCanvas.height = SKY_ICON * b;
  const widget = document.getElementById("widget");
  widget.style.setProperty("--sky-h", SKY_ICON * b + "px");
  widget.style.setProperty("--sky-gap", 1 * b + "px");       // just above the roof, never over it (user tuned this)
  widget.style.setProperty("--sky-over", "0px");
  buildSkyTrack();
  sizeMood(2);                                              // a 48px emoji at every 界面大小, like the gear
}
function skyTarget() {
  if (weather.kind !== "clear") return weather.kind;
  const h = hour();
  return h >= 6 && h < 19 ? "sun" : "moon";
}
function drawIcon(name, cx, cy, scale) {
  const fr = IMG_SKY[name];
  if (!fr || scale <= 0.02) return;
  const fps = name === "rain" ? 6 : name === "sun" ? 3 : 4;
  const img = reduceMotionUI ? fr[0] : fr[Math.floor(realClock * fps) % fr.length];
  // whole screen pixels only: the icon is drawn at an integer size and position,
  // so it never lands between pixels (that is what made it look jagged)
  const size = Math.max(1, Math.round(SKY_ICON * skyGeo.b * scale));
  skx.drawImage(img, Math.round(cx - size / 2), Math.round(cy - size / 2), size, size);
}
function renderSky() {
  if (!skyTrack || !IMG_SKY.sun) return;
  const { b, w, cols } = skyGeo, ox = Math.floor((w - cols * b) / 2);
  const col = Math.round(SKY_ICON / 2 + skyFrac(sim.t) * (cols - SKY_ICON));
  const x = ox + col * b, cy = (SKY_ICON * b) / 2;
  const want = skyTarget();
  if (sky.icon === null) { sky.icon = want; sky.x = x; }
  const wrapped = x < sky.x - w / 2;                          // 06:00: from the right end back to the left
  if (want !== sky.icon || wrapped) { sky.from = sky.icon; sky.fromX = sky.x; sky.icon = want; sky.t0 = realClock; }
  sky.x = x;
  skx.imageSmoothingEnabled = false;
  skx.clearRect(0, 0, w, skyCanvas.height);
  skx.drawImage(skyTrack, 0, 0);
  const p = reduceMotionUI ? 1 : (realClock - sky.t0) / SKY_MORPH;
  const bob = reduceMotionUI || sky.icon === "sun" ? 0 : (Math.sin(realClock * 1.8) > 0.6 ? -b : 0);   // whole units

    drawIcon(sky.from, sky.fromX, cy, back * back * (3 - 2 * back));
    const q = Math.max(0, (p - 0.3) / 0.7), c1 = 1.9;     // ease-out-back: overshoots a little, settles
    const pop = q <= 0 ? 0 : 1 + (c1 + 1) * (q - 1) ** 3 + c1 * (q - 1) ** 2;

    // sparkles fly out from where the change happens

    if (p > 0.25 && p < 0.95) {
      const r = (p - 0.25) / 0.7;
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4 + 0.3, d = (6 + r * 9) * b;
        const size = Math.max(1, Math.round(b * (1 - r) * 1.5));
        skx.fillRect(Math.round(x + Math.cos(a) * d), Math.round(cy + Math.sin(a) * d), size, size);
      }
    }
  } else {
    drawIcon(sky.icon, x, cy + bob, 1);

// ================================================================ moodlets & emotions
// Sims-style. Every moodlet adds points to one emotion; the emotion with the
// most points is how she feels (no moodlets = 平静): 1-2 points "a little",
// 3-5 normal, 6+ "very". Condition moodlets (hungry, rainy...) last while
// their condition holds, the rest run out. All text lives in life_text.js.
/*__LIFE_TEXT_JS__*/
const T = LIFE_TEXT, ML = T.moodlets;
// {书} {游戏} {节目} {零食} anywhere else: any title from the catalogs
Object.assign(T.fill, { 书: T.reading.flatMap(g => g.books), 节目: T.tv.flatMap(k => k.shows),
  游戏: [...T.games, ...T.phoneGames].flatMap(g => g.games), 零食: T.snacks });
const MOOD = Object.fromEntries(D.moods.map(([k, name, color]) => [k, { name, color }]));
const LEVEL_WORD = ["", "有点", "", "非常"];
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
const one = v => (Array.isArray(v) ? pick(v) : v);   // a line, or one of its variants
// "{食物}" -> a random dish; vars pins a value so diary and words agree
function fill(text, vars = {}) {
  vars.名字 ??= nameOf(); vars.她 ??= ta();
  return text.replace(/\{(\S+?)\}/g, (m, k) => vars[k] || (T.fill[k] ? (vars[k] = pick(T.fill[k])) : m));
}
const moods = new Map();          // id -> { until: game minute | null (condition), t: when added }
function addMood(id, { vars = {}, diary = true, words = true } = {}) {
  const m = ML[id];
  if (!m) return;
  const had = moods.has(id);
  moods.set(id, { until: m.min ? sim.t + m.min : null, t: sim.t, vars: had ? moods.get(id).vars : vars });
  if (had) return;                 // refreshed quietly
  if (diary && m.diary) log(fill(one(m.diary), vars));
  if (words && m.say) speak(fill(pick(m.say), vars));
}
function emotion() {
  const sum = {}, last = {};
  for (const [id, m] of moods) {
    const d = ML[id];
    sum[d.emo] = (sum[d.emo] || 0) + d.pts;
    last[d.emo] = Math.max(last[d.emo] ?? -1, m.t);
  }
  let key = "fine", pts = 0;
  for (const [e, p] of Object.entries(sum)) if (p > pts || (p === pts && last[e] > last[key])) { key = e; pts = p; }
  return { key, pts, level: pts >= 6 ? 3 : pts >= 3 ? 2 : 1 };
}
const emoWord = (key, level) => (T.words[key] ? T.words[key][level - 1] : MOOD[key].name);

  const u = parseFloat(getComputedStyle(document.getElementById("widget")).getPropertyValue("--u")) || 4;
  let need = 0;                                         // px needed above the mood row's top
  const mTop = moodrow.getBoundingClientRect().top, rowH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row-h")) || 42;

  booted = false;
  await store.save(null);
  if (!TAURI) try { localStorage.removeItem("buddy-look-v2"); localStorage.removeItem("buddy-look-at"); } catch (e) { /* ignore */ }
  location.reload();
}

// ---------- the desktop window: sized to the game, tray menu events
let lastWin = "", lastTop = null, lastLeft = null, lifted = 0, shifted = 0;
function fitWindow() {
  if (!TAURI) return;
  const w = document.getElementById("widget"), desk = document.querySelector(".desk"), cs = getComputedStyle(desk);
  // the game, plus the settings menu while it is open (it may reach past the house)
  const r = w.getBoundingClientRect();
  let right = r.right, bottom = r.bottom;
  if (!setPop.hidden) { const p = setPop.getBoundingClientRect(); right = Math.max(right, p.right + 8); bottom = Math.max(bottom, p.bottom + 8); }
  const width = Math.ceil(right - r.left + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight));
  const height = Math.ceil(bottom - r.top + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom));
  // room made above the house (makeRoom) moves it down in the window: move
  // the window up as much, so it stays put on screen; give back only what
  // the window really moved (it stops at the top of the screen)
  // (and the same leftward for the pick-a-thing panel)
  const mr = moodrow.getBoundingClientRect(), top = mr.top, left = mr.left;
  let dy = lastTop === null ? 0 : top - lastTop, dx = lastLeft === null ? 0 : left - lastLeft;
  lastTop = top; lastLeft = left;
  if (dy < 0) dy = -Math.min(-dy, lifted);
  if (dx < 0) dx = -Math.min(-dx, shifted);
  if (`${width}x${height}` === lastWin && !dy && !dx) return;
  lastWin = `${width}x${height}`;
  TAURI.core.invoke("fit_window", { width, height, dx, dy })
    .then(m => { const [mx, my] = Array.isArray(m) ? m : [0, +m || 0]; shifted = Math.max(0, shifted + mx); lifted = Math.max(0, lifted + my); })
    .catch(e => TAURI.core.invoke("log_js", { message: `fit_window: ${e}` }));
}
// Moving the window (it has no title bar): press on the empty space around
// the game, the mood row or the time bar; or press on the house's walls or
// floor (not on her or a piece of furniture) and move a little.
function dragWindow() { TAURI.core.invoke("start_drag").catch(e => TAURI.core.invoke("log_js", { message: `start_drag: ${e}` })); }
if (TAURI) {
  const desk = document.querySelector(".desk"), widgetEl = document.getElementById("widget");
  const EMPTY = new Set([document.documentElement, document.body, desk, widgetEl, document.querySelector(".house-col"),
                         moodrow, moodTalk, document.getElementById("skybar"), skyHit]);
  document.addEventListener("mousedown", e => { if (e.button === 0 && EMPTY.has(e.target)) { e.preventDefault(); dragWindow(); } });
  let press = null;
  view.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.pointerType !== "mouse" || sim.mode === "down") return;
    const [x, y] = canvasXY(e);
    press = !buddyHit(x, y) && !clickableAt(x, y) ? { x: e.clientX, y: e.clientY } : null;
  });
  view.addEventListener("pointermove", e => {
    if (press && (e.buttons & 1) && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 3) { press = null; dragWindow(); }
  });
  window.addEventListener("pointerup", () => { press = null; });
}
if (TAURI) {
  const ro = new ResizeObserver(fitWindow);
  ro.observe(document.getElementById("widget")); ro.observe(setPop);
  TAURI.event.listen("app-quit", async () => { await autoSave(); TAURI.core.invoke("exit_app"); });
  TAURI.event.listen("on-top-changed", e => { prefs.onTop = !!e.payload; saveSettings(); buildSettings(); });
}

// ================================================================ loop
let last = performance.now(), uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  realClock += dt;
  const fast = sim.mode === "act" && sim.act === "sleep" ? 8 : 1, run = cardHolds() ? 0 : speed;   // a chance card stops the clock
  step(dt * run * fast, dt * (run ? 1 : 0));
  updateDoors(run ? dt : 0);
  render();
  renderSky();
  renderMood();
  placeRing();
  placeNametag();
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; syncUI(); updateMood(); }
  requestAnimationFrame(frame);
}

document.getElementById("testDown").addEventListener("click", () => { if (sim.mode !== "down") collapse(pick(EXTREME)); });

(async function boot() {
  let sv = null, st = null;
  try { sv = migrate(await store.load()); } catch (e) { sv = null; }
  try { st = await settingsStore.load(); } catch (e) { st = null; }
  if (sv) restore(sv);
  applySettings(st);
  await refreshSaveDir();
  // her look may have been changed on the 造型室 page since (browser only)
  let shared = null, sharedAt = 0;
  if (!TAURI) try { shared = JSON.parse(localStorage.getItem("buddy-look-v2") || "null"); sharedAt = +localStorage.getItem("buddy-look-at") || 0; } catch (e) { /* storage unavailable */ }
  if (!sv) setLook(shared && typeof shared === "object" ? shared : doll.PRESETS.f);
  else if (shared && typeof shared === "object" && sharedAt > sv.savedAt) setLook({ ...shared, name: shared.name || look.name });
  namedAs = namedAs || nameOf();
  studio = BuddyStudio(studioEl, doll, D.doll, { look, previewScale: 3, thumbH: 40, onChange: changeLook, onClose: closeWardrobe });
  fit();
  if (TAURI && !st && !sv) {      // first run of the desktop app: the biggest size that leaves most of the screen free
    const w = document.getElementById("widget"), k = prefs.scale / 100;
    const need = (w.offsetWidth + 80) / k, needH = (w.offsetHeight + 112) / k;
    prefs.scale = [...SCALES].reverse().find(v => need * v / 100 <= screen.availWidth * 0.6 && needH * v / 100 <= screen.availHeight * 0.6) || SCALES[0];
    fit();
  }
  window.addEventListener("resize", fit);
  await loadAssets();
  await loadSkyIcons();
  await loadMoodIcons();
  await loadWeatherMasks();
  weather.kind = weatherAt(sim.t);
  if (!sv) {
    log("—— 第 1 天 · 春 ——", "day");
    log(`${nameOf()}还在被窝里睡觉。`);
  } else {
    log(`—— 回来啦 · 第 ${Math.floor(sim.t / 1440) + 1} 天 ——`, "day");
  }
  if (TAURI) TAURI.core.invoke("set_on_top", { on: prefs.onTop }).catch(() => {});
  booted = true;
  updateMood();
  syncUI();
  render();
  requestAnimationFrame(frame);
  if (!st) saveSettings();
  if (!sv) autoSave();
})();
</script>

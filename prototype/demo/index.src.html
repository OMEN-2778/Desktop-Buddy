<title>Buddy 小屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: the page is just the house, centred like a widget on a desktop.
   Everything else hides until asked for: the needs are four dots beside the
   house that stretch into bars when the pointer comes near. */
:root {
  --bg: #e6e3ee;
  --dither: #dcd8e6;
  --panel: #f7f6fb;
  --panel-2: #eceaf2;
  --ink: #22182a;
  --muted: #5e5b71;
  --edge: #22182a;
  --bevel-hi: #ffffff;
  --bevel-lo: #bab7c9;
  --shadow: #8f8ba2;
  --accent: #46619e;
  --accent-hi: #6c90c8;
  --accent-lo: #2f3c6d;
  --accent-ink: #f7f6fb;
  --accent-soft: #cfdcf2;
  --focus: #d29b30;
  /* needs: track ring + three states (from the sketch) */
  --ring: #ffffff;
  --need-ok: #b2d683;
  --need-warn: #f5b675;
  --need-low: #e87272;
  --need-label: rgba(34, 24, 42, 0.62);
  --u: 2px;              /* one UI pixel = one house pixel on screen (set by fit) */
  --font: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131f; --dither: #1d1828; --panel: #2b2538; --panel-2: #332c42; --ink: #f7f6fb; --muted: #bab7c9;
    --edge: #0d0a12; --bevel-hi: #433a54; --bevel-lo: #1f1a2a; --shadow: #0d0a12;
    --accent: #6c90c8; --accent-hi: #a6c5e7; --accent-lo: #2f3c6d; --accent-ink: #141228; --accent-soft: #34446a; --focus: #efc452;
    --ring: #f4f1f8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131f; --dither: #1d1828; --panel: #2b2538; --panel-2: #332c42; --ink: #f7f6fb; --muted: #bab7c9;
  --edge: #0d0a12; --bevel-hi: #433a54; --bevel-lo: #1f1a2a; --shadow: #0d0a12;
  --accent: #6c90c8; --accent-hi: #a6c5e7; --accent-lo: #2f3c6d; --accent-ink: #141228; --accent-soft: #34446a; --focus: #efc452;
  --ring: #f4f1f8; color-scheme: dark;
}
* { box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; }
body {
  background-color: var(--bg);
  background-image: repeating-conic-gradient(var(--dither) 0 25%, transparent 0 50%);
  background-size: 6px 6px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  display: grid;
  grid-template-rows: 1fr auto;
  grid-template-columns: minmax(0, 1fr);
}
.desk {
  display: grid;
  place-items: center;
  padding-block: calc(var(--row-h, 42px) + 24px + var(--room-top, 0px)) 32px;   /* top: the gear + diary row, and room for what opens above it */
  padding-left: calc(max(16px, env(safe-area-inset-left, 0px)) + var(--room-left, 0px));   /* + room for the pick-a-thing panel */
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.widget { position: relative; }
#view { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }

/* ---------- needs: dots that stretch into bars ----------
   Sizes come from JS (fit): --u is one house pixel on screen, --bh the dot /
   bar height, --bar-w the open length; the column is exactly as tall as the
   house and sits just left of it. Bars only ever grow to the left. */
.widget { display: flex; align-items: flex-end; gap: var(--g, 12px); padding-left: calc(var(--bar-w, 200px) - var(--bh, 24px)); }
.needs {
  position: relative;
  flex: none;
  height: var(--house-h, 236px);   /* flush with the house, not with the studio above it */
  width: var(--bh, 24px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;  /* first dot flush with the top, last with the bottom */
  align-items: flex-end;           /* right-anchored: bars grow to the left */
  outline: none;
}
.needs::before {                   /* invisible hover zone around the dots */
  content: ""; position: absolute; inset: -14px -10px -14px -14px;
}
.needs.open::before { left: calc(var(--bh, 24px) - var(--bar-w, 200px) - 14px); }
.need {
  position: relative;
  flex: none;
  width: var(--bh, 24px);          /* JS springs this between the dot and the open bar */
  height: var(--bh, 24px);
  background: var(--ring);
  clip-path: var(--clip-track);
}
.need .fill {
  position: absolute;
  /* 2px white ring; once open (--p springs 0 -> 1) the fill starts right of
     the icon slot, so the icon never hides the fill's start or its maximum */
  --room: calc(100% - var(--u) * 4 - var(--slot, 30px) * var(--p, 0));
  top: calc(var(--u) * 2); bottom: calc(var(--u) * 2);
  left: calc(var(--u) * 2 + var(--slot, 30px) * var(--p, 0));
  width: min(var(--room), var(--fmin) + (var(--room) - var(--fmin)) * var(--v, 1) * var(--p, 0));
  background-color: var(--c, var(--need-ok));
  background-image: var(--stripes);
  background-size: calc(var(--u) * 8) calc(var(--u) * 8);
  image-rendering: pixelated;
  clip-path: var(--clip-fill);
  animation: crawl 3.2s steps(8) infinite;
  transition: background-color .3s;
}
.need .fill::before {              /* a 1px gloss line along the top */
  content: ""; position: absolute; top: var(--u); left: calc(var(--u) * 2); right: calc(var(--u) * 2);
  height: var(--u); background: rgba(255, 255, 255, .38);
}
.need.low .fill { animation: crawl 3.2s steps(8) infinite, pulse 1.4s ease-in-out infinite; }
@keyframes crawl { from { background-position: 0 0; } to { background-position: calc(var(--u) * -8) 0; } }
@keyframes pulse { 50% { filter: brightness(1.18) saturate(1.1); } }
.need img {
  position: absolute;
  left: calc(var(--u) * 3);
  top: 50%;
  width: var(--icon, 24px);
  height: var(--icon, 24px);
  transform: translateY(-50%) scale(.2);
  image-rendering: pixelated;
  opacity: 0;
  pointer-events: none;
}
.needs.open .need img {
  animation: pop .5s cubic-bezier(.3, 1.9, .5, 1) both;
  animation-delay: calc(var(--i, 0) * 55ms + 200ms);
}
@keyframes pop {
  from { opacity: 0; transform: translateY(-50%) scale(.2) rotate(-12deg); }
  to   { opacity: 1; transform: translateY(-50%) scale(1) rotate(0); }
}
.needs:focus-visible::after {
  content: ""; position: absolute; inset: -6px; border: 2px dashed var(--focus); pointer-events: none;
}

/* ---------- 造型室: opens UPWARD above the gear row, as wide as the house ----------
   The house and its UI never move (user): the slot hangs above the mood row
   and grows from 0 to the studio's height upward; the page (or the app
   window) makes room above it (--room-top, see makeRoom). The clip keeps
   room for the studio's pixel outline and drop shadow. */
.house-col { display: grid; min-width: 0; width: var(--house-w, 684px); }
.studio-slot {
  position: absolute; z-index: 2; bottom: calc(100% + var(--row-h, 42px) + 20px); left: calc(-1 * var(--studio-dx, 0px));   /* phones: also spans the needs column (see fit) */
  display: grid;
  width: var(--studio-w, 684px);
  grid-template-rows: 0fr;
  transition: grid-template-rows .42s cubic-bezier(.3, 1.2, .5, 1);
}
.studio-slot.open { grid-template-rows: 1fr; }
.studio-clip {
  min-height: 0; overflow: hidden;
  padding: var(--u) calc(var(--u) * 3) calc(var(--u) * 3) var(--u);
  margin: calc(-1 * var(--u)) calc(-3 * var(--u)) calc(-3 * var(--u)) calc(-1 * var(--u));
}
#studio { --sp: var(--u); width: var(--studio-w, 684px); }

/* ---------- 新手教程: a picture book, opening upward like the 造型室 ----------
   Contents on the left (a 目录 button on a narrow guide), the page on the
   right: title, a screenshot with numbered marks, the text, a tip. Pointing
   at a line lights up its marks. */
.guide-slot { left: var(--guide-left, 0px); width: var(--guide-w, 684px); }
.guide {
  --sp: var(--u); width: var(--guide-w, 684px); height: var(--guide-h, 520px);
  display: flex; flex-direction: column; font-size: 14px; line-height: 1.7;
}
.guide[hidden] { display: none; }
.gd-count { font-weight: 400; font-size: 12px; letter-spacing: .06em; opacity: .7; margin-left: 10px; font-variant-numeric: tabular-nums; }
.guide .gd-toc { display: none; }
.guide.narrow .gd-toc { display: inline-block; }
.gd-body { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 12em minmax(0, 1fr); }
.guide.narrow .gd-body { grid-template-columns: minmax(0, 1fr); }
.gd-nav { overflow-y: auto; background: var(--panel-2); box-shadow: inset calc(-1 * var(--sp)) 0 0 var(--edge); padding: 6px 0; scrollbar-width: thin; }
.guide.narrow .gd-nav { display: none; position: absolute; inset: 0; z-index: 3; box-shadow: none; animation: gdToc .22s ease-out; }
.guide.narrow.toc .gd-nav { display: block; }
@keyframes gdToc { from { opacity: 0; transform: translateY(-8px); } }
.gd-nav ol { list-style: none; margin: 0; padding: 0; }
.guide .gd-nav button {
  display: flex; gap: 6px; align-items: baseline; width: calc(100% - 10px); margin: 1px 4px 1px 6px; padding: 3px 8px;
  text-align: left; font-size: 12.5px; line-height: 1.45; background: transparent; box-shadow: none;
}
.guide .gd-nav button:hover { background: var(--panel); }
.guide .gd-nav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.gd-nav button i { font-style: normal; min-width: 1.5em; opacity: .55; font-variant-numeric: tabular-nums; }
.gd-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.gd-page { flex: 1; overflow-y: auto; padding: 12px 18px 16px; scrollbar-width: thin; outline: none; }
.gd-page.in-r { animation: gdInR .28s cubic-bezier(.2, .8, .3, 1); }
.gd-page.in-l { animation: gdInL .28s cubic-bezier(.2, .8, .3, 1); }
@keyframes gdInR { from { opacity: 0; transform: translateX(22px); } }
@keyframes gdInL { from { opacity: 0; transform: translateX(-22px); } }
.gd-page h3 { margin: 0 0 10px; font-size: 18px; letter-spacing: .04em; }
/* the picture stays in view while the text scrolls under it, so a pointed-at line can show its marks */
.gd-fig { position: sticky; top: -12px; z-index: 1; margin: -12px -18px 8px; display: flex; justify-content: center; padding: 18px 24px 12px; background: var(--panel); }
.gd-pic { position: relative; display: inline-block; line-height: 0; box-shadow: 0 0 0 var(--sp) var(--edge), calc(var(--sp) * 2) calc(var(--sp) * 2) 0 var(--sp) var(--shadow); }
.gd-pic img { display: block; max-width: 100%; width: auto; height: auto; max-height: var(--fig-h, 220px); }
/* the marks: a number, and an outline that shows while its line is pointed at */
.gd-mark { position: absolute; pointer-events: none; outline: 2px solid transparent; outline-offset: 1px; transition: outline-color .15s, background-color .15s; }
.gd-mark.hot { outline-color: var(--focus); background: rgba(239, 196, 82, .22); box-shadow: 0 0 0 4px rgba(255, 255, 255, .5); }
.gd-mark .gd-n {
  position: absolute; left: -7px; top: -7px; pointer-events: auto; cursor: default;
  animation: gdPop .4s cubic-bezier(.3, 1.6, .5, 1) backwards; animation-delay: calc(.15s + var(--k) * 70ms);
}
.gd-mark.hot .gd-n { animation: gdBob .5s ease-in-out infinite alternate; }
@keyframes gdPop { from { opacity: 0; transform: scale(.2); } }
@keyframes gdBob { to { transform: translateY(-3px) scale(1.15); } }
.gd-n {
  display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 4px; margin: 0 2px;
  border-radius: 10px; background: var(--focus); color: #22182a; font-size: 12px; font-weight: 700; line-height: 1;
  font-style: normal; vertical-align: 1px; box-shadow: 0 0 0 2px #22182a, 0 0 0 3.5px #fff;
}
.gd-lead { margin: 0 0 8px; }
.gd-points { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.gd-points li { padding: 2px 8px 2px 4px; transition: background-color .15s; }
.gd-points li.plain { padding-left: 26px; position: relative; }
.gd-points li.plain::before { content: ""; position: absolute; left: 11px; top: .75em; width: 6px; height: 6px; background: var(--muted); }
.gd-points li.hot { background: var(--accent-soft); }
.gd-tip {
  margin: 12px 2px 4px; padding: 8px 12px; background: var(--accent-soft);
  box-shadow: 0 calc(-1 * var(--sp)) 0 0 var(--edge), 0 var(--sp) 0 0 var(--edge), calc(-1 * var(--sp)) 0 0 0 var(--edge), var(--sp) 0 0 0 var(--edge);
}
.gd-tip > b:first-child { display: inline-block; margin-right: 8px; padding: 0 6px; background: var(--focus); color: #22182a; font-size: 12px; }
.gd-foot { display: flex; align-items: center; gap: 8px; padding: 6px 12px 8px; box-shadow: inset 0 var(--sp) 0 0 var(--edge); }
.guide .gd-foot button { padding: 3px 12px; font-weight: 700; white-space: nowrap; }
.guide .gd-foot button:disabled { opacity: .4; cursor: default; transform: none; }
.guide .gd-next { background: var(--accent); color: var(--accent-ink); }
.guide .gd-next:hover { background: var(--accent-hi); }
.gd-dots { flex: 1; display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; }
.gd-dots i { width: 6px; height: 6px; background: var(--bevel-lo); transition: width .25s, background-color .25s; }
.gd-dots i.on { width: 16px; background: var(--accent); }
@media (prefers-reduced-motion: reduce) { .gd-page.in-r, .gd-page.in-l, .gd-mark .gd-n, .gd-mark.hot .gd-n, .guide.narrow .gd-nav { animation: none; } }

/* ---------- sky bar: one day from 06:00 (left) to 06:00 (right) above the house,
   exactly as wide as it. The icon walks along it with the clock and turns
   into the moon at dusk, or a rain cloud / snowflake when the weather turns.
   Drawn in a canvas at one UI pixel per bar unit (set by fit). */
.skybar { position: relative; z-index: 2; width: var(--house-w, 684px); height: var(--sky-h, 48px); margin-bottom: var(--sky-gap, 12px); pointer-events: none; }
#sky { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
/* the bar hangs over the house's top edge; only the part above the house takes the pointer (tooltip) */
.sky-hit { position: absolute; left: 0; right: 0; top: 0; bottom: var(--sky-over, 0px); pointer-events: auto; }
.sky-tip {
  position: absolute; bottom: calc(100% + 6px); left: 0; transform: translateX(-50%);
  white-space: nowrap; pointer-events: none; z-index: 3;
  background: var(--panel); color: var(--ink); font-size: 12px; font-weight: 500; letter-spacing: .04em;
  padding: 2px 10px;
  box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge), 3px 3px 0 0 var(--shadow);
}
.sky-tip[hidden] { display: none; }
.sky-tip { opacity: 0; transform: translate(-50%, 6px) scale(.6); transform-origin: 50% 100%; transition: opacity .16s, transform .3s cubic-bezier(.3, 1.6, .5, 1); }
.sky-tip.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
.skybar.tipping { z-index: 9; }   /* while its tip is up, the bar sits over the mood row (user: not under her words) */
/* on a festival (or her birthday) its name rides the time bar in a little
   rounded tag right of the sun / moon; when the icon is too near the bar's
   end for it to fit, it fades away (the day is nearly over anyway; user) */
.sky-fest {
  position: absolute; top: 50%; left: 0; z-index: 2; pointer-events: none; white-space: nowrap;
  transform: translate(var(--fx, 0px), -50%); isolation: isolate;
  font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #fff; padding: 2px 9px; line-height: 1.35;
  filter: drop-shadow(2px 2px 0 var(--shadow)); transition: opacity .35s;
}
.sky-fest::before { content: ""; position: absolute; inset: -2px; z-index: -2; background: #fff; clip-path: var(--clip-btn); }
.sky-fest::after { content: ""; position: absolute; inset: 0; z-index: -1; background: #e1725b; clip-path: var(--clip-btn); }
.sky-fest.gone { opacity: 0; }
.sky-fest[hidden] { display: none; }

/* ---------- mood: an emoji in a round frame at the top-left of the sky bar;
   to its right Buddy's own thoughts / words in a light-wood bubble with a
   tail pointing at her face, running to the house's right edge. It pops in
   and fades out; it never covers the house. */
.moodrow {
  position: relative; z-index: 3; width: var(--house-w, 684px);   /* the emoji lines up with the house's left edge, never the open bars */
  display: flex; align-items: center; gap: calc(var(--sky-b, 3px) * 2);   /* her words sit close to the emoji (user) */
  height: var(--mood-h, 72px); margin-bottom: calc(var(--sky-b, 3px) * 1);
}
.mood-face { position: relative; flex: none; width: var(--mood-d, 78px); height: var(--mood-d, 78px); cursor: pointer; outline: none; }
.mood-face canvas {
  display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges;
  transition: transform .35s cubic-bezier(.3, 1.8, .5, 1);
}
.mood-face:hover canvas, .mood-face[aria-expanded="true"] canvas { transform: translateY(calc(var(--sky-b, 3px) * -1)); }   /* a little hop, whole pixels only */
.mood-face:focus-visible::after { content: ""; position: absolute; inset: -4px; border: 2px dashed var(--focus); }
.mood-talk {
  position: relative; flex: 1 1 auto; min-width: 0; height: 100%;
  display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 5px;
  padding-right: 0;     /* the bubble's outline ends exactly at the house's right edge */
}
.pop {
  --pe: var(--edge);
  position: relative; max-width: 100%; display: flex; align-items: baseline; gap: 8px;
  font-size: var(--say-fs, 32px); line-height: 1.35; padding: 8px 20px; color: var(--ink);
  isolation: isolate; filter: drop-shadow(3px 3px 0 var(--shadow));
  transform-origin: left center;
  animation: popin .42s cubic-bezier(.3, 1.6, .5, 1) both;
  transition: translate .3s cubic-bezier(.3, 1.4, .5, 1), filter .3s;
}
.pop span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* (the pop-in animation pins opacity/transform, so fades use translate + filter) */
.pop.out { translate: 0 -4px; filter: drop-shadow(3px 3px 0 var(--shadow)) opacity(0); }
.mood-talk.listing .pop { translate: 16px 0; filter: drop-shadow(3px 3px 0 var(--shadow)) opacity(0); pointer-events: none; }
.pop[hidden] { display: none; }
/* the bubble is ONE pixel shape (sayClip, made in fit): a 2px outline layer
   and a fill layer, both ends full half-circles like the diary box above it
   (user: no tail, the corners didn't match). In the --tail gap between her
   face and the bubble, two little round bubbles (small, then bigger) show
   the words come from the emoji, like a thought bubble. */
.pop .bg { position: absolute; inset: 0 0 0 calc(-1 * var(--tail, 16px)); z-index: -1; background: var(--pe); clip-path: var(--clip-say); }
.pop .bg::after { content: ""; position: absolute; inset: 0; background: var(--pf); clip-path: var(--clip-say-in); }
.pop .dot { position: absolute; z-index: -1; background: var(--pe); clip-path: var(--clip-dot); animation: dotin .32s cubic-bezier(.3, 1.6, .5, 1) both; }
.pop .dot::after { content: ""; position: absolute; inset: 2px; background: var(--pf); clip-path: var(--clip-dot-in); }
.pop .d1 { --clip-dot: var(--clip-dot-xs); --clip-dot-in: var(--clip-dot-xs-in); width: 6px; height: 6px; left: calc(1px - var(--tail, 18px)); top: calc(50% - 0px); }
.pop .d2 { --clip-dot: var(--clip-dot-s); --clip-dot-in: var(--clip-dot-s-in); width: 8px; height: 8px; left: calc(9px - var(--tail, 18px)); top: calc(50% - 6px); animation-delay: .06s; }
@keyframes dotin { from { transform: scale(0); } }
.pop.say {
  --pe: #8a6446; --pf: #ecd5ad; color: #3d2a1e; font-weight: 700; margin-left: var(--tail, 16px);
  height: var(--say-h, 60px); padding-block: 0; align-items: center;   /* whole-pixel height keeps every step crisp */
}
.pop .who { font-style: normal; color: #9a6a3c; margin-right: .15em; }   /* "妈妈：", "【音符】", "评论：" */
.pop.other span { color: #9a6a3c; }                                          /* and the whole line someone else says */
@keyframes popin { from { opacity: 0; transform: scale(.5) translateX(-10px); } to { opacity: 1; transform: none; } }
/* her moodlets: hovering (or tapping) the emoji swaps her words for a row of
   pills in the same place, so nothing gets covered. First pill = the
   emotion in its own colour, then each moodlet (name, points) tinted with its
   emotion's colour; the tint shrinks as its time runs out. */
.mood-list {   /* up to two rows of pills fit in the mood row's height */
  position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: center; align-items: center;
  gap: 6px 8px; padding-left: 4px; overflow: hidden; padding-bottom: 3px;
}
.mood-list[hidden] { display: none; }
/* every pill ("还有 N 个" pointed at): the list grows up from the row's bottom */
.mood-list.all { inset: auto 0 0 0; padding-bottom: 0; align-content: flex-end; overflow: visible; transition: height .3s cubic-bezier(.3, 1.3, .5, 1); }
.mood-list.all .mp.late { animation: mpLate .4s cubic-bezier(.3, 1.6, .5, 1) backwards; animation-delay: calc(var(--j) * 40ms); }
@keyframes mpLate { from { opacity: 0; transform: translateY(10px) scale(.4); } }
.mp {
  --tint: color-mix(in srgb, var(--c) 42%, var(--panel-2));
  position: relative; isolation: isolate; flex: none; display: flex; align-items: center; gap: 7px;
  white-space: nowrap; font-size: var(--mp-fs, 15px); font-weight: 700; line-height: 1.3; letter-spacing: .02em;
  padding: 6px 14px; color: var(--ink); cursor: default;

<script>

const prefs = { scale: TAURI ? 100 : "auto", onTop: false, autosave: true, guided: false, autoUpdate: true };   // guided: the guide has been seen

// 界面大小 counts SCREEN pixels: 25% = one game pixel is one pixel of the

const SCALES = [25, 50, 75, 100, 125, 150, 175, 200];

// ================================================================ Buddy's look
const doll = BuddyDoll(D.doll);
let look = doll.normalize(doll.PRESETS.f);
let ramps = doll.rampsOf(look);
function setLook(l) {
  look = doll.normalize(l);

  rotCache.clear();

}
// her name and 她/他 (by gender) wherever the page talks about her
const nameOf = () => look.name, ta = () => doll.pronoun(look);
// Chinese running text gets a space where it meets Latin letters or digits
// ("和 Buddy 聊天", "Buddy 的小屋"): applied to every line the page writes
const spaced = t => t.replace(/([\u3400-\u9fff])([A-Za-z0-9])/g, "$1 $2").replace(/([A-Za-z0-9])([\u3400-\u9fff])/g, "$1 $2");
function syncNames() {
  const n = nameOf();
  document.title = spaced(`${n}的小屋`);
  const set = (id, attr, text) => { const el = document.getElementById(id); if (el) el.setAttribute(attr, spaced(text)); };
  set("needs", "aria-label", `${n}的状态（饱腹、精力、清洁、如厕、社交、开心）`);
  set("moodTip", "aria-label", `${n}现在的心情`);
  set("ring", "aria-label", `和${n}互动`);
  set("view", "aria-label", `小屋剖面，${n}在里面生活。点家具让${ta()}去做事，点衣柜打开造型室，点${ta()}弹出互动菜单。`);
}

const DW = doll.W, DH = doll.H;
const dollCache = new Map(), rotCache = new Map();
function rowsOf(buf, w, r) { return buf.slice(r * w * 4, (r + 1) * w * 4); }
function applyPose(buf, pose, lk = look) {
  const W4 = DW * 4, P = D.doll.pose[lk.bottomStyle];
  if (pose === "walkL" || pose === "walkR") {   // lift one foot by a pixel
    const out = buf.slice();
    const c0 = pose === "walkL" ? 0 : DW / 2, c1 = c0 + DW / 2;
    for (let r = P.legStart; r < DH; r++) {
      for (let c = c0; c < c1; c++) {
        const src = (r * DW + c) * 4, dst = ((r - 1) * DW + c) * 4;
        for (let k = 0; k < 4; k++) out[dst + k] = buf[src + k];
        if (r === DH - 1) for (let k = 0; k < 4; k++) out[src + k] = 0;
      }
    }
    return out;
  }
  if (pose === "sit") {                         // drop the thighs: head sinks, knees forward
    const keep = [];
    for (let r = 0; r < DH; r++) if (!P.sitDrop.includes(r)) keep.push(r);
    const out = new Uint8ClampedArray(buf.length);
    const off = DH - keep.length;
    keep.forEach((r, i) => out.set(rowsOf(buf, DW, r), (i + off) * W4));
    return out;
  }
  return buf;
}
function dollCanvas(f, pose = "stand", cropRows = DH) {
  const key = JSON.stringify([f.expr, f.look, f.bob, f.sway, f.wave ?? null, pose, cropRows]);
  if (dollCache.has(key)) return dollCache.get(key);
  const c = doll.toCanvas(applyPose(doll.pixels(look, f, ramps), pose), DW, DH, cropRows);
  dollCache.set(key, c);
  return c;
}
function backCanvas(f, pose = "stand") {   // seen from behind, climbing the stairs
  const key = JSON.stringify(["back", f.bob, f.sway, pose]);
  if (dollCache.has(key)) return dollCache.get(key);
  const c = doll.toCanvas(applyPose(doll.pixelsBack(look, f, ramps), pose), DW, DH);
  dollCache.set(key, c);
  return c;
}
const emoteCache = new Map();
function emoteCanvas(name) {
  if (emoteCache.has(name)) return emoteCache.get(name);
  const e = doll.emotePixels(name, ramps);
  const c = doll.toCanvas(e.buf, e.w, e.h);
  emoteCache.set(name, c);
  return c;
}

// ================================================================ house assets
const IMG = {};
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function loadAssets() {
  IMG.day = await loadImg(D.bg.day);
  IMG.night = await loadImg(D.bg.night);
  IMG.gap = {}; for (const d of D.doors) IMG.gap[d.id] = await loadImg(d.gap);
  IMG.leaf = {}; for (const [k, v] of Object.entries(D.leaves)) IMG.leaf[k] = await loadImg(v);
  IMG.ov = {}; for (const [k, v] of Object.entries(D.overlays)) IMG.ov[k] = await loadImg(v.src);
  IMG.click = {}; for (const [k, v] of Object.entries(D.clickables)) IMG.click[k] = await loadImg(v.src);
  IMG.trip = {}; for (const [k, v] of Object.entries(D.trip)) IMG.trip[k] = await loadImg(v);
  IMG.out = {};

    : Object.fromEntries(await Promise.all(Object.entries(v).map(async ([k, x]) => [k, await deep(x)])));
  for (const [k, v] of Object.entries(D.outside)) IMG.out[k] = await deep(v.img);   // every picture of every place
  IMG.win = {};
  for (const [k, v] of Object.entries(D.windows)) {
    IMG.win[k] = {};
    for (const key of ["day0", "day1", "day2", "night0", "night1", "night2", "drawn"]) IMG.win[k][key] = await loadImg(v[key]);
  }
  IMG.tv = {}; for (const [c, fr] of Object.entries(D.screens.tv.channels)) IMG.tv[c] = await Promise.all(fr.map(loadImg));
  IMG.mon = {}; for (const [g, fr] of Object.entries(D.screens.monitor.games)) IMG.mon[g] = await Promise.all(fr.map(loadImg));
  IMG.app = {}; for (const [g, fr] of Object.entries(D.screens.monitor.apps)) IMG.app[g] = await Promise.all(fr.map(loadImg));
  IMG.fx = {}; for (const [k, v] of Object.entries(D.fx)) IMG.fx[k] = await Promise.all(v.frames.map(loadImg));
  buildClickables();
}
function drawOverlay(ctx, name) { const o = D.overlays[name]; ctx.drawImage(IMG.ov[name], o.x, o.y); }

// ================================================================ walking
// The floors are flat; the only way between them is the flight in the
// stairwell, which runs straight back into the screen: Buddy climbs it with
// her back to us and comes down facing us. Each trip is its own short
// polyline (along the floor, up or down the stairs, along again) and her
// position is the distance sim.s walked along it.
const FLOOR_Y = D.floors, STAIR_X = D.stair.x;
const MID_Y = (FLOOR_Y[0] + FLOOR_Y[1]) / 2;
const storeyOfY = y => (y < MID_Y ? 1 : 0);
function planRoute(fx, fy, tx, ty) {
  if (fy === ty) return [[fx, fy], [tx, ty]];
  return [[fx, fy], [STAIR_X, fy], [STAIR_X, ty], [tx, ty]];
}
function routeLength(r) {
  let L = 0;
  for (let i = 1; i < r.length; i++) L += Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
  return L;
}
function routePos(r, s) {   // -> { x, y, dy }: dy < 0 while climbing, > 0 coming down
  for (let i = 1; i < r.length; i++) {
    const [x0, y0] = r[i - 1], [x1, y1] = r[i], L = Math.hypot(x1 - x0, y1 - y0);
    if (s <= L || i === r.length - 1) {
      const t = L ? Math.max(0, Math.min(1, s / L)) : 1;
      return { x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, dy: t < 1 ? Math.sign(y1 - y0) : 0 };
    }
    s -= L;
  }
  return { x: r[0][0], y: r[0][1], dy: 0 };
}
const here = () => routePos(sim.route, sim.s);
// doors this trip walks through: [door id, x] on the storey it crosses them
function doorsOn(r) {
  const out = [];
  for (let i = 1; i < r.length; i++) {
    const [x0, y0] = r[i - 1], [x1, y1] = r[i];
    if (y0 !== y1) continue;
    for (const d of D.doors) {
      const dx = d.x + 2;
      if (d.storey === storeyOfY(y0) && dx > Math.min(x0, x1) && dx < Math.max(x0, x1)) out.push([d.id, dx]);
    }
  }
  return out;
}
function roomAt(p) {
  if (sim.place !== "home") return "outside";
  if (p.dy) return "stairs";
  const storey = storeyOfY(p.y);
  for (const [k, [st, x0, x1]] of Object.entries(D.roomX)) if (st === storey && p.x >= x0 && p.x < x1) return k;
  return "stairs";
}

// ================================================================ simulation
const ACTS = {

  // going out (user): to the front door and out / back to it from outside and in; a stroll out there
  go_out:  { spot: "front_door", label: "出门", emote: null, dur: 1, log: null },
  go_home: { spot: "out_door",   label: "回家", emote: null, dur: 1, log: null },

  bench:   { spot: "out_x",      label: "坐长椅", emote: null, dur: 1, log: null },   // the park: till she goes home
  mall:    { spot: "out_x",      label: "逛商场", emote: null, dur: 1, log: null },   // the mall: on and on
};
const EFFECT = {   // per game minute while doing it
  sleep: { energy: 0.2 }, eat: { hunger: 4 }, snack: { hunger: 5 }, bath: { hygiene: 3.2, fun: 0.2 },
  toilet: { bladder: 22 }, wash: { hygiene: 2.4 }, towel: { hygiene: 1.6 },
  computer: { fun: 1.4, energy: -0.03 }, tv: { fun: 1.1 }, read: { fun: 0.8 },
  window: { fun: 0.4 }, water_living: { fun: 0.5 }, water_study: { fun: 0.5 }, art: { fun: 0.4 }, dress: { fun: 0.6 }, cook: { fun: 0.2 },
  pc_video: { social: 1.8, fun: 0.6 }, pc_forum: { social: 1.0, fun: 0.8 }, pc_code: { fun: 0.3, energy: -0.04 },
  phone_call: { social: 2.2 }, phone_video: { social: 1.8, fun: 0.5 }, phone_feed: { social: 0.6, fun: 0.9 },
  phone_text: { social: 1.6 }, phone_game: { fun: 1.3 }, dance: { fun: 1.8, energy: -0.1, hygiene: -0.1 },
  stroll: { fun: 0.5 }, bench: { fun: 0.35 }, mall: { fun: 0.6, social: 0.15 },
};
// Pace (user: needs came back too fast): every activity but sleep takes
// PACE times as long and fills needs PACE times slower, so a need takes a
// while to come back while a day still has room for all of them.
const PACE = 2;
for (const [k, a] of Object.entries(ACTS)) if (k !== "sleep") a.dur *= PACE;
for (const [k, e] of Object.entries(EFFECT)) if (k !== "sleep") for (const n in e) if (e[n] > 0) e[n] /= PACE;
// per game minute. Social runs dry in two days (user); the bladder in ~5 hours
const DECAY = { hunger: 0.115, energy: 0.065, hygiene: 0.045, bladder: 0.3, social: 100 / 2880, fun: 0.11 };
const NEED_NAMES = { hunger: "饱腹", energy: "精力", hygiene: "清洁", bladder: "如厕", social: "社交", fun: "开心" };

const sim = {
  t: 6 * 60 + 52,                           // game minutes since day 1, 00:00
  needs: { hunger: 62, energy: 88, hygiene: 70, bladder: 45, social: 72, fun: 64 },
  route: [[D.spots.bed[1], FLOOR_Y[1]]], s: 0, target: 0, crossing: [], mode: "act", act: "sleep", actEnd: 7 * 60 + 600,
  facing: 1, walkDist: 0, idleUntil: 0, queue: [], recent: [],
  poke: 0, lastDay: 1, sleptTonight: 420, meal: null, down: null, graceUntil: 0,
};
let speed = 3;

const hour = () => (sim.t % 1440) / 60;
const clamp = v => Math.max(0, Math.min(100, v));
const fmt = t => { const m = Math.floor(t % 1440); return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };

const logEl = document.getElementById("log");
// (the diary box over her speech bubble shows the same list: see syncDiary)
const diaryEl = document.getElementById("diary"), diaryBox = document.getElementById("diaryBox");

let diaryOn = false;
function log(text, cls, talk = null) {   // talk: [[who, line], ...], a whole conversation kept with the line

  const li = document.createElement("li");
  if (cls) { li.className = cls; li.textContent = text; }
  else li.innerHTML = `<time>${fmt(sim.t)}</time><span></span>`, li.querySelector("span").textContent = text;
  if (talk && talk.length) li._talk = talk;

function choose() {
  if (sim.place !== "home") return chooseOutside();
  const h = hour(), n = sim.needs, r = () => Math.random();
  const meal = (h >= 7 && h < 9) || (h >= 11.5 && h < 13) || (h >= 18 && h < 20);
  const score = {
    sleep: (h >= 22.5 || h < 6) ? 300 : n.energy < 15 ? 150 : 0,
    cook: n.hunger < 55 ? (100 - n.hunger) * 1.3 + (meal ? 40 : 0) : (meal && n.hunger < 75 ? 50 : 0),
    snack: n.hunger < 40 && !meal ? (100 - n.hunger) * 0.6 : 0,
    bath: n.hygiene < 55 ? (100 - n.hygiene) * 1.1 + (h >= 20 && h < 22.5 ? 30 : 0) : 0,
    computer: (100 - n.fun) * 1.0 + r() * 25,
    tv: (100 - n.fun) * 0.9 + r() * 25 + (h >= 19 ? 15 : 0),
    read: (100 - n.fun) * 0.8 + r() * 25,
    toilet: n.bladder < 12 ? 400 : n.bladder < 35 ? (100 - n.bladder) * 1.6 : n.bladder < 55 ? 6 + r() * 8 : 0,
    phone_text: (100 - n.social) * 0.8 + r() * 15,
    phone_feed: (100 - n.fun) * 0.5 + (100 - n.social) * 0.3 + r() * 15,
    phone_video: (100 - n.social) * 0.8 + r() * 15 - (h >= 22 || h < 8 ? 40 : 0),
    phone_call: h >= 9 && h < 21.5 ? (100 - n.social) * 0.6 + r() * 10 : 0,
    pc_video: (100 - n.social) * 0.95 + r() * 15 + (h >= 19 && h < 23 ? 10 : 0),
    pc_forum: (100 - n.social) * 0.6 + (100 - n.fun) * 0.4 + r() * 15,
    pc_code: 8 + r() * 20, phone_game: (100 - n.fun) * 0.6 + r() * 15, dance: 2 + r() * 6,
    wash: (h >= 6.5 && h < 9) || (h >= 21 && h < 23) ? 28 + r() * 10 : 4 + r() * 8,
    towel: 3 + r() * 6, window: 7 + r() * 14, water_living: 5 + r() * 10, water_study: 4 + r() * 10, art: 4 + r() * 12, dress: 4 + r() * 10,
  };
  // how she feels tips the scales (Sims-style)
  for (const [a, v] of Object.entries(EMO_PULL[emotion().key] || {})) score[a] += v;
  for (const a of sim.recent) score[a] *= 0.3;   // don't repeat the last few things
  return Object.entries(score).sort((a, b) => b[1] - a[1])[0][0];
}

const EMO_PULL = {
  playful: { dance: 30, tv: 10 }, energized: { dance: 20, water_living: 8 }, focused: { pc_code: 35, read: 10 },
  inspired: { read: 20, pc_code: 15, art: 15, window: 10 }, sad: { phone_call: 25, bath: 15, phone_video: 15 },
  angry: { dance: 10, bath: 10, computer: -20 }, tense: { bath: 30, read: 10 }, bored: { tv: 15, computer: 15, pc_forum: 10 },
  flirty: { phone_text: 25, dress: 15 }, confident: { dress: 15, pc_code: 10 }, scared: { phone_call: 20, tv: 10 },
  embarrassed: { bath: 15 }, uncomfortable: {}, dazed: { window: 10 },
};
function startAct(name, quiet = false) {
  if (sim.place !== "home" && !OUT_ACTS.has(name) && ACTS[name].spot) { sim.queue.unshift(name); name = "go_home"; }   // indoor things: home first
  if (sim.place === "home" && OUT_ACTS.has(name) && name !== "go_out") name = "go_out";
  const a = ACTS[name];
  sim.act = name;
  const p = here();
  if (sim.place !== "home" && name === "go_home" && sim.place !== "front") { throughDoor("home"); return; }   // no door out there: the bars close where she is
  if (sim.place !== "home" && OUT[sim.place].kind !== "walk") {   // on the bench / walking on through the mall, right where she is
    sim.mode = "act"; sim.actEnd = Infinity; sim.pendingLog = null;
    return;
  }
  if (sim.place !== "home") {                    // out on the sidewalk: straight along it
    const O = OUT[sim.place], x = name === "go_home" ? O.doorX : name === "stroll" ? sim.strollX ?? p.x : p.x;
    sim.route = [[Math.round(p.x), O.feet], [Math.round(x), O.feet]];
    sim.s = 0; sim.target = routeLength(sim.route); sim.crossing = [];
    sim.mode = "walk"; sim.pendingLog = a.log && !quiet ? a.log : null;
    return;

ROOM_KEYS.forEach((k, i) => {

  for (let r = n - 1; r >= 0; r--) pts.push(`${R(ins[r] * p)} ${R((r + 1) * p)}`, `${R(ins[r] * p)} ${R(r * p)}`);
  for (let r = 0; r < n; r++) pts.push(`${ins[r] * p}px ${R(r * p)}`, `${ins[r] * p}px ${R((r + 1) * p)}`);
  for (let r = n - 1; r >= 0; r--) pts.push(`${ins[r] * p}px ${(r + 1) * p}px`, `${ins[r] * p}px ${r * p}px`);
  return `polygon(${pts.join(",")})`;
}

// 8x8 UI-pixel tile of faint diagonal stripes; it crawls along the fill.
function stripePattern(u) {

  const x = c.getContext("2d");

}
let needGeo = { u: 2, bh: 28, barW: 200 };

function fit() {
  // The widget is [room for the bars][dots][house]; the bars always open to
  // the left into their own room, so they never cover the house.
  const desk = document.querySelector(".desk");
  const cs = getComputedStyle(desk);
  const avail = desk.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const BAR_MIN = 150, BAR_MAX = 300;
  // N = screen (device) pixels per house pixel; s = CSS px per house pixel
  const dpr = window.devicePixelRatio || 1;
  let N;
  if (prefs.scale !== "auto") N = prefs.scale / 25;
  else {
    const maxS = Math.min(4, (avail - 12 - BAR_MIN) / W);    // as big as the page allows, at most 4 CSS px
    N = Math.floor(maxS * dpr);
    if (N < 1 || N / dpr < maxS * 0.75) N = Math.max(0.4, maxS) * dpr;   // phones: bigger beats whole pixels
  }
  const s = N / dpr;
  scale = s; devPx = N;
  const hPx = H * s, wPx = W * s;
  view.width = Math.round(W * N); view.height = Math.round(H * N);   // drawn in screen pixels
  view.style.width = wPx + "px"; view.style.height = hPx + "px";
  // UI pixel = house pixel (at least 2px so the dots stay round)
  const u = Math.max(2, Math.round(s));
  let n = Math.max(12, Math.round(hPx * 0.11 / u));          // dot height in UI pixels
  while (n > 5 && n * u * 6 + 5 * 2 * u > hPx) n--;          // six (and a little air) must fit in the house height
  const bh = n * u, g = 6 * u;
  const barW = prefs.scale !== "auto" ? Math.round(BAR_MAX * s / 4 / u) * u     // a set size: everything scales together
    : Math.round(Math.max(BAR_MIN, Math.min(BAR_MAX, avail - wPx - g, wPx * 0.42)) / u) * u;
  const widget = document.getElementById("widget");
  widget.style.setProperty("--u", u + "px");
  widget.style.setProperty("--house-w", wPx + "px");
  widget.style.setProperty("--house-h", hPx + "px");
  widget.style.setProperty("--bh", bh + "px");
  widget.style.setProperty("--g", g + "px");
  widget.style.setProperty("--bar-w", barW + "px");
  // 10x10 chibi icons at one icon pixel per house pixel (smaller if the bar is thin)
  const icon = 10 * Math.max(1, Math.min(u, Math.floor((bh - 4 * u) / 10)));
  widget.style.setProperty("--icon", icon + "px");
  widget.style.setProperty("--slot", icon + 2 * u + "px");           // icon + a pixel of air each side
  widget.style.setProperty("--clip-track", pillClip(n, u));
  widget.style.setProperty("--clip-fill", pillClip(n - 4, u));
  widget.style.setProperty("--fmin", (n - 4) * u + "px");
  widget.style.setProperty("--stripes", `url(${stripePattern(u)})`);
  needGeo = { u, bh, barW };
  sizeSky(wPx, hPx, u);
  // the 造型室 is exactly as wide as the house; on phones the house is too
  // small for it, so it also spans the needs column to the house's left
  const narrowHouse = wPx < 520;
  widget.style.setProperty("--studio-w", (narrowHouse ? wPx + g + barW : wPx) + "px");
  widget.style.setProperty("--studio-dx", (narrowHouse ? g + barW : 0) + "px");
  widget.style.setProperty("--pop-wide", narrowHouse ? "1" : "0");
  widget.classList.toggle("narrow", narrowHouse);
  // text and round corners grow with the house: k = 1 at 100% (phones in auto: 0.75)
  const k = prefs.scale !== "auto" ? s / 4 : narrowHouse ? 0.75 : 1;
  // the emoji, the gear, the diary box and her words share one height (user): 48px
  const sayFs = narrowHouse && prefs.scale === "auto" ? 17 : 20;
  widget.style.setProperty("--say-fs", sayFs + "px");
  widget.style.setProperty("--ring-fs", Math.max(11, Math.round(14 * k)) + "px");
  widget.style.setProperty("--mp-fs", Math.max(11, Math.round(15 * k)) + "px");
  // round corners (user: as round as they can be): 2px steps and 2px outlines,
  // like the speech bubble; the buttons come out almost pill-shaped
  const nb = Math.max(6, Math.round(9 * k));
  widget.style.setProperty("--clip-btn", roundClip(nb, 2));
  widget.style.setProperty("--clip-btn-in", roundClip(nb - 1, 2));
  const sayH = 48, tail = 18;                                 // a whole, even number of 2px steps; tail = the gap for the two little bubbles (user: closer to the emoji)
  const [sayOut, sayIn] = sayClip(sayH, tail, 12, 12, 2, 0);  // no tail, both ends full half-circles (user)
  widget.style.setProperty("--clip-dot-xs", roundClip(1, 2)); widget.style.setProperty("--clip-dot-xs-in", roundClip(1, 1));   // 6px dot
  widget.style.setProperty("--clip-dot-s", roundClip(2, 2)); widget.style.setProperty("--clip-dot-s-in", roundClip(1, 2));   // 8px dot
  widget.style.setProperty("--clip-dot-m", roundClip(3, 2)); widget.style.setProperty("--clip-dot-m-in", roundClip(2, 2));   // 12px dot
  widget.style.setProperty("--say-h", sayH + "px");
  widget.style.setProperty("--tail", tail + "px");
  widget.style.setProperty("--clip-say", sayOut);
  const sets = document.getElementById("settings"), np = window.innerWidth <= 520 ? 7 : 9;
  sets.style.setProperty("--clip-btn", roundClip(np, 2));
  sets.style.setProperty("--clip-btn-in", roundClip(np - 1, 2));
  sets.style.setProperty("--clip-gear", roundClip(12, 2));            // 48px button: a circle
  sets.style.setProperty("--clip-gear-in", roundClip(11, 2));
  widget.style.setProperty("--clip-say-in", sayIn);
  // the diary box: the bubble's wood without the tail, as tall as the gear
  const di = document.getElementById("diary");
  // the box: a 48px pill like her words' right end; the 日记 tag inside it is
  // a 36px pill 6px in from its top, bottom and left, so the two round ends
  // share one centre (user: concentric corners)
  const [dOut, dIn] = sayClip(sayH, 0, 12, 12, 2, 0);

  di.style.setProperty("--clip-pop", roundClip(12, 2));
  di.style.setProperty("--clip-pop-in", roundClip(11, 2));
  di.style.setProperty("--diary-fs", (sayFs - 4) + "px");
  document.documentElement.style.setProperty("--row-h", 52 + "px");   // the gear + diary row: as tall as the emoji's canvas
  di.style.setProperty("--diary-max", Math.round(Math.max(150, Math.min(320, hPx * 1.1))) + "px");
  if (typeof kickNeeds === "function") kickNeeds();
  if (typeof fitSay === "function") { fitSay(); fitDiary(); }   // a new size: refit both lines
  if (typeof guideOn !== "undefined" && guideOn) sizeGuide();
  if (TAURI || wardrobeOpen || diaryOn || (typeof guideOn !== "undefined" && guideOn)) { studio.refit(); makeRoom(); }
  if (pickOn) fitPicker();                          // (fit runs only after the page has loaded)   // what's open above the house got a new size
  if (TAURI) { fitWindow(); requestAnimationFrame(fitWindow); }   // the app window starts hidden: no frames until it's sized
}

function activityFrame(ms) {
  // what Buddy looks like right now: frame params, pose, emote
  const a = sim.act, phase = Math.floor(ms / 600) % 2;
  if (reaction && realClock < reaction.until && sim.mode !== "down")
    return { f: { expr: "happy", wave: reaction.wave === false ? null : Math.floor(ms / 180) % 2, bob: Math.floor(ms / 300) % 2 }, pose: "stand", emote: reaction.emote };
  if (sim.mode === "walk") {
    const i = Math.floor(sim.walkDist / 4) % 4;
    // contact frames (a foot lifted) dip the head a pixel, passing frames rise
    const dy = here().dy;   // on the stairs: back to us going up, facing us coming down
    return { f: { look: dy ? 0 : sim.facing, bob: i % 2 ? 0 : 1, sway: i % 2 }, pose: ["walkL", "stand", "walkR", "stand"][i], emote: null, back: dy < 0 };
  }
  if (sim.mode === "act") {
    const em = ACTS[a].emote;
    const showEm = em && Math.floor(ms / 2400) % 2 === 0;
    switch (a) {
      case "bench": return benchFrame(ms);
      case "mall": return mallFrame(ms);
      case "cook": return { f: { expr: phase ? "happy" : "neutral", bob: phase, sway: phase, look: -1 }, pose: "stand", emote: showEm ? em : null };
      case "stroll": return { f: { expr: phase ? "happy" : "neutral", look: Math.floor(ms / 1700) % 3 - 1, bob: Math.floor(ms / 900) % 2 }, pose: "stand", emote: null };
      case "toilet": return { f: { expr: Math.floor(ms / 2000) % 3 === 2 ? "blink" : "neutral", look: Math.floor(ms / 2600) % 2 ? 1 : -1 }, pose: "sit", emote: null };
      case "wash": return { f: { expr: phase ? "happy" : "blink", bob: phase, look: 1 }, pose: "stand", emote: showEm ? em : null };
      case "towel": return { f: { expr: "happy", bob: phase, look: -1 }, pose: "stand", emote: showEm ? em : null };
      case "water_living": case "water_study": return { f: { expr: "happy", look: a === "water_living" ? -1 : 1, bob: phase }, pose: "stand", emote: showEm ? em : null };
      case "dress": return { f: { expr: phase ? "happy" : "neutral", look: 1, bob: phase }, pose: "stand", emote: showEm ? em : null };
      case "eat": return { f: { expr: phase ? "happy" : "blink", bob: phase }, pose: "sit", emote: showEm ? em : null };
      case "computer": case "pc_code": case "pc_forum": case "pc_video":
        if (!chairReady()) return { f: { expr: "happy", wave: 1 }, pose: "stand", emote: null };   // a wave of the hand: the chair pops in, then she sits
        return { f: { expr: Math.floor(ms / 3000) % 3 === 2 ? "happy" : "neutral", look: Math.floor(ms / 1500) % 2 ? 1 : 0 }, pose: "sit", emote: showEm ? em : null };
      case "phone_call": return { f: { expr: Math.floor(ms / 1800) % 3 === 1 ? "happy" : "neutral", bob: phase, look: Math.floor(ms / 2600) % 2 ? -1 : 0 }, pose: "stand", emote: showEm ? em : null };
      case "phone_video": case "phone_feed": case "phone_text": case "phone_game":
        return { f: { expr: Math.floor(ms / 2200) % 3 === 2 ? "happy" : Math.floor(ms / 3100) % 5 === 4 ? "blink" : "neutral", look: 1 }, pose: "stand", emote: showEm ? em : null };
      case "dance": {
        const i = Math.floor(ms / 260) % 4;
        return { f: { expr: "happy", wave: i % 2, bob: i % 2, sway: i % 2, look: i < 2 ? -1 : 1 }, pose: ["walkL", "stand", "walkR", "stand"][i], emote: showEm ? em : null };
      }
      case "tv": return { f: { expr: Math.floor(ms / 2000) % 3 === 0 ? "happy" : "neutral", look: 1 }, pose: "sit", emote: showEm ? em : null };
      case "read": return { f: { expr: "neutral", look: -1, bob: Math.floor(ms / 1800) % 2 }, pose: "stand", emote: showEm ? em : null };
      case "window": return { f: { expr: Math.floor(ms / 2500) % 4 === 3 ? "blink" : "neutral", look: 1 }, pose: "stand", emote: null };
      default: return { f: { expr: "happy", bob: phase }, pose: "stand", emote: showEm ? em : null };
    }
  }
  // idle: replay the lively idle loop
  const seq = D.doll.seq, total = seq.reduce((a, s) => a + s.ms, 0);
  let t = ms % total, fr = seq[0];
  for (const s of seq) { if (t < s.ms) { fr = s; break; } t -= s.ms; }
  const em = fr.emote === "cheer" ? doll.cheer(look) : fr.emote;
  return { f: { ...fr }, pose: "stand", emote: em && fr.wave == null ? em : null };
}

function lyingHead(f) {   // the sleepy head turned 90 degrees: lying on the pillow
  const key = JSON.stringify(f);
  if (rotCache.has(key)) return rotCache.get(key);
  const src = dollCanvas(f, "stand", 15);
  const c = document.createElement("canvas"); c.width = src.height; c.height = src.width;
  const x = c.getContext("2d"); x.translate(0, src.width); x.rotate(-Math.PI / 2); x.drawImage(src, 0, 0);
  rotCache.set(key, c);
  return c;
}
function lyingBody(f) {   // the whole doll turned 90 degrees: lying on her side, head to the left
  const key = "body" + JSON.stringify(f);
  if (rotCache.has(key)) return rotCache.get(key);
  const src = dollCanvas(f, "stand");
  const c = document.createElement("canvas"); c.width = src.height; c.height = src.width;
  const x = c.getContext("2d"); x.translate(0, src.width); x.rotate(-Math.PI / 2); x.drawImage(src, 0, 0);
  rotCache.set(key, c);

}
// hold her for 5 seconds to wake her: a ring of pixels fills up around her
const REVIVE_S = 5;
let holding = null;
function drawRevive(ctx) {
  const p = here(), cx = Math.round(p.x), cy = Math.round(p.y) - 8;
  const k = holding ? Math.min(1, (realClock - holding.t0) / REVIVE_S) : 0;
  const N = 36;
  for (let i = 0; i < N; i++) {
    const a = -Math.PI / 2 + i / N * Math.PI * 2;
    const x = Math.round(cx + Math.cos(a) * 17), y = Math.round(cy + Math.sin(a) * 12);
    if (i / N < k) { px(ctx, x, y, 1, "255,255,255"); px(ctx, x, y + 1, 0.9, GLOW); }
    else if (holding || Math.floor(realClock * 1.5) % 2) px(ctx, x, y, 0.35, "255,255,255");
  }
  if (holding && k >= 1) { holding = null; revive(); }
}
// ---------- the computer chair: conjured when she sits down at the computer
// (sparkles + an ordered-dither fade, whole pixels only), gone when she leaves
const PC_ACTS = ["computer", "pc_video", "pc_forum", "pc_code"];
const CHAIR_S = 0.32;                                   // fade length, seconds
const chair = { on: false, t0: -9, steps: null };
function chairSteps() {                                 // 4 dither levels of the chair sprite
  if (chair.steps) return chair.steps;
  const img = IMG.fx.chair[0], w = img.width, h = img.height, BAYER = [0, 2, 3, 1];
  chair.steps = [1, 2, 3, 4].map(level => {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const x = c.getContext("2d"); x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, w, h);
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (BAYER[(i % 2) + (j % 2) * 2] >= level) d.data[(j * w + i) * 4 + 3] = 0;
    x.putImageData(d, 0, 0);
    return c;
  });
  return chair.steps;
}
const chairXY = () => [D.spots.computer[1] - DW / 2 - 3, FLOOR_Y[1] - IMG.fx.chair[0].height + 1];
function drawChair(ctx) {
  const want = sim.mode === "act" && PC_ACTS.includes(sim.act);
  if (want !== chair.on) {                              // appear / vanish with a little sparkle burst
    chair.on = want; chair.t0 = realClock;
    const [cx, cy] = chairXY();
    poof = { t0: realClock, x: cx + 13, y: cy + 15 };
  }
  const k = reduceMotionUI ? 1 : Math.min(1, (realClock - chair.t0) / CHAIR_S);
  const level = Math.ceil((chair.on ? k : 1 - k) * 4);
  if (level <= 0) return;
  const [cx, cy] = chairXY();
  ctx.drawImage(chairSteps()[level - 1], cx, cy);
}
const chairReady = () => realClock - chair.t0 >= CHAIR_S;   // she sits once it's all there

const DREAMS = ["heart", "star", "note", "bowl", "game", "book"];   // what she dreams of, shown in a bubble now and then
const dishPics = new Map();
function dishPic(src) { if (!dishPics.has(src)) { const i = new Image(); i.src = src; dishPics.set(src, i); } return dishPics.get(src); }
function frameOf(list, fps) { return list[Math.floor(realClock * fps) % list.length]; }

function render() {
  if (sim.place !== "home") { renderOutside(); return; }
  const h = hour(), f = nightness(h);
  bctx.clearRect(0, 0, W, H);
  bctx.globalAlpha = 1; bctx.drawImage(IMG.day, 0, 0);
  if (f > 0) { bctx.globalAlpha = f; bctx.drawImage(IMG.night, 0, 0); bctx.globalAlpha = 1; }
  // open windows: casements swung in, curtains drifting
  const sway = [0, 1, 2, 1][Math.floor(realClock * 2.2) % 4];
  for (const [id, st] of Object.entries(windowState)) {
    const wv = D.windows[id];
    if (st === "drawn") { bctx.drawImage(IMG.win[id].drawn, wv.x, wv.y); continue; }   // the night pass dims it
    if (st !== "open") continue;
    bctx.drawImage(IMG.win[id]["day" + sway], wv.x, wv.y);
    if (f > 0) { bctx.globalAlpha = f; bctx.drawImage(IMG.win[id]["night" + sway], wv.x, wv.y); bctx.globalAlpha = 1; }
  }
  drawWeather(bctx, f > 0.5);   // on the glass only, behind everything that stands in front of a window
  drawOverlay(bctx, "plant_study"); drawOverlay(bctx, "plant_living");   // the potted trees stay in front of windows and curtains (user)
  drawDoors(bctx);
  const room = roomAt(here()), acting = sim.mode === "act", act = acting ? sim.act : null;
  const sleeping = act === "sleep";
  for (const [id, on] of Object.entries(lamps)) if (on) drawOverlay(bctx, id);
  updateRoomLights(room, !sleeping);                  // lights out when she goes to bed
  const lit = [];
  if (f > 0.05) {
    for (const [id, on] of Object.entries(lamps)) if (on) lit.push(id);
    const auto = { kitchen: "kitchen", bath: "bath", stairs: "stairs", study: "study" }[room];
    if (auto && !sleeping) { lit.push(auto); if (auto === "stairs") drawOverlay(bctx, "sconce"); if (auto === "study") drawOverlay(bctx, "pendant"); }
    if (act === "tv") lit.push("tv");
    if (act === "computer" || (act && act.startsWith("pc_"))) lit.push("monitor");
  }
  drawChair(bctx);
  // Buddy
  const ms = realClock * 1000;
  const fr = activityFrame(ms);
  const full = { expr: "neutral", look: 0, bob: 0, sway: 0, wave: null, ...fr.f };
  let emoteAt = null;
  if (sim.mode === "down") {
    // lying on her side on the floor, a skull bubble over her (no harm done)
    const p = here(), body = lyingBody({ ...full, expr: "sleepy", look: 0, bob: 0, sway: 0, wave: null });
    const x = Math.round(p.x - body.width / 2), y = Math.round(p.y) - 17;
    bctx.drawImage(body, x, y);
    emoteAt = [x + 10, y - 13];
  } else if (sleeping) {
    const [lx, ly] = D.sleepLying;
    bctx.drawImage(lyingHead({ ...full, expr: "sleepy", look: 0, bob: 0, sway: 0, wave: null }), lx, ly);
    drawOverlay(bctx, "sleep_cover");
    emoteAt = [lx + 10, ly - 14];
  } else if (act === "bath") {
    bctx.drawImage(dollCanvas({ ...full, look: 0, wave: null }, "stand", 14), D.bathHead[0], D.bathHead[1]);
    drawOverlay(bctx, "tub_front"); drawOverlay(bctx, "bubbles");
    emoteAt = [D.bathHead[0] + 13, D.bathHead[1] - 15];
  } else {
    const p = here();
    const x = Math.round(p.x - DW / 2), y = Math.round(p.y - DH + 1);
    bctx.drawImage(fr.back ? backCanvas(full, fr.pose) : dollCanvas(full, fr.pose), x, y);
    if (act === "tv") drawOverlay(bctx, "coffee_table");
    if (act && act.startsWith("phone_")) {          // her phone: at the ear on a call, in her hands otherwise
      if (act === "phone_call") bctx.drawImage(IMG.fx.phone_call[0], x + 16, y + 8 + full.bob);
      else bctx.drawImage(frameOf(IMG.fx.phone, 2), x + 8, y + 17);
    }
    emoteAt = [x + 13, y - 15];
  }
  grade(bctx, f, lit);
  // things that glow on their own: screens, flames, steam
  if (act === "tv") {
    const ch = IMG.tv[sim.item?.screen] ? sim.item.screen : Object.keys(IMG.tv)[Math.floor(realClock / 6) % 4];
    bctx.drawImage(frameOf(IMG.tv[ch], 4), D.screens.tv.x, D.screens.tv.y);
  }
  if (act === "computer") {
    const g = IMG.mon[sim.item?.screen] ? sim.item.screen : Object.keys(IMG.mon)[Math.floor(realClock / 8) % 3];
    bctx.drawImage(frameOf(IMG.mon[g], 5), D.screens.monitor.x, D.screens.monitor.y);
  }
  if (act && act.startsWith("pc_")) bctx.drawImage(frameOf(IMG.app[act.slice(3)], act === "pc_video" ? 2 : 3), D.screens.monitor.x, D.screens.monitor.y);
  if (act === "cook") bctx.drawImage(frameOf(IMG.fx.cook, 8), D.fx.cook.x, D.fx.cook.y);
  if (act === "eat") {   // the dish she cooked is the one on the table (user); a plain bowl otherwise
    const pic = sim.meal && sim.meal.pic && dishPic(sim.meal.pic);
    if (pic && pic.complete) bctx.drawImage(pic, D.fx.meal.x + 3 - (pic.width >> 1), D.fx.meal.y + 13 - pic.height + 1);
    else bctx.drawImage(frameOf(IMG.fx.meal, 4), D.fx.meal.x, D.fx.meal.y);
  }
  if (act === "water_living" || act === "water_study") bctx.drawImage(frameOf(IMG.fx[act], 6), D.fx[act].x, D.fx[act].y);
  const down = sim.mode === "down";
  if (sleeping) {
    // Zs drift up from the pillow; now and then a dream bubble instead (user:
    // not the same dark zzz bubble all night)
    const cyc = Math.floor(realClock / 26), inDream = realClock % 26 > 19;
    if (inDream) bctx.drawImage(emoteCanvas(DREAMS[cyc % DREAMS.length]), emoteAt[0], emoteAt[1]);
    else bctx.drawImage(frameOf(IMG.fx.sleep_z, 4), emoteAt[0] - 2, emoteAt[1] - 6);
  } else if (fr.emote || down) bctx.drawImage(emoteCanvas(down ? "skull" : fr.emote), emoteAt[0], emoteAt[1] + (down ? Math.floor(realClock * 2) % 2 : 0));
  if (down) drawRevive(bctx);
  drawClickFx(bctx);
  vctx.imageSmoothingEnabled = false;
  vctx.clearRect(0, 0, view.width, view.height);   // (the house has see-through edges: no leftovers from outside)
  vctx.drawImage(buf, 0, 0, view.width, view.height);

// ================================================================ seasons & weather
// Every 14 days is a season. Spring, summer and autumn now and then get a
// shower; winter gets snow. Each day rolls its episodes once (lazily).
const SEASON_DAYS = 14;
const SEASONS = [
  { name: "春", kind: "rain", p: 0.32 },
  { name: "夏", kind: "rain", p: 0.28 },
  { name: "秋", kind: "rain", p: 0.26 },
  { name: "冬", kind: "snow", p: 0.45 },
];
const WEATHER_NAME = { clear: "晴", rain: "小雨", snow: "下雪" };
function seasonOf(t) {
  const d = Math.floor(t / 1440);
  return { i: Math.floor(d / SEASON_DAYS) % 4, day: d % SEASON_DAYS + 1 };
}
const weather = { plan: new Map(), force: null, kind: "clear", season: 0, snowCover: 0 };
function planDay(d) {
  if (d < 0) return [];
  if (!weather.plan.has(d)) {
    const s = SEASONS[Math.floor(d / SEASON_DAYS) % 4], eps = [];
    for (const p of [s.p, s.p * 0.3]) {           // usually none, sometimes one, rarely two
      if (Math.random() >= p) break;
      const from = d * 1440 + Math.floor(Math.random() * 22 * 60);
      eps.push({ from, to: from + 90 + Math.random() * 270, kind: s.kind });
    }
    weather.plan.set(d, eps);
  }
  return weather.plan.get(d);
}
function weatherAt(t) {
  if (weather.force) return weather.force;
  const d = Math.floor(t / 1440);
  for (const dd of [d - 1, d]) for (const e of planDay(dd)) if (t >= e.from && t < e.to) return e.kind;
  return "clear";
}
function updateWeather(dtGame) {
  const se = seasonOf(sim.t).i;
  if (se !== weather.season) { weather.season = se; lifeSeason(se); }
  const w = weatherAt(sim.t);
  if (w !== weather.kind) {
    const was = weather.kind;
    weather.kind = w;
    lifeWeather(was, w);
    if (w === "snow") log("下雪了！窗外白白的一片。");
    else if (w === "clear") log(was === "snow" ? "雪停了。" : "雨停了。");
  }
  // snow settles on the hill while it snows and melts slowly afterwards (fast outside winter)
  if (w === "snow") weather.snowCover = Math.min(1, weather.snowCover + dtGame / 150);
  else weather.snowCover = Math.max(0, weather.snowCover - dtGame / (se === 3 ? 2880 : 240));
}

const WMASK = {};

function skyColor(f) {

}
function drawIcon(name, cx, cy, scale) {

  const img = reduceMotionUI ? fr[0] : fr[Math.floor(realClock * fps) % fr.length];
  // whole screen pixels only: the icon is drawn at an integer size and position,

  const size = Math.max(1, Math.round(SKY_ICON * skyGeo.b * scale));

// ================================================================ moodlets & emotions
// Sims-style. Every moodlet adds points to one emotion; the emotion with the

// 3-5 normal, 6+ "very". Condition moodlets (hungry, rainy...) last while

/*__LIFE_TEXT_JS__*/
const T = LIFE_TEXT, ML = T.moodlets;
// {书} {游戏} {节目} {零食} anywhere else: any title from the catalogs
Object.assign(T.fill, { 书: T.reading.flatMap(g => g.books), 节目: T.tv.flatMap(k => k.shows),
  游戏: [...T.games, ...T.phoneGames].flatMap(g => g.games), 零食: T.snacks });
const MOOD = Object.fromEntries(D.moods.map(([k, name, color]) => [k, { name, color }]));
const LEVEL_WORD = ["", "有点", "", "非常"];
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
const one = v => (Array.isArray(v) ? pick(v) : v);   // a line, or one of its variants
// "{食物}" -> a random dish; vars pins a value so diary and words agree
function fill(text, vars = {}) {
  vars.名字 ??= nameOf(); vars.她 ??= ta();

}

  moods.set(id, { until: m.min ? sim.t + m.min : null, t: sim.t, vars: had ? moods.get(id).vars : vars });
  if (had) return;                 // refreshed quietly

}

  for (const [e, p] of Object.entries(sum)) if (p > pts || (p === pts && last[e] > last[key])) { key = e; pts = p; }

    for (const p of pl.trail) { bctx.globalAlpha = 0.55 * (1 - (realClock - p.t) / 9); bctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
    bctx.globalAlpha = 1;
    if (f > 0.5) { if (Math.floor(realClock * 2) % 2) { bctx.fillStyle = "#e1725b"; bctx.fillRect(Math.round(pl.x) + 4, Math.round(pl.y) + 2, 1, 1); } }
    else flipDraw(bctx, O.plane, Math.round(pl.x), Math.round(pl.y), pl.d, 9);
    if (pl.x < -60 || pl.x > W + 60) life.plane = null;
  }
  if (life.wet > 0.02) { bctx.globalAlpha = life.wet; bctx.drawImage(O.wet, 0, 0); bctx.globalAlpha = 1; }
  if (run) life.wet += ((w === "rain" ? 1 : 0) - life.wet) * Math.min(1, dt * (w === "rain" ? 0.8 : 0.08));
  for (const d of life.ducks) {                  // ducks paddle about the pond
    const [cx, , rx] = L.pond;
    if (run) {
      d.t += dt;
      d.x += d.dir * 3 * dt;
      if (d.x < cx - rx + 10 || d.x > cx + rx - 18 || Math.random() < dt * 0.05) d.dir = d.x < cx ? 1 : d.x > cx + rx - 18 ? -1 : -d.dir;
      if (!d.dip && Math.random() < dt * 0.08) d.dip = 1.2;
      d.dip = Math.max(0, d.dip - dt);
    }
    const fr = d.dip ? 2 : Math.floor(d.t / 0.6) % 2;
    flipDraw(bctx, O.duck[fr], Math.round(d.x), Math.round(d.y) - 5, d.dir, 10);
  }
  if (run) stepBirds(dt, L, 16, [20, W - 20]);
  drawBirds(bctx, O.sparrow);
  const gust = Math.sin(realClock * 0.9) + Math.sin(realClock * 2.3) * 0.4;
  const treeImg = S.trees[gust > 0.55 || (w !== "clear" && gust > 0) ? 1 : 0];
  bctx.drawImage(treeImg, 0, 0);
  if (weather.snowCover > 0.02) { bctx.globalAlpha = Math.min(1, weather.snowCover); bctx.drawImage(O.snow, 0, 0); bctx.globalAlpha = 1; }
  // petals (spring) and leaves (autumn) drift down; butterflies over the border
  if (run && (se === 2 || se === 0) && life.bits.length < 16 && Math.random() < dt * (se === 2 ? 2.4 : 1.4)) {
    const trees = se === 0 ? L.trees.filter(t => t[0] === "cherry") : L.trees, [, tx, cy, rx, ry] = pick(trees);
    const cols = se === 2 ? ["#c65022", "#e88a2f", "#f6c45a", "#8a2f1f", "#d29b30"] : ["#f5c3d4", "#fde6ee", "#e095b2"];
    life.bits.push({ x: tx + (Math.random() * 2 - 1) * rx, y: cy + Math.random() * 0.6 * ry, vy: 6 + Math.random() * 6, ph: Math.random() * 6, c: pick(cols), t: 0, floor: L.path[0] + Math.random() * 12 });
  }
  for (const b of life.bits) {
    if (run) { b.t += dt; b.y += b.vy * dt; b.x += Math.sin(b.t * 2.4 + b.ph) * 10 * dt + 3 * dt; }
    if (b.y > b.floor) b.gone = true;
    bctx.fillStyle = b.c; bctx.fillRect(Math.round(b.x), Math.round(b.y), Math.sin(b.t * 5 + b.ph) > 0 ? 2 : 1, 1);
  }
  life.bits = life.bits.filter(b => !b.gone);
  const flyOk = day && w === "clear" && (se === 0 || se === 1);
  if (run && flyOk && life.flies.length < 3 && Math.random() < dt * 0.06) life.flies.push({ hx: 20 + Math.random() * (W - 40), t: 0, ph: Math.random() * 6, k: Math.random() < 0.5 ? 0 : 2 });
  for (const fl of life.flies) {
    if (run) fl.t += dt;
    const x = fl.hx + Math.sin(fl.t * 0.7 + fl.ph) * 24 + Math.sin(fl.t * 2.3) * 4, y = H - 12 + Math.sin(fl.t * 1.9 + fl.ph) * 5;
    if (!flyOk || fl.t > 40) fl.gone = true;
    bctx.drawImage(O.butterfly[fl.k + (Math.floor(realClock * 6) % 2)], Math.round(x) - 3, Math.round(y) - 2);
  }
  life.flies = life.flies.filter(fl => !fl.gone);
  npcTick(dt, run);
  drawNpcs(bctx, "back");
  bctx.drawImage(O.bench, 0, 0);                 // people behind the bench stay behind it
  const fr = activityFrame(realClock * 1000);
  const { emoteAt, dollAt } = drawOutBuddy(bctx, fr);
  drawNpcs(bctx, "front");
  // butterflies crossing right in front of us (user)
  if (run && flyOk && life.front.length < 1 && Math.random() < dt / 14) {
    const d = Math.random() < 0.5 ? 1 : -1;
    life.front.push({ x: d > 0 ? -8 : W + 8, d, y: 96 + Math.random() * 14, t: 0, ph: Math.random() * 6, k: Math.random() < 0.5 ? 0 : 2 });
  }
  for (const b of life.front) {
    if (run) { b.t += dt; b.x += b.d * 16 * dt; }
    const y = b.y + Math.sin(b.t * 3.1 + b.ph) * 6 + Math.sin(b.t * 7) * 1.5, img = O.butterfly[b.k + (Math.floor(realClock * 8) % 2)];
    bctx.drawImage(img, Math.round(b.x) - 3, Math.round(y) - 2);

  drawOutsideWeather(bctx);
  gradeOutside(bctx, f);
  drawLit(bctx, f, O.lit, [[treeImg, 0, 0], ...(dollAt ? [dollAt] : [])]);
  if (f > 0.5 && se === 1 && w === "clear") {    // fireflies on summer nights
    for (let i = 0; i < 9; i++) {
      const on = Math.sin(realClock * 1.7 + i * 2.1) > 0.3;
      if (!on) continue;
      bctx.fillStyle = "#fff1b8";
      bctx.fillRect(Math.round(30 + hash(i * 3.3) * (W - 60) + Math.sin(realClock * 0.6 + i) * 8), Math.round(L.horizon + 8 + hash(i * 7.1) * 26 + Math.sin(realClock * 0.9 + i * 3) * 3), 1, 1);
    }
  }
  finishOut(fr, emoteAt);
}

// ---------------------------------------------------------------- 海边
// The dock (user: simple): sky, sea, now and then a container ship crawls
// along the horizon or a speedboat skims past with its wake; a gull or two.
function renderBeach(dt) {
  const L = OUT.beach, O = IMG.out.beach, se = seasonOf(sim.t).i, S = O.seasons[SEASON_KEYS[se]], f = nightness(hour());
  const h = hour(), day = h >= 7 && h < 18.5, run = speed && !cardHolds() && !wiping, w = weather.kind;
  bctx.clearRect(0, 0, W, H);

  // ships: rarely, from either side; far ones slow, the speedboat quick
  if (run && !life.ship && Math.random() < dt / 70) { const d = Math.random() < 0.5 ? 1 : -1; life.ship = { x: d > 0 ? -42 : W + 2, d }; life.tagNext = Math.random() < 0.6 ? "ship" : null; life.chatNext = realClock + 4; }
  if (run && !life.boat && Math.random() < dt / 45) { const d = Math.random() < 0.5 ? 1 : -1; life.tagNext = Math.random() < 0.6 ? "boat" : null; life.chatNext = realClock + 2; life.boat = { x: d > 0 ? -20 : W + 4, d, y: L.horizon + 10 + Math.round(Math.random() * 14), trail: [] }; }
  const sh = life.ship;
  if (sh) {
    if (run) sh.x += sh.d * 2.2 * dt;
    flipDraw(bctx, O.ship, Math.round(sh.x), L.horizon - 10, sh.d, 40);
    if (f > 0.4) { bctx.fillStyle = "#fff1b8"; bctx.fillRect(Math.round(sh.x) + (sh.d > 0 ? 5 : 34), L.horizon - 9, 1, 1); bctx.fillRect(Math.round(sh.x) + 20, L.horizon - 7, 1, 1); }
    if (sh.x < -50 || sh.x > W + 10) life.ship = null;
  }
  const bt = life.boat;
  if (bt) {
    if (run) {
      bt.x += bt.d * 32 * dt;

      bt.trail = bt.trail.filter(p => realClock - p.t < 2.2);
    }

    for (const p of bt.trail) {

      bctx.fillRect(Math.round(p.x), bt.y + 4 - sp, 1, 1); bctx.fillRect(Math.round(p.x), bt.y + 5 + sp, 1, 1);

  }
  if (day && w === "clear") {                    // glints moving on the water
    bctx.fillStyle = "#f7f6fb";
    for (let i = 0; i < 16; i++) {
      const k = Math.floor(realClock * 1.1 + hash(i * 4.7) * 5);
      if ((k + i) % 3) continue;
      const x = Math.floor(mod(hash(i * 2.9 + k) * W + realClock * 3, W)), y = Math.floor(L.horizon + 3 + hash(i * 6.1 + k) * (L.deck - L.horizon - 20));
      bctx.fillRect(x, y, 2, 1);
    }
  }
  if (run && life.gulls.length < 2 && Math.random() < dt * 0.03 && w === "clear")
    life.gulls.push({ x: -10, y: 8 + Math.random() * 26, v: 12 + Math.random() * 8, ph: Math.random() * 6, t: 0 });
  for (const g of life.gulls) {
    if (run) { g.t += dt; g.x += g.v * dt; }
    if (g.x > W + 10) g.gone = true;
    const fr = Math.sin(g.t * 3 + g.ph) > 0.3 ? Math.floor(realClock * 6) % 3 : 1;
    bctx.drawImage(O.gull[fr], Math.round(g.x), Math.round(g.y + Math.sin(g.t * 0.8 + g.ph) * 4));
  }
  life.gulls = life.gulls.filter(g => !g.gone);
  if (life.wet > 0.02) { bctx.globalAlpha = life.wet; bctx.drawImage(O.wet, 0, 0); bctx.globalAlpha = 1; }
  if (run) life.wet += ((w === "rain" ? 1 : 0) - life.wet) * Math.min(1, dt * (w === "rain" ? 0.8 : 0.08));
  if (weather.snowCover > 0.02) { bctx.globalAlpha = Math.min(1, weather.snowCover); bctx.drawImage(O.snow, 0, 0); bctx.globalAlpha = 1; }
  npcTick(dt, run);
  drawNpcs(bctx, "back");
  const fr = activityFrame(realClock * 1000);
  const { emoteAt, dollAt } = drawOutBuddy(bctx, fr);
  drawNpcs(bctx, "front");
  drawOutsideWeather(bctx);
  gradeOutside(bctx, f);
  drawLit(bctx, f, O.lit, dollAt ? [dollAt] : []);
  finishOut(fr, emoteAt);
}

// ---------------------------------------------------------------- 商场
const mod = (a, n) => ((a % n) + n) % n;
function renderMall(dt) {
  const L = MALL, O = IMG.out.mall, se = SEASON_KEYS[seasonOf(sim.t).i], f = nightness(hour()), run = speed && !cardHolds() && !wiping;
  bctx.clearRect(0, 0, W, H);
  const offF = mod(-mallS.x * 0.45, L.farW), offD = mod(L.at - mallS.x * 0.75, L.nearW), offN = mod(L.at - mallS.x, L.nearW);
  const tile = (img, off, wd) => { for (let x = off - wd; x < W; x += wd) bctx.drawImage(img, Math.round(x), 0); };
  tile(O.far, offF, L.farW);
  if (f > 0) { bctx.globalAlpha = Math.min(1, f * 1.2); tile(O.skyNight, offF, L.farW); bctx.globalAlpha = 1; }
  if (weather.kind === "rain") {                 // rain on the skylight
    bctx.fillStyle = "rgba(220, 232, 250, 0.6)";
    for (let i = 0; i < 24; i++) bctx.fillRect(Math.floor(hash(i * 3.1) * W), Math.floor((realClock * 9 + hash(i * 7.7) * 8) % 8), 1, 2);
  } else if (weather.kind === "snow") {
    bctx.fillStyle = "#f6f9fd";
    for (let i = 0; i < 30; i++) bctx.fillRect(Math.floor(mod(hash(i * 5.3) * L.farW + offF, L.farW)), Math.floor(hash(i * 2.2) * 7), 1, 1);
  }
  for (const s of mallS.shoppers) {              // shoppers upstairs, behind the glass
    if (run) s.x = mod(s.x + s.dir * s.v * dt, L.farW);
    const fr = Math.floor(realClock * 3 + s.k) % 2, x0 = mod(s.x + offF, L.farW);
    for (const x of [x0, x0 - L.farW]) if (x > -8 && x < W) flipDraw(bctx, O.shopper[s.k][fr], Math.round(x), L.upWalk - 12, s.dir, 7);
  }
  tile(O.rail, offF, L.farW);
  bctx.fillStyle = "rgba(236, 234, 244, 0.45)";  // upstairs is far: hazed, so our side stands out (user)
  bctx.fillRect(0, 0, W, L.fascia);
  tile(O.deco[se], offD, L.nearW);
  tile(O.near, offN, L.nearW);
  npcTick(dt, run);
  drawNpcs(bctx, "counter");                     // kiosk staff behind their counters
  for (const it of L.items) if (O.props[it.id]) {
    const x0 = mod(it.px - mallS.x + L.at, L.nearW);
    for (const x of [x0, x0 - L.nearW]) if (x > -60 && x < W) bctx.drawImage(O.props[it.id], Math.round(x), it.top);
  }
  drawNpcs(bctx, "back");
  drawMallHover(bctx);
  const fr = activityFrame(realClock * 1000);
  let emoteAt = [L.at + 3, L.feet - 42], dollAt = null;
  if (!mallInside()) ({ emoteAt, dollAt } = drawOutBuddy(bctx, fr));     // (in a shop: out of sight)
  drawNpcs(bctx, "front");
  if (dollAt) {                                  // her reflection in the polished floor
    const [dc, x, y] = dollAt;
    bctx.save(); bctx.globalAlpha = 0.16; bctx.translate(x, 2 * (L.feet + 1) - y); bctx.scale(1, -1);
    bctx.drawImage(dc, 0, 0); bctx.restore();
  }
  finishOut(mallInside() ? { ...fr, emote: null } : fr, emoteAt);
}

// ================================================================ video chats & forums
// User: on the computer, video chat with 爸爸 / 妈妈 / a friend, or browse a
// forum (音符, 小红本, 树洞岛, 冷知识研究所). Each picks one conversation
// (CHATS, chats_text.js) and plays it line by line in her bubble while time
// runs; she stays until it's over. Its mood lands when she's done, with a
// diary line. Lines: ">" someone else (the person / a comment), "#" a post,
// plain = her. The same conversation doesn't come back until most of its
// group has been seen.
/*__CHATS_JS__*/
const CHAT_ACT = { pc_video: "video", pc_forum: "forum", phone_call: "call", phone_video: "video" };
for (const [kind, groups] of Object.entries(CHATS)) for (const [who, g] of Object.entries(groups))
  g.talks.forEach((t, i) => { if (t.mood) ML[t.id = `chat_${kind === "call" ? "call_" : ""}${who}_${i}`] = { ...t.mood }; });
// phone calls (user: 50 per person, voice only) are CHATS.call; a video call on the phone is a video chat
function chatItem(kind, who, via = "pc") {
  const g = CHATS[kind][who], seen = ((lifeFlags.talkSeen ||= {})[kind === "call" ? "call_" + who : who] ||= []);
  let fresh = g.talks.map((_, i) => i).filter(i => !seen.includes(i));
  if (!fresh.length) { seen.splice(0, seen.length - 3); fresh = g.talks.map((_, i) => i).filter(i => !seen.includes(i)); }
  const i = pick(fresh), t = g.talks[i], vars = { 朋友: pick(T.fill.朋友) };
  seen.push(i);
  const name = fill(g.name, vars);
  return { vars, talk: { ...t, kind, who, name,
    start: kind === "call" ? `拿起手机给${name}打电话。` : via === "phone" ? `拿起手机和${name}视频。` : kind === "video" ? `打开电脑，和${name}视频聊天。` : `打开电脑，${g.verb}。`,
    end: kind === "call" ? `和${name}打电话：${t.title}。` : kind === "video" ? `和${name}视频：${t.title}。` : `${g.verb}：${t.title}。` } };
}
function playTalk(dt) {
  if (!sim.item || !sim.item.talk || !CHAT_ACT[sim.act]) { sim.talk = null; return; }   // she was sent off to do something else
  const tk = sim.item.talk, st = sim.talk;
  if (st.i >= tk.lines.length || (st.wait -= dt) > 0) return;
  const raw = tk.lines[st.i++], mark = raw[0], text = fill((mark === ">" || mark === "#" ? raw.slice(1) : raw).trim(), sim.item.vars);
  const who = mark === ">" ? (tk.kind !== "forum" ? `${tk.name}：` : "评论：") : mark === "#" ? `【${CHATS.forum[tk.who].tag}】` : "";
  showSay(text, who);
  (st.said ||= []).push([who, text]);                 // for the diary when it's over (user)
  st.wait = Math.min(4.6, Math.max(2.6, 1.4 + (who + text).length * 0.13));      // seconds of running time per line
}

// ================================================================ chance cards
// Like The Sims' chance cards (user): now and then a little situation pops
// out of her (CARDS: the user's 100 cards, cards_text.js) with two choices,
// and each choice has two possible results. The card springs out of her over
// the house; the choice gets pressed in and the card shrinks back into her;
// a few seconds later the result pops out of her, with the moodlet it gave
// her on a pill above it. Any click closes the result (not while it is still
// popping, so it can't be clicked away unread), and the pill flies into the
// emoji, where the moodlet lands. Untouched for a minute, she picks by
// herself and the result just goes in the diary. Every card comes once
// before any comes again; cards with a `when` wait for a fitting moment.
/*__CARDS_JS__*/
/*__PLACE_CARDS_JS__*/
for (const cd of CARDS) for (const k of ["a", "b"]) cd[k].out.forEach((o, i) => { if (o.mood) ML[o.id = `card${cd.n}${k}${i}`] = { ...o.mood }; });
const CARD_GAP = 330, CARD_CHANCE = 0.3;         // game minutes between cards, odds per hour after that
const CARD_GAP_OUT = 60, CARD_CHANCE_OUT = 0.6;   // out and about they come much more often (user)
const CARD_WAIT = 60000, CARD_LOCK = 900;        // ms: until she picks herself / before a result can be clicked away
const cardEl = document.getElementById("card"), cardRes = document.getElementById("cardRes");
const cardOpts = [...cardEl.querySelectorAll(".cd-opt")], crBox = cardRes.querySelector(".cr-box"), crMood = cardRes.querySelector(".cr-mood");
const crWrap = cardRes.querySelector(".cr-moodwrap"), crBurst = cardRes.querySelector(".cr-burst");
for (let i = 0; i < 20; i++) {                   // sparks around the moodlet pill: all directions, a pill-wide spread
  const a = (i / 20) * Math.PI * 2 + (i % 2) * 0.15, d = 0.7 + (i % 3) * 0.25, sp = document.createElement("s");
  sp.style.cssText = `--i:${i % 7};--x:calc(${(Math.cos(a) * d * 170).toFixed(1)}px * var(--cs, 1));--y:calc(${(Math.sin(a) * d * 78).toFixed(1)}px * var(--cs, 1))`;
  crBurst.append(sp);
}
// while a card or its result is up the house dims a little and time stands still (user)
const cardHolds = () => !!(card && card.hold) || guideOn;   // (the guide stops the clock too)
const dimHouse = on => view.classList.toggle("dim", on);
let quietUntil = 0;         // her card line isn't followed by a "new mood" thought
let card = null;            // { cd, vars, phase: ask | wait | result | closing, k, o, auto, timer, lockUntil }
let swallowUntil = 0;       // the click that closed a result does nothing else
const cardWhen = new Map();
function cardFits(cd, c) {
  if (!cd.when) return true;
  if (!cardWhen.has(cd)) { const any = cd.when.split("|").map(whenOk); cardWhen.set(cd, c => any.some(f => f(c))); }
  return cardWhen.get(cd)(c);
}
function rollCard(c) {
  const st = (lifeFlags.cards ||= { seen: [], last: -1e9 });
  const out = sim.place !== "home";               // outside: that place's own cards (cd.at)
  if (card || !c.awake || (!out && busyWith("bath", "toilet", "dress")) || pickOn || wiping || (out && mallInside())
    || sim.t - st.last < (out ? CARD_GAP_OUT : CARD_GAP) || Math.random() >= (out ? CARD_CHANCE_OUT : CARD_CHANCE)) return false;
  const any = CARDS.filter(cd => !cd.on && (cd.at || "home") === sim.place);
  let fresh = any.filter(cd => !st.seen.includes(cd.n));
  if (!fresh.length) { st.seen = st.seen.filter(n => !any.some(cd => cd.n === n) || st.seen.lastIndexOf(n) >= st.seen.length - 20); fresh = any.filter(cd => !st.seen.includes(cd.n)); }   // all seen: start over, not the latest ones
  const ok = fresh.filter(cd => cardFits(cd, c));
  if (!ok.length) return false;
  const w = cd => (cd.when ? 2 : 1);              // a fitting moment is used when it comes
  let r = Math.random() * ok.reduce((a, cd) => a + w(cd), 0);
  const cd = ok.find(x => (r -= w(x)) < 0) || ok[0];
  st.seen.push(cd.n); st.last = sim.t;
  showCard(cd);
  return true;
}
// ---------- moments (user: cards for the bath, the toilet, cooking, the
// stairs, passing a window, opening / closing one, ...): cards with `on` only
// come at that moment, with these odds (frequent moments get lower ones).
// All told about 2.5-3 cards a day (20 simulated days).
const MOMENT_ODDS = { stairs: 0.1, passWindow: 0.06, toilet: 0.2, wash: 0.25, wake: 0.3, eat: 0.3, phone: 0.3, pc: 0.3 };
const ACT_MOMENT = act => act.startsWith("water_") ? "water" : act.startsWith("pc_") || act === "computer" ? "pc"
  : act.startsWith("phone_") ? "phone" : act;
function cardMoment(tag) {
  if (!tag || card || sim.place !== "home" || sim.mode === "down" || pickOn || !CARDS.some(cd => cd.on === tag)) return false;
  const st = (lifeFlags.cards ||= { seen: [], last: -1e9 });
  if (sim.t - st.last < CARD_GAP || Math.random() >= (MOMENT_ODDS[tag] ?? 0.4)) return false;
  const c = lifeCtx(), pool = CARDS.filter(cd => cd.on === tag && cardFits(cd, c));
  // unseen first; once all are seen, any but the last few
  const cd = pick(pool.filter(x => !st.seen.includes(x.n)).length ? pool.filter(x => !st.seen.includes(x.n))
    : pool.filter(x => !st.seen.slice(-3).includes(x.n)).length ? pool.filter(x => !st.seen.slice(-3).includes(x.n)) : pool);
  if (!cd) return false;
  st.seen = [...st.seen.filter(n => n !== cd.n), cd.n]; st.last = sim.t;
  showCard(cd);
  return true;
}
// walking: onto the stairs; past a window (its middle, on her floor)
let passedWin = null;

// A box over her speech bubble with the latest diary line; clicking it pops

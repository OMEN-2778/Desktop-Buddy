<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>机场与飞行转场 · 美术预览</title>
<style>
@font-face{font-family:sign;src:url(signs.otf)}*{box-sizing:border-box}body{margin:0;background:#e9edf1;color:#40515c;font:15px system-ui,sans-serif}main{max-width:1080px;margin:24px auto;padding:0 20px}h1{font-size:21px;font-weight:600}p{line-height:1.7}figure{margin:24px 0}figcaption{margin:8px 0;font-size:15px}canvas,.still{display:block;width:100%;image-rendering:pixelated}button{border:1px solid #b5c2cc;background:#f7f9fc;color:#345760;padding:9px 16px;margin:5px 8px 0 0;border-radius:6px;cursor:pointer}button:focus-visible{outline:3px solid #558eae}button:disabled{color:#89949d;cursor:default}#stage{position:relative}.sign{position:absolute;color:#ecf3ee;font-family:sign,system-ui,sans-serif;pointer-events:none;font-weight:500;line-height:1.3}.board{left:9.9%;top:21%;width:24%;font-size:clamp(8px,1.5vw,16px)}.board small{display:block;font-size:.73em;color:#abc8c6;margin-top:3px}.gate{left:80%;top:23%;width:14%;text-align:center;font-size:clamp(8px,1.5vw,16px)}#flights{display:none;position:absolute;left:32%;top:9%;width:38%;height:75%;pointer-events:none}#flights.show{display:block}#flights button{position:absolute;margin:0;transform:translate(-50%,-50%);pointer-events:auto;border:2px solid #aabdc8;background:#f5f9fa;border-radius:18px;padding:7px 12px;font-size:13px;box-shadow:0 2px #c2cdd5}#flights button:nth-child(1){left:50%;top:15%}#flights button:nth-child(2){left:88%;top:50%}#flights button:nth-child(3){left:50%;top:85%}#flights button:nth-child(4){left:12%;top:50%}.muted{font-size:13px;color:#687b86}a{color:#306b86}
</style><main><h1>机场与飞行转场</h1><p>美术预览：家门 → 银白航站楼转场 → 机场 → 客机机舱 → 茵菲谷；返程也经过机舱。</p>
<div id="stage"><canvas id="view" width="342" height="118" aria-label="机场与客机机舱动态预览"></canvas><div id="labels" hidden><div class="sign board">航班出发<small>茵菲谷 · 可前往<br>？　？　？</small></div><div class="sign gate">登机口 →</div></div><div id="flights"><button id="spring">茵菲谷</button><button disabled>？</button><button disabled>？</button><button disabled>？</button></div></div>
<div><button id="arrive">家门 → 机场</button><button id="menu">选择航班</button><button id="home">农场 → 回家</button><button id="pause">暂停动画</button></div><p id="status" role="status">机场候机大厅</p><p class="muted">只演示画面和转场；尚未接入存档、购票扣币或正式地图。人物为原生尺寸示例，接入时跟随玩家造型。</p>
<figure><figcaption>① 机场大厅</figcaption><img class="still" src="terminal-review.png" alt="银白顶棚、售票柜台和登机口"></figure><figure><figcaption>② 往返共用的客机机舱</figcaption><img class="still" src="airport_cabin_preview.png" alt="小人坐在客机机舱内"></figure><figure><figcaption>③ 银白色家门到机场转场</figcaption><img class="still" src="airport_transition_preview.png" alt="银白背景、航站楼贴纸图标和小人头像"></figure><p><a href="airport-review.png">打开三张合并大图</a></p></main>
<script>
/*__FLIGHT_JS__*/
const files=['airport_terminal','airport_vista','airport_terminal_front','airport_plane','airport_cabin','airport_cabin_front','trip_airport','airport_hero','airport_hero_seated','spring-destination','home-destination'];const images={};let mode='airport',time=0,last=0,paused=false;const cv=document.getElementById('view'),c=cv.getContext('2d');c.imageSmoothingEnabled=false;const status=document.getElementById('status'),labels=document.getElementById('labels'),flights=document.getElementById('flights');
function setMode(m){if(flight.busy)return;mode=m;time=0;flights.classList.remove('show');labels.hidden=true;status.textContent={airport:'机场候机大厅',arrive:'前往机场',outbound:'飞往茵菲谷',inbound:'回家途中'}[m]}
let planes=null,planeLast=0;function terminal(){planes||=createAirportPlanes(images);const now=performance.now(),dt=planeLast&&!paused?Math.min(100,now-planeLast):0;planeLast=now;planes.draw(c,dt,matchMedia('(prefers-reduced-motion:reduce)').matches);c.drawImage(images.airport_hero,193,76)}

const flight=createCabinFlight({canvas:cv,images,drawHero:(ctx,x,y)=>ctx.drawImage(images.airport_hero_seated,x,y),paused:()=>paused});
function fly(destination){if(flight.busy)return;flights.classList.remove('show');labels.hidden=true;mode='flight';const from=document.createElement('canvas');from.width=342;from.height=118;from.getContext('2d').drawImage(cv,0,0);status.textContent=destination==='spring'?'飞往茵菲谷':'回家途中';flight.start(from,()=>images[destination==='spring'?'spring-destination':'home-destination'],()=>{mode=destination;status.textContent=destination==='spring'?'已抵达茵菲谷':'已回到家';});}

function trip(){terminal();let t=time,enter=700,hold=1600,exit=700;const ease=n=>{n=Math.max(0,Math.min(1,n));return n<.5?4*n*n*n:1-Math.pow(-2*n+2,3)/2};for(let i=0;i<6;i++){let start=t<enter?0:t<enter+hold?0:Math.round(342*ease((t-enter-hold-i*45)/475)),end=t<enter?Math.round(342*ease((t-i*45)/475)):342;c.fillStyle='#e7e5e9';c.fillRect(start,i*20,end-start,20);if(end<342){c.fillStyle='#b5b1b9';c.fillRect(end-2,i*20,2,20)}}if(t>=enter&&t<enter+hold){let p=(t-enter)/hold,ax=Math.round(227+(153-227)*ease(Math.min(1,p/.85)));c.fillStyle='#8d9ab3';for(let x=151;x<ax-8;x+=10)c.fillRect(x,58,2,2);c.drawImage(images.trip_airport,101,43);c.drawImage(images.airport_hero,0,0,20,16,ax-10,50-Math.round(Math.abs(Math.sin(p*22))*2),20,16)}if(t>enter+hold+exit)setMode('airport')}
function frame(now){if(last&&!paused)time+=Math.min(now-last,60);last=now;if(!flight.busy){c.clearRect(0,0,342,118);if(mode==='airport')terminal();else if(mode==='arrive')trip();else if(mode==='spring'||mode==='home')c.drawImage(images[mode==='spring'?'spring-destination':'home-destination'],0,0,342,118);}requestAnimationFrame(frame)}
document.getElementById('arrive').onclick=()=>setMode('arrive');document.getElementById('menu').onclick=()=>{if(flight.busy)return;setMode('airport');flights.classList.toggle('show')};document.getElementById('spring').onclick=()=>fly('spring');document.getElementById('home').onclick=()=>{if(!flight.busy){c.drawImage(images['spring-destination'],0,0,342,118);fly('home')}};document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续动画':'暂停动画'};
Promise.all(files.map(name=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[name]=im;resolve()};im.onerror=reject;im.src=name+'.png'}))).then(()=>{document.fonts.ready.then(()=>{});requestAnimationFrame(frame)});
</script></html>

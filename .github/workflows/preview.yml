name: Web preview

on:
  push:
    branches: [claude/awesome-einstein-wtzgsw]
    paths:
      - 'prototype/**'
      - 'art/src/**'
      - 'tools/**'
      - 'AUDIO_LIBRARY/**'
      - 'desktop/scripts/copy-web.mjs'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-preview
  cancel-in-progress: false

# This source repo may be private (no free GitHub Pages then). The built page
# always goes to the public downloads repo's gh-pages branch as well:
#   https://omen-2778.github.io/Desktop-Buddy-Releases/
# and to this repo's own Pages only while it is public.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install page build dependencies
        run: python -m pip install Pillow numpy
      - name: Build the browser game from source
        run: |
          PYTHONPATH=tools python tools/make_demo.py
          npm ci --prefix desktop --no-audit --no-fund   # terser for the minify step
          BUDDY_TRIAL=1 BUDDY_MINIFY=1 node desktop/scripts/copy-web.mjs   # public page: the 试玩版 only, never the full game
          PYTHONPATH=tools python tools/make_pet_preview.py
          mkdir -p desktop/dist/pets
          cp prototype/pets/index.html desktop/dist/pets/index.html
          cp -R prototype/music-preview desktop/dist/music
          touch desktop/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: desktop/dist
      - name: Publish to the public downloads repo (gh-pages)
        if: ${{ env.TOKEN != '' }}
        working-directory: desktop/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web preview ${GITHUB_SHA::7}"
          git push -fq "https://x-access-token:${TOKEN}@github.com/OMEN-2778/Desktop-Buddy-Releases.git" gh-pages

  pages:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4

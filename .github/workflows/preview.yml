name: Web preview

on:
  push:
    branches: [claude/awesome-einstein-wtzgsw]
    paths:
      - 'prototype/**'
      - 'art/src/**'
      - 'tools/**'
      - 'AUDIO_LIBRARY/**'
      - 'desktop/scripts/copy-web.mjs'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install page build dependencies
        run: python -m pip install Pillow numpy
      - name: Build the browser game from source
        run: |
          PYTHONPATH=tools python tools/make_demo.py
          node desktop/scripts/copy-web.mjs
          PYTHONPATH=tools python tools/make_pet_preview.py
          mkdir -p desktop/dist/pets
          cp prototype/pets/index.html desktop/dist/pets/index.html
          touch desktop/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: desktop/dist
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4

name: Web preview

on:
  push:
    branches: [claude/awesome-einstein-wtzgsw]
    paths:
      - 'prototype/**'
      - 'art/src/**'
      - 'tools/**'
      - 'AUDIO_LIBRARY/**'
      - 'desktop/scripts/copy-web.mjs'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-preview
  cancel-in-progress: false

# This source repo may be private (no free GitHub Pages then). The built page
# always goes to the public downloads repo's gh-pages branch as well:
#   https://omen-2778.github.io/Desktop-Buddy-Releases/
# and to this repo's own Pages only while it is public.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install page build dependencies
        run: python -m pip install Pillow numpy
      - name: Build the browser game from source
        run: |
          PYTHONPATH=tools python tools/make_demo.py
          npm ci --prefix desktop --no-audit --no-fund   # terser for the minify step
          BUDDY_TRIAL=1 BUDDY_MINIFY=1 node desktop/scripts/copy-web.mjs   # public page: the 试玩版 only, never the full game
          PYTHONPATH=tools python tools/make_pet_preview.py
          mkdir -p desktop/dist/pets
          cp prototype/pets/index.html desktop/dist/pets/index.html
          cp -R prototype/music-preview desktop/dist/music
          # Owner-requested isolated spring art walk-through; no full-game features.
          PYTHONPATH=tools python tools/make_spring_preview.py
          # Owner-requested summer bay walk-through (旅舍 -> 更衣室 -> 沙滩 -> 水底), same rules.
          PYTHONPATH=tools python tools/make_summer_preview.py
          # Owner-requested polluted autumn city: art review only.
          PYTHONPATH=tools python tools/make_autumn_preview.py
          # Owner-authorized game-shell map test, separate from trial and EXE builds.
          PYTHONPATH=tools python tools/make_season_game_test.py
          # Isolated airport/cabin art review; no live-game destination.
          PYTHONPATH=tools python tools/make_airport_preview.py
          cp -R prototype/story-review desktop/dist/story-review
          touch desktop/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: desktop/dist
      - name: Publish to the public downloads repo (gh-pages)
        if: ${{ env.TOKEN != '' }}
        working-directory: desktop/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web preview ${GITHUB_SHA::7}"
          git push -fq "https://x-access-token:${TOKEN}@github.com/OMEN-2778/Desktop-Buddy-Releases.git" gh-pages

  # Owner 2026-11-04: the TapTap H5 package as a download on this (private) repo's run page, never on the public Pages.
  # The artifact unzips to one folder buddy-house/ with index.html: upload that zip to TapTap as it is.
  taptap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the phone page and the TapTap package
        run: |
          python -m pip install Pillow numpy
          sudo apt-get install -y -qq ffmpeg >/dev/null || true
          PYTHONPATH=tools python tools/make_demo.py
          npm ci --prefix desktop --no-audit --no-fund
          (cd desktop && BUDDY_MOBILE=1 BUDDY_MINIFY=1 node scripts/copy-web.mjs)
          bash tools/make_taptap_h5.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TapTap-H5
          path: desktop/taptap-h5
          retention-days: 30
          if-no-files-found: error

  pages:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4

# Builds the desktop app (desktop/, Tauri) for Windows: a setup .exe (NSIS)
# and the bare desktop-buddy.exe, uploaded as the run's artifact.
#
# Updates: each build is version 0.1.<run number>. With the signing key in
# the repo's secrets (TAURI_SIGNING_PRIVATE_KEY), the installer is signed and
# published as a GitHub release (v0.1.N) with latest.json, which the app
# checks (plugins.updater in desktop/src-tauri/tauri.conf.json). Without the
# key it builds as before and publishes nothing.
name: Desktop app

on:
  push:
    paths:
      - "desktop/**"
      - "prototype/demo/index.html"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write        # to publish the release

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Version
        working-directory: desktop
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run web
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: building without updates"
            npm run build
          fi

      - name: Release (for the in-app updater)
        if: env.TAURI_SIGNING_PRIVATE_KEY != '' && github.event_name == 'push'
        working-directory: desktop/src-tauri/target/release/bundle/nsis
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(ls *_x64-setup.exe | head -1)
          exe="Desktop-Buddy_${VERSION}_x64-setup.exe"
          cp "$src" "$exe"
          node -e "
            const fs = require('fs'), v = process.env.VERSION, exe = process.argv[1];
            fs.writeFileSync('latest.json', JSON.stringify({
              version: v,
              notes: process.argv[2],
              pub_date: new Date().toISOString(),
              platforms: { 'windows-x86_64': {
                signature: fs.readFileSync(process.argv[3], 'utf8'),
                url: 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/releases/download/v' + v + '/' + exe,
              } },
            }, null, 2));
          " "$exe" "$(git log -1 --pretty=%s)" "$src.sig"
          gh release create "v$VERSION" "$exe" latest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Desktop Buddy $VERSION" --notes "$(git log -1 --pretty=%s)" --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Desktop-Buddy-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/desktop-buddy.exe
          if-no-files-found: error

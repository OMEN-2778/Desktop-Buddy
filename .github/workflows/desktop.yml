# Builds the desktop app (desktop/, Tauri) for Windows: a setup .exe (NSIS)
# and the bare desktop-buddy.exe, uploaded as the run's artifact.
name: Desktop app

on:
  push:
    paths:
      - "desktop/**"
      - "prototype/demo/index.html"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Build
        working-directory: desktop
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: Desktop-Buddy-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/desktop-buddy.exe
          if-no-files-found: error

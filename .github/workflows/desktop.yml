# Builds the desktop app (desktop/, Tauri) for Windows: a setup .exe (NSIS)
# and the bare desktop-buddy.exe, uploaded as the run's artifact.
#
# Updates: each build is version 0.1.<run number>. With the signing key in
# the repo's secrets (TAURI_SIGNING_PRIVATE_KEY), the installer and the bare
# exe are signed and published as a GitHub release (v0.1.N) with latest.json
# (entries windows-x86_64 = installer, windows-x86_64-portable = exe), which the app
# checks (plugins.updater in desktop/src-tauri/tauri.conf.json). Without the
# key it builds as before and publishes nothing. Run it by hand (Actions →
# Desktop app → Run workflow) to publish without a code change.
name: Desktop app

on:
  push:
    paths:
      - "desktop/**"
      - "tools/check_window_drag.js"
      - "prototype/demo/index.html"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write        # to publish the release

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the current game page from source
        run: |
          python -m pip install Pillow numpy
          PYTHONPATH=tools python tools/make_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-game-page
          path: prototype/demo/index.html
          retention-days: 3
          if-no-files-found: error

  windows:
    needs: web
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      VERSION: 0.1.${{ github.run_number }}
      BUDDY_MINIFY: "1"   # shipped page minified (desktop/scripts/copy-web.mjs)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: current-game-page
          path: prototype/demo

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Check window dragging
        shell: bash
        run: |
          node tools/check_window_drag.js
          rustc --test desktop/src-tauri/src/window_motion.rs -o window-motion-tests.exe
          ./window-motion-tests.exe

      - name: Version
        working-directory: desktop
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run web
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: building without updates"
            npm run build
          fi

      - name: Sign the bare exe (the portable app updates itself with it)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        working-directory: desktop
        shell: bash
        run: npx tauri signer sign src-tauri/target/release/desktop-buddy.exe

      # Releases go to the public downloads-only repo (OMEN-2778/Desktop-Buddy-Releases) once its
      # token is in the secrets (RELEASES_TOKEN), so this source repo can be private; until then here.
      - name: Release (for the in-app updater)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        working-directory: desktop/src-tauri/target/release/bundle/nsis
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          REPO: ${{ secrets.RELEASES_TOKEN && 'OMEN-2778/Desktop-Buddy-Releases' || github.repository }}
        run: |
          src=$(ls *_x64-setup.exe | head -1)
          exe="Desktop-Buddy_${VERSION}_x64-setup.exe"
          bare="Desktop-Buddy_${VERSION}_x64-portable.exe"
          cp "$src" "$exe"
          cp ../../desktop-buddy.exe "$bare"
          # a zip of the portable exe too: browsers block a rarely seen .exe, rarely a .zip (user)
          zip="Desktop-Buddy_${VERSION}_portable.zip"
          mkdir -p pack && cp ../../desktop-buddy.exe "pack/Desktop Buddy.exe" && (cd pack && 7z a -tzip "../$zip" "Desktop Buddy.exe" >/dev/null)
          node -e "
            const fs = require('fs'), v = process.env.VERSION, exe = process.argv[1], bare = process.argv[4];
            const at = f => 'https://github.com/' + process.env.REPO + '/releases/download/v' + v + '/' + f;
            fs.writeFileSync('latest.json', JSON.stringify({
              version: v,
              notes: process.argv[2],
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': { signature: fs.readFileSync(process.argv[3], 'utf8'), url: at(exe) },
                'windows-x86_64-portable': { signature: fs.readFileSync('../../desktop-buddy.exe.sig', 'utf8'), url: at(bare) },
              },
            }, null, 2));
          " "$exe" "$(git log -1 --pretty=%s)" "$src.sig" "$bare"
          target=(); [ "$REPO" = "$GITHUB_REPOSITORY" ] && target=(--target "$GITHUB_SHA")
          gh release create "v$VERSION" "$zip" "$exe" "$bare" latest.json --repo "$REPO" "${target[@]}" \
            --title "Desktop Buddy $VERSION" --notes "$(git log -1 --pretty=%s)" --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Desktop-Buddy-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/desktop-buddy.exe
          if-no-files-found: error

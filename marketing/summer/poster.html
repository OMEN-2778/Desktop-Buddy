<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:2400px;height:1800px;overflow:hidden}
body{position:relative;font-family:"Noto Sans CJK SC","Noto Sans CJK TC",sans-serif;background:linear-gradient(180deg,#effcf4 0%,#d3f3e4 34%,#aee6d9 58%,#8fdccf 70%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 3px,transparent 4px);background-size:46px 46px;opacity:.6}
.sun{position:absolute;left:1880px;top:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#fffbe2 0 38%,rgba(255,251,226,.55) 39% 52%,rgba(255,251,226,0) 70%)}
.beach{position:absolute;left:0;right:0;bottom:0;height:420px}
.beach svg{position:absolute;inset:0;width:100%;height:100%}
.px{image-rendering:pixelated;position:absolute}
.st{image-rendering:pixelated;position:absolute;filter:drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(0 14px 14px rgba(25,90,80,.28))}
.st.sm{filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 8px 8px rgba(25,90,80,.25))}
.photo{position:absolute;background:#fff;padding:18px 18px 76px;border-radius:16px;box-shadow:0 26px 50px rgba(20,80,70,.22),0 4px 0 rgba(20,80,70,.06)}
.photo img{display:block;width:100%;border-radius:8px;image-rendering:pixelated}
.photo p{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-weight:800;font-size:40px;color:#2a7d6f;letter-spacing:2px}
.tape{position:absolute;width:150px;height:44px;background:rgba(255,236,170,.85);top:-20px;left:50%;margin-left:-75px;transform:rotate(-4deg);border-radius:4px}
.label{position:absolute;left:150px;top:92px;padding:12px 34px;background:#fff;color:#2a7d6f;font-weight:800;font-size:44px;border-radius:999px;letter-spacing:4px;box-shadow:0 10px 24px rgba(20,80,70,.15)}
.title{position:absolute;left:128px;top:150px;font-weight:900;font-size:300px;line-height:1.08;color:#1f7a6c;-webkit-text-stroke:20px #fff;paint-order:stroke fill;letter-spacing:16px;text-shadow:0 18px 0 rgba(31,122,108,.16)}
.sub{position:absolute;left:156px;top:520px;font-weight:800;font-size:54px;color:#fff;background:#2fa48f;padding:14px 42px;border-radius:999px;letter-spacing:6px;box-shadow:0 12px 26px rgba(20,80,70,.2)}
.foot{position:absolute;right:80px;bottom:56px;padding:14px 36px;background:#fff;border-radius:999px;font-weight:800;font-size:40px;color:#2a7d6f;box-shadow:0 10px 24px rgba(20,80,70,.15)}
.foot b{color:#e8875a}
.bubble{position:absolute;left:1070px;top:300px;padding:20px 30px;background:#fff;border-radius:28px;font-weight:800;font-size:32px;line-height:1.5;color:#2a7d6f;box-shadow:0 14px 28px rgba(20,80,70,.22);transform:rotate(-2deg);z-index:2;white-space:nowrap}
.bubble:after{content:'';position:absolute;left:40px;bottom:-30px;border:18px solid transparent;border-top:22px solid #fff;border-right:24px solid #fff}
</style></head><body>
<div class="dots"></div><div class="sun"></div>
<div class="beach"><svg viewBox="0 0 2400 420" preserveAspectRatio="none">
 <path d="M0 60 Q300 10 600 60 T1200 60 T1800 60 T2400 60 V420 H0Z" fill="#7fd3c6"/>

 <path d="M0 170 Q320 125 640 170 T1280 170 T1920 170 T2400 165 V420 H0Z" fill="#f7ead0"/>
 <path d="M0 250 Q400 220 800 250 T1600 250 T2400 250 V420 H0Z" fill="#f1dfbb" opacity=".7"/>
</svg></div>

</body></html>

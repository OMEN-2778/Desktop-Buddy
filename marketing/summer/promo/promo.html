function place(o,t){
 const vis=t>=o.t0&&t<o.t1;o.el.style.display=vis?'':'none';if(!vis)return;
 const a=t-o.t0,b=o.t1-t;let x=o.x,y=o.y,r=o.r,s=o.s,op=1;
 const pin=a/o.dIn,pout=1-b/o.dOut;
 switch(o.in){case 'pop':s*=backOut(pin,2.6);r+= (1-outQ(pin))*-25;break;
  case 'grow':s*=backOut(pin,1.6);op=clamp(pin*4);break;
  case 'drop':y-=(1-elastic(pin*.8))*500;r+=(1-outQ(pin))*15;break;
  case 'slideL':x-=(1-backOut(pin,1.4))*1400;r-=(1-outQ(pin))*8;break;
  case 'slideR':x+=(1-backOut(pin,1.4))*1400;r+=(1-outQ(pin))*8;break;
  case 'fly':{const k=backOut(pin,1.4);x=o.from[0]+(o.x-o.from[0])*k;y=o.from[1]+(o.y-o.from[1])*k;r+=(1-k)*360;break;}
  case 'cut':s*=1+(1-outQ(a/.18))*.06;break;}
 if(b<o.dOut){s*=1-inQ(pout)*.9;op*=1-inQ(pout);}
 if(o.shake&&a>o.dIn)r+=Math.sin(a*40)*1.4;
 if(o.bob)y-=Math.abs(Math.sin((a+o.t0)*5))*14*clamp(pin);
 r+=Math.sin((a+o.t0*3)*2.2)*.6;   // everything breathes a little
 o.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s})`;o.el.style.opacity=op;
 if(o.chars)[...o.el.children].forEach((sp,i)=>{const q=clamp((a-.06*i)/.5);sp.style.transform=`translateY(${(1-elastic(q))*-120}px) rotate(${(1-q)*-20}deg)`;});
 if(o.img){const c=INFO[o.clip],f=clamp(Math.floor((a)*30)+(o.seek||0)+1,1,c.n);const src=`clips/${o.clip}/${String(f).padStart(4,'0')}.jpg`;if(o.img.getAttribute('src')!==src)o.img.src=src;}}
